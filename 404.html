        <div class="fpreg"><label for="f_personas">Cuántos son</label>
          <input id="f_personas" type="number" min="1" value="${v(l.personas)}"></div>
        <div class="fpreg"><label for="f_cuando">Para cuándo</label>
          <input id="f_cuando" value="${v(l.cuando_necesita)}"></div>
        <div class="fpreg"><label for="f_perma">Cuánto tiempo</label>
          <input id="f_perma" value="${v(l.permanencia)}"></div>
        <div class="fpreg"><label for="f_situacion">Qué tienen ahora</label>
          <input id="f_situacion" value="${v(l.situacion_actual)}"></div>
        <div class="fpreg"><label for="f_decide">Quién decide</label>
          <input id="f_decide" value="${v(l.quien_decide)}"></div>
        <div class="fpreg"><label for="f_valor">Valor €/mes</label>
          <input id="f_valor" type="number" step="0.01" inputmode="decimal"
                 value="${v(l.valor_mes)}"></div>
        <div class="fpreg"><label for="f_canal">Canal</label>
          <select id="f_canal">
            ${[['desconocido','Sin saber'],['whatsapp_directo','WhatsApp directo'],
               ['portal','Portal'],['web','Web propia'],['google','Google'],
               ['referido','Referido'],['walkin','Entró por la puerta'],
               ['broker','Broker'],['evento','Evento'],['otro','Otro']]
              .map(([k,t]) => `<option value="${k}"${l.canal===k?' selected':''}>${t}</option>`).join('')}
          </select></div>
        <div class="fpreg arriba"><label for="f_notas">Notas</label>
          <textarea id="f_notas">${v(l.notas)}</textarea></div>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-cab">
        <h3>Historial</h3>
        <button id="fver">Ver conversación</button>
      </div>
      <div class="hist" id="fhist"><div class="ph">Cargando…</div></div>
    </div>

    <div class="fguardar" id="fguardar">
      <button class="btn" id="fguarda">Guardar</button>
      <button class="cbtn sec" id="fdescarta">Descartar</button>
    </div>
   </div>`;

  // La fila que se está leyendo, marcada en la lista.
  document.querySelectorAll('.lfila[data-lead]').forEach(el =>
    el.classList.toggle('on', Number(el.dataset.lead) === id));
  enlazarFicha(l);
  pintarHistorial(l.id);
}


/* ---------- historial del lead ---------- */
const ICONO_EV = { toque:'Contacto', etapa:'Cambio de etapa', nota:'Nota', alta:'Alta' };

async function pintarHistorial(leadId){
  const cont = $('#fhist'); if (!cont) return;
  const { data, error } = await supabase.rpc('mt_historial_lead', { p_id: leadId });
  if (error){ cont.innerHTML = '<div class="ph">No se ha podido cargar.</div>'; return; }
  const ev = data || [];

  cont.innerHTML = ev.length ? ev.map(e => `
    <div class="hev">
      <div class="hcuerpo">
        <div>${e.tipo === 'etapa'
          ? `De <b>${esc(NOMBRE_ETAPA[e.desde] || e.desde || '—')}</b> a
             <b>${esc(NOMBRE_ETAPA[e.hasta] || e.hasta)}</b>`
          : esc(e.detalle || ICONO_EV[e.tipo] || e.tipo)}</div>
        <div class="hcuando">${fechaHoraCorta(e.cuando)}</div>
      </div>
      <div class="hacc">
        ${e.tipo === 'toque' ? `
          <button data-edev="${e.id}">Corregir</button>
          <button class="mal" data-delev="${e.id}">Deshacer</button>` : ''}
      </div>
    </div>`).join('')
    : '<div class="ph">Sin movimientos por ahora.</div>';

  enlazarHistorial(leadId);
}

function enlazarHistorial(leadId){
  const cont = $('#fhist'); if (!cont) return;

  cont.querySelectorAll('button[data-delev]').forEach(b =>
    b.addEventListener('click', async () => {
      b.disabled = true;
      const { error } = await supabase.rpc('mt_deshacer_evento',
        { p_evento: Number(b.dataset.delev) });
      if (error){ b.disabled = false; return; }
      await pintarHistorial(leadId);
      await refrescarEmbudo();
      const l = LEADS.find(x => x.id === leadId);
      if (l) $('#mbox').querySelector('.dmeta:last-of-type')?.replaceWith(
        Object.assign(document.createElement('p'), { className:'dmeta',
          textContent: `${nf.format(l.mensajes || 0)} ${
            Number(l.mensajes) === 1 ? 'mensaje' : 'mensajes'}, ${l.toques} ${
            Number(l.toques) === 1 ? 'contacto' : 'contactos'}` }));
    }));

  // Corregir sustituye el texto por un campo, en el sitio. Abrir otro
  // formulario para cambiar una línea sería desproporcionado.
  cont.querySelectorAll('button[data-edev]').forEach(b =>
    b.addEventListener('click', () => {
      const fila = b.closest('.hev');
      const cuerpo = fila.querySelector('.hcuerpo > div');
      const antes = cuerpo.textContent.trim();
      cuerpo.innerHTML = `<input class="sel" style="width:100%;font-size:13px"
        value="${esc(antes)}">`;
      const inp = cuerpo.querySelector('input');
      inp.focus(); inp.select();
      const guardar = async () => {
        const v = inp.value.trim();
        if (!v || v === antes){ cuerpo.textContent = antes; return; }
        await supabase.rpc('mt_editar_evento',
          { p_evento: Number(b.dataset.edev), p_detalle: v });
        await pintarHistorial(leadId);
      };
      inp.addEventListener('blur', guardar);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape'){ inp.value = antes; inp.blur(); }
      });
    }));
}

const fechaHoraCorta = d => new Date(d).toLocaleString('es-ES',
  { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });

function enlazarFicha(l){
  const leer = () => ({
    personas:         $('#f_personas').value.trim() || null,
    cuando_necesita:  $('#f_cuando').value.trim()   || null,
    permanencia:      $('#f_perma').value.trim()    || null,
    situacion_actual: $('#f_situacion').value.trim()|| null,
    quien_decide:     $('#f_decide').value.trim()   || null,
    canal:            $('#f_canal').value,
    valor_mes:        $('#f_valor').value.trim()    || null,
    notas:            $('#f_notas').value.trim()    || null
  });

  const aviso = (txt, ok) => {
    const e = $('#faviso');
    e.textContent = txt;
    e.className = 'faviso ' + (ok ? 'ok' : 'mal');
    $('#mbox').scrollTo({ top: 0, behavior: 'smooth' });
    if (ok) setTimeout(() => { e.className = 'faviso'; }, 3500);
  };

  const fallo = (error) => aviso(
    /lectura|acceso|42501/.test(error.message || '')
      ? 'No tienes permiso para editar este cliente. Pídele a SimpliaSpain que te dé rol de administrador.'
      : 'No se ha podido guardar: ' + error.message, false);

  // La barra de guardar solo aparece cuando hay algo que guardar.
  // Un botón siempre visible que casi nunca hace falta enseña a
  // ignorarlo, y entonces no se ve el día que sí importa.
  const inicial = JSON.stringify(leer());
  const mirar = () => {
    $('#fguardar').classList.toggle('on', JSON.stringify(leer()) !== inicial);
  };
  $('#mbox').querySelectorAll('.fdatos input, .fdatos select, .fdatos textarea')
    .forEach(i => { i.addEventListener('input', mirar); i.addEventListener('change', mirar); });

  $('#fguarda').addEventListener('click', async () => {
    const b = $('#fguarda'); b.disabled = true; b.textContent = 'Guardando…';
    const { error } = await supabase.rpc('mt_guardar_lead',
      { p_id: l.id, p_campos: leer() });
    b.disabled = false; b.textContent = 'Guardar';
    if (error) return fallo(error);
    $('#fguardar').classList.remove('on');
    aviso('Guardado', true);
    anunciar('Guardado');
    await refrescarEmbudo();
  });

  $('#fdescarta').addEventListener('click', () => abrirLead(l.id));

  // ---- etapa ----
  const sel = $('#fetapa');
  sel.addEventListener('change', async () => {
    const et = sel.value;
    if (et === l.etapa) return;
    if (et === 'perdido'){
      $('#fcajaperdido').classList.add('on');
      $('#p_motivo').focus();
      return;
    }
    $('#fcajaperdido').classList.remove('on');
    await moverA(et, null);
  });

  async function moverA(et, nota){
    const { error } = await supabase.rpc('mt_mover_lead',
      { p_id: l.id, p_etapa: et, p_nota: nota });
    if (error){ sel.value = l.etapa; return fallo(error); }
    await refrescarEmbudo();
    const nuevo = LEADS.find(x => x.id === l.id);
    if (nuevo){
      abrirLead(nuevo.id);
      const t = et === 'perdido' ? 'Marcado como perdido' : 'Etapa: ' + NOMBRE_ETAPA[et];
      aviso(t, true); anunciar(t);
    }
    else cerrar();
  }

  $('#p_no').addEventListener('click', () => {
    $('#fcajaperdido').classList.remove('on');
    sel.value = l.etapa;      // el desplegable vuelve a donde estaba
  });
  $('#p_ok').addEventListener('click', async () => {
    const m = $('#p_motivo').value.trim();
    if (!m) return aviso('Escribe el motivo', false);
    await moverA('perdido', m);
  });

  // ---- apuntar un contacto ----
  $('#t_ok').addEventListener('click', async () => {
    const d = $('#t_detalle').value.trim();
    if (!d) return aviso('Escribe qué has hecho', false);
    const b = $('#t_ok'); b.disabled = true;
    const { error } = await supabase.rpc('mt_apuntar_toque',
      { p_id: l.id, p_detalle: d, p_proxima: $('#t_fecha').value || null });
    b.disabled = false;
    if (error) return fallo(error);
    aviso('Apuntado', true);
    anunciar('Apuntado');
    await refrescarEmbudo();
    const nuevo = LEADS.find(x => x.id === l.id);
    if (nuevo) abrirLead(nuevo.id);
  });
  $('#t_detalle').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); $('#t_ok').click(); }
  });

  // ---- ir a la conversación ----
  $('#fx')?.addEventListener('click', cerrar);
  $('#fver').addEventListener('click', () => {
    cerrar();
    document.querySelector('nav button[data-v="convs"]')?.click();
    setTimeout(() => {
      const b = $('#buscar');
      if (b){ b.value = l.telefono || l.user_ref; filtrar(b.value); }
    }, 700);
  });

  // Enter dentro de los datos guarda. Fuera de ahí no, porque el
  // campo de apuntar contacto y el del motivo tienen su propio
  // Enter y harían dos cosas a la vez.
  $('#mbox').querySelectorAll('.fdatos input').forEach(i =>
    i.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      $('#fguarda').click();
    }));
  $('#p_motivo').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); $('#p_ok').click(); }
  });
}

/* ---------- utilidades ---------- */
// El teléfono completo no se muestra en pantalla: se ve lo justo para reconocer al contacto.
const ofusca = t => t ? t.slice(0,4) + '···' + t.slice(-3) : '—';
// El agente de n8n guarda su traza de herramientas delante de la
// respuesta. mensajes_contacto ya la quita, pero la actividad
// reciente lee `content` directo de la tabla. Mismo criterio:
// se cuentan corchetes, porque el JSON de la traza lleva
// corchetes dentro y cortar por el primer "]]" falla con arrays
// anidados.
function limpiaMensaje(t){
  const s = String(t ?? '').trimStart();
  if (!s.startsWith('[Used tools:')) return t ?? '';
  let d = 0;
  for (let i = 0; i < s.length; i++){
    if (s[i] === '[') d++;
    else if (s[i] === ']' && --d === 0) return s.slice(i + 1).trim();
  }
  return t ?? '';
}

const esc = s => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fechaCorta = d => new Date(d).toLocaleDateString('es-ES',
  { day:'2-digit', month:'short', year:'2-digit' });
const fecha = d => new Date(d).toLocaleString('es-ES',
  { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const hora = d => new Date(d).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });

/* El distintivo solo aparece fuera del dominio de producción. Así no
   hay forma de confundir un panel con otro, y nadie tiene que
   acordarse de quitarlo al desplegar. */
(function(){
  const enProduccion =
    location.hostname === 'panel.simpliaspain.com' &&
    !location.pathname.startsWith('/staging');
  const enLocal =
    location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (enProduccion || enLocal) return;
  const d = document.createElement('div');
  d.className = 'staging';
  d.textContent = 'Staging, no es lo que ve el cliente';
  document.body.insertBefore(d, document.body.firstChild);
})();
</script>
