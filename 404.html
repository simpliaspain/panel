<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpliaSpain · Panel de cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pulso:#1B7CFF;
    --profundo:#0A1F4A;
    --tinta:#0A0E1A;
    --aire:#E5EFFE;
    --gris:#64748B;
    --linea:#E2E8F0;
    --blanco:#FFFFFF;
    --fondo:#F7FAFF;
    --verde:#12B76A;
    --ambar:#F79009;
    --rojo:#F04438;
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;width:100%;max-width:100%;overflow-x:hidden;
            -webkit-text-size-adjust:100%}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:var(--fondo);color:var(--tinta);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  em{font-style:italic;color:var(--pulso);font-weight:800}
  button{font-family:inherit;cursor:pointer;border:none}
  button:focus-visible,input:focus-visible{outline:2px solid var(--pulso);outline-offset:2px}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center}
  @media(max-width:900px){#login{grid-template-columns:1fr}#login .izq{display:none}}
  #login .izq{padding:0 6vw}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;background:var(--aire);
    color:var(--profundo);font-size:12px;font-weight:600;
    padding:6px 14px;border-radius:99px;margin-bottom:28px;
  }
  .eyebrow::before{content:'';width:7px;height:7px;border-radius:99px;background:var(--pulso)}
  #login h1{font-size:clamp(44px,5.5vw,76px);line-height:1.02;letter-spacing:-.035em;font-weight:800}
  #login .izq p{margin-top:22px;max-width:44ch;color:#334155;line-height:1.65;font-size:15px}
  .der{padding:0 6vw}
  .card{
    background:var(--blanco);border-radius:var(--r);padding:38px 34px;
    box-shadow:0 1px 2px rgba(10,31,74,.04),0 12px 40px rgba(10,31,74,.07);
    max-width:440px;margin:0 auto;width:100%;
  }
  .marca{font-size:15px;font-weight:800;text-align:center;letter-spacing:-.01em}
  .marca span{color:var(--pulso)}
  .card h2{text-align:center;font-size:27px;line-height:1.2;margin:14px 0 6px;letter-spacing:-.02em}
  .estado{
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12.5px;color:var(--gris);margin-bottom:26px;
  }
  .dot{width:7px;height:7px;border-radius:99px;background:var(--verde);flex:none}
  .dot.on{animation:lat 2s ease-in-out infinite}
  @keyframes lat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
  label{display:block;font-size:12.5px;font-weight:600;margin:0 0 7px}
  input{
    width:100%;padding:13px 15px;border:1.5px solid var(--linea);border-radius:11px;
    font-size:14.5px;font-family:inherit;margin-bottom:16px;transition:border-color .15s;
    background:var(--blanco);color:var(--tinta);
  }
  input:focus{border-color:var(--pulso)}
  .btn{
    width:100%;background:var(--pulso);color:#fff;padding:14px;border-radius:11px;
    font-size:14.5px;font-weight:700;transition:filter .15s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .err{
    background:#FEF3F2;border:1px solid #FDA29B;color:#B42318;
    padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;
  }

  /* ---------- APP ---------- */
  #app{display:none;min-height:100vh}
  header{
    background:var(--blanco);border-bottom:1px solid var(--linea);
    padding:0 22px;display:flex;align-items:center;gap:20px;
    position:sticky;top:0;z-index:20;flex-wrap:wrap;
  }
  .marca{font-size:16px}
  nav{display:flex;gap:4px;flex:1 1 auto;min-width:0}
  .hend{display:flex;align-items:center;gap:14px;margin-left:auto;min-width:0}
  nav button{
    background:none;padding:19px 14px;font-size:14px;font-weight:600;color:var(--gris);
    border-bottom:2.5px solid transparent;margin-bottom:-1px;
  }
  nav button.on{color:var(--pulso);border-bottom-color:var(--pulso)}
  .vivo{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gris);
        font-weight:600;min-width:0}
  .vivo span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .salir{background:none;color:var(--gris);font-size:13px;padding:8px 12px;border-radius:8px}
  .salir:hover{background:var(--aire);color:var(--profundo)}
  main{padding:34px 26px 70px;max-width:1440px;margin:0 auto}
  h2.tit{font-size:32px;letter-spacing:-.03em;margin-bottom:5px}
  .sub{color:var(--gris);font-size:14px;margin-bottom:28px;max-width:70ch;line-height:1.55}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:15px;margin-bottom:26px}
  .kpi{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:21px 23px}
  .kpi .lab{font-size:12px;color:var(--gris);font-weight:600;margin-bottom:9px}
  .kpi .num{font-size:41px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .kpi .num.az{color:var(--pulso)}
  .kpi .num small{font-size:17px;font-weight:700}
  .kpi .pie{font-size:11.5px;color:var(--gris);margin-top:9px}
  .kpi.pend{background:repeating-linear-gradient(135deg,#fff,#fff 9px,#FBFCFE 9px,#FBFCFE 18px)}
  .kpi.pend .num{color:#CBD5E1}

  .panel{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:23px 25px;margin-bottom:22px}
  .panel h3{font-size:15px;margin-bottom:3px}
  .panel .ph{color:var(--gris);font-size:12.5px;margin-bottom:20px}

  .vacio{text-align:center;padding:46px 20px;color:var(--gris);font-size:13.5px;line-height:1.6}

  .tabla{overflow-x:auto;margin:0 -25px;padding:0 25px;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td,th{white-space:nowrap}
  td:first-child,th:first-child{white-space:normal}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--gris);padding:0 14px 11px;font-weight:700;
  }
  td{padding:13px 14px;border-top:1px solid var(--linea)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--fondo)}
  .pill{
    display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;
    border-radius:99px;background:var(--aire);color:var(--profundo);
  }
  .pill.hist{background:#F1F5F9;color:var(--gris)}

  .modal{
    display:none;position:fixed;inset:0;background:rgba(10,14,26,.55);
    z-index:50;padding:26px;overflow-y:auto;
  }
  .modal .box{
    background:var(--blanco);border-radius:var(--r);max-width:760px;margin:26px auto;
    padding:30px 32px;
  }
  .modal .cab{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
  .cerrar{background:none;font-size:25px;color:var(--gris);line-height:1;padding:0 6px}
  .msg{display:flex;margin-bottom:11px}
  .msg .burb{max-width:76%;padding:11px 15px;border-radius:14px;font-size:13.5px;line-height:1.55}
  .msg.h{justify-content:flex-start}
  .msg.h .burb{background:var(--aire);border-bottom-left-radius:4px}
  .msg.a{justify-content:flex-end}
  .msg.a .burb{background:var(--pulso);color:#fff;border-bottom-right-radius:4px}
  .hora{font-size:10.5px;color:var(--gris);margin-top:5px;opacity:.8}
  .msg.a .hora{color:#DBEAFE}

  .aviso{
    background:#FFFAEB;border:1px solid #FEDF89;border-radius:12px;
    padding:13px 17px;font-size:12.5px;color:#93370D;margin-bottom:24px;line-height:1.6;
  }
  .cabpanel{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .rangos{display:flex;gap:4px;background:var(--fondo);padding:3px;border-radius:10px}
  .rg{background:none;padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--gris)}
  .rg.on{background:var(--blanco);color:var(--pulso);box-shadow:0 1px 3px rgba(10,31,74,.09)}
  .mini{display:flex;gap:26px;flex-wrap:wrap;font-size:12.5px;color:var(--gris);margin:16px 0 20px;
        padding-bottom:16px;border-bottom:1px solid var(--linea)}
  .mini strong{color:var(--tinta);font-size:15px;font-weight:700;margin-right:5px}
  .nota{font-size:12px;color:var(--gris);line-height:1.6;margin:-6px 0 30px;max-width:76ch}
  .secc{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--gris);margin-bottom:13px}
  .ficha{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:1px 22px;font-size:13.5px}
  .ficha dt{color:var(--gris);font-weight:600;padding:9px 0;border-top:1px solid var(--linea)}
  .ficha dd{padding:9px 0;border-top:1px solid var(--linea);line-height:1.55}
  .ficha dt:first-of-type,.ficha dd:first-of-type{border-top:0}
  @media(max-width:640px){.ficha{grid-template-columns:1fr;gap:0}
    .ficha dd{padding-top:0;border-top:0}}
  .campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
  .campos input{margin-bottom:0}
  .acc{display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap}
  .btn.corto{width:auto;padding:11px 22px}
  .msg-ok{font-size:12.5px;color:var(--verde);font-weight:600}
  .msg-err{font-size:12.5px;color:var(--rojo);font-weight:600}
  .feed{list-style:none;margin:0;padding:0}
  .feed li{display:grid;grid-template-columns:auto 52px 62px 1fr;gap:11px;align-items:baseline;
           padding:9px 0;border-top:1px solid var(--linea);font-size:13px}
  .feed li:first-child{border-top:0}
  .fdot{width:7px;height:7px;border-radius:99px;margin-top:6px}
  .fdot.h{background:var(--pulso)}
  .fdot.a{background:#94A3B8}
  .fh{font-size:11.5px;color:var(--gris)}
  .fq{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.04em}
  .ft{color:var(--tinta);line-height:1.5;min-width:0;overflow-wrap:anywhere}
  @media(max-width:640px){.feed li{grid-template-columns:auto 52px 1fr}.fq{display:none}}
  .barras{display:grid;gap:19px}
  .bfila{}
  .bcab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:12px}
  .blab{font-size:13.5px;font-weight:600}
  .bnum{font-size:14px;font-weight:700}
  .bnum small{color:var(--gris);font-weight:500;font-size:11.5px}
  .btrack{height:8px;background:var(--aire);border-radius:99px;overflow:hidden}
  .bfill{height:100%;border-radius:99px;transition:width .5s ease}
  .bfill.az{background:var(--pulso)} .bfill.vd{background:var(--verde)}
  .bfill.rj{background:var(--ambar)}
  .bpie{font-size:11.5px;color:var(--gris);margin-top:6px}

  .zonas{display:grid;gap:9px}
  .zfila{display:grid;grid-template-columns:minmax(120px,1.4fr) 68px 1fr 42px;
         gap:12px;align-items:center;font-size:13px}
  .zn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zz{font-size:11px;color:var(--gris)}
  .ztrack{height:7px;background:var(--aire);border-radius:99px;overflow:hidden;min-width:30px}
  .zfill{display:block;height:100%;background:var(--pulso);border-radius:99px}
  .zc{text-align:right;font-weight:700}
  @media(max-width:600px){.zfila{grid-template-columns:1fr 46px;gap:4px 10px}
    .zz,.ztrack{display:none}}

  .mapa{overflow-x:auto;padding-bottom:4px}
  .mhoras,.mfila{display:grid;grid-template-columns:38px repeat(24,minmax(11px,1fr));
                 gap:3px;align-items:center;min-width:420px}
  .mhoras{margin-bottom:5px}
  .mh{font-size:9.5px;color:var(--gris);text-align:center;font-family:'JetBrains Mono',monospace}
  .mfila{margin-bottom:3px}
  .md{font-size:11px;color:var(--gris);font-weight:600}
  .mc{aspect-ratio:1;border-radius:3px;background:var(--aire);min-height:11px}

  .busca{width:auto;min-width:230px;max-width:100%;margin:0;padding:9px 13px;font-size:13.5px}
  @media(max-width:600px){.busca{width:100%;min-width:0}}
  .aprox{font-size:10px;color:var(--gris);font-weight:600}
  .pill.az{background:#E5EFFE;color:#0A4DA6}
  .pill.vd{background:#E7F8F0;color:#04724D}
  .pill.rj{background:#FEF0C7;color:#93370D}
  td .pill{margin-right:4px}
  .hint{font-size:11px;color:var(--gris);margin-top:6px;line-height:1.5}
  input:disabled{background:var(--fondo);color:var(--gris);cursor:not-allowed}
  .cargando{text-align:center;padding:60px;color:var(--gris);font-size:13.5px}

  /* ---------- MÓVIL ---------- */
  @media(max-width:820px){
    header{padding:0;gap:0}
    .marca{order:1;padding:13px 16px;flex:1 1 auto}
    .hend{order:2;padding:13px 16px;margin-left:0;flex:0 0 auto}
    .hend .vivo span:last-child{max-width:110px}
    nav{order:3;flex:0 0 100%;width:100%;padding:0 8px;
        border-top:1px solid var(--linea);overflow-x:auto;
        scrollbar-width:none;-webkit-overflow-scrolling:touch}
    nav::-webkit-scrollbar{display:none}
    nav button{padding:13px 12px;font-size:13.5px;white-space:nowrap;flex:0 0 auto}
    main{padding:24px 16px 60px}
    h2.tit{font-size:25px}
    .panel{padding:19px 17px}
    .kpi{padding:18px 19px}
    .kpi .num{font-size:35px}
    .tabla{margin:0 -17px;padding:0 17px}
    .mini{gap:16px 20px}
    .modal{padding:0}
    .modal .box{margin:0;border-radius:0;min-height:100vh;padding:22px 18px}
    .modal .cab{position:sticky;top:0;background:var(--blanco);
                padding-bottom:14px;margin-bottom:16px;z-index:2}
    .msg .burb{max-width:88%}
    .rangos{width:100%;justify-content:space-between}
    .rg{flex:1;text-align:center}
    .cabpanel{gap:14px}
  }
  @media(max-width:420px){
    .kpis{grid-template-columns:1fr}
    .campos{grid-template-columns:1fr}
    main{padding:20px 13px 56px}
    .tabla{margin:0 -17px;padding:0 17px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login">
  <div class="izq">
    <div class="eyebrow">Panel de cliente</div>
    <h1>Encender<br>el <em>pulso</em>.</h1>
    <p>Tu operación no se detiene cuando cierras la oficina. Cada conversación
       que atiende la IA queda registrada aquí: cuándo entró, qué se pidió y cómo se resolvió.</p>
  </div>
  <div class="der">
    <div class="card">
      <div class="marca">Simplia<span>Spain</span></div>
      <h2>Tu operación<br><em>nunca duerme.</em></h2>
      <div class="estado"><span class="dot on"></span><span id="ping">Conectando…</span></div>
      <div class="err" id="err"></div>
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="email" placeholder="tu@empresa.com">
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="entrar">Entrar al panel →</button>
    </div>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app">
  <header>
    <div class="marca">Simplia<span>Spain</span></div>
    <nav>
      <button class="on" data-v="latido">Latido</button>
      <button data-v="convs">Conversaciones</button>
      <button data-v="ajustes">Configuración</button>
    </nav>
    <div class="hend">
      <div class="vivo"><span class="dot on"></span><span id="cliente">—</span></div>
      <button class="salir" id="salir">Salir</button>
    </div>
  </header>
  <main>
    <div id="vista"><div class="cargando">Cargando datos…</div></div>
  </main>
</div>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const URL = 'https://bmbfmcgqfruhnhlxxdmy.supabase.co';
const KEY = 'sb_publishable_YE2Oe3kvM70VGL-304-SXw_yU8KPzS2';

// Sesión en memoria: los artefactos no permiten almacenamiento del navegador.
const supabase = createClient(URL, KEY, {
  auth: { persistSession:false, autoRefreshToken:true, detectSessionInUrl:false }
});

const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat('es-ES');
let TENANT = null, CONVS = [];
// Toda la terminología y el horario laboral vienen del cliente
// (tabla tenants), no del código. Estos son solo los valores por
// defecto si la configuración no llegara.
let CFG = {
  etiquetas: {
    ubicacion_titulo: 'Ubicaciones más solicitadas',
    ubicacion_desc:   'Sedes y zonas que mencionan los clientes.',
    ubicacion_vacio:  'sedes',
    servicio_titulo:  'Qué servicios preguntan',
    servicio_desc:    'Servicios sobre los que consultan los clientes.',
    servicio_vacio:   'servicios',
    senales_titulo:   'Qué buscan tus clientes',
    interes_desc:     'Muestran intención de compra o de cita',
    contacto_desc:    'Han facilitado email o teléfono',
    friccion_desc:    'Piden atención humana o expresan queja'
  },
  horario:   { inicio: 9, fin: 19, dias: [1,2,3,4,5] },
  objetivos: []
};
const E = k => CFG.etiquetas[k] || '';

/* ---------- comprobación de conexión ---------- */
(async () => {
  try {
    const { error } = await supabase.from('tenants').select('id').limit(1);
    $('#ping').textContent = error ? 'Servicio disponible' : 'Servicio disponible';
  } catch { $('#ping').textContent = 'Sin conexión con el servicio'; }
})();

/* ---------- login ---------- */
$('#entrar').addEventListener('click', entrar);
$('#pw').addEventListener('keydown', e => e.key === 'Enter' && entrar());
$('#em').addEventListener('keydown', e => e.key === 'Enter' && $('#pw').focus());

async function entrar(){
  const b = $('#entrar'), e = $('#err');
  e.style.display = 'none';
  b.disabled = true; b.textContent = 'Comprobando…';

  const { error } = await supabase.auth.signInWithPassword({
    email: $('#em').value.trim(), password: $('#pw').value
  });

  if (error){
    e.textContent = error.message.includes('Invalid')
      ? 'Email o contraseña incorrectos. Revísalos e inténtalo otra vez.'
      : error.message;
    e.style.display = 'block';
    b.disabled = false; b.textContent = 'Entrar al panel →';
    return;
  }
  $('#login').style.display = 'none';
  $('#app').style.display = 'block';
  await arrancar();
}

/* Auto-refresco cada 30 s. Se detiene si la pestaña no está
   visible, para no consumir peticiones en balde, y no interrumpe
   si hay un modal abierto o el usuario está escribiendo. */
let TIMER = null, VISTA = 'latido';
function autoRefresco(){
  clearInterval(TIMER);
  TIMER = setInterval(() => {
    if (document.hidden) return;
    if ($('#modal').style.display === 'block') return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (VISTA === 'latido') pintarLatido();
    else if (VISTA === 'convs' && !$('#buscar')?.value) pintarConvs();
  }, 30000);
}

$('#salir').addEventListener('click', async () => {
  clearInterval(TIMER);
  await supabase.auth.signOut();
  location.reload();
});

document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const v = b.dataset.v; VISTA = v;
    if (v === 'latido') pintarLatido();
    else if (v === 'convs') pintarConvs();
    else pintarAjustes();
  });
});

/* ---------- carga ---------- */
async function arrancar(){
  const { data: t } = await supabase.from('tenants').select('id,name').limit(1).single();
  if (!t){
    $('#vista').innerHTML = `<div class="panel"><div class="vacio">
      <strong>Tu cuenta no tiene ningún cliente asignado.</strong><br>
      Falta la fila correspondiente en <code>memberships</code>.</div></div>`;
    return;
  }
  TENANT = t;
  $('#cliente').textContent = t.name;

  // Los textos del panel salen del tenant, no del código: así un
  // cliente de otro sector ve su propia terminología.
  try {
    const { data } = await supabase.rpc('mi_config');
    if (data){
      CFG.etiquetas = { ...CFG.etiquetas, ...(data.etiquetas || {}) };
      if (data.horario)   CFG.horario   = data.horario;
      if (data.objetivos) CFG.objetivos = data.objetivos;
    }
  } catch { /* se usan los valores por defecto */ }
  await pintarLatido();
  autoRefresco();
}

let RANGO = 24;   // horas

async function datos(){
  const desde = new Date(Date.now() - RANGO*36e5).toISOString();

  const [convs, evR, evTot, lat, reciente, lugares, patron] = await Promise.all([
    supabase.from('conversations')
      .select('id,contact_ref,started_at,last_at,msg_count,human_count,ai_count,is_backfilled,seq,fecha_origen,fecha_estimada,senal_interes,senal_frustracion,senal_contacto')
      .order('last_at', { ascending:false }).limit(1000),
    supabase.from('message_events')
      .select('role,observed_at')
      .eq('is_backfilled', false).gte('observed_at', desde),
    supabase.from('message_events').select('id', { count:'exact', head:true }),
    supabase.from('message_events')
      .select('latency_ms').not('latency_ms', 'is', null)
      .order('id', { ascending:false }).limit(200),
    supabase.from('message_events')
      .select('conversation_id,role,content,observed_at,is_backfilled')
      .eq('is_backfilled', false)
      .order('id', { ascending:false }).limit(12),
    supabase.from('v_demanda_temas').select('*').limit(40),
    supabase.from('v_patron_horario').select('*')
  ]);

  // Orden: primero lo registrado con fecha real (más reciente arriba);
  // después el histórico, ordenado por seq — que conserva el orden
  // original de n8n aunque no tengamos la fecha.
  // Ahora hay fecha real para casi todo (fecha_origen viene de
  // users.created_at en el histórico), así que se ordena por ella.
  CONVS = (convs.data || []).sort((a, b) => {
    const fa = a.fecha_origen ? new Date(a.fecha_origen).getTime() : null;
    const fb = b.fecha_origen ? new Date(b.fecha_origen).getTime() : null;
    if (fa && fb && fa !== fb) return fb - fa;
    if (fa && !fb) return -1;
    if (!fa && fb) return 1;
    return (b.seq || 0) - (a.seq || 0);
  });
  const lats = (lat.data || []).map(r => r.latency_ms);
  return {
    convs: CONVS,
    evR:   evR.data || [],
    total: evTot.count || 0,
    lats,
    latMedia: lats.length
      ? lats.reduce((a,b) => a+b, 0) / lats.length / 1000
      : null,
    reciente: reciente.data || [],
    temas:    lugares.data  || [],
    patron:   patron.data   || [],
    vivas: CONVS.filter(c => !c.is_backfilled),
    hist:  CONVS.filter(c =>  c.is_backfilled)
  };
}

/* ---------- patrón horario ---------- */
function bloquePatron(d){
  if (!d.patron.length) return '';
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  let max = 0;
  d.patron.forEach(p => {
    const v = Number(p.mensajes) || 0;
    grid[p.dia_semana][p.hora] += v;
    if (grid[p.dia_semana][p.hora] > max) max = grid[p.dia_semana][p.hora];
  });
  if (!max) return '';

  // Horario laboral real del cliente (settings.horario).
  // dias viene en formato ISO 1=lunes…7=domingo; getDay() usa 0=domingo.
  const H = CFG.horario || { inicio:9, fin:19, dias:[1,2,3,4,5] };
  const lab = new Set((H.dias || [1,2,3,4,5]).map(n => n === 7 ? 0 : n));
  let fuera = 0, total = 0;
  for (let dd=0; dd<7; dd++) for (let h=0; h<24; h++){
    const v = grid[dd][h]; total += v;
    if (!lab.has(dd) || h < H.inicio || h >= H.fin) fuera += v;
  }
  const pct = total ? Math.round(fuera / total * 100) : 0;
  const dnom = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const dlab = (H.dias || []).map(n => dnom[n === 7 ? 0 : n]);
  const rango = dlab.length
    ? `${dlab[0]} a ${dlab[dlab.length-1]}, de ${H.inicio}:00 a ${H.fin}:00`
    : `de ${H.inicio}:00 a ${H.fin}:00`;

  const orden = [1,2,3,4,5,6,0];
  return `<div class="panel">
    <h3>Cuándo escriben</h3>
    <p class="ph">Mensajes por día y hora. <strong>${pct}%</strong> llegan fuera
       de tu horario de atención (${rango}) — y se atienden igual.</p>
    <div class="mapa">
      <div class="mhoras"><span></span>${
        Array.from({length:24}, (_,h) => `<span class="mh">${h%6===0?h:''}</span>`).join('')}</div>
      ${orden.map(dd => `<div class="mfila">
        <span class="md">${dias[dd]}</span>
        ${grid[dd].map((v,h) => {
          const o = v ? (0.14 + 0.86 * (v / max)) : 0;
          return `<span class="mc" style="background:rgba(27,124,255,${o.toFixed(3)})"
            title="${dias[dd]} ${h}:00 · ${v} mensajes"></span>`;
        }).join('')}
      </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- cardiograma ---------- */
function grafica(ev){
  if (!ev.length) return `<div class="vacio">
    Todavía no hay mensajes registrados en este periodo.<br>
    En cuanto entre uno, aparecerá aquí.</div>`;

  const porDia = RANGO > 48;
  const paso   = porDia ? 864e5 : 36e5;
  const n      = porDia ? Math.round(RANGO/24) : RANGO;

  const cubos = Array.from({length:n}, (_,i) => {
    const t = new Date(Date.now() - (n-1-i)*paso);
    porDia ? t.setHours(0,0,0,0) : t.setMinutes(0,0,0);
    return { t, n:0 };
  });
  ev.filter(e => e.role === 'human').forEach(e => {
    const t = new Date(e.observed_at);
    porDia ? t.setHours(0,0,0,0) : t.setMinutes(0,0,0);
    const s = cubos.find(x => x.t.getTime() === t.getTime());
    if (s) s.n++;
  });

  const max = Math.max(...cubos.map(h => h.n), 1);
  const W = 1000, H = 190;
  const pts = cubos.map((h,i) => [
    (i/Math.max(cubos.length-1,1))*W,
    H - (h.n/max)*(H-34) - 17
  ]);
  const linea = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area  = `M0 ${H} L` + pts.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L') + ` L${W} ${H} Z`;
  const et = d => porDia
    ? d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' })
    : d.getHours() + ':00';

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
      aria-label="Mensajes entrantes a lo largo del periodo">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B7CFF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#1B7CFF" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#E2E8F0" stroke-width="1"/>
    <path d="${area}" fill="url(#g)"/>
    <path d="${linea}" fill="none" stroke="#1B7CFF" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i) => cubos[i].n > 0
      ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#1B7CFF"/>` : '').join('')}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:#64748B;margin-top:9px"
       class="mono">
    <span>${et(cubos[0].t)}</span>
    <span>${et(cubos[Math.floor(cubos.length/2)].t)}</span>
    <span>${et(cubos[cubos.length-1].t)} · ahora</span>
  </div>`;
}

function enlazarFilas(){
  document.querySelectorAll('tbody tr').forEach(tr =>
    tr.addEventListener('click', () => abrir(tr.dataset.id)));
}

async function filtrar(q){
  const tb = document.querySelector('tbody');
  if (!tb) return;

  if (!q){
    tb.innerHTML = CONVS.slice(0,100).map(fila).join('');
    enlazarFilas(); return;
  }

  // teléfono: filtra en memoria. texto: busca en los mensajes.
  if (/^[0-9+ ]{3,}$/.test(q)){
    const n = q.replace(/[^0-9]/g,'');
    const r = CONVS.filter(c => (c.contact_ref||'').includes(n));
    tb.innerHTML = r.length ? r.map(fila).join('')
      : `<tr><td colspan="6" class="vacio">Ningún contacto coincide.</td></tr>`;
    enlazarFilas(); return;
  }

  tb.innerHTML = `<tr><td colspan="6" class="vacio">Buscando…</td></tr>`;
  const { data } = await supabase.from('message_events')
    .select('conversation_id').ilike('content', `%${q}%`).limit(400);
  const ids = new Set((data || []).map(r => r.conversation_id));
  const r = CONVS.filter(c => ids.has(c.id));
  tb.innerHTML = r.length ? r.map(fila).join('')
    : `<tr><td colspan="6" class="vacio">Ninguna conversación contiene «${esc(q)}».</td></tr>`;
  enlazarFilas();
}

        <dd>Texto de los mensajes, fecha y hora, y un identificador del
            contacto para poder agrupar la conversación.</dd>
        <dt>Para qué</dt>
        <dd>Atender la conversación, calcular las métricas de este panel
            y permitir consultar el histórico.</dd>
        <dt>Quién accede</dt>
        <dd>Solo los usuarios dados de alta en tu cuenta. Cada cliente ve
            exclusivamente sus propias conversaciones.</dd>
        <dt>Servicios implicados</dt>
        <dd>OpenAI (generación de respuestas y transcripción de audios),
            Supabase (almacenamiento, servidores en la UE) y Hostinger
            (servidor del asistente).</dd>
        <dt>Números de teléfono</dt>
        <dd>Se muestran parcialmente ofuscados en este panel.</dd>
        <dt>Horario y ubicaciones</dt>
        <dd>Se configuran con los datos que nos facilitaste en el alta del
            servicio. Si algo ha cambiado, dínoslo y lo actualizamos.</dd>
      </dl>
      <p class="aviso" style="margin:16px 0 0">
        Para ejercer derechos de acceso, rectificación o supresión sobre un
        contacto concreto, escríbenos y lo tramitamos.
      </p>
    </div>`;

  $('#guardar').addEventListener('click', async () => {
    const b = $('#guardar'), m = $('#msg');
    b.disabled = true; b.textContent = 'Guardando…'; m.textContent = '';
    const num = v => v === '' ? null : Number(v);
    try {
      const args = { p_email_avisos: $('#ea').value.trim() };
      if (!$('#ch').disabled){
        args.p_coste_hora = num($('#ch').value);
        args.p_minutos    = num($('#mn').value);
      }
      const { error } = await supabase.rpc('actualizar_ajustes', args);
      if (error) throw error;
      m.textContent = 'Cambios guardados.';
      m.className = 'msg-ok';
    } catch (e) {
      m.textContent = e.message === 'Sin acceso'
        ? 'Tu cuenta no tiene permiso para modificar estos ajustes.'
        : (e.message || 'No se han podido guardar los cambios.');
      m.className = 'msg-err';
    }
    b.disabled = false; b.textContent = 'Guardar cambios';
  });
}

const fila = c => `<tr data-id="${c.id}">
  <td class="mono">${ofusca(c.contact_ref)}</td>
  <td class="mono">${c.msg_count}</td>
  <td class="mono">${c.human_count}</td>
  <td class="mono">${c.ai_count}</td>
  <td>${c.fecha_origen
        ? fecha(c.fecha_origen) + (c.fecha_estimada ? ' <span class="aprox">aprox.</span>' : '')
        : '—'}</td>
  <td>${[
      c.senal_interes     ? '<span class="pill az">Interés</span>'   : '',
      c.senal_contacto    ? '<span class="pill vd">Contacto</span>'  : '',
      c.senal_frustracion ? '<span class="pill rj">Fricción</span>'  : ''
    ].join('') || '<span class="pill hist">—</span>'}</td>
</tr>`;

function horarioTexto(){
  const H = CFG.horario || {};
  const dn = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const ds = (H.dias || []).map(n => dn[n === 7 ? 0 : n]);
  if (!ds.length) return '—';
  return `${ds[0]} a ${ds[ds.length-1]}, de ${H.inicio}:00 a ${H.fin}:00`;
}

/* ---------- detalle ---------- */
async function abrir(id){
  const c = CONVS.find(x => x.id === id);
  $('#mbox').innerHTML = '<div class="cargando">Cargando…</div>';
  $('#modal').style.display = 'block';

  const { data } = await supabase.from('message_events')
    .select('role,content,observed_at,is_backfilled')
    .eq('conversation_id', id).order('id', { ascending:true });

  $('#mbox').innerHTML = `
    <div class="cab">
      <div>
        <h2 style="font-size:22px;letter-spacing:-.02em">Conversación</h2>
        <p style="color:#64748B;font-size:13px;margin-top:5px" class="mono">
          ${ofusca(c.contact_ref)} · ${data.length} mensajes</p>
      </div>
      <button class="cerrar" id="cx" aria-label="Cerrar">×</button>
    </div>
    ${data.map(m => `<div class="msg ${m.role === 'human' ? 'h' : 'a'}">
      <div class="burb">${esc(m.content || '')}
        <div class="hora">${m.is_backfilled ? 'Sin fecha registrada' : hora(m.observed_at)}</div>
      </div></div>`).join('')}`;

  $('#cx').addEventListener('click', cerrar);
}
function cerrar(){ $('#modal').style.display = 'none'; }
$('#modal').addEventListener('click', e => e.target.id === 'modal' && cerrar());
document.addEventListener('keydown', e => e.key === 'Escape' && cerrar());

/* ---------- utilidades ---------- */
// El teléfono completo no se muestra en pantalla: se ve lo justo para reconocer al contacto.
const ofusca = t => t ? t.slice(0,4) + '···' + t.slice(-3) : '—';
const esc = s => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fecha = d => new Date(d).toLocaleString('es-ES',
  { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const hora = d => new Date(d).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
</script>
