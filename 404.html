<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<!-- Lo que se anuncia a quien usa lector de pantalla. No se ve.
     aria-live="polite" espera a que termine de leer lo que esté
     leyendo: con "assertive" interrumpiría a media frase cada vez
     que el panel se refresca solo. -->
<div class="sr" id="anuncio" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const URL = 'https://gwibsjohvfxasslcrxuq.supabase.co';
const KEY = 'sb_publishable_FAdZnCbOMYQTDJY-5ysSBg_FryJ_Z81';

// Sesión en memoria: los artefactos no permiten almacenamiento del navegador.
const supabase = createClient(URL, KEY, {
  auth: { persistSession:false, autoRefreshToken:true, detectSessionInUrl:false }
});

/* ============================================================
   REGISTRO DE INCIDENCIAS

   Cuando el panel del cliente falla —un error de
   JavaScript, una consulta que devuelve permission denied, una
   promesa sin capturar— lo registra en `incidencias` y aparece
   solo en el panel maestro. Hoy, si al cliente le falla algo, no
   nos enteramos hasta que llama.

   Requiere 020_maestro.sql aplicado. Si no lo está, la llamada
   falla en silencio y el panel sigue funcionando igual.

   Nota: no reporta más de una vez por código y sesión. Un error
   dentro de un bucle de render podría disparar cientos de
   inserciones por segundo; el contador `veces` de la tabla ya
   recoge la reincidencia entre sesiones.
   ============================================================ */

const YA_REPORTADO = new Set();

async function reportar(codigo, titulo, detalle = {}, severidad = 'aviso'){
  if (YA_REPORTADO.has(codigo)) return;
  YA_REPORTADO.add(codigo);
  try {
    await supabase.rpc('mt_registrar_incidencia', {
      p_codigo:    codigo,
      p_titulo:    String(titulo).slice(0, 300),
      p_severidad: severidad,
      p_detalle:   { ...detalle,
                     vista:  typeof VISTA !== 'undefined' ? VISTA : null,
                     agente: navigator.userAgent.slice(0, 180) },
      p_origen:    'panel'
    });
  } catch { /* si ni siquiera se puede reportar, no hay nada más que hacer */ }
}

const codigoDe = (pref, txt) =>
  pref + '_' + String(txt || 'error').slice(0, 60).replace(/\W+/g, '_').toLowerCase();

window.addEventListener('error', e => reportar(
  codigoDe('js', e.message),
  'Error de JavaScript: ' + (e.message || 'desconocido'),
  { fichero: e.filename, linea: e.lineno }));

window.addEventListener('unhandledrejection', e => {
  const t = String(e.reason?.message || e.reason || '');
  reportar(codigoDe('promesa', t), 'Promesa sin capturar: ' + t.slice(0, 200));
});

/* Además de los errores de JavaScript, interesa saber cuándo una
   consulta a Supabase devuelve error: es el fallo más probable y
   el más silencioso, porque el panel solo muestra "no se han
   podido cargar" y el cliente cierra la pestaña. */
const _rpc = supabase.rpc.bind(supabase);
supabase.rpc = async (nombre, args, opciones) => {
  const r = await _rpc(nombre, args, opciones);
  if (r?.error && nombre !== 'registrar_incidencia'){
    reportar('rpc_' + nombre,
             `Fallo en ${nombre}(): ${r.error.message}`,
             { codigo: r.error.code, pista: r.error.hint },
             'critico');
  }
  return r;
};

const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat('es-ES');
let TENANT = null, CONVS = [];
// Toda la terminología y el horario laboral vienen del cliente
// (tabla tenants), no del código. Estos son solo los valores por
// defecto si la configuración no llegara.
let CFG = {
  etiquetas: {
    ubicacion_titulo: 'Ubicaciones más solicitadas',
    ubicacion_desc:   'Sedes y zonas que mencionan los clientes.',
    ubicacion_vacio:  'sedes',
    servicio_titulo:  'Qué servicios preguntan',
    servicio_desc:    'Servicios sobre los que consultan los clientes.',
    servicio_vacio:   'servicios',
    senales_titulo:   'Por qué se interesan',
    interes_desc:     'Muestran intención de compra o de cita',
    contacto_desc:    'Han facilitado email o teléfono',
    friccion_desc:    'Piden atención humana o expresan queja'
  },
  horario:   { inicio: 9, fin: 19, dias: [1,2,3,4,5] },
  objetivos: [],
  documentos: [],
  mapas: {},
  modulos: {},
  tratamiento: []
};
let ULTIMA = null;   // instante de la última carga de datos
const E = k => CFG.etiquetas[k] || '';

/* ---------- comprobación de conexión ---------- */
(async () => {
  const punto = document.querySelector('.card .dot');
  const poner = (txt, ok) => {
    $('#ping').textContent = txt;
    // El punto deja de latir y se pone gris si no hay servicio: en
    // verde junto a «sin conexión» se contradecía a sí mismo.
    if (punto) punto.className = 'dot' + (ok ? ' on' : ' mal');
  };
  try {
    const { error } = await supabase.rpc('mt_ping');
    poner(error ? 'Sin conexión con el servicio' : 'Servicio disponible', !error);
  } catch { poner('Sin conexión con el servicio', false); }
})();

/* ---------- login ---------- */
$('#entrar').addEventListener('click', entrar);
$('#pw').addEventListener('keydown', e => e.key === 'Enter' && entrar());
$('#em').addEventListener('keydown', e => e.key === 'Enter' && $('#pw').focus());

async function entrar(){
  const b = $('#entrar'), e = $('#err');
  e.style.display = 'none';
  b.disabled = true; b.textContent = 'Comprobando…';

  const { error } = await supabase.auth.signInWithPassword({
    email: $('#em').value.trim(), password: $('#pw').value
  });

  if (error){
    // El mensaje tiene que distinguir qué ha fallado. Decir "email o
    // contraseña incorrectos" cuando el problema es la conexión o la
    // configuración manda a la gente a cambiar su contraseña por algo
    // que no tiene nada que ver.
    const m = String(error.message || '');
    e.textContent =
      /Invalid login/i.test(m)      ? 'Email o contraseña incorrectos. Revísalos e inténtalo otra vez.' :
      /Email not confirmed/i.test(m)? 'Tu cuenta existe pero no está confirmada todavía.' :
      /Failed to fetch|NetworkError|fetch/i.test(m)
                                    ? 'No se ha podido contactar con el servidor. Revisa la conexión.' :
      /API key|apikey|JWT|anon/i.test(m)
                                    ? 'La configuración del panel no es válida. Avisa a SimpliaSpain.' :
      m || 'No se ha podido entrar.';
    e.style.display = 'block';
    console.error('Entrada rechazada:', error);
    b.disabled = false; b.textContent = 'Entrar al panel';
    return;
  }
  $('#login').style.display = 'none';
  $('#app').style.display = 'block';
  await arrancar();
}

/* Auto-refresco cada 30 s. Se detiene si la pestaña no está
   visible, para no consumir peticiones en balde, y no interrumpe
   si hay un modal abierto o el usuario está escribiendo. */
let TIMER = null, VISTA = 'latido', MAPA = null, ULTIMOS = null, PUNTOS = null;
function autoRefresco(){
  clearInterval(TIMER);
  TIMER = setInterval(() => {
    if (document.hidden) return;
    if ($('#modal').style.display === 'block') return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) return;
    if (VISTA === 'latido') pintarLatido(true);
    else if (VISTA === 'convs' && !$('#buscar')?.value) pintarConvs(true);
    else if (VISTA === 'embudo' && !$('#lbusca')?.value) pintarEmbudo(true);
    else if (VISTA === 'agenda') pintarAgenda(true);
  }, 30000);
}

$('#salir').addEventListener('click', async () => {
  clearInterval(TIMER);
  await supabase.auth.signOut();
  location.reload();
});

// En una función porque al cambiar de cliente hay que rehacer la
// barra: la pestaña Agenda se quita o se pone según ese cliente
// tenga citas, y los oyentes se pierden al reescribir el HTML.
function enlazarNav(){
  document.querySelectorAll('nav button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      const v = b.dataset.v; VISTA = v;
      if (v !== 'latido' && LMAP){ LMAP.remove(); LMAP = null; LCAPA = null; }
      if (v === 'latido') pintarLatido();
      else if (v === 'convs') pintarConvs();
      else if (v === 'embudo') pintarEmbudo();
      else if (v === 'agenda') pintarAgenda();
      else pintarAjustes();
    });
  });
}
enlazarNav();

/* ---------- carga ---------- */
async function arrancar(){
  // mt_mi_config devuelve una fila solo si quien entra tiene acceso
  // a algún cliente. Sin fila, la cuenta existe pero no está dada de
  // alta en ninguno.
  const { data: cfg } = await supabase.rpc('mt_mi_config');
  const t = Array.isArray(cfg) ? cfg[0] : cfg;
  if (!t){
    $('#vista').innerHTML = `<div class="panel"><div class="vacio">
      <strong>Tu cuenta no tiene ningún cliente asignado.</strong><br>
      Falta la fila correspondiente en <code>mt_miembros</code>
      o en <code>mt_operadores</code>.</div></div>`;
    return;
  }
  TENANT = t;
  $('#cliente').textContent = t.name;

  // Los textos del panel salen del tenant, no del código: así un
  // cliente de otro sector ve su propia terminología.
  try {
    const { data } = await supabase.rpc('mt_mi_config');
    if (data){
      CFG.etiquetas = { ...CFG.etiquetas, ...(data.etiquetas || {}) };
      // El rótulo antiguo pudo quedar guardado en tenants.etiquetas y
      // ganaría al valor por defecto. Se sustituye solo si coincide
      // exactamente. Quitar estas dos líneas cuando la fila esté
      // actualizada en la base de datos (SQL en las notas de entrega).
      if (CFG.etiquetas.senales_titulo === 'Qué buscan tus clientes')
        CFG.etiquetas.senales_titulo = 'Por qué se interesan';
      if (data.horario)   CFG.horario   = data.horario;
      if (data.objetivos)  CFG.objetivos  = data.objetivos;
      if (data.documentos) CFG.documentos = data.documentos;
      if (data.mapas)       CFG.mapas       = data.mapas;
      if (data.modulos)     CFG.modulos     = data.modulos;
      if (data.tratamiento) CFG.tratamiento = data.tratamiento;
    }
  } catch { /* se usan los valores por defecto */ }
  // Fuera de arrancar(): al cambiar de cliente se vuelve a llamar
  // y el oyente se duplicaría, disparando dos cargas por clic.
  if (!$('#refrescar').dataset.listo){
    $('#refrescar').addEventListener('click', refrescar);
    $('#refrescar').dataset.listo = '1';
  }
  // La Agenda se muestra siempre. Una pestaña vacía que explica
  // qué aparecerá ahí vale más que una pestaña ausente: el cliente
  // no puede echar de menos lo que no sabe que existe, y agendar
  // visitas es el paso donde más se cae el proceso de venta.
  // Un cliente sin agenda puede ocultarla con
  // settings.modulos.agenda = false.
  if (CFG.modulos?.agenda === false)
    document.querySelector('nav button[data-v="agenda"]')?.remove();

  await pintarLatido();
  autoRefresco();
}

let RANGO = 24;   // horas

function pintarCuando(){
  const el = $('#rcuando'); if (!el) return;
  if (!ULTIMA){ el.textContent = '—'; return; }
  const s = Math.round((Date.now() - ULTIMA) / 1000);
  el.textContent = s < 10 ? 'ahora mismo'
    : s < 60 ? `hace ${s} s`
    : s < 3600 ? `hace ${Math.round(s/60)} min`
    : `hace ${Math.round(s/3600)} h`;
}
setInterval(pintarCuando, 10000);

async function refrescar(){
  const b = $('#refrescar');
  b?.classList.add('girando');
  if (VISTA === 'latido')       await pintarLatido(true);
  else if (VISTA === 'convs')   await pintarConvs(true);
  else if (VISTA === 'embudo')  await refrescarEmbudo();
  else if (VISTA === 'agenda')  await pintarAgenda(true);
  else                          await pintarAjustes(true);
  b?.classList.remove('girando');
}

async function datos(){
  const desde = new Date(Date.now() - RANGO*36e5).toISOString();

  // Los nombres hacen falta para segmentar las señales por persona.
  // Se piden una sola vez y se reutiliza la misma caché que usan
  // Conversaciones y el detalle de contacto.
  if (!CONTACTOS.length){
    try {
      const { data: cs } = await supabase.rpc('mt_mis_contactos');
      CONTACTOS = cs || [];
    } catch { /* se seguirá mostrando la referencia del contacto */ }
  }

  // Ninguna lectura directa de tablas: en el proyecto nuevo todas
  // están cerradas y se entra solo por función. Eso cierra de raíz
  // la familia de fallos que nos costó más caro — una vista que
  // devolvía datos de todos los clientes, una columna que no
  // existía y daba ceros en silencio — porque el filtro de
  // exclusiones vive dentro de la función y no se puede olvidar.
  const [convs, resumen, porHora, lat, reciente, lugares, patron, numeros] = await Promise.all([
    supabase.rpc('mt_conversaciones_lista', { p_limite: 1000 }),
    supabase.rpc('mt_resumen',    { p_horas: RANGO }),
    supabase.rpc('mt_por_hora',   { p_horas: RANGO }),
    supabase.rpc('mt_latencias',  { p_limite: 200 }),
    supabase.rpc('mt_actividad',  { p_limite: 12 }),
    supabase.rpc('mt_demanda'),
    supabase.rpc('mt_patron_horario'),
    supabase.rpc('mt_mis_numeros')
  ]);

  // Orden: primero lo registrado con fecha real (más reciente arriba);
  // después el histórico, ordenado por seq — que conserva el orden
  // original de n8n aunque no tengamos la fecha.
  // Ahora hay fecha real para casi todo (primera_en viene de
  // users.created_at en el histórico), así que se ordena por ella.
  ULTIMA = Date.now(); pintarCuando();
  CONVS = (convs.data || []).sort((a, b) => {
    const fa = a.primera_en ? new Date(a.primera_en).getTime() : null;
    const fb = b.primera_en ? new Date(b.primera_en).getTime() : null;
    if (fa && fb && fa !== fb) return fb - fa;
    if (fa && !fb) return -1;
    if (!fa && fb) return 1;
    return (b.seq || 0) - (a.seq || 0);
  });
  const lats = (lat.data || []).map(r => r.latencia_ms);
  // mt_resumen devuelve una fila con los recuentos ya hechos. Antes
  // se traían todos los mensajes del periodo para contarlos en el
  // navegador: con volumen, eso es traerse media base para calcular
  // dos números.
  const res = (Array.isArray(resumen.data) ? resumen.data[0] : resumen.data) || {};
  return {
    convs: CONVS,
    num: (Array.isArray(numeros.data) ? numeros.data[0] : numeros.data) || null,
    res,
    porHora: porHora.data || [],
    total: res.mensajes || 0,
    lats,
    latMedia: lats.length
      ? lats.reduce((a,b) => a+b, 0) / lats.length / 1000
      : null,
    reciente: reciente.data || [],
    temas:    lugares.data  || [],
    patron:   patron.data   || [],
    vivas: CONVS.filter(c => !c.historico),
    hist:  CONVS.filter(c =>  c.historico)
  };
}

/* ---------- vista: latido ---------- */
// `silencioso` = refresco automático o manual sobre contenido ya
// visible: se evita el estado de carga y se conserva el scroll,
// para que la página no dé el salto que reportaba el usuario.
// Dice algo a quien no ve la pantalla. Se vacía antes de escribir
// porque, si el texto es idéntico al anterior, el lector no lo
// vuelve a leer y el usuario se queda sin enterarse.
function anunciar(texto){
  const a = document.getElementById('anuncio');
  if (!a) return;
  a.textContent = '';
  setTimeout(() => { a.textContent = texto; }, 60);
}

// Un nombre puede ser árabe, emoji o venir vacío. <bdi> aísla la
// dirección del texto: sin él, un nombre en árabe junto a un número
// de teléfono reordena la línea entera y el teléfono aparece al
// revés.
function nom(valor, refPorDefecto){
  const t = String(valor ?? '').trim();
  if (!t) return `<span class="mono">${esc(refPorDefecto ?? '')}</span>` +
                 `<span class="csin"> sin nombre</span>`;
  return `<bdi>${esc(t)}</bdi>`;
}

// La inicial de un nombre que puede empezar por emoji: [...t] parte
// por caracteres reales, no por unidades UTF-16, que partiría un
// emoji por la mitad y dejaría un signo roto.
function inicial(valor, refPorDefecto){
  const t = String(valor ?? '').trim();
  if (!t) return String(refPorDefecto ?? '?').slice(-2);
  return [...t][0].toUpperCase();
}

// Esqueleto con la forma de lo que va a aparecer. Que la espera
// tenga forma la hace percibirse más corta que un "Cargando…".
function esqueleto(tipo){
  if (tipo === 'latido') return `
    <div class="esq-kpis">${'<div class="esq esq-kpi"></div>'.repeat(4)}</div>
    <div class="esq esq-panel"></div>
    <div class="esq esq-panel" style="height:150px"></div>`;
  if (tipo === 'lista') return `
    <div class="esq esq-panel" style="height:72px"></div>
    ${'<div class="esq esq-fila"></div>'.repeat(6)}`;
  return `<div class="esq esq-panel"></div>
          <div class="esq esq-panel" style="height:140px"></div>`;
}

function pintaEn(html, silencioso){
  const y = window.scrollY;
  $('#vista').innerHTML = html;
  if (silencioso) window.scrollTo({ top: y, behavior: 'instant' });
}

async function pintarLatido(silencioso){
  if (!silencioso) $('#vista').innerHTML = esqueleto('latido');
  const d = await datos();

  const contactos = new Set(d.convs.map(c => c.user_ref)).size;
  const msgs      = d.convs.reduce((s,c) => s + (c.mensajes||0), 0);
  const media     = d.convs.length ? Math.round(msgs / d.convs.length) : 0;
  const auto      = d.convs.reduce((s,c) => s + (c.del_asistente||0), 0);

  const cR   = d.vivas.filter(c => new Date(c.ultima_en) > Date.now() - RANGO*36e5);
  const entr = d.res.del_cliente   || 0;
  const resp = d.res.del_asistente || 0;
  const et   = RANGO === 24 ? '24 horas' : RANGO === 168 ? '7 días' : '30 días';
  const etc  = RANGO === 24 ? '24h'       : RANGO === 168 ? '7 días' : '30 días';

  pintaEn(`
    <h2 class="tit">El <em>latido</em></h2>
    <p class="sub">Cada conversación que atiende la IA con tus clientes, registrada según entra.</p>

    <div class="kpis">
      ${kpi('Personas atendidas', nf.format(contactos),
            `En ${nf.format(d.convs.length)} ${
              d.convs.length === 1 ? 'conversación' : 'conversaciones'}`)}
      ${kpi(`Conversaciones en ${etc}`, nf.format(cR.length),
            `${nf.format(entr + resp)} ${entr + resp === 1 ? 'mensaje' : 'mensajes'}`)}
      ${kpi('Respuestas de la IA', nf.format(auto), 'Sin intervención humana', true)}
      ${d.latMedia
        ? kpi('Tiempo medio de respuesta',
              `${d.latMedia.toFixed(1).replace('.', ',')}<small> s</small>`,
              'Incluye 4 s de espera para agrupar mensajes')
        : kpiPend('Tiempo medio de respuesta', 'Aún sin mediciones registradas')}
    </div>

    <div class="panel">
      <div class="cabpanel">
        <div>
          <h3>Cardiograma</h3>
          <p class="ph">Mensajes entrantes ${RANGO > 48 ? 'por día' : 'por hora'}.</p>
        </div>
        <div class="rangos">
          ${[[24,'24h'],[168,'7d'],[720,'30d']].map(([h,l]) =>
            `<button class="rg${RANGO===h?' on':''}" data-h="${h}">${l}</button>`).join('')}
        </div>
      </div>
      ${grafica(d.porHora)}
    </div>

    <div class="rejilla2">
      ${bloqueSenales(d)}
      ${bloqueTemas(d, 'servicio')}
    </div>

    <div class="rejilla2">
      ${bloqueTemas(d, 'ubicacion')}
      ${bloqueNumeros(d.num)}
    </div>

    ${bloquePatron(d)}

    <div class="rejilla2">
      ${bloqueMapa(d)}
      ${bloqueActividad(d)}
    </div>`, silencioso);

  activarGrafico();
  enlazarPlegables();
  ULTIMOS = d;
  // El mapa lo monta su observador cuando entra en pantalla, no
  // aquí: así Leaflet solo se descarga si alguien baja hasta él.
  activarSenales();

  // desde la actividad reciente se abre la conversación completa
  document.querySelectorAll('.feed li[data-ir]').forEach(li => {
    li.addEventListener('click', () => abrir(li.dataset.ir));
    li.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(li.dataset.ir); }
    });
  });

  // El rango sí necesita volver a consultar (otra ventana temporal),
  // pero se pinta en modo silencioso para conservar el scroll.
  document.querySelectorAll('.rg[data-h]').forEach(b =>
    b.addEventListener('click', () => { RANGO = +b.dataset.h; pintarLatido(true); }));

  // El mapa no necesita datos nuevos: solo se reencuadra.
  document.querySelectorAll('.rg[data-m]').forEach(b =>
    b.addEventListener('click', () => { MAPA = b.dataset.m; repintarMapa(); }));
}

const kpi = (l,n,p,az) => `<div class="kpi">
  <div class="lab">${l}</div><div class="num${az?' az':''}">${n}</div><div class="pie">${p}</div></div>`;

// Un indicador sin datos todavía. Enseña un guion y por qué, en vez
// de un cero: un cero parece una medición que salió cero.
const kpiPend = (l, p) => `<div class="kpi pend">
  <div class="lab">${l}</div><div class="num">—</div><div class="pie">${p}</div></div>`;

// Sustituye al antiguo bloque de coste. Tres partidas, cada una con su cuenta
// escrita: una cifra sin la operación que la produce no se puede
// defender delante de nadie.
//
// Lo calcula la base (mt_mis_numeros), no el navegador: el horario y
// la zona horaria del cliente ya viven allí, y así la cifra es la
// misma la mire quien la mire.
// Lo que hay que enganchar después de pintar el Latido: la carga
// diferida del mapa y el botón que lleva a Configuración.
//
// PENDIENTE: el plegado de los bloques pesados en móvil. En el
// diseño los paneles se pliegan con «Ver» / «Ocultar» en pantalla
// pequeña, y aquí todos salen abiertos: en un teléfono el Latido
// es muy largo.
function enlazarPlegables(){
  // El mapa se ve desde el principio, como en el diseño, pero
  // Leaflet son 150 KB y está al final de la página: se pide cuando
  // el panel entra en pantalla, no al cargar. Quien no baja hasta
  // ahí no lo descarga nunca.
  const cont = document.getElementById('panelmapa');
  if (cont && !cont.dataset.observado){
    cont.dataset.observado = '1';
    if ('IntersectionObserver' in window){
      const obs = new IntersectionObserver(es => {
        if (es.some(e => e.isIntersecting)){
          obs.disconnect();
          activarMapa().then(() => setTimeout(() => LMAP?.invalidateSize(), 60));
        }
      }, { rootMargin: '200px' });
      obs.observe(cont);
    } else {
      activarMapa();   // navegador antiguo: se carga y ya
    }
  }

  // El botón «i» lleva a Configuración y marca el panel: sin eso,
  // el usuario aterriza en una pantalla llena de paneles y tiene
  // que buscar a cuál venía.
  $('#binum')?.addEventListener('click', async e => {
    e.stopPropagation();
    document.querySelector('nav button[data-v="ajustes"]')?.click();
    await new Promise(r => setTimeout(r, 400));
    const el = $('#parametros'); if (!el) return;
    const alto = document.querySelector('header')?.getBoundingClientRect().height || 0;
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - alto - 16,
                      behavior: 'smooth' });
    el.classList.add('destaca');
    setTimeout(() => el.classList.remove('destaca'), 2400);
    $('#tk')?.focus({ preventScroll: true });
  });
}

// La actividad reciente, en su propia función para poder ponerla
// junto al mapa. Sin punto de color: la palabra "Cliente" o "IA" ya
// dice de quién es, y el punto obligaba a aprenderse un código.
function bloqueActividad(d){
  if (!d.reciente || !d.reciente.length) return '';
  return `<div class="panel">
    <h3>Actividad reciente</h3>
    <p class="ph">Últimos mensajes, del más nuevo al más antiguo.</p>
    <ul class="feed">
      ${d.reciente.map(m => {
        const ref = m.user_ref || null;
        const t = limpiaMensaje(m.contenido);
        return `<li${ref ? ` data-ir="${esc(ref)}" tabindex="0" role="button"` : ''}>
          <span class="fh mono">${hora(m.cuando)}</span>
          <span class="fq">${m.papel === 'human' ? 'Cliente' : 'IA'}</span>
          <span class="ft">${esc(t.slice(0, 90))}${t.length > 90 ? '\u2026' : ''}</span>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}

function bloqueNumeros(n){
  if (!n) return '';
  const falta = new Set(n.faltan || []);
  const eur = v => nf.format(Math.round(Number(v) || 0)) + ' €';

  // Una partida sin su parámetro no enseña un cero, que parecería un
  // dato: dice qué falta y dónde se pone.
  const fila = (titulo, importe, cuenta, falta_de) => `
    <div class="tn-fila">
      <div class="tn-cab"><b>${titulo}</b>
        <span class="tn-eur">${falta_de ? '—' : eur(importe)}</span></div>
      <div class="tn-cuenta${falta_de ? ' tn-falta' : ''}">${
        falta_de ? 'Falta el dato en Configuración' : cuenta}</div>
    </div>`;

  // Las tres partidas, ordenadas por importe. "Captados fuera de
  // horario" entra en el total, como en el diseño.
  //
  // Conviene saber que no es lo mismo que las otras dos: tiempo
  // liberado son horas que nadie ha trabajado y ventas cerradas es
  // dinero firmado, mientras que esto es ingreso POSIBLE de gente
  // que quizá se habría perdido. Si alguna vez el cliente discute
  // la cifra, será por esta partida.
  const partidas = [
    [Number(n.fuera_horario_eur) || 0, fila('Captados fuera de horario', n.fuera_horario_eur,
      `<strong>${nf.format(n.fuera_horario)}</strong>
       ${n.fuera_horario === 1 ? 'contacto' : 'contactos'} de noche o en fin de semana
       × <strong>${nf.format(n.ticket_medio)} €</strong> al mes`,
      falta.has('ticket') ? 'el pago medio de un cliente' : null)],
    [Number(n.tiempo_eur) || 0, fila('Tiempo liberado', n.tiempo_eur,
      `<strong>${nf.format(n.conversaciones)}</strong> conversaciones
       × <strong>${n.minutos_por_conv} min</strong>
       × <strong>${n.coste_hora} €</strong> la hora`,
      falta.has('minutos') || falta.has('coste_hora')
        ? 'el coste por hora o los minutos por conversación' : null)],
    [Number(n.ventas_eur) || 0, fila('Ventas cerradas', n.ventas_eur,
      `<strong>${nf.format(n.ganados)}</strong>
       ${n.ganados === 1 ? 'cliente ganado' : 'clientes ganados'}
       × <strong>${nf.format(n.ticket_medio)} €</strong> al mes`,
      falta.has('ticket') ? 'el pago medio de un cliente' : null)],
  ].sort((a,b) => b[0] - a[0]).map(x => x[1]).join('');

  // El total lo suma el navegador y no la base, porque la base
  // devuelve el total SIN lo de fuera de horario. Se escribe como
  // suma para que añadir una partida no obligue a acordarse de
  // tocar el total.
  const total = (Number(n.tiempo_eur) || 0)
              + (Number(n.ventas_eur) || 0)
              + (falta.has('ticket') ? 0 : Number(n.fuera_horario_eur) || 0);

  return `<div class="panel" id="p-numeros">
    <div class="cabpanel">
      <div>
        <h3>Tus números</h3>
        <p class="ph">Calculado con tus datos de este mes.</p>
      </div>
      <button class="binfo" id="binum" title="Cambiar los valores del cálculo"
        aria-label="Cambiar los valores del cálculo en Configuración">i</button>
    </div>
    <div class="tn-total">${nf.format(Math.round(total))}<span>€/mes</span></div>
    <div class="tn">${partidas}
      <div class="tn-tot"><span>= Total al mes</span>
        <span class="tn-eur">${eur(total)}</span></div>
    </div>
  </div>`;
}

function inicioPeriodo(p){
  const d = new Date();
  if (p === 'dia'){ d.setHours(0,0,0,0); return d; }
  if (p === 'semana'){
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    d.setHours(0,0,0,0); return d;
  }
  if (p === 'mes'){ d.setDate(1); d.setHours(0,0,0,0); return d; }
  if (p === 'ano'){ d.setMonth(0,1); d.setHours(0,0,0,0); return d; }
  return null;                       // 'todo'
}

// Estado de la segmentacion de senales: por periodo y por persona.
// Vive fuera de la funcion porque sobrevive a los repintados.
const SEN_PERIODOS = [['dia','Hoy'], ['semana','Semana'], ['mes','Mes'], ['ano','Año'], ['todo','Todo']];
let SEN_PER = 'todo', SEN_QUIEN = '';

// primera_en es el dato real (users.created_at en el histórico).
// Si faltara, se recurre al inicio de la sesión registrada.
const fechaConv = c => {
  const f = c.primera_en || c.primera_en || c.ultima_en;
  return f ? new Date(f) : null;
};

function segmentaConvs(d){
  let lista = d.convs;
  if (SEN_QUIEN) lista = lista.filter(c => c.user_ref === SEN_QUIEN);
  const desde = inicioPeriodo(SEN_PER);
  let sinFecha = 0;
  if (desde){
    lista = lista.filter(c => {
      const f = fechaConv(c);
      if (!f){ sinFecha++; return false; }
      return f >= desde;
    });
  }
  return { lista, desde, sinFecha };
}

function personasSenales(d){
  const refs = new Set(d.convs.map(c => c.user_ref));
  const l = CONTACTOS.length
    ? CONTACTOS.filter(c => refs.has(c.user_ref))
        .map(c => ({ ref: c.user_ref, n: c.nombre || c.telefono || c.user_ref }))
    : [...refs].map(r => ({ ref: r, n: r }));
  return l.sort((a,b) => String(a.n).localeCompare(String(b.n), 'es'));
}

function bloqueSenales(d){
  if (!d.convs.length) return '';
  return `<div class="panel" id="psen">${interiorSenales(d)}</div>`;
}

function interiorSenales(d){
  const { lista, desde, sinFecha } = segmentaConvs(d);
  const t = lista.length;
  const personas = personasSenales(d);
  const quien = personas.find(p => p.ref === SEN_QUIEN);
  const segmentado = SEN_PER !== 'todo' || !!SEN_QUIEN;

  // Las píldoras van bajo el título, como en el diseño. El
  // desplegable de personas se queda: con 39 contactos, mirar las
  // señales de uno concreto es justo lo que hace útil el bloque, y
  // sin él habría que irse a Conversaciones y perder el periodo.
  const controles = `
    <div class="segm">
      ${personas.length > 1 ? `<select class="sel" id="senquien"
          aria-label="Filtrar las señales por persona">
        <option value="">Todas las personas</option>
        ${personas.map(p => `<option value="${esc(String(p.ref))}"${
          p.ref === SEN_QUIEN ? ' selected' : ''}>${esc(String(p.n))}</option>`).join('')}
      </select>` : ''}
      <div class="rangos per">
        ${SEN_PERIODOS.map(([k,l]) => `<button class="rg${SEN_PER===k?' on':''}"
          data-p="${k}">${l}</button>`).join('')}
      </div>
    </div>`;

  // El alcance solo se escribe cuando hay algo que aclarar: sin
  // segmentar, "todas las personas, todo el histórico" es decir lo
  // obvio, y la maqueta no lo lleva.
  const quienTxt = quien ? `<strong>${esc(String(quien.n))}</strong>, ` : '';
  const nomPer = { dia:'Hoy', semana:'Esta semana', mes:'Este mes',
                   ano:'Este año', todo:'' }[SEN_PER];
  const pie = (segmentado || sinFecha) ? `<p class="segpie">${quienTxt}${
    nomPer ? nomPer + (desde ? ` desde el ${fechaCorta(desde)}` : '') + ', ' : ''
  }<strong>${nf.format(t)}</strong> ${t === 1 ? 'conversación' : 'conversaciones'}${
    sinFecha ? `, ${nf.format(sinFecha)} sin fecha quedan fuera` : ''}</p>` : '';

  const cab = `
    <h3>${esc(E('senales_titulo'))}</h3>
    <p class="ph">Señales detectadas en el texto de las conversaciones.</p>
    ${controles}
    ${pie}`;

  if (!t) return `${cab}<div class="vacio">
    Ninguna conversación en este periodo.<br>
    Amplía el rango o elige otra persona.</div>`;

  const i = lista.filter(c => c.interes).length;
  const f = lista.filter(c => c.friccion).length;
  const k = lista.filter(c => c.contacto).length;
  const r = lista.filter(c => c.sin_respuesta).length;

  // Saltar a Conversaciones solo tiene sentido sin segmentar: allí no
  // hay filtro de periodo, y las cifras no coincidirían.
  const s = n => segmentado ? null : n;

  return `${cab}
    <div class="barras">
      ${barra('Interés comercial', i, t, E('interes_desc'),  'az', s('interes'))}
      ${barra('Datos de contacto', k, t, E('contacto_desc'), 'vd', s('contacto'))}
      ${barra('El asistente no supo responder', r, t,
              'Reconoció no tener el dato o derivó a una persona', 'am', s('sin_respuesta'))}
      ${barra('Fricción',          f, t, E('friccion_desc'), 'rj', s('friccion'))}
    </div>
    ${quien ? `<div class="dacc" style="margin:18px 0 0;padding:0;border:0">
      <button class="cbtn" id="senabrir">Ver la conversación completa</button>
    </div>` : ''}
`;
}

// Repinta solo el interior del bloque: no hace falta volver a
// consultar nada y la página no se mueve.
function repintarSenales(){
  const cont = $('#psen');
  if (!cont || !ULTIMOS) return;
  cont.innerHTML = interiorSenales(ULTIMOS);
  activarSenales();
}

function activarSenales(){
  const cont = $('#psen'); if (!cont) return;

  cont.querySelectorAll('.rg[data-p]').forEach(b =>
    b.addEventListener('click', () => { SEN_PER = b.dataset.p; repintarSenales(); }));

  const sel = cont.querySelector('#senquien');
  sel?.addEventListener('change', () => { SEN_QUIEN = sel.value; repintarSenales(); });

  cont.querySelector('#senabrir')
      ?.addEventListener('click', () => abrir(SEN_QUIEN));

  // desde una señal se salta a las conversaciones que la tienen
  cont.querySelectorAll('.bfila[data-sen]').forEach(b => {
    const ir = () => irASenal(b.dataset.sen);
    b.addEventListener('click', ir);
    b.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); }
    });
  });
}
// Solo se puede pulsar si hay algo que ver: llevar al usuario a
// una lista vacía sería un callejón sin salida.
const barra = (lab, n, t, pie, cl, tipo) => {
  const p = t ? (n / t * 100) : 0;
  const act = n > 0 && tipo;
  return `<div class="bfila${act ? ' pulsa' : ''}"${
      act ? ` data-sen="${tipo}" tabindex="0" role="button"
      aria-label="Ver las ${n} conversaciones con ${lab.toLowerCase()}"` : ''}>
    <div class="bcab">
      <span class="blab">${lab}${act ? '<span class="bver">Ver</span>' : ''}</span>
      <span class="bnum mono">${nf.format(n)} <small>de ${nf.format(t)}</small></span></div>
    <div class="btrack"><div class="bfill ${cl}" style="width:${Math.max(p,0.6).toFixed(1)}%"></div></div>
    <div class="bpie">${pie}</div>
  </div>`;
};

/* ---------- temas: ubicaciones y servicios ---------- */
function bloqueTemas(d, cat){
  const todos = (d.temas || []).filter(t => t.categoria === cat);
  if (!todos.length) return '';
  const gen  = todos.filter(t => t.generico);
  // Cuatro y no diez: los que van detrás tienen una o dos menciones
  // y solo alargan el panel. Lo que importa es qué piden más.
  const list = todos.filter(t => !t.generico)
    .sort((a,b) => b.conversaciones - a.conversaciones).slice(0, 4);
  if (!list.length && !gen.length) return '';
  const max = Math.max(...list.map(t => t.conversaciones), 1);
  const id = 'p-' + cat;

  return `<div class="panel" id="${id}">
      <h3>${esc(E(cat + '_titulo'))}</h3>
      <p class="ph">${esc(E(cat + '_desc'))}</p>
      ${list.length ? `<div class="barras compacta">
        ${list.map(t => `<div class="bfila">
          <div class="bcab">
            <span class="blab">${esc(t.nombre)}</span>
            <span class="bnum mono">${nf.format(t.conversaciones)}</span>
          </div>
          <div class="btrack"><div class="bfill az"
            style="width:${(t.conversaciones / max * 100).toFixed(1)}%"></div></div>
        </div>`).join('')}
      </div>` : ''}
      ${gen.length ? `<p class="nota" style="margin:${list.length ? '16px' : '0'} 0 0">
        ${gen.map(g => `${nf.format(g.conversaciones)} conversaciones nombran
          ${esc(g.nombre)} sin concretar.`).join(' ')}</p>` : ''}
      ${!list.length ? `<div class="vacio">Sin menciones a
        ${esc(E(cat + '_vacio'))} concretos.</div>` : ''}
  </div>`;
}

function bloqueMapa(d){
  const pts = (d.temas || []).filter(t =>
    t.categoria === 'ubicacion' && t.lat != null && t.lng != null);
  if (!pts.length) return '';

  const grupos = {};
  pts.forEach(p => { const a = p.ambito || 'general'; (grupos[a] ||= []).push(p); });

  const claves = Object.keys(grupos).sort((a,b) =>
    ((CFG.mapas[a]?.orden ?? 99) - (CFG.mapas[b]?.orden ?? 99)) || a.localeCompare(b));
  if (!claves.length) return '';
  if (!claves.includes(MAPA)) MAPA = claves[0];

  const etq = k => CFG.mapas[k]?.etiqueta || k.charAt(0).toUpperCase() + k.slice(1);
  PUNTOS = grupos;

  // Plegado por defecto, y por un motivo que no es estético: hasta
  // que no se abre, no se descargan los 150 KB de Leaflet ni las
  // teselas. En el móvil eso es la diferencia entre un panel que
  // carga y uno que se queda pensando.
  return `<div class="panel" id="panelmapa">
    <h3>Mapa de demanda</h3>
    <p class="ph">Zonas que nombran los clientes. Cada punto marca la zona,
       no la dirección del centro.</p>
    <div>
      ${claves.length > 1 ? `<div class="rangos" style="margin-bottom:12px">
        ${claves.map(k => `<button class="rg mp${MAPA===k?' on':''}" data-m="${esc(k)}">
          ${esc(etq(k))}</button>`).join('')}
      </div>` : ''}
      <div id="lmapa" class="lmapa"></div>
    </div>
  </div>`;
}

// Teselas: Stadia "Alidade Smooth" (equivalente a Positron).
// Se autentica por dominio, así que no hay ninguna clave en el
// código. Si fallara, se cae a OpenStreetMap automáticamente.
const TESELAS = {
  principal: {
    url: 'https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png',
    attribution: '&copy; Stadia Maps &copy; OpenMapTiles &copy; OpenStreetMap',
    maxZoom: 20
  },
  respaldo: {
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19, className: 'tsuave'
  }
};

function ponerTeselas(){
  const cfg = CFG.mapas?.teselas || TESELAS.principal;
  let fallos = 0, caido = false;

  const capa = L.tileLayer(cfg.url, {
    attribution: cfg.attribution, maxZoom: cfg.maxZoom || 19,
    className: cfg.className || ''
  }).addTo(LMAP);

  // Varios errores seguidos suelen significar que el proveedor
  // no está sirviendo (dominio sin dar de alta, cuota agotada).
  capa.on('tileerror', () => {
    if (caido || ++fallos < 4) return;
    caido = true;
    capa.remove();
    L.tileLayer(TESELAS.respaldo.url, {
      attribution: TESELAS.respaldo.attribution,
      maxZoom: TESELAS.respaldo.maxZoom,
      className: TESELAS.respaldo.className
    }).addTo(LMAP);
  });
}


// ---------- el mapa se carga cuando se necesita ----------
// Leaflet son unos 150 KB de JavaScript y su hoja de estilos. Estaban
// en la cabecera, bloqueando el primer pintado, para un bloque que
// vive en una pestaña y que muchos clientes no miran nunca.
// Ahora se pide la primera vez que hay un mapa que dibujar.
// El mapa y su capa de puntos. Se guardan fuera de la funcion
// porque hay que poder destruirlos al cambiar de pestana: Leaflet
// deja el contenedor vivo y, sin esto, se acumulan mapas huerfanos.
let LMAP = null, LCAPA = null;
let leafletCargando = null;
function cargarLeaflet(){
  if (window.L) return Promise.resolve();
  if (leafletCargando) return leafletCargando;

  leafletCargando = new Promise((ok, mal) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    css.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
    css.crossOrigin = '';
    document.head.appendChild(css);

    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
    js.crossOrigin = '';
    js.onload = () => ok();
    js.onerror = () => { leafletCargando = null; mal(new Error('leaflet')); };
    document.head.appendChild(js);
  });
  return leafletCargando;
}

// Crea o actualiza el mapa. Se llama después de pintar la vista.
async function activarMapa(){
  const cont = document.getElementById('lmapa');
  if (!cont || !PUNTOS) return;

  try {
    await cargarLeaflet();
  } catch {
    cont.innerHTML = '<div class="vacio">No se ha podido cargar el mapa.<br>' +
      'Revisa tu conexión y vuelve a intentarlo.</div>';
    return;
  }
  // El contenedor puede haber desaparecido mientras se cargaba
  if (!document.getElementById('lmapa')) return;

  // El contenedor se recrea en cada pintado, así que el mapa
  // anterior queda huérfano: se destruye antes de crear el nuevo.
  if (LMAP){ LMAP.remove(); LMAP = null; }

  LMAP = L.map(cont, {
    zoomControl: true, scrollWheelZoom: false, attributionControl: true
  });
  ponerTeselas();

  // El scroll del ratón hace zoom solo tras pulsar en el mapa:
  // evita que se quede atrapado al desplazar la página.
  LMAP.on('click', () => LMAP.scrollWheelZoom.enable());
  LMAP.on('mouseout', () => LMAP.scrollWheelZoom.disable());

  pintarPuntos();
}

function pintarPuntos(){
  if (!LMAP) return;
  if (LCAPA){ LCAPA.remove(); LCAPA = null; }

  const pts = (PUNTOS[MAPA] || []).filter(p => p.lat != null && p.lng != null);
  if (!pts.length) return;

  const max = Math.max(...pts.map(p => p.conversaciones), 1);
  LCAPA = L.layerGroup().addTo(LMAP);

  // de menor a mayor: los círculos grandes quedan encima
  [...pts].sort((a,b) => a.conversaciones - b.conversaciones).forEach((p, i) => {
    const prop = p.conversaciones / max;
    const r = 9 + 20 * Math.sqrt(prop);

    const c = L.circleMarker([Number(p.lat), Number(p.lng)], {
      radius: r, color: '#1B7CFF', weight: 2,
      fillColor: '#1B7CFF', fillOpacity: 0.16 + 0.38 * prop,
      className: 'pmarca'
    }).addTo(LCAPA);

    c.bindTooltip(
      `<strong>${esc(p.nombre)}</strong>
       <span>${p.conversaciones} ${p.conversaciones === 1 ? 'conversación' : 'conversaciones'}</span>
       ${p.zona ? `<span class="tz">${esc(p.zona)}</span>` : ''}`,
      { className: 'ltip', direction: 'top', offset: [0, -r - 2], sticky: false });

    c.on('mouseover', () => c.setStyle({ weight: 3, fillOpacity: 0.62 }));
    c.on('mouseout',  () => c.setStyle({ weight: 2, fillOpacity: 0.16 + 0.38 * prop }));

    // aparición escalonada, como el resto de transiciones del panel
    const el = c.getElement();
    if (el){
      el.style.opacity = '0';
      el.style.transform = 'scale(.4)';
      el.style.transformOrigin = 'center';
      setTimeout(() => {
        el.style.transition = 'opacity .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1)';
        el.style.opacity = '1';
        el.style.transform = 'scale(1)';
      }, 40 + i * 45);
    }
  });

  const grupo = L.featureGroup(LCAPA.getLayers());
  LMAP.fitBounds(grupo.getBounds(), { padding: [46, 46], maxZoom: 14 });
}

// Cambio de ámbito: solo se repintan los puntos y se reencuadra.
// No se toca el DOM, así que la página no se mueve.
function repintarMapa(){
  document.querySelectorAll('.rg[data-m]').forEach(b =>
    b.classList.toggle('on', b.dataset.m === MAPA));
  pintarPuntos();
}

/* ---------- patrón horario ---------- */
function bloquePatron(d){
  if (!d.patron.length) return '';
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  let max = 0;
  d.patron.forEach(p => {
    const v = Number(p.mensajes) || 0;
    grid[p.dia][p.hora] += v;
    if (grid[p.dia][p.hora] > max) max = grid[p.dia][p.hora];
  });
  if (!max) return '';

  // Horario laboral real del cliente (settings.horario).
  // dias viene en formato ISO 1=lunes…7=domingo; getDay() usa 0=domingo.
  const H = CFG.horario || { inicio:9, fin:19, dias:[1,2,3,4,5] };
  const lab = new Set((H.dias || [1,2,3,4,5]).map(n => n === 7 ? 0 : n));
  let fuera = 0, total = 0;
  for (let dd=0; dd<7; dd++) for (let h=0; h<24; h++){
    const v = grid[dd][h]; total += v;
    if (!lab.has(dd) || h < H.inicio || h >= H.fin) fuera += v;
  }
  const pct = total ? Math.round(fuera / total * 100) : 0;
  const dnom = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const dlab = (H.dias || []).map(n => dnom[n === 7 ? 0 : n]);
  const rango = dlab.length
    ? `${dlab[0]} a ${dlab[dlab.length-1]}, de ${H.inicio}:00 a ${H.fin}:00`
    : `de ${H.inicio}:00 a ${H.fin}:00`;

  const orden = [1,2,3,4,5,6,0];
  return `<div class="panel">
    <h3>Cuándo escriben</h3>
    <p class="ph">Mensajes por día y hora. <strong>${pct}%</strong> llegan fuera
       de tu horario de atención (${rango}), y se atienden igual.</p>
    <div class="mapa">
      <div class="mhoras"><span></span>${
        Array.from({length:24}, (_,h) => `<span class="mh">${h%6===0?h:''}</span>`).join('')}</div>
      ${orden.map(dd => `<div class="mfila">
        <span class="md">${dias[dd]}</span>
        ${grid[dd].map((v,h) => {
          const o = v ? (0.14 + 0.86 * (v / max)) : 0;
          return `<span class="mc" style="background:rgba(27,124,255,${o.toFixed(3)})"
            title="${dias[dd]}, ${h}:00, ${v} ${v === 1 ? 'mensaje' : 'mensajes'}"></span>`;
        }).join('')}
      </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- cardiograma ---------- */
function grafica(ev){
  if (!ev.length) return `<div class="vacio">
    Sin mensajes en este periodo.<br>
    El primero que entre aparece aquí.</div>`;

  const porDia = RANGO > 48;
  const paso   = porDia ? 864e5 : 36e5;
  const n      = porDia ? Math.round(RANGO/24) : RANGO;

  // `ev` viene de mt_por_hora, ya agrupado por la base EN LA ZONA
  // HORARIA DEL CLIENTE. Agrupar aquí lo haría en la del navegador,
  // y un mensaje de las 10:30 de Madrid caería en otra hora según
  // dónde esté quien mira el panel.
  const conteo = new Map();
  ev.forEach(e => {
    const t = new Date(e.tramo);
    porDia ? t.setHours(0,0,0,0) : t.setMinutes(0,0,0);
    conteo.set(t.getTime(), (conteo.get(t.getTime()) || 0) + Number(e.mensajes || 0));
  });

  const cubos = Array.from({length:n}, (_,i) => {
    const t = new Date(Date.now() - (n-1-i)*paso);
    porDia ? t.setHours(0,0,0,0) : t.setMinutes(0,0,0);
    return { t, n: conteo.get(t.getTime()) || 0 };
  });

  const max = Math.max(...cubos.map(h => h.n), 1);
  const W = 1000, H = 190;
  const pts = cubos.map((h,i) => [
    (i/Math.max(cubos.length-1,1))*W,
    H - (h.n/max)*(H-34) - 17
  ]);
  const linea = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area  = `M0 ${H} L` + pts.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L') + ` L${W} ${H} Z`;
  const et = d => porDia
    ? d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' })
    : d.getHours() + ':00';
  const etLargo = d => porDia
    ? d.toLocaleDateString('es-ES', { weekday:'long', day:'2-digit', month:'long' })
    : d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' }) +
      ', ' + d.getHours() + ':00 h';
  const ancho = W / cubos.length;

  return `<div class="graf" id="graf">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
        aria-label="Mensajes entrantes a lo largo del periodo">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1B7CFF" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#1B7CFF" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#E2E8F0" stroke-width="1"/>
      <path d="${area}" fill="url(#g)"/>
      <path d="${linea}" fill="none" stroke="#1B7CFF" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>
      <line id="guia" x1="0" y1="0" x2="0" y2="${H}" stroke="#1B7CFF"
            stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      ${pts.map((p,i) => cubos[i].n > 0
        ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#1B7CFF"/>` : '').join('')}
      <circle id="foco" r="6" fill="#fff" stroke="#1B7CFF" stroke-width="2.5" opacity="0"/>
      ${cubos.map((c,i) => `<rect x="${(i*ancho).toFixed(1)}" y="0"
          width="${ancho.toFixed(1)}" height="${H}" fill="transparent"
          data-i="${i}" data-x="${pts[i][0].toFixed(1)}" data-y="${pts[i][1].toFixed(1)}"
          data-n="${c.n}" data-t="${esc(etLargo(c.t))}" class="hit"/>`).join('')}
    </svg>
    <div class="tip" id="tip" hidden></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#64748B;margin-top:9px"
         class="mono">
      <span>${et(cubos[0].t)}</span>
      <span>${et(cubos[Math.floor(cubos.length/2)].t)}</span>
      <span>${et(cubos[cubos.length-1].t)}</span>
    </div>
  </div>`;
}

// Tooltip del cardiograma: se engancha tras pintar el bloque.
function activarGrafico(){
  const cont = $('#graf'); if (!cont) return;
  const svg = cont.querySelector('svg');
  const tip = $('#tip'), guia = $('#guia'), foco = $('#foco');
  if (!svg || !tip) return;

  cont.querySelectorAll('.hit').forEach(r => {
    const mostrar = e => {
      const n = r.dataset.n, x = +r.dataset.x, y = +r.dataset.y;
      guia.setAttribute('x1', x); guia.setAttribute('x2', x);
      guia.setAttribute('opacity', '1');
      foco.setAttribute('cx', x); foco.setAttribute('cy', y);
      foco.setAttribute('opacity', n > 0 ? '1' : '0');

      tip.innerHTML = `<strong>${n} ${n === '1' ? 'mensaje' : 'mensajes'}</strong>
                       <span>${r.dataset.t}</span>`;
      tip.hidden = false;

      const caja = cont.getBoundingClientRect();
      const px = (e.touches ? e.touches[0].clientX : e.clientX) - caja.left;
      const ancho = tip.offsetWidth || 130;
      tip.style.left = Math.max(4, Math.min(px - ancho/2, caja.width - ancho - 4)) + 'px';
      tip.style.top  = Math.max(0, (y / 190) * caja.height - 52) + 'px';
    };
    r.addEventListener('mousemove', mostrar);
    r.addEventListener('touchstart', mostrar, { passive:true });
  });

  const ocultar = () => {
    tip.hidden = true;
    guia.setAttribute('opacity','0');
    foco.setAttribute('opacity','0');
  };
  cont.addEventListener('mouseleave', ocultar);
  cont.addEventListener('touchend', ocultar);
}

function irASenal(tipo){
  FILTRO = new Set([tipo]);
  VISTA = 'convs';
  document.querySelectorAll('nav button').forEach(x =>
    x.classList.toggle('on', x.dataset.v === 'convs'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  pintarConvs();
}

/* ---------- vista: conversaciones ----------
   Se agrupa por PERSONA, no por sesión. El corte a 30 minutos
   sigue existiendo para las métricas, pero aquí sería confuso:
   el usuario piensa en "mi conversación con X", no en sesiones. */
let CONTACTOS = [], ABIERTO = null;
// Filtros activos en Conversaciones. Se combinan con Y: marcar
// "Interés" y "Contacto" da los leads listos para llamar.
let FILTRO = new Set();
// Ordenar importa más de lo que parece: con 26 personas se navega
// a ojo, con 300 no. Por defecto, quien escribió más recientemente.
let ORDEN = 'reciente';
const ORDENES = {
  reciente: { etq:'Más reciente', fn:(a,b) => new Date(b.ultima) - new Date(a.ultima) },
  mensajes: { etq:'Más mensajes', fn:(a,b) => Number(b.mensajes) - Number(a.mensajes) },
  nombre:   { etq:'Por nombre',   fn:(a,b) =>
      (a.nombre || '\uffff').localeCompare(b.nombre || '\uffff', 'es') }
};
const ordena = l => [...l].sort(ORDENES[ORDEN].fn);
const SENALES = {
  interes:       { etq: 'Interés',       campo: c => c.interes,        pill: 'az' },
  contacto:      { etq: 'Con contacto',  campo: c => c.contacto,       pill: 'nt' },
  cita:          { etq: 'Con cita',      campo: c => !!c.cita,         pill: 'vd' },
  sin_respuesta: { etq: 'Sin respuesta', campo: c => c.sin_respuesta,  pill: 'am' },
  friccion:      { etq: 'Fricción',      campo: c => c.friccion,       pill: 'rj' },
  vuelto:        { etq: 'Ha vuelto',     campo: c => Number(c.conversaciones) > 1, pill: 'nt' }
};
const aplicaFiltros = (lista, filtros) =>
  lista.filter(c => [...filtros].every(k => SENALES[k].campo(c)));

// Repinta solo el interior del panel: los filtros son instantáneos
// porque no hay que volver a consultar nada.
function render(busqueda){
  const cont = $('#pconvs'); if (!cont) return;
  const lista = aplicaFiltros(CONTACTOS, FILTRO);

  // Cada filtro muestra cuántos resultados daría AÑADIRLO a la
  // selección actual. Si daría cero, se desactiva: así nunca se
  // llega a una lista vacía.
  const chips = Object.entries(SENALES).map(([k, s]) => {
    const activo = FILTRO.has(k);
    const prueba = new Set(FILTRO);
    activo ? prueba.delete(k) : prueba.add(k);
    const n = activo
      ? lista.length
      : aplicaFiltros(CONTACTOS, prueba).length;
    return { k, s, activo, n };
  }).filter(c => c.activo || c.n > 0);


  cont.innerHTML = `
    <div class="cabpanel">
      <div>
        <h3>${nf.format(lista.length)} ${lista.length === 1 ? 'persona' : 'personas'}</h3>
        ${FILTRO.size ? `<p class="ph" style="margin:2px 0 0">de ${nf.format(CONTACTOS.length)}</p>` : ''}
      </div>
    </div>

    <div class="barrafil">
      <input id="buscar" class="busca" type="search"
             placeholder="Buscar por nombre, teléfono o email…"
             autocomplete="off" value="${esc(busqueda || '')}">
      <div class="orden">
        ${Object.entries(ORDENES).map(([k,o]) =>
          `<button class="${ORDEN===k?'on':''}" data-o="${k}">${o.etq}</button>`).join('')}
      </div>
    </div>

    <div class="chips">
      ${chips.map(c => `<button class="chip ${c.s.pill}${c.activo ? ' on' : ''}"
          data-f="${c.k}" aria-pressed="${c.activo}">
        ${esc(c.s.etq)}<span class="cn">${nf.format(c.n)}</span>
      </button>`).join('')}
      ${FILTRO.size ? '<button class="chip limpia" id="limpiar">Quitar filtros</button>' : ''}
    </div>

    <div class="lista" id="plista">${lista.length
      ? ordena(lista).slice(0,150).map(filaC).join('')
      : '<div class="vacio">Ninguna persona con esos filtros.</div>'}</div>
    ${lista.length > 150 ? `<p class="nota">Se muestran las 150 primeras de
       ${nf.format(lista.length)}. Afina con el buscador o los filtros.</p>` : ''}`;

  enlazarFilas();

  cont.querySelectorAll('.chip[data-f]').forEach(b =>
    b.addEventListener('click', () => {
      const k = b.dataset.f;
      FILTRO.has(k) ? FILTRO.delete(k) : FILTRO.add(k);
      render();
    }));
  $('#limpiar')?.addEventListener('click', () => { FILTRO.clear(); render(); });

  cont.querySelectorAll('.orden button[data-o]').forEach(b =>
    b.addEventListener('click', () => {
      ORDEN = b.dataset.o;
      render($('#buscar')?.value.trim() || '');
    }));

  const inp = $('#buscar');
  let tmr = null;
  inp.addEventListener('input', () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => filtrar(inp.value.trim()), 280);
  });
  BUSCA = busqueda || '';
  if (busqueda) filtrar(busqueda);
}

async function filtrar(q){
  const cont = $('#plista');
  if (!cont) return;
  BUSCA = q || '';
  const base = aplicaFiltros(CONTACTOS, FILTRO);
  const pinta = (l, vacio) => {
    cont.innerHTML = l.length ? ordena(l).slice(0,150).map(filaC).join('')
                              : `<div class="vacio">${vacio}</div>`;
    enlazarFilas();
  };

  if (!q){ pinta(base, 'Ninguna persona con esos filtros.'); return; }

  // Se normalizan acentos y mayúsculas en ambos lados: buscar
  // "jose" tiene que encontrar a "José", y era el fallo más
  // frecuente del buscador anterior.
  const norm = t => String(t || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const n = norm(q);
  const soloNum = q.replace(/[^0-9]/g, '');

  const local = base.filter(c =>
    norm(c.nombre).includes(n) ||
    norm(c.email).includes(n) ||
    (soloNum.length >= 3 &&
      ((c.telefono || '') + (c.user_ref || '')).includes(soloNum)));

  // Con un texto que parece un teléfono no se busca en los
  // mensajes: encontraría cualquier conversación que mencione
  // esos dígitos y confundiría más que ayudar.
  if (local.length || /^[0-9+ ()-]{3,}$/.test(q)){
    pinta(local, `Nadie coincide con «${esc(q)}».`);
    return;
  }

  cont.innerHTML = '<div class="vacio">Buscando en los mensajes…</div>';
  // La búsqueda ignora acentos porque mt_buscar compara contra el
  // texto normalizado: "coruna" encuentra "A Coruña".
  const { data } = await supabase.rpc('mt_buscar', { p_texto: q, p_limite: 500 });
  const refs = new Set((data || []).map(r => r.user_ref));
  const r = base.filter(c => refs.has(c.user_ref ?? c.user_ref));
  // Al buscar dentro de los mensajes, resaltar el nombre no
  // aporta: la coincidencia está en la conversación, no aquí.
  BUSCA = '';
  cont.innerHTML = r.length
    ? ordena(r).slice(0,150).map(filaC).join('')
      + `<p class="nota">${nf.format(r.length)} ${r.length === 1
          ? 'persona escribió' : 'personas escribieron'} «${esc(q)}» en sus mensajes.</p>`
    : `<div class="vacio">Ninguna conversación contiene «${esc(q)}».</div>`;
  enlazarFilas();
}

// Una persona por fila. El identificador manda: si tiene nombre,
// el nombre; si no, el teléfono, y se dice que no hay nombre en
// vez de dejar el hueco. Antes ambos casos se veían igual de
// pequeños y costaba distinguir a quién estabas mirando.
let BUSCA = '';

// Esta tomaba un contacto y partía con n[0], que corta por unidades
// UTF-16: un nombre que empieza por emoji devolvía medio carácter y
// se veía un signo roto. Ahora delega en inicial(), que parte por
// caracteres reales.
const inicialDe = c => {
  const n = (c.nombre || '').trim();
  return n ? inicial(n) : null;
};

// Resalta lo buscado sin romper el escapado: se escapa primero y
// se marca después sobre el texto ya seguro.
//
// El resaltado tiene que ignorar los acentos igual que la
// búsqueda. Si no, escribes "jose", la fila de José aparece y
// nada se marca: parece que el buscador se ha equivocado. No se
// puede normalizar el texto y buscar en él, porque quitar los
// acentos cambia las posiciones; se amplía cada letra de la
// consulta a las variantes que puede tener en el texto.
const ACENTOS = {
  a:'aáàâäã', e:'eéèêë', i:'iíìîï', o:'oóòôöõ',
  u:'uúùûü',  n:'nñ',    c:'cç',    y:'yý'
};
function regexBusqueda(q){
  const partes = [...q].map(ch => {
    const b = ch.toLowerCase();
    if (ACENTOS[b]) return '[' + ACENTOS[b] + ACENTOS[b].toUpperCase() + ']';
    return ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  });
  return new RegExp(partes.join(''), 'gi');
}

function marca(txt){
  const t = esc(String(txt ?? ''));
  if (!BUSCA) return t;
  try {
    // Se marca sobre el texto ya escapado, así que hay que evitar
    // pintar dentro de una entidad como &amp; o &lt;.
    return t.replace(regexBusqueda(BUSCA), m =>
      m.includes('&') || m.includes(';') ? m : `<mark>${m}</mark>`);
  } catch { return t; }
}

// "hace 3 h" dice más que una fecha para saber si alguien acaba
// de escribir. Pasada la semana, la fecha vuelve a ser más útil.
function desdeEntonces(d){
  if (!d) return { txt:'—', frio:true };
  const ms = Date.now() - new Date(d).getTime();
  const min = Math.round(ms/6e4);
  if (min < 2)     return { txt:'ahora mismo', frio:false };
  if (min < 60)    return { txt:`hace ${min} min`, frio:false };
  const h = Math.round(min/60);
  if (h < 24)      return { txt:`hace ${h} h`, frio:false };
  const dd = Math.round(h/24);
  if (dd < 7)      return { txt:`hace ${dd} ${dd===1?'día':'días'}`, frio:false };
  return { txt: fechaCorta(d), frio:true };
}

const filaC = c => {
  const ini = inicialDe(c);
  const act = c.historico ? { txt:'histórico', frio:true } : desdeEntonces(c.ultima);
  const senales = [
    c.cita          ? '<span class="pill vd">Cita</span>'          : '',
    c.interes       ? '<span class="pill az">Interés</span>'       : '',
    c.contacto      ? '<span class="pill nt">Contacto</span>'      : '',
    c.sin_respuesta ? '<span class="pill am">Sin respuesta</span>' : '',
    c.friccion      ? '<span class="pill rj">Fricción</span>'      : ''
  ].join('');

  return `<div class="pers${c.user_ref === ABIERTO ? ' on' : ''}" data-c="${esc(c.user_ref)}" tabindex="0" role="button">
    <div class="ini${ini ? '' : ' anon'}">${ini ? esc(ini) : '·'}</div>
    <div class="pcuerpo">
      <div class="pnom">${c.nombre
        ? `<bdi>${marca(c.nombre)}</bdi>`
        : `<span class="mono">${marca(c.telefono || c.user_ref)}</span>
           <span class="csin"> sin nombre</span>`}</div>
      <div class="pdat">${c.nombre
        ? `<span class="mono">${marca(c.telefono || c.user_ref)}</span>`
        : (c.email ? marca(c.email) : '')}</div>
      ${senales ? `<div class="pmarcas">${senales}</div>` : ''}
    </div>
    <div class="pact">
      <div class="pcuando${act.frio ? ' frio' : ''}">${esc(act.txt)}</div>
      <div class="pmsg">${nf.format(c.mensajes)} mensajes</div>
    </div>
  </div>`;
};

function enlazarFilas(){
  document.querySelectorAll('.pers[data-c]').forEach(el => {
    const ir = () => abrir(el.dataset.c);
    el.addEventListener('click', ir);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); }
    });
  });
}

/* ---------- vista: agenda ----------
   Las citas ya las guarda el agente en la tabla users mediante
   su herramienta "Save Data". Aquí solo se presentan.          */
async function pintarAgenda(silencioso){
  if (!silencioso) $('#vista').innerHTML = esqueleto('lista');

  const { data, error } = await supabase.rpc('mt_mis_citas');
  ULTIMA = Date.now(); pintarCuando();

  if (error){
    pintaEn(`<h2 class="tit">Agenda</h2><div class="panel">
      <div class="vacio">No se ha podido cargar la agenda.<br>${esc(error.message)}</div>
    </div>`, silencioso);
    return;
  }

  const citas = data || [];
  const ahora = Date.now();
  const vivas = citas.filter(c => c.estado !== 'cancelada');
  const canceladas = citas.filter(c => c.estado === 'cancelada');
  const conFecha = vivas.filter(c => c.cuando);
  const proximas = conFecha.filter(c => new Date(c.cuando) >= ahora)
    .sort((a,b) => new Date(a.cuando) - new Date(b.cuando));
  const pasadas  = conFecha.filter(c => new Date(c.cuando) < ahora)
    .sort((a,b) => new Date(b.cuando) - new Date(a.cuando));
  const sinFecha = vivas.filter(c => !c.cuando);

  pintaEn(`
    <h2 class="tit">Agenda</h2>
    <p class="sub">Las citas que ha agendado el asistente.</p>

    <div class="kpis">
      ${kpi('Próximas citas', nf.format(proximas.length),
            proximas.length ? 'La más cercana, ' + fechaCorta(proximas[0].cuando) : 'Ninguna pendiente')}
      ${kpi('Citas agendadas', nf.format(vivas.length), 'Desde el inicio del servicio', true)}
      ${kpi('Ya celebradas', nf.format(pasadas.length), 'Con fecha pasada')}
      ${kpi('Canceladas', nf.format(canceladas.length),
            citas.length ? `${Math.round(canceladas.length / citas.length * 100)}% del total` : '—')}
    </div>

    ${bloqueCitas('Próximas', proximas, true)}
    ${bloqueCitas('Anteriores', pasadas.slice(0, 25), false)}
    ${sinFecha.length ? bloqueCitas('Sin fecha', sinFecha, false) : ''}
    ${canceladas.length ? bloqueCitas('Canceladas', canceladas.slice(0, 15), false) : ''}

    ${!citas.length ? `<div class="panel"><div class="vacio">
      <strong>Sin citas por ahora.</strong><br>

    silencioso);

  document.querySelectorAll('.ics').forEach(b =>
    b.addEventListener('click', () => descargarICS(JSON.parse(b.dataset.c))));
}

          ${c.enlace && c.estado !== 'cancelada' ? `<a class="cbtn" href="${esc(c.enlace)}"
              target="_blank" rel="noopener noreferrer">Reagendar</a>` : ''}
        </div>

    </div>
  </div>`;

// Genera un .ics estándar: se abre en Google Calendar, Outlook,
// Apple Calendar o el que tenga configurado el usuario.
function descargarICS(c){
  const ini = new Date(c.w);
  const fin = new Date(ini.getTime() + 60*60*1000);
  const z = d => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const esc2 = s => String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SimpliaSpain//Panel//ES',
    'BEGIN:VEVENT',
    'UID:' + Date.now() + '@simpliaspain',
    'DTSTAMP:' + z(new Date()),
    'DTSTART:' + z(ini),
    'DTEND:'   + z(fin),
    'SUMMARY:' + esc2('Cita con ' + c.t),
    'DESCRIPTION:' + esc2((c.d ? c.d + '\n' : '') +
        (c.p ? 'Teléfono: ' + c.p + '\n' : '') + (c.e ? 'Email: ' + c.e : '')),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');

  const url = URL.createObjectURL(new Blob([ics], {type:'text/calendar;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'cita.ics'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

      <h3>Información del servicio</h3>

         Para cambiarlos, escríbenos.</p>
      <div class="docs">
        ${CFG.documentos.map(doc => `<a class="doc" href="${esc(doc.url)}"
            target="_blank" rel="noopener noreferrer">
          <span class="dico" aria-hidden="true">📄</span>
          <span class="dtx">

          </span>
          <span class="dfl" aria-hidden="true">↗</span>
        </a>`).join('')}
      </div>
    </div>` : ''}

    ${CFG.tratamiento && CFG.tratamiento.length ? `<div class="panel">
      <h3>Tratamiento de datos</h3>
      <p class="ph">Qué se guarda de cada conversación y para qué.</p>
      <dl class="ficha">
        ${CFG.tratamiento.map(x =>

      </dl>
      <p class="aviso" style="margin:16px 0 0">
        Para ejercer derechos de acceso, rectificación o supresión sobre un
        contacto concreto, escríbenos y lo tramitamos.
      </p>
    </div>` : ''}
    </div>`;

  // Dos guardados separados: el email es del cliente y los
  // parámetros de cálculo son de SimpliaSpain. Un solo botón
  // mezclaba dos permisos distintos y el cliente no podía guardar
  // su email sin tocar unas cifras que no son suyas.
  const guardar = async (boton, mensaje, campos, textoOk) => {
    const b = $(boton), m = $(mensaje);
    const antes = b.textContent;
    b.disabled = true; b.textContent = 'Guardando…'; m.textContent = '';
    try {
      const { data, error } = await supabase.rpc('mt_guardar_ajustes',
        { p_ajustes: campos() });
      if (error) throw error;
      // Los ajustes se refrescan en memoria para que el Latido use
      // los valores nuevos sin recargar la página.
      if (data) CFG.ajustes = data;
      m.textContent = textoOk;
      m.className = 'msg-ok';
      anunciar(textoOk);
    } catch (e) {
      m.textContent = /acceso|lectura|42501/.test(e.message || '')
        ? 'Tu cuenta no tiene permiso para modificar esto.'
        : (e.message || 'No se han podido guardar los cambios.');
      m.className = 'msg-err';
    }
    b.disabled = false; b.textContent = antes;
  };

  const num = v => (v === '' || v == null) ? null : Number(v);

  $('#guardar').addEventListener('click', () =>
    guardar('#guardar', '#msg',
      () => ({ email_avisos: $('#ea').value.trim() }),
      'Cambios guardados.'));

  $('#guardarpar')?.addEventListener('click', () =>
    guardar('#guardarpar', '#msgpar',
      () => ({
        ticket_medio_eur:         num($('#tk').value),
        minutos_por_conversacion: num($('#mn').value),
        coste_hora_eur:           num($('#ch').value)
      }),
      'Guardado. El Latido ya usa los nuevos valores.'));
}

function horarioTexto(){
  const H = CFG.horario || {};
  const dn = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const ds = (H.dias || []).map(n => dn[n === 7 ? 0 : n]);

  }
  const c = CONTACTOS.find(x => x.user_ref === contact) || {};

  const { data } = await supabase.rpc('mt_mensajes_contacto', { p_user_ref: contact });

      </div>
      ${c.nombre ? `<p class="dmeta"><a href="tel:${esc(tel)}" class="mono">${esc(tel)}</a></p>` : ''}
      ${c.email ? `<p class="dmeta"><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p>` : ''}
      <div class="dacc">
        <a class="cbtn pri" href="tel:${esc(tel)}">Llamar</a>
        <button class="cbtn" id="verembudo">Abrir en Embudo</button>
      </div>
    </div>
    ${msgs.length ? msgs.map(m => {
      // Separador por DÍA, no por sesión: el usuario piensa en
      // "lo del martes", no en cuántas sesiones hubo.
      let sep = '';
      const f = m.cuando ? new Date(m.cuando).toDateString() : null;
      if (f && f !== dia){ dia = f; sep = `<div class="sep"><span>${fecha(m.cuando)}</span></div>`; }
      return sep + `<div class="msg ${m.papel === 'human' ? 'h' : 'a'}">
        <div class="burb">${esc(limpiaMensaje(m.contenido))}
          <div class="hora">${m.cuando ? hora(m.cuando) : 'sin hora'}${
            m.latencia_ms ? `, ${(m.latencia_ms/1000).toFixed(1).replace('.', ',')} s` : ''}</div>

    if (caja === '#mbox') cerrar();

    setTimeout(() => {

/* ============================================================
   EMBUDO COMERCIAL

   El orden de la lista es el producto. Un comercial no necesita
   ver 27 leads: necesita saber a quién llama ahora. Por eso la
   cola se ordena por urgencia real y no por fecha:

     1. Acción vencida — se comprometió a algo y ha pasado
     2. Dejó contacto y nadie le ha tocado — el dinero sobre la mesa
     3. Visita agendada próxima — confirmarla evita el no-show
     4. El resto, por antigüedad del último mensaje

   La cualificación se muestra como cinco barritas, no como un
   número: se ve de un vistazo cuánto falta sin tener que leer.
   ============================================================ */

let LEADS = [], EMBUDO = [], LFILTRO = 'activos', LABIERTO = null;

const ETAPAS = [
  ['entrada',        'Entrada',   'fe1'],
  ['cualificado',    'Cualificado','fe2'],
  ['visita_agendada','Visita',    'fe3'],
  ['visita_hecha',   'Visitado',  'fe4'],
  ['propuesta',      'Propuesta', 'fe5'],
  ['ganado',         'Ganado',    'fe6'],
  ['perdido',        'Perdido',   'fe7']
];
const NOMBRE_ETAPA = Object.fromEntries(ETAPAS.map(e => [e[0], e[1]]));

// Devuelve por qué este lead es urgente, o null. Que el motivo sea
// texto y no un color permite escribirlo en la tarjeta: un comercial
// no debería tener que descifrar por qué algo está en rojo.
// Los textos son más cortos que antes porque el título del grupo ya
// dice el motivo: dentro de "Sin llamar" no hace falta repetir en
// cada fila "dejó contacto y nadie le ha llamado". Solo el grupo de
// hoy conserva su texto, porque ahí la FECHA importa.
function urgencia(l){
  const hoy = new Date().toISOString().slice(0,10);
  if (l.proxima_fecha && l.proxima_fecha < hoy)
    return { nivel:'urg', txt:`Vencido el ${fechaCorta(l.proxima_fecha)}`, peso:0 };
  if (l.proxima_fecha === hoy)
    return { nivel:'urg', txt:'Para hoy', peso:1 };
  // Una visita en menos de tres días pasa a 'urg': confirmarla es lo
  // que evita el no-show, y eso corre tanto como una acción vencida.
  if (l.cita && new Date(l.cita) - Date.now() < 3*864e5)
    return { nivel:'urg', txt:`Visita el ${fechaCorta(l.cita)}`, peso:2 };
  // El teléfono NO cuenta como "dejó su contacto": viene de
  // WhatsApp, lo tenemos de todos y no significa que quieran que
  // les llamen. El email sí lo dieron ellos.
  if (Number(l.toques) === 0 && l.email)
    return { nivel:'oro', txt:'', peso:3 };
  if (Number(l.toques) === 0)
    return { nivel:'sin', txt:'', peso:5 };
  return null;
}

// Los grupos, en el orden en que se pintan. Un grupo vacío no se
// pinta: una cabecera con cero debajo es ruido.
const GRUPOS = [
  ['urg',    'Para hoy',   'urg'],
  ['oro',    'Sin llamar', 'oro'],
  ['marcha', 'En marcha',  ''],
  ['sin',    'Sin contacto', 'sin'],
];
// Un grupo de más de ocho se corta a seis. La holgura evita el caso
// absurdo de ocultar uno solo tras un botón que ocupa lo mismo.
const MOSTRAR = 6, HOLGURA = 2;
let LEXP = {};

function ordenLeads(a, b){
  const ua = urgencia(a), ub = urgencia(b);
  const pa = ua ? ua.peso : 4, pb = ub ? ub.peso : 4;
  if (pa !== pb) return pa - pb;
  return new Date(b.ultima || 0) - new Date(a.ultima || 0);
}

async function pintarEmbudo(silencioso){
  if (!silencioso) $('#vista').innerHTML = esqueleto('lista');

  // Sincronizar ANTES de leer: si no, una conversación nueva no
  // aparece hasta que alguien se acuerde de refrescar el CRM a
  // mano, y nadie se acuerda. Es idempotente y no pisa nada de lo
  // que haya escrito el comercial.
  //
  // Si falla —por permisos, por ejemplo— se sigue adelante y se
  // muestra lo que ya hay: una lista algo vieja es mejor que una
  // pantalla en blanco.
  await supabase.rpc('mt_sincronizar').catch(() => {});

  const [a, b] = await Promise.all([
    supabase.rpc('mt_mis_leads'),
    supabase.rpc('mt_embudo_resumen')
  ]);
  ULTIMA = Date.now(); pintarCuando();

  if (a.error){
    pintaEn(`<h2 class="tit">Embudo</h2><div class="panel"><div class="vacio">
      No se ha podido cargar.<br>${esc(a.error.message)}</div></div>`, silencioso);
    return;
  }
  LEADS = a.data || []; EMBUDO = b.data || [];

  if (!LEADS.length){
    pintaEn(`<h2 class="tit">Embudo</h2>
      <p class="sub corta">Quien ha escrito a tu asistente, ordenado por lo que hay que hacer primero.</p>
      <div class="panel"><div class="vacio">
        <strong>Nadie ha escrito aún.</strong><br>
        Quien escriba al asistente entra aquí solo, sin hacer nada.</div></div>`, silencioso);
    return;
  }

  const vivos = LEADS.filter(l => !['ganado','perdido'].includes(l.etapa));

  pintaEn(`
    <h2 class="tit">Embudo</h2>
    <p class="sub corta">Quien ha escrito a tu asistente, ordenado por lo que hay
       que hacer primero.</p>

    ${cuentasEtapa()}

    <div class="convs2 embudo2">
     <div class="panel lpanel">
      <div class="lfiltros">
        <input id="lbusca" class="busca" type="search" aria-label="Buscar leads"
               placeholder="Buscar por nombre o teléfono" autocomplete="off">
        <div class="orden" role="group" aria-label="Qué mostrar">
          ${[['activos','Abiertos', vivos.length],
             ['cerrados','Cerrados', LEADS.length - vivos.length]]
            .map(([k,t,n]) => `<button class="${LFILTRO===k?'on':''}" data-lf="${k}"
                   aria-pressed="${LFILTRO===k}">${t} ${nf.format(n)}</button>`).join('')}
        </div>
      </div>

      <div id="lista-leads"></div>
     </div>
     <div id="pficha" class="panel vacio-det">
       Elige a alguien de la lista para ver su ficha.
     </div>
    </div>`, silencioso);

  // Los filtros y el buscador se enlazan aquí, no en la vista de
  // Conversaciones: cada vista enlaza lo suyo.
  document.querySelectorAll('.orden button[data-lf]').forEach(b =>
    b.addEventListener('click', () => {
      LFILTRO = b.dataset.lf;
      LEXP = {};   // lo desplegado era de la lista anterior
      document.querySelectorAll('.orden button[data-lf]').forEach(x => {
        x.classList.toggle('on', x === b);
        x.setAttribute('aria-pressed', String(x === b));
      });
      pintarLista($('#lbusca')?.value.trim());
    }));

  const lb = $('#lbusca');
  if (lb){
    let t = null;
    lb.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => pintarLista(lb.value.trim()), 200);
    });
  }

  pintarLista($('#lbusca')?.value.trim());
}


// Refresca los datos SIN repintar la vista entera. Repintar `#vista`
// con la ficha abierta vacía el fondo un instante, la página se
// encoge y el modal salta.
async function refrescarEmbudo(){
  const [a, b] = await Promise.all([
    supabase.rpc('mt_mis_leads'),
    supabase.rpc('mt_embudo_resumen')
  ]);
  if (a.data) LEADS = a.data;
  if (b.data) EMBUDO = b.data;

  const c = document.querySelector('.fcuentas');
  if (c) c.outerHTML = cuentasEtapa();
  pintarLista($('#lbusca')?.value.trim());
}

// Una línea con las etapas que tienen gente. Sustituye a la barra
// del recorrido: aquella ocupaba un panel entero para decir lo
// mismo, y con cero cerrados sus proporciones no decían nada.
function cuentasEtapa(){
  const con = (EMBUDO || []).filter(e => Number(e.leads) > 0);
  if (!con.length) return '';
  return `<div class="fcuentas">${con.map(e =>
    `<span>${esc(NOMBRE_ETAPA[e.etapa] || e.etapa)} <b>${nf.format(e.leads)}</b></span>`
  ).join('')}</div>`;
}

function pintarLista(q){
  const cont = $('#lista-leads'); if (!cont) return;
  const norm = t => String(t || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  const cerrados = LFILTRO === 'cerrados';
  let l = LEADS.filter(x => cerrados === ['ganado','perdido'].includes(x.etapa));

  if (q){
    const n = norm(q), num = q.replace(/[^0-9]/g, '');
    l = l.filter(x => norm(x.nombre).includes(n) || norm(x.email).includes(n) ||
      (num.length >= 3 && String(x.telefono || x.user_ref).includes(num)));
  }
  l.sort(ordenLeads);

  if (!l.length){
    cont.innerHTML = `<div class="vacio">${q
      ? `Nadie coincide con «${esc(q)}».`
      : cerrados ? 'Ninguno cerrado.' : 'Ninguno abierto.'}</div>`;
    return;
  }

  // Agrupado: por etapa si son cerrados, por urgencia si no. El
  // motivo vive en el título del grupo y no se repite en cada fila.
  const grupos = cerrados
    ? [['ganado','Ganado',''], ['perdido','Perdido','sin']]
    : GRUPOS;
  const de = cerrados
    ? (x => x.etapa)
    : (x => urgencia(x)?.nivel || 'marcha');

  cont.innerHTML = grupos.map(([clave, titulo, tono]) => {
    const dentro = l.filter(x => de(x) === clave);
    if (!dentro.length) return '';          // un grupo vacío es ruido

    const corta = dentro.length > MOSTRAR + HOLGURA && !LEXP[clave];
    const vistos = corta ? dentro.slice(0, MOSTRAR) : dentro;
    const faltan = dentro.length - vistos.length;

    return `<div class="lgcab ${tono}">${esc(titulo)}
              <span class="mono">${dentro.length}</span></div>
            ${vistos.map(x => filaLead(x, clave)).join('')}
            ${faltan ? `<button class="lmas" data-g="${esc(clave)}">Ver ${faltan} más</button>` : ''}`;
  }).join('');

  enlazarLeads();
}

function filaLead(l, grupo){
  const u = urgencia(l);
  const pide = [l.servicio, l.ubicacion].filter(Boolean).join(', ');
  const tel  = l.telefono || l.user_ref;
  const hace = l.ultima ? desdeEntonces(l.ultima).txt : '';

  // El motivo solo se escribe en el grupo de hoy, donde la fecha
  // importa. En los demás, el título del grupo ya lo dice.
  const motivo = grupo === 'urg' && u?.txt ? u.txt : '';

  return `<div class="lfila" data-lead="${l.id}" tabindex="0" role="button"
    aria-label="${esc(l.nombre || tel)}${motivo ? '. ' + esc(motivo) : ''}">
    <div class="lfila-txt">
      <div class="lfila-nom${l.nombre ? '' : ' mono'}">${
        l.nombre ? `<bdi>${esc(l.nombre)}</bdi>` : esc(tel)}</div>
      <div class="lfila-pide">${pide ? esc(pide) : 'Sin concretar qué busca'}</div>
      ${motivo ? `<div class="lfila-urg">${esc(motivo)}</div>` : ''}
    </div>
    ${hace ? `<span class="lfila-hace">${esc(hace)}</span>` : ''}
  </div>`;
}

function enlazarLeads(){
  document.querySelectorAll('.lmas[data-g]').forEach(b =>
    b.addEventListener('click', e => {
      e.stopPropagation();           // el botón vive dentro de la lista
      LEXP[b.dataset.g] = true;
      pintarLista($('#lbusca')?.value.trim());
    }));

  document.querySelectorAll('.lfila[data-lead]').forEach(el => {
    const ir = () => abrirLead(Number(el.dataset.lead));
    el.addEventListener('click', ir);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); }
    });
  });
}
