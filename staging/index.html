  .co-fila2{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tinta-suave)}
  .co-fila2 input[type=number]{width:76px}
  .co-fila2 input[type=time]{width:auto}
  .co-dias{display:flex;gap:4px}
  .co-dia{margin:0;cursor:pointer}
  .co-dia input{position:absolute;opacity:0;width:1px;height:1px}
  .co-dia span{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
               border:1.5px solid var(--linea);font-size:13px;font-weight:700;color:var(--gris);transition:all .15s ease}
  .co-dia input:checked + span{background:var(--pulso);border-color:var(--pulso);color:#fff}
  .co-dia input:focus-visible + span{outline:2px solid var(--pulso);outline-offset:2px}

  .co-fotosdrive{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .co-fotosdrive .cbtn{margin-left:auto}
  .co-centros{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
  .co-centro{display:grid;gap:2px;padding:12px 16px;border:1px solid var(--linea);border-radius:14px;font-size:13px}
  .co-centro span{color:var(--gris);font-size:12px;font-family:'JetBrains Mono',monospace}
  .co-centro .tn-falta{font-family:'Plus Jakarta Sans',sans-serif}

  /* ---- 06/11 (3): carpetas enteras, lectura, vistas, adjuntos ---- */
  /* Más ancho para el correo (la página no pasa de 1440 px en el resto). */
  main:has(.correo){max-width:1800px}
  /* Carpetas: el nombre entero, en dos líneas si hace falta; nunca barra lateral. */
  .co-bandeja{grid-template-columns:256px minmax(300px,400px) minmax(0,1fr)}
  .co-bandeja.co-ladov{grid-template-columns:256px minmax(260px,320px) minmax(0,1fr)}
  .co-carps{overflow-x:hidden}
  .co-carp{min-width:0}
  .co-cnomb{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;overflow-wrap:anywhere}

  /* Correo abierto: cabecera, y el correo y la respuesta cada uno en su caja. */
  .co-dcab{padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--linea)}
  .co-dtit{display:flex;gap:12px;align-items:flex-start}
  .co-dtit h3{flex:1 1 auto;font-size:21px;letter-spacing:-.02em;line-height:1.3;margin:0}
  .co-dtit .cerrar{flex:none}
  .co-vistas{display:flex;gap:2px;background:var(--fondo);padding:2px;border-radius:10px;flex:none}
  .co-vbtn{width:34px;height:30px;border-radius:8px;background:none;color:var(--gris);display:flex;align-items:center;justify-content:center}
  .co-vbtn:hover{color:var(--pulso)}
  .co-vbtn.on{background:var(--blanco);color:var(--pulso);box-shadow:0 1px 3px rgba(10,31,74,.12)}
  .co-dde{display:flex;gap:12px;align-items:center;margin-top:12px;font-size:13px;line-height:1.6}
  .co-av{width:40px;height:40px;border-radius:999px;background:var(--aire);color:var(--profundo);
         display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
  .co-dcab .co-clasif{margin:12px 0 0}
  .co-par{display:grid;gap:16px}
  .co-lado .co-par{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .co-msg{border:1px solid var(--linea);border-radius:14px;padding:16px 20px;background:var(--blanco);min-width:0}
  .co-msgresp{background:var(--blanco-tibio);border-color:var(--azul-borde)}
  .co-msgt{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.07em;
           text-transform:uppercase;color:var(--gris);margin-bottom:12px}
  .co-msgq{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
  .co-msg .co-orig{padding:0;border:0;white-space:normal}
  .co-orig p{margin:0 0 12px}
  .co-orig p:last-child{margin-bottom:0}
  /* La respuesta crece con su texto: sin barra propia; se desplaza el correo entero. */
  .co-msg textarea.co-txt{min-height:260px;overflow:hidden;resize:none}
  .co-addadj{margin-top:8px}

  /* Adjuntos: tarjeta con miniatura, Ver y Descargar; «Descargar todos» arriba. */
  .co-adjs{margin-top:16px;padding-top:12px;border-top:1px solid var(--linea)}
  .co-adjscab{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;
              color:var(--gris);margin-bottom:8px}
  .co-adjsl{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
  .co-adjc{position:relative;border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:var(--blanco);min-width:0}
  .co-adjprev{display:flex;align-items:center;justify-content:center;width:100%;height:88px;padding:0;background:var(--fondo)}
  .co-adjprev img{width:100%;height:100%;object-fit:cover;display:block}
  .co-adjprev:hover{filter:brightness(.97)}
  .co-adjico{display:flex;align-items:flex-end;justify-content:center;width:40px;height:50px;border-radius:4px;padding-bottom:6px;
             font-size:11px;font-weight:800;background:var(--rojo-fondo);color:var(--rojo-texto)}
  .co-adjico.doc{background:var(--azul-suave);color:var(--azul-texto)}
  .co-adjn{padding:8px 12px 0;font-size:12px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .co-adjn small{display:block;font-weight:500;color:var(--gris);font-size:11px}
  .co-adjb{display:flex;gap:4px;padding:8px 12px 12px}
  .co-adjb .cbtn{padding:6px 10px;font-size:12px}
  .co-adjx{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:999px;background:var(--blanco);
           color:var(--gris);font-size:15px;line-height:1;box-shadow:0 1px 3px rgba(10,31,74,.18)}
  .co-adjx:hover{color:var(--rojo-texto)}

  /* Visor de adjuntos (por encima de todo, también de la ventana del correo). */
  .co-visor{position:fixed;inset:0;z-index:70;background:rgba(10,14,26,.86);display:none;flex-direction:column}
  .co-vcab{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;font-size:13px}
  .co-vcab b{flex:1 1 auto;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .co-vcab span{color:var(--borde-fuerte);white-space:nowrap}
  .co-vx{background:none;color:#fff;font-size:26px;line-height:1;padding:0 8px}
  .co-vcuerpo{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 72px 32px;position:relative}
  .co-vcuerpo img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.35);background:#fff}
  .co-vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;
           background:rgba(255,255,255,.14);color:#fff;font-size:26px;line-height:1}
  .co-vnav:hover{background:rgba(255,255,255,.26)}
  .co-vnav.ant{left:16px} .co-vnav.sig{right:16px}
  .co-vsin{background:var(--blanco);border-radius:14px;padding:32px 40px;text-align:center;font-size:15px;line-height:1.6;
           display:flex;flex-direction:column;align-items:center;gap:16px}

  /* ---- 06/11 (4): arrastrar, Archivados/Papelera, deshacer, listas ---- */
  .co-cliente{display:inline-flex;align-items:center;gap:8px;margin:0;cursor:pointer}
  .co-cliente select{border:none;font:inherit;font-weight:700;color:var(--tinta);background:none;cursor:pointer}
  .co-carpsis .co-icarp{display:flex;color:var(--gris);flex:none}
  .co-carp.on .co-icarp{color:var(--profundo)}
  /* Al arrastrar: las carpetas se marcan como sitio donde soltar. */
  .co-carps.soltando .co-carp[data-drop]{outline:1.5px dashed var(--azul-borde);outline-offset:-2px}
  .co-carp.sobre{background:var(--pulso)!important;color:#fff!important;outline:none!important}
  .co-carp.sobre .cn,.co-carp.sobre .co-icarp{color:#fff}
  .co-fila.arrastrando{opacity:.45}
  /* Punteros: siempre los del sistema. Sobre los correos, la flecha normal (sin mano);
     arrastrarlos es una opción más, no se anuncia con el puntero. */
  .co-arrastre{position:fixed;top:-200px;left:0;padding:24px 0 0 24px;background:transparent}
  .co-arrastre span{display:block;max-width:280px;padding:8px 12px;border-radius:10px;
               background:var(--profundo);color:#fff;font:600 13px 'Plus Jakarta Sans',sans-serif;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 6px 18px rgba(10,31,74,.22)}
  .co-lcab .co-vaciar{margin-left:auto;padding:6px 10px;font-size:12px}
  .co-lcab .co-vaciar:disabled{opacity:.45;cursor:default}
  .co-dacc{display:flex;gap:4px;flex:none}
  .co-ibtn{width:34px;height:30px;border-radius:8px;background:var(--fondo);color:var(--gris);
           display:flex;align-items:center;justify-content:center}
  .co-ibtn:hover{color:var(--pulso);background:var(--aire)}
  .co-ibtn[data-co=papelera]:hover{color:var(--rojo-texto);background:var(--rojo-fondo)}
  /* Aviso con «Deshacer»: se puede pulsar. */
  .co-toast{display:flex;align-items:center;gap:12px}
  .co-toast.accion{pointer-events:auto}
  .co-toast button{background:none;color:var(--azul-borde);font-weight:700;font-size:13px;padding:4px 8px;border-radius:8px}
  .co-toast button:hover{background:rgba(255,255,255,.12);color:#fff}
  .co-toast kbd{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gris-claro);
                border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:2px 6px}
  /* Configuración: atajos a cada sección. */
  .co-secnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;z-index:2;
             background:var(--fondo);padding-bottom:8px}
  .co-cuerpo [id^=co-sec-]{scroll-margin-top:56px}
  /* Listas añadibles (correos, dominios). */
  .co-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;padding:6px 8px;
            border:1.5px solid var(--linea);border-radius:10px;background:var(--blanco)}
  .co-chips:focus-within{border-color:var(--pulso)}
  .co-chipv{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;border-radius:999px;
            background:var(--aire);color:var(--profundo);font-size:13px;font-weight:600}
  .co-chipv button{width:20px;height:20px;border-radius:999px;background:none;color:var(--gris);font-size:15px;line-height:1}
  .co-chipv button:hover{background:var(--blanco);color:var(--rojo-texto)}
  .co-chips input.co-chipin{flex:1 1 180px;min-width:120px;border:none!important;padding:6px 4px!important;margin:0;
            font-size:13px!important;background:none!important;outline:none}
  .co-uadd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto auto;gap:8px;margin-top:16px;align-items:center}
  .co-uadd input,.co-uadd select{margin:0;padding:8px 12px;font-size:13px;border:1.5px solid var(--linea);border-radius:10px;font-family:inherit}
  .co-uadd .btn.corto{margin:0;padding:8px 16px}

  /* ---- 06/11 (5): regla al mover, versiones, compañeros, deslizar, seguridad, búsqueda, embudo ---- */
  /* Aviso «¿Siempre a…?»: entra suave desde abajo a la derecha, con muy poco texto. */
  .co-regla{position:fixed;right:24px;bottom:24px;z-index:65;display:grid;gap:4px;max-width:320px;
            background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:16px 20px;
            box-shadow:0 12px 40px rgba(10,31,74,.16);font-size:13px;
            opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;
            transition:opacity .25s ease,transform .25s cubic-bezier(.2,.8,.2,1)}
  .co-regla.on{opacity:1;transform:none;pointer-events:auto}
  .co-regla b{font-size:15px}
  .co-regla span{color:var(--gris);overflow-wrap:anywhere}
  .co-regla div{display:flex;gap:8px;margin-top:8px}
  .co-regla .btn.corto{margin:0;padding:8px 16px;font-size:13px}
  @media (prefers-reduced-motion:reduce){.co-regla{transition:opacity .15s ease;transform:none}}
  .co-siempre{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .co-siempre .co-chipv{font-size:12px}

  /* Pídele un cambio + versiones */
  .co-reesc{display:grid;gap:8px;margin-top:8px}
  .co-reesc-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .co-reesc-chips .chip{padding:6px 10px;font-size:12px}
  .co-vers{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--gris);font-weight:600}
  .co-vers button{width:26px;height:26px;border-radius:8px;background:var(--fondo);color:var(--tinta);font-size:15px}
  .co-vers button:disabled{opacity:.35;cursor:default}
  .co-reesc-pide{display:flex;gap:8px}
  .co-reesc-pide input{flex:1;margin:0;padding:8px 12px;font-size:13px;border:1.5px solid var(--linea);border-radius:10px}

  /* Compañeros: quién está viendo o respondiendo */
  .co-av.co-avmini{width:22px;height:22px;font-size:10px;display:inline-flex;margin-right:6px;vertical-align:-6px}
  .co-hora{display:flex;align-items:center;justify-content:flex-end}
  .co-av.co-avmini.viendo{background:var(--ambar-fondo);color:var(--ambar-texto);box-shadow:0 0 0 2px var(--ambar)}
  .co-av.co-avmini.respondiendo{background:var(--rojo-fondo);color:var(--rojo-texto);box-shadow:0 0 0 2px var(--coral)}
  .co-pres{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5}
  .co-pres.viendo{background:var(--ambar-tenue);color:var(--ambar-texto)}
  .co-pres.respondiendo{background:var(--rojo-fondo);color:var(--rojo-texto)}
  .co-pres .cbtn{margin-left:auto}
  /* «En línea»: cada foto entera, separadas, con su punto verde fuera de la cara. */
  .co-enlinea{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--gris);font-weight:600;margin-right:4px}
  .co-enlinea .co-av{width:28px;height:28px;font-size:11px;position:relative;overflow:visible}
  .co-enlinea .co-av::after{content:'';position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:999px;
                            background:var(--verde);border:2px solid var(--fondo)}
  /* Fotos de perfil */
  .co-av.co-avfoto{padding:0;background:var(--fondo)}
  .co-av.co-avfoto img{width:100%;height:100%;object-fit:cover;border-radius:999px;display:block}
  .co-av.co-avgrande{width:40px;height:40px;font-size:13px}
  .co-ufoto{display:flex;align-items:center;gap:8px;flex:none}
  .co-fotobtn{display:inline-block;padding:0}
  /* Idiomas */
  .co-idioma{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--tinta-suave);
             margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--linea)}
  .co-escribir{margin-bottom:8px;width:max-content;max-width:100%}
  .co-trad{margin-top:12px;border:1px dashed var(--azul-borde);border-radius:10px;padding:12px 16px;background:var(--blanco)}
  .co-tradcab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
  .co-trad .co-orig{font-size:13px}
  .co-desfasada{opacity:.5}
  /* Agenda: cifras por canal */
  .co-canales table{max-width:640px}
  .co-canales tbody tr{cursor:default}
  .co-canales tbody tr:hover{background:none}
  .co-canales th:not(:first-child),.co-canales td:not(:first-child){text-align:right}
  .pill.co-canal{vertical-align:2px;margin-left:6px}
  .emb-reglas{margin-bottom:12px}

  /* Seguridad */
  .co-seg{margin-top:12px;border-radius:10px;font-size:13px;line-height:1.5}
  .co-seg.mal{background:var(--rojo-fondo);border:1px solid var(--rojo-borde);color:var(--rojo-texto);padding:12px 16px}
  .co-segtit{display:flex;gap:8px;align-items:flex-start}
  .co-segico{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:999px;
             font-size:11px;font-weight:800;background:var(--verde-tenue);color:var(--verde-oscuro);flex:none}
  .co-seg.mal .co-segico{background:var(--rojo-texto);color:#fff}
  .co-seglista{list-style:none;display:grid;gap:4px;margin:8px 0 0;padding:0}
  .co-seglista li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;color:var(--tinta-suave)}
  .co-seglista li span{font-weight:800;text-align:center}
  .co-seglista li.ok span{color:var(--verde-texto)} .co-seglista li.mal span{color:var(--rojo-texto)} .co-seglista li.info span{color:var(--gris)}
  .co-seg.mal .co-seglista li{color:var(--rojo-texto)}
  .co-segacc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .pill.co-peligro{background:var(--rojo-texto);color:#fff}
  .co-enlmal{background:var(--rojo-fondo);color:var(--rojo-texto);border-radius:4px;padding:0 4px;text-decoration:line-through;text-decoration-color:rgba(180,35,24,.4)}
  .co-enlmal small{text-decoration:none;display:inline-block;font-weight:700;font-size:11px}
  .co-adjmal{border-color:var(--rojo-borde)}
  .co-adjico.mal{background:var(--rojo-texto);color:#fff}

  /* Búsqueda con filtros */
  .co-lbusca{padding:12px 16px 8px;border-bottom:1px solid var(--linea);flex:none;display:grid;gap:8px}
  .co-bwrap{display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border:1.5px solid var(--linea);border-radius:10px;color:var(--gris)}
  .co-bwrap:focus-within{border-color:var(--pulso)}
  .co-bwrap input{flex:1;min-width:0;border:none;margin:0;padding:8px 0;font-size:13px;background:none;outline:none}
  .co-bayuda{width:26px;height:26px;border-radius:999px;background:var(--fondo);color:var(--gris);font-weight:700;font-size:13px;flex:none}
  .co-bayudat{display:grid;gap:4px;font-size:12px;color:var(--tinta-suave);background:var(--fondo);border-radius:10px;padding:8px 12px}
  .co-bayudat code{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--blanco);border:1px solid var(--linea);border-radius:4px;padding:1px 4px}
  .co-bfiltros{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .co-bfiltros::-webkit-scrollbar{display:none}
  .co-bfiltros .chip{padding:6px 10px;font-size:12px;white-space:nowrap;flex:none}
  .co-blimpiar{padding:0 4px;margin-left:auto}
  .co-lcab .co-blimpiar + .co-vaciar{margin-left:8px}
  .correo mark{background:var(--ambar-fondo);color:inherit;border-radius:2px;padding:0 1px}

  /* Deslizar (táctil) */
  .co-swipe{position:relative;overflow:hidden}
  .co-swipe + .co-swipe .co-fila{border-top:1px solid var(--linea)}
  .co-lscroll .co-swipe .co-fila{border-top:0}

<script type="module">
// Versión EXACTA de la librería. Con @2 a secas, cada visita cargaba
// la última 2.x publicada: el panel podía cambiar de comportamiento
// sin que nadie lo tocara. 2.117.3 es la que se estaba sirviendo, así
// que fijarla no cambia nada hoy. Para subirla, se cambia aquí, en los
// dos paneles, y se pasan las pruebas.
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.3';

const URL = 'https://gwibsjohvfxasslcrxuq.supabase.co';
const KEY = 'sb_publishable_FAdZnCbOMYQTDJY-5ysSBg_FryJ_Z81';

// Qué versión de este archivo está cargada. Sale en la franja de
// staging y en la consola. GitHub Pages guarda los archivos en caché
// unos minutos: sin esto no hay forma de saber si lo que se está
// probando es lo último que se subió. Se cambia en cada entrega.
const VERSION = '2026-11-05 · correo en pruebas 3 (datos de ejemplo)';
console.info('Panel SimpliaSpain · versión', VERSION);

// Sesión en memoria: los artefactos no permiten almacenamiento del navegador.
const supabase = createClient(URL, KEY, {
  auth: { persistSession:false, autoRefreshToken:true, detectSessionInUrl:false }
});

/* ============================================================
   REGISTRO DE INCIDENCIAS

   Cuando el panel del cliente falla —un error de
   JavaScript, una consulta que devuelve permission denied, una
   promesa sin capturar— lo registra en `incidencias` y aparece
   solo en el panel maestro. Hoy, si al cliente le falla algo, no
   nos enteramos hasta que llama.

   Requiere 020_maestro.sql aplicado. Si no lo está, la llamada
   falla en silencio y el panel sigue funcionando igual.

   Nota: no reporta más de una vez por código y sesión. Un error
   dentro de un bucle de render podría disparar cientos de
   inserciones por segundo; el contador `veces` de la tabla ya
   recoge la reincidencia entre sesiones.
   ============================================================ */

// codigo → 'enviado', o el instante del último intento fallido. Antes
// el código se daba por usado ANTES de enviar: si el envío fallaba
// (sin red, justo cuando más falla todo), ese código ya no se volvía a
// reportar en toda la sesión y un error de verdad posterior se perdía.
// Ahora un envío fallido se puede reintentar pasado un minuto.
const YA_REPORTADO = new Map();

async function reportar(codigo, titulo, detalle = {}, severidad = 'aviso'){
  const prev = YA_REPORTADO.get(codigo);
  if (prev === 'enviado' || (typeof prev === 'number' && Date.now() - prev < 60000)) return;
  YA_REPORTADO.set(codigo, Date.now());
  try {
    const r = await supabase.rpc('mt_registrar_incidencia', {
      p_codigo:    codigo,
      p_titulo:    String(titulo).slice(0, 300),
      p_severidad: severidad,
      p_detalle:   { ...detalle,
                     vista:  typeof VISTA !== 'undefined' ? VISTA : null,
                     agente: navigator.userAgent.slice(0, 180) },
      p_origen:    'panel'
    });
    if (!r?.error) YA_REPORTADO.set(codigo, 'enviado');
  } catch { /* si ni siquiera se puede reportar, no hay nada más que hacer */ }
}

const codigoDe = (pref, txt) =>
  pref + '_' + String(txt || 'error').slice(0, 60).replace(/\W+/g, '_').toLowerCase();

window.addEventListener('error', e => reportar(
  codigoDe('js', e.message),
  'Error de JavaScript: ' + (e.message || 'desconocido'),
  { fichero: e.filename, linea: e.lineno }));

window.addEventListener('unhandledrejection', e => {
  const t = String(e.reason?.message || e.reason || '');
  reportar(codigoDe('promesa', t), 'Promesa sin capturar: ' + t.slice(0, 200));

/* Además de los errores de JavaScript, interesa saber cuándo una
   consulta a Supabase devuelve error: es el fallo más probable y
   el más silencioso, porque el panel solo muestra "no se han
   podido cargar" y el cliente cierra la pestaña. */
/* UNA LLAMADA NO PUEDE DEJAR UNA PANTALLA ESPERANDO PARA SIEMPRE.
   Antes, si la red fallaba de una forma que la librería no convertía
   en error (o la llamada no contestaba nunca, cosa normal en un móvil
   con poca cobertura o al volver de segundo plano), la pantalla se
   quedaba en el esqueleto gris sin decir nada. Ahora:

       'red', igual que cualquier otro error, y cada pantalla ya sabe
       qué decir con eso;
     · las LECTURAS tienen tiempo máximo: si en ESPERA_MAX no hay
       respuesta, vuelven como { error } con código 'tiempo'.
     · las ESCRITURAS no. Cortar una escritura no la para: sigue en el
       servidor y puede llegar. Darla por fallida invitaba a repetirla,
       y «Apuntar contacto» repetido son dos contactos apuntados. Las

       mt_sincronizar no: repetirla no cambia nada, y el Embudo la
       espera antes de pintar. */
//

// automático: las lecturas del Latido van todas a la vez, así que una
// carga dura como mucho ESPERA_MAX y termina antes del siguiente.
// mt_registrar_incidencia no va en ESCRITURAS: repetirla solo suma
// `veces`, y sin tiempo máximo se acumularían envíos colgados.
const ESPERA_MAX = 20000;
const ESCRITURAS = new Set(['mt_apuntar_toque','mt_deshacer_evento','mt_editar_evento',
  'mt_guardar_lead','mt_mover_lead','mt_guardar_ajustes','mt_pausar','mt_reanudar',
  'mt_excluir','mt_incluir','mt_guardar_parametros']);

// en Chrome, «NetworkError» en Firefox).

// («TypeError: Load failed», «permission denied for function…») no se
// enseña tal cual: no le dice nada a quien usa el panel. Los mensajes
// que ya escribe la base en castellano («Estás en modo lectura…») sí.
function mensajeError(error){
  if (!error) return 'Ha ocurrido un error.';
  const m = String(error.message || '');
  if (esDeRed({ error })) return 'No hay conexión con el servidor. Inténtalo de nuevo en un momento.';
  if (error.code === 'tiempo')
    return 'El servidor no ha contestado a tiempo. Si estabas guardando algo, recarga para ver si llegó antes de repetirlo.';
  if (/permission denied/i.test(m)) return 'Con esta cuenta no se puede hacer este cambio.';

      llamada,
      new Promise(listo => { reloj = setTimeout(() => listo({ data: null, error: {

  // Al maestro va lo que puede servir para arreglar algo. Un fallo de
  // red no: no se puede enviar mientras dura, y no es del panel.
  // Lo lento va con su propio código, para que un aviso de lentitud no
  // tape después un error de verdad de la misma función.
  // (Aquí ponía 'registrar_incidencia', sin el mt_: la condición no se
  // cumplía nunca.)
  // Una función que llega con una migración (la 120, la 121…) y que el
  // servidor aún no tiene no es un fallo: el panel sigue sin ella.
  if (r.error && nombre !== 'mt_registrar_incidencia' && !esDeRed(r)
      && !(esOpcional(nombre) && sinFuncion(r.error, nombre))){
    const lento = r.error.code === 'tiempo';
    reportar((lento ? 'rpc_tiempo_' : 'rpc_') + nombre,
             lento ? `${nombre}() no ha contestado en ${ESPERA_MAX / 1000} s`
                   : `Fallo en ${nombre}(): ${r.error.message}`,
             { codigo: r.error.code, pista: r.error.hint },
             lento ? 'aviso' : 'critico');
  }
  return r;
};

async function entrar(){
  const b = $('#entrar'), e = $('#err');
  e.style.display = 'none';
  b.disabled = true; b.textContent = 'Comprobando…';

  const { data: sesion, error } = await supabase.auth.signInWithPassword({
    email: $('#em').value.trim(), password: $('#pw').value
  });
  USUARIO_EMAIL = String(sesion?.user?.email || $('#em').value || '').trim().toLowerCase();

  if (error){
    // El mensaje tiene que distinguir qué ha fallado. Decir "email o
    // contraseña incorrectos" cuando el problema es la conexión o la
    // configuración manda a la gente a cambiar su contraseña por algo
    // que no tiene nada que ver.
    const m = String(error.message || '');
    e.textContent =
      /Invalid login/i.test(m)      ? 'Email o contraseña incorrectos. Revísalos e inténtalo otra vez.' :
      /Email not confirmed/i.test(m)? 'Tu cuenta existe pero no está confirmada todavía.' :
      /Failed to fetch|Load failed|NetworkError|fetch/i.test(m)
                                    ? 'No se ha podido contactar con el servidor. Revisa la conexión.' :
      /API key|apikey|JWT|anon/i.test(m)
                                    ? 'La configuración del panel no es válida. Avisa a SimpliaSpain.' :
      m || 'No se ha podido entrar.';
    e.style.display = 'block';
    console.error('Entrada rechazada:', error);
    b.disabled = false; b.textContent = 'Entrar al panel';
    return;
  }
  $('#login').style.display = 'none';
  $('#app').style.display = 'block';
  await arrancar();
}

/* Auto-refresco cada 30 s. Se detiene si la pestaña no está
   visible, para no consumir peticiones en balde, y no interrumpe
   si hay un modal abierto o el usuario está escribiendo.

   EL REFRESCO NO CIERRA LO QUE SE ESTÁ LEYENDO. En Conversaciones y
   en el Embudo esto llamaba a pintarConvs / pintarEmbudo, que
   reescriben la pantalla entera: cada 30 segundos la conversación
   abierta volvía a «Elige a alguien de la lista» —con la fila aún
   resaltada— y la ficha del lead desaparecía con lo que se estuviera
   escribiendo. Ahora esas dos pantallas se refrescan en su sitio: la
   lista se pone al día y lo abierto se queda abierto. Lo comprueba
   pruebas/refresco.mjs. */
let TIMER = null, VISTA = 'latido', MAPA = null, ULTIMOS = null, PUNTOS = null;

// Un textarea también es escribir: las notas del lead lo son, y antes
// solo se miraban INPUT y SELECT.
function escribiendo(){
  const ae = document.activeElement;
  return !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT'
               || ae.tagName === 'TEXTAREA' || ae.isContentEditable === true);
}

// El tic del temporizador, con nombre para poder probarlo.
function tic30(){
  if (document.hidden) return;
  // Correo: se mira siempre, para que el número de la pestaña esté al día.
  // Solo cambia la lista: lo que se esté escribiendo no se toca.
  if (TENANT && correoPermitido()) coRefrescar(false);
  if ($('#modal').style.display === 'block') return;
  if (escribiendo()) return;
  // Si la carga anterior del Latido aún no ha vuelto, no se empieza
  // otra: la nueva le quitaría el turno y, si cada carga tardara más que
  // el intervalo, la pantalla no se pondría al día nunca.
  if (VISTA === 'latido') return LATIDO_EN_VUELO ? undefined : pintarLatido(true);
  if (VISTA === 'convs' && !$('#buscar')?.value) return refrescarConvs();
  if (VISTA === 'embudo' && !$('#lbusca')?.value) return refrescarEmbudoVista();
  if (VISTA === 'agenda') return pintarAgenda(true);
}

function autoRefresco(){
  clearInterval(TIMER);
  TIMER = setInterval(tic30, 30000);
}

$('#salir').addEventListener('click', async () => {
  clearInterval(TIMER);
  await supabase.auth.signOut();
  location.reload();
});

// En una función porque al cambiar de cliente hay que rehacer la
// barra: la pestaña Agenda se quita o se pone según ese cliente
// tenga citas, y los oyentes se pierden al reescribir el HTML.
// Cambiar de pestaña, y ESPERAR a que esté pintada. Los saltos entre
// pantallas («Ver conversación», «Abrir en Embudo», el «i» de «Tus
// números») pulsaban la pestaña y esperaban 700 ms a ciegas: con una
// conexión algo lenta la ficha no se abría, o se abría la de otra
// persona, o salía en la ventana del móvil encima del ordenador.
function irA(v){
  // Se empieza por arriba: con la cabecera fija ya se puede cambiar de
  // pestaña con la página bajada, y en el móvil se aterrizaba a mitad.
  window.scrollTo(0, 0);
  document.querySelectorAll('nav button').forEach(x =>
    x.classList.toggle('on', x.dataset.v === v));
  VISTA = v;
  // Al salir del Latido se tira el mapa, y con él su observador:
  // seguiría vigilando un contenedor que ya no existe.
  if (v !== 'latido' && LMAP){
    OBSMAPA?.disconnect(); OBSMAPA = null;
    LMAP.remove(); LMAP = null; LCAPA = null;
  }
  if (v === 'latido') return pintarLatido();
  if (v === 'convs')  return pintarConvs();
  if (v === 'embudo') return CO.embudoCanal === 'correo' && correoPermitido() ? pintarEmbudoCorreo() : pintarEmbudo();
  if (v === 'agenda') return pintarAgenda();
  if (v === 'correo' && correoPermitido()) return pintarCorreo();
  return pintarAjustes();
}

function coAviso(txt, conDeshacer){
  anunciar(txt);

  if (!t){

    t.addEventListener('click', e => { if (e.target.closest('[data-deshacer]')) coDeshacer(); });

  }
  t.innerHTML = `<span>${esc(txt)}</span>${conDeshacer ? '<button data-deshacer>Deshacer</button><kbd>Ctrl+Z</kbd>' : ''}`;
  t.classList.toggle('accion', !!conDeshacer);

}

/* ---- Deshacer: solo lo que se hace con los correos (mover, archivar,
   eliminar, vaciar, no responder, enviar), nunca ajustes. Botón en el
   aviso y Ctrl+Z (Cmd+Z en Mac) cuando no se está escribiendo. ---- */
CO.historial = [];
function coHacer(texto, hacer, deshacer, extra = {}){
  hacer();
  const paso = { texto, deshacer, ...extra };
  CO.historial.push(paso);
  if (CO.historial.length > 30) CO.historial.shift();
  coTrasCambio();
  coAviso(texto, true);
  return paso;
}
function coDeshacer(){
  const paso = CO.historial.pop();
  if (!paso) return coAviso('No hay nada que deshacer.');
  paso.deshacer();
  coTrasCambio();
  coAviso(paso.deshecho || `Deshecho: ${paso.texto.charAt(0).toLowerCase()}${paso.texto.slice(1)}`);
}
// Tras mover o cambiar un correo: si estaba abierto en la ventana (tableta o
// móvil), se cierra; en el ordenador se queda donde está.
function coTrasCambio(){
  if ($('#modal').style.display === 'block' && $('#mbox .co-det')) cerrar();
  coBadge();
  if (VISTA === 'embudo') return pintarEmbudoCorreo();
  pintarCorreo();

function coMover(ids, destino, conRegla = true){
  const lista = ids.map(id => CO.correos.find(c => c.id === id)).filter(c => c && c.carpeta !== destino);
  if (!lista.length) return;
  // Al mover a mano un correo a una carpeta vuestra: «¿Siempre a esta carpeta?»
  if (conRegla && lista.length === 1 && CO.carpetas.some(k => k.id === destino)) setTimeout(() => coProponerRegla(lista[0], destino), 350);
  const antes = lista.map(c => ({ c, carpeta: c.carpeta, estado: c.estado, previa: c.antes }));
  const nom = coCarp(destino)?.nombre || 'la bandeja de entrada';
  const texto = destino === 'papelera' ? (lista.length > 1 ? `${lista.length} correos a la Papelera.` : 'Movido a la Papelera.')
              : destino === 'archivados' ? (lista.length > 1 ? `${lista.length} correos archivados.` : 'Archivado.')
              : lista.length > 1 ? `${lista.length} correos movidos a «${nom}».` : `Movido a «${nom}».`;
  coHacer(texto, () => lista.forEach(c => {
      CO.seleccion.delete(c.id);
      if (!coFuera(c)) c.antes = c.carpeta;              // para «Restaurar»
      c.carpeta = destino;
      // Un borrador que deja de ser de «Nuevos clientes» ya no se responde.
      if (!coFuera(c) && !coCarp(destino)?.responde && c.estado === 'borrador') c.estado = 'descartado';
    }),
    () => antes.forEach(x => { x.c.carpeta = x.carpeta; x.c.estado = x.estado; x.c.antes = x.previa; }));
}

function coHora(c){
  const d = new Date(c.llegada), min = Math.floor((Date.now() - c.llegada) / 60000);
  const hm = d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
  if (min < 1) return 'ahora';
  if (min < 60) return `hace ${min} min`;
  if (d.toDateString() === new Date().toDateString()) return hm;
  if (d.toDateString() === new Date(Date.now() - 864e5).toDateString()) return `ayer, ${hm}`;
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}
function coHace(ts){
  const s = Math.round((Date.now() - ts) / 1000);
  return s < 10 ? 'ahora mismo' : s < 60 ? `hace ${s} s` : `hace ${Math.round(s / 60)} min`;
}

/* Archivos de ejemplo (la maqueta no tiene los de verdad): fotos dibujadas,
   un PDF real de una página y, para Word/Excel, un texto. En la versión real
   se descargan los originales desde Supabase Storage (enlaces firmados). */
const CO_IMG = new Map();
function coImagen(nombre, w = 1200, h = 800){
  const clave = `${nombre}|${w}`;
  if (CO_IMG.has(clave)) return CO_IMG.get(clave);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#E5EFFE'); g.addColorStop(.62, '#DBEAFE'); g.addColorStop(.62, '#CBD5E1'); g.addColorStop(1, '#E2E8F0');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = '#FFFFFF'; x.fillRect(w * .58, h * .12, w * .3, h * .38);          // ventana
  x.strokeStyle = '#94A3B8'; x.lineWidth = Math.max(2, w / 200); x.strokeRect(w * .58, h * .12, w * .3, h * .38);
  x.fillStyle = '#0A1F4A'; x.fillRect(w * .12, h * .5, w * .36, h * .05);         // mesa
  x.fillRect(w * .15, h * .55, w * .02, h * .2); x.fillRect(w * .43, h * .55, w * .02, h * .2);
  x.fillStyle = '#1B7CFF'; x.fillRect(w * .24, h * .42, w * .1, h * .08);         // pantalla
  x.fillStyle = 'rgba(10,31,74,.78)'; x.fillRect(0, h * .84, w, h * .16);
  x.fillStyle = '#FFFFFF'; x.font = `600 ${Math.round(h * .06)}px "Plus Jakarta Sans", sans-serif`;
  x.fillText(nombre.replace(/\.[a-z]+$/i, ''), w * .04, h * .94);
  const url = cv.toDataURL(/\.jpe?g$/i.test(nombre) ? 'image/jpeg' : 'image/png', .86);
  CO_IMG.set(clave, url);
  return url;
}
function coPaginaPDF(nombre){
  const cv = document.createElement('canvas'); cv.width = 794; cv.height = 1123;
  const x = cv.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, 794, 1123);
  x.fillStyle = '#0A0E1A'; x.font = '700 26px "Plus Jakarta Sans", sans-serif'; x.fillText(nombre.replace(/\.pdf$/i, ''), 72, 110);
  x.fillStyle = '#64748B'; x.font = '15px "Plus Jakarta Sans", sans-serif';
  x.fillText('Vista previa de ejemplo. En la versión real se ve el documento original.', 72, 150);
  x.fillStyle = '#E2E8F0';
  for (let i = 0; i < 22; i++) x.fillRect(72, 200 + i * 38, i % 5 === 4 ? 380 : 650, 12);
  return cv.toDataURL('image/png');
}
function coPDF(titulo){
  const t = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E]/g, '?').replace(/([()\\])/g, '\\$1');
  const st = `BT /F1 18 Tf 56 780 Td (${t(titulo)}) Tj /F1 11 Tf 0 -28 Td (Documento de ejemplo de la maqueta de SimpliaSpain.) Tj 0 -16 Td (En la version real se descarga el archivo original.) Tj ET`;
  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>', `<< /Length ${st.length} >>\nstream\n${st}\nendstream`];
  let pdf = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(pdf.length); pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => `${String(o).padStart(10, '0')} 00000 n \n`).join('')
       + `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return new TextEncoder().encode(pdf);
}
function coArchivo(a){
  if (a.tipo === 'img'){
    const url = coImagen(a.nombre), bin = atob(url.split(',')[1]);
    return { nombre: a.nombre, mime: url.slice(5, url.indexOf(';')), bytes: Uint8Array.from(bin, ch => ch.charCodeAt(0)) };
  }
  if (a.tipo === 'pdf') return { nombre: a.nombre, mime:'application/pdf', bytes: coPDF(a.nombre) };
  return { nombre: a.nombre.replace(/\.[a-z]+$/i, '') + ' (ejemplo).txt', mime:'text/plain',
           bytes: new TextEncoder().encode(`${a.nombre}\n\nArchivo de ejemplo de la maqueta. En la versión real se descarga el original.\n`) };
}
function coDescargar(nombre, blob){
  // globalThis.URL: en este archivo, «URL» es la dirección de Supabase.
  const U = globalThis.URL, url = U.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.append(a); a.click(); a.remove();
  setTimeout(() => U.revokeObjectURL(url), 4000);
}
// ZIP sin comprimir (método «store»): lo abre cualquier ordenador.
const CO_CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const coCrc32 = b => { let c = 0xFFFFFFFF; for (const x of b) c = CO_CRC[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function coZip(archivos){
  const enc = new TextEncoder(), partes = [], central = [], usados = new Set(); let off = 0;
  for (const f of archivos){
    let nombre = f.nombre, n = 2;
    while (usados.has(nombre)) nombre = f.nombre.replace(/(\.[^.]+)?$/, ` (${n++})$1`);
    usados.add(nombre);
    const nom = enc.encode(nombre), crc = coCrc32(f.bytes), tam = f.bytes.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, crc, true); h.setUint32(18, tam, true); h.setUint32(22, tam, true); h.setUint16(26, nom.length, true);
    partes.push(new Uint8Array(h.buffer), nom, f.bytes);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, tam, true); c.setUint32(24, tam, true); c.setUint16(28, nom.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nom);
    off += 30 + nom.length + tam;
  }
  const tamC = central.reduce((s, p) => s + p.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, archivos.length, true); e.setUint16(10, archivos.length, true);
  e.setUint32(12, tamC, true); e.setUint32(16, off, true);
  return new Blob([...partes, ...central, new Uint8Array(e.buffer)], { type:'application/zip' });
}

/* Visor: ver un adjunto antes de descargarlo (flechas para pasar al siguiente). */
function coVer(id, g, i){
  const lista = coAdjDe(id, g); if (!lista[i]) return;
  CO.visor = { id, g, i };
  const a = lista[i];
  let v = $('#covisor');
  if (!v){
    v = document.createElement('div'); v.id = 'covisor'; v.className = 'co-visor';
    v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true');
    v.addEventListener('click', e => {
      const b = e.target.closest('[data-v]');
      if (e.target === v || e.target.classList.contains('co-vcuerpo') || b?.dataset.v === 'cerrar') return coCerrarVisor();
      if (b?.dataset.v === 'ant') return coVer(CO.visor.id, CO.visor.g, CO.visor.i - 1);
      if (b?.dataset.v === 'sig') return coVer(CO.visor.id, CO.visor.g, CO.visor.i + 1);
      if (b?.dataset.v === 'bajar'){ const f = coArchivo(coAdjDe(CO.visor.id, CO.visor.g)[CO.visor.i]); coDescargar(f.nombre, new Blob([f.bytes], { type: f.mime })); }
    });
    document.body.append(v);
  }
  v.setAttribute('aria-label', a.nombre);
  v.innerHTML = `
    <div class="co-vcab"><b>${esc(a.nombre)}</b><span>${coKb(a.kb)} · ${i + 1} de ${lista.length}</span>
      <button class="cbtn" data-v="bajar">Descargar</button>
      <button class="co-vx" data-v="cerrar" aria-label="Cerrar">×</button></div>
    <div class="co-vcuerpo">
      ${i > 0 ? '<button class="co-vnav ant" data-v="ant" aria-label="Anterior">‹</button>' : ''}
      ${a.tipo === 'img' ? `<img src="${coImagen(a.nombre)}" alt="${esc(a.nombre)}">`
        : a.tipo === 'pdf' ? `<img class="co-vpag" src="${coPaginaPDF(a.nombre)}" alt="Primera página de ${esc(a.nombre)}">`
        : `<div class="co-vsin"><span class="co-adjico doc">DOC</span><p>Los Word y Excel no se pueden ver aquí.<br>Descárgalo para abrirlo.</p></div>`}
      ${i < lista.length - 1 ? '<button class="co-vnav sig" data-v="sig" aria-label="Siguiente">›</button>' : ''}
    </div>`;
  v.style.display = 'flex';
  v.querySelector('.co-vx').focus();
}
function coCerrarVisor(){ const v = $('#covisor'); if (v) v.style.display = 'none'; CO.visor = null; }
// Escape cierra primero el visor (sin cerrar el correo de debajo); las flechas pasan de archivo.
document.addEventListener('keydown', e => {
  if (!CO.visor) return;
  if (e.key === 'Escape'){ e.stopImmediatePropagation(); coCerrarVisor(); }
  else if (e.key === 'ArrowLeft') coVer(CO.visor.id, CO.visor.g, CO.visor.i - 1);
  else if (e.key === 'ArrowRight') coVer(CO.visor.id, CO.visor.g, CO.visor.i + 1);
}, true);

/* La firma en HTML la escribe el cliente: antes de pintarla se le quita todo
   lo que pueda ejecutar algo o salirse de su sitio (scripts, estilos de
   página, formularios, marcos, eventos on* y enlaces javascript:). La versión
   real lo hace también en el servidor antes de enviar. */
function coLimpiarHTML(html){
  const doc = new DOMParser().parseFromString(String(html), 'text/html');
  doc.querySelectorAll('script,style,link,meta,base,iframe,frame,object,embed,form,input,button,textarea,select,svg,math')
    .forEach(n => n.remove());
  doc.body.querySelectorAll('*').forEach(n => {
    for (const at of [...n.attributes]){
      const nom = at.name.toLowerCase(), val = at.value.trim().toLowerCase();
      if (nom.startsWith('on') || nom === 'srcdoc' ||
          (['href','src','xlink:href','action','formaction'].includes(nom) && /^(javascript|vbscript|data:text)/.test(val))) n.removeAttribute(at.name);
    }
    if (n.tagName === 'A'){ n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); }
  });
  return doc.body.innerHTML;
}

function coMasCorto(t){

  const saludo = ps[0], cierre = ps[ps.length - 1], medio = ps.slice(1, -1).map(p => p.split(/(?<=[.?!])\s/)[0]);
  return [saludo, medio.join(' '), cierre].join('\n\n');

function coMarca(texto){
  const libres = coBuscando() ? coTerminos().libres.filter(t => t.length > 1) : [];
  let html = esc(texto); if (!libres.length) return html;
  const plano = coNorm(texto), trozos = []; let i = 0;
  const re = new RegExp(libres.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g'); let m;
  while ((m = re.exec(plano))){ trozos.push(esc(texto.slice(i, m.index)), `<mark>${esc(texto.slice(m.index, m.index + m[0].length))}</mark>`); i = m.index + m[0].length; if (!m[0].length) re.lastIndex++; }
  trozos.push(esc(texto.slice(i)));
  return trozos.join('');
}

   de todas (la Papelera solo si se pide con «carpeta:papelera»). */
function coListaDatos(){
  if (coBuscando()){
    const base = /carpeta:papelera/.test(coNorm(CO.busca.q)) ? coVisibles() : coVisibles().filter(c => c.carpeta !== 'papelera');
    return { lista: coFiltrar(base), titulo:'Resultados', sistema:null, pie:'Busca en todas las carpetas.' };
  }
  const todos = coVisibles(), vis = coActivos();
  const lista = CO.carpeta === '_revisar' ? coPorRevisar() : CO.carpeta === '_todo' ? vis : todos.filter(c => c.carpeta === CO.carpeta);
  return { lista, sistema: CO_SISTEMA.find(s => s.id === CO.carpeta),
    titulo: CO.carpeta === '_revisar' ? 'Por revisar' : CO.carpeta === '_todo' ? 'Todos' : (coCarp(CO.carpeta)?.nombre || ''),
    pie: CO.carpeta === '_revisar' ? 'Respuestas preparadas para nuevos clientes. También están en Borradores de vuestro correo.'
       : coCarp(CO.carpeta)?.que || 'Todos los correos, en su carpeta.' };
}
function coListaCab(){
  const { lista, titulo, sistema, pie } = coListaDatos();
  // Varios seleccionados: acciones para todos a la vez.
  const varios = coVariosSel();
  if (varios.length > 1) return `<div class="co-lcab co-bulk" role="toolbar" aria-label="Acciones con los seleccionados">
    <b>${varios.length} seleccionados</b>
    <button class="co-ibtn" data-co="selarchivar" title="Archivar (E)" aria-label="Archivar los seleccionados">${CO_ICO_ARCH}</button>
    <button class="co-ibtn" data-co="selpapelera" title="Eliminar (Supr)" aria-label="Eliminar los seleccionados">${CO_ICO_PAP}</button>
    <select class="co-sel" data-co="selmover" aria-label="Mover los seleccionados a">
      <option value="">Mover a…</option>${CO.carpetas.map(k => `<option value="${esc(k.id)}">${esc(k.nombre)}</option>`).join('')}</select>
    <button class="co-ibtn co-selx" data-co="selquitar" title="Quitar selección (Esc)" aria-label="Quitar selección">×</button></div>`;
  return `<div class="co-lcab" title="${esc(pie)}"><h3>${esc(titulo)}</h3><span class="co-para">${lista.length}</span>
    ${coBuscando() ? '<button class="co-editar co-blimpiar" data-co="blimpiar">Quitar búsqueda</button>' : ''}
    ${sistema ? `<button class="cbtn peligro co-vaciar" data-co="vaciar" data-id="${sistema.id}" ${lista.length ? '' : 'disabled'}>Vaciar ${sistema.nombre}</button>` : ''}</div>`;
}
function coListaFilas(){
  const { lista } = coListaDatos();
  return lista.length ? lista.map(coFila).join('')
    : `<div class="vacio">${coBuscando() ? 'Nada coincide con la búsqueda.' : 'No hay correos aquí.'}</div>`;
}
function coPintarListaQuieta(){
  const ls = $('#cocuerpo .co-lscroll'), y = ls?.scrollTop;
  coPintarLista();
  if (ls) $('#cocuerpo .co-lscroll').scrollTop = y;
}
// Repinta solo la cabecera y las filas: el buscador no pierde el foco.
function coPintarLista(){
  const cab = $('#cocuerpo .co-lcab'), filas = $('#cocuerpo .co-lscroll'); if (!cab || !filas) return;
  const t = document.createElement('div'); t.innerHTML = coListaCab(); cab.replaceWith(t.firstElementChild);
  filas.innerHTML = coListaFilas();
  document.querySelectorAll('[data-co="bfiltro"]').forEach(b => {
    const on = CO.busca.f.has(b.dataset.v); b.classList.toggle('on', on); b.classList.toggle('az', on); b.setAttribute('aria-pressed', on);
  });
}

/* Logo de la empresa que escribe: por su dominio. Nunca en correos sospechosos
   (un logo daría confianza a un engaño) ni en correos personales (Gmail, Outlook…).
   En la maqueta se pide a DuckDuckGo y solo para dominios conocidos; en la versión
   real lo busca el servidor una vez por dominio (BIMI o el icono de su web) y lo guarda. */
const CO_LOGOS = ['idealista.com', 'iberdrola.es', 'cal.com', 'agenciatributaria.gob.es'];
function coLogo(c, clase = ''){
  const dom = String(c.email || '').split('@')[1]?.toLowerCase() || '';
  const base = CO_LOGOS.find(d => dom === d || dom.endsWith('.' + d));
  const ini = esc(String(c.de || '?').trim().charAt(0).toUpperCase());
  if (coSeguridad(c).nivel !== 'ok') return `<span class="co-av co-logo co-logomal ${clase}" aria-hidden="true">!</span>`;
  return `<span class="co-av co-logo ${clase}" aria-hidden="true">${base
    ? `<img src="https://icons.duckduckgo.com/ip3/${base}.ico" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}<span>${ini}</span></span>`;
}

function coFila(c){
  const carp = coCarp(c.carpeta), seg = coSeguridad(c), pres = coPresencia(c);
  const eti = [];
  if (c.esSeguimiento && c.estado === 'borrador') eti.push('<span class="pill am">Seguimiento</span>');
  else if (c.estado === 'borrador') eti.push('<span class="pill am">Por revisar</span>');
  if (c.estado === 'enviando') eti.push('<span class="pill az">Enviando…</span>');
  if (c.estado === 'enviado') eti.push('<span class="pill vd">Respondido</span>');
  if (c.estado === 'descartado') eti.push('<span class="pill hist">Sin responder</span>');
  if (c.alerta) eti.push('<span class="pill rj">Falta un dato</span>');
  if (seg.nivel !== 'ok') eti.push('<span class="pill co-peligro">Peligroso</span>');
  if (CO.carpeta === '_todo' || coBuscando()) eti.push(`<span class="pill nt">${esc(carp?.nombre || 'Bandeja de entrada')}</span>`);
  if (coOtroIdioma(c)) eti.push(`<span class="pill nt">${esc(String(c.idioma).toUpperCase())}</span>`);
  const sel = CO.seleccion.size > 1 && CO.seleccion.has(c.id);
  // Al pasar el puntero: archivar y eliminar (o restaurar), con símbolo.
  const acc = coFuera(c)
    ? `<button class="co-ibtn" data-co="restaurar" data-id="${c.id}" title="Restaurar" aria-label="Restaurar">${CO_ICO_REST}</button>`
    : `<button class="co-ibtn" data-co="archivar" data-id="${c.id}" title="Archivar" aria-label="Archivar">${CO_ICO_ARCH}</button>
       <button class="co-ibtn" data-co="papelera" data-id="${c.id}" title="Eliminar" aria-label="Eliminar">${CO_ICO_PAP}</button>`;
  // Deslizar (pantallas táctiles): el fondo dice qué pasará al soltar.
  return `<div class="co-swipe">
    <div class="co-swfondo" aria-hidden="true"><span class="izq">${esc(coDeslizarNom(CO.deslizar.der))}</span><span class="der">${esc(coDeslizarNom(CO.deslizar.izq))}</span></div>
    <div class="co-fila ${c.nuevo?'nuevo':''} ${c.id===CO.abierto && coLector()?'on':''} ${sel?'sel':''}" tabindex="0" role="option" aria-selected="${sel}"
      data-co="abrir" data-id="${c.id}" draggable="true" data-drag="${c.id}">
      ${coLogo(c)}
      <div class="co-fcuerpo">
        <div class="co-l1"><span class="co-de">${coMarca(c.de)}</span>
          ${pres ? coAvatar(pres, 'co-avmini ' + pres.que, `${pres.nombre} ${pres.que === 'respondiendo' ? 'está respondiendo' : 'lo está viendo'}`) : ''}
          <span class="co-hora">${esc(coHora(c))}</span><span class="co-filacc">${acc}</span></div>
        <div class="co-l2"><span class="co-asunto">${coMarca(c.asunto)}</span>${eti.length ? `<span class="co-etis">${eti.join('')}</span>` : ''}</div>
      </div>
    </div></div>`;
}

/* Abre un correo: a la derecha en el ordenador, en la ventana en
   pantallas más pequeñas. */
function coAbrir(id){
  const c = CO.correos.find(x => x.id === id); if (!c) return;
  c.nuevo = false; CO.abierto = id;
  if (coLector()) return pintarCorreo();
  $('#mbox').innerHTML = coDetalle(c, true);
  $('#mbox').classList.toggle('co-mboxancho', !!$('#mbox .co-lado'));
  $('#modal').style.display = 'block';
  $('#modal').scrollTo?.(0, 0);
  coAjustarAltos();
  pintarCorreo();
}

function coDetalle(c, enVentana){
  const carp = coCarp(c.carpeta);
  const opciones = [...CO.carpetas, ...CO_SISTEMA].map(k => `<option value="${esc(k.id)}" ${k.id===c.carpeta?'selected':''}>${esc(k.nombre)}</option>`).join('');
  const conResp = c.respuesta != null;
  const editable = c.estado === 'borrador';
  const libres = CO.docs.filter(d => !(c.adjuntos || []).includes(d.id));
  const buzon = coBuzon(c);
  const lado = conResp && CO.vista === 'lado' && coLadoCabe(enVentana);
  const seg = coSeguridad(c), pres = coPresencia(c);
  // Si un compañero está escribiendo la respuesta, el borrador se bloquea (salvo «Editar igualmente»).
  const bloqueado = editable && pres?.que === 'respondiendo' && !c.tomado;
  // Enlaces engañosos: se enseña adónde llevan de verdad y no se pueden pulsar.
  let cuerpo = coParrafos(c.cuerpo);
  for (const l of seg.enlaces || []) cuerpo = cuerpo.split(esc(l.texto)).join(
    `<span class="co-enlmal" title="Enlace bloqueado">${esc(l.texto)} <small>⚠ lleva a ${esc(l.destino)}</small></span>`);

  return `
    <div class="co-det ${lado ? 'co-lado' : ''}">
      <div class="co-dcab">
        <div class="co-dtit">
          <h3>${esc(c.asunto)}</h3>
          <div class="co-dacc">
            ${coFuera(c)
              ? `<button class="cbtn sec" data-co="restaurar" data-id="${c.id}">Restaurar</button>`
              : `<button class="co-ibtn" data-co="archivar" data-id="${c.id}" title="Archivar" aria-label="Archivar">${CO_ICO_ARCH}</button>
                 <button class="co-ibtn" data-co="papelera" data-id="${c.id}" title="Eliminar (a la Papelera)" aria-label="Eliminar">${CO_ICO_PAP}</button>`}
          </div>
          ${conResp ? `<div class="co-vistas" role="group" aria-label="Cómo ver el correo y la respuesta">
            <button class="co-vbtn ${lado ? '' : 'on'}" data-co="vista" data-v="arriba" aria-pressed="${!lado}" title="Correo arriba y respuesta debajo">${CO_ICO_ARRIBA}</button>
            <button class="co-vbtn ${lado ? 'on' : ''}" data-co="vista" data-v="lado" aria-pressed="${lado}" title="Correo a la izquierda y respuesta a la derecha">${CO_ICO_LADO}</button>
          </div>` : ''}
          ${enVentana ? '<button class="cerrar" data-co="cerrar" aria-label="Cerrar">×</button>' : ''}
        </div>
        <div class="co-dde">
          ${coLogo(c)}
          <div><b>${esc(c.de)}</b> <span class="co-para">&lt;${esc(c.email)}&gt;</span><br>
            <span class="co-para">Para ${esc(buzon)} · ${esc(coHoraLarga(c))}</span>
            ${c.responderA ? `<br><span class="co-para">La respuesta irá a <b>${esc(c.responderA)}</b></span>` : ''}</div>
        </div>
        <div class="co-clasif">
          <div><b>${esc(carp?.nombre || 'Bandeja de entrada')}</b> · seguro al ${c.seguro} % · <span class="por">${esc(c.motivo)}</span></div>
        </div>
        ${seg.nivel === 'ok' ? ''
          : `<div class="co-seg mal" role="alert"><div class="co-segtit"><span class="co-segico">!</span> <b>Cuidado:</b> ${esc(seg.resumen)}</div>
              ${coSegLista(seg)}
              <div class="co-segacc"><button class="cbtn peligro" data-co="bloquear" data-id="${c.id}">Bloquear remitente</button>
                <button class="cbtn sec" data-co="papelera" data-id="${c.id}">A la Papelera</button>
                <button class="co-editar" data-co="esseguro" data-id="${c.id}">Es de confianza</button></div></div>`}
        ${pres ? `<div class="co-pres ${pres.que}">${coAvatar(pres, 'co-avmini ' + pres.que)}
          ${pres.que === 'respondiendo'
            ? `<span><b>${esc(pres.nombre)}</b> está escribiendo la respuesta ahora mismo.${bloqueado ? ' Para no pisaros, el borrador está bloqueado.' : ''}</span>
               ${bloqueado ? `<button class="cbtn sec" data-co="tomar" data-id="${c.id}">Editar igualmente</button>` : ''}`
            : `<span><b>${esc(pres.nombre)}</b> también está viendo este correo.</span>`}</div>` : ''}
      </div>

      <div class="co-par">
        <section class="co-msg" aria-label="${c.esSeguimiento ? 'Vuestro último correo' : 'Correo recibido'}">
          ${c.esSeguimiento ? '<div class="co-msgt">Vuestro último correo · sin respuesta</div>' : ''}
          ${coOtroIdioma(c) ? `<div class="co-idioma">
            ${c.verTraduccion
              ? `Traducido del ${esc(CO_IDIOMAS[c.idioma] || c.idioma)} <button class="co-editar" data-co="traducir" data-id="${c.id}">Ver el original</button>`
              : `Escrito en ${esc(CO_IDIOMAS[c.idioma] || c.idioma)} <button class="cbtn sec" data-co="traducir" data-id="${c.id}">Traducir al ${esc(CO_IDIOMAS[coMiIdioma()])}</button>`}
          </div>` : ''}
          <div class="co-orig">${c.verTraduccion && c.traduccion ? coParrafos(c.traduccion) : cuerpo}</div>
          ${coListaAdj(c.recibidos || [], c.id, 'rec', false)}
        </section>
        ${conResp ? `
        <section class="co-msg co-msgresp" aria-label="${c.estado==='enviado' ? 'Respuesta enviada' : 'Respuesta propuesta'}">
          <div class="co-msgt">${c.estado==='enviado' ? (c.esSeguimiento ? 'Seguimiento enviado' : 'Respuesta enviada') : (c.esSeguimiento ? 'Seguimiento propuesto' : 'Respuesta propuesta')}
            ${c.estado==='enviado' ? `<span class="co-msgq">${esc(c.enviadoPor)}</span>` : ''}</div>
          ${c.alerta && editable ? `<div class="co-alerta">${esc(c.alerta)}</div>` : ''}
          ${editable && coOtroIdioma(c) && c.respuestaEs != null ? `<div class="co-escribir rangos" role="group" aria-label="En qué idioma escribes">
            <button class="rg ${coEscribeEnMio(c) ? 'on' : ''}" data-co="escribiren" data-id="${c.id}" data-v="mio">Escribo en ${esc(CO_IDIOMAS[coMiIdioma()])}</button>
            <button class="rg ${coEscribeEnMio(c) ? '' : 'on'}" data-co="escribiren" data-id="${c.id}" data-v="suyo">En ${esc(CO_IDIOMAS[c.idioma])}</button></div>` : ''}
          <textarea class="co-txt" id="cotxt" data-id="${c.id}" ${editable && !bloqueado ? '' : 'readonly'} aria-label="Texto de la respuesta">${esc(editable ? coTextoDe(c) : c.respuesta)}</textarea>
          ${editable && !bloqueado ? coReescUI(c, 'correo') : ''}
          ${editable && coEscribeEnMio(c) ? `<div class="co-trad">
            <div class="co-tradcab"><b>Se enviará en ${esc(CO_IDIOMAS[c.idioma])}</b>
              ${c.trDesfasada ? `<button class="cbtn" data-co="retraducir" data-id="${c.id}">Actualizar traducción</button>` : '<span class="co-para">Al día</span>'}</div>
            <div class="co-orig ${c.trDesfasada ? 'co-desfasada' : ''}">${coParrafos(c.respuesta)}</div></div>` : ''}
          <div class="co-firmaprev" title="Firma de la empresa (se añade sola)">${coFirmaHTML(buzon)}</div>
          ${coListaAdj(coAdjResp(c), c.id, 'resp', editable)}
          ${editable && libres.length ? `<select class="co-sel co-addadj" data-co="addadj" data-id="${c.id}" aria-label="Adjuntar documento">
            <option value="">+ Adjuntar documento…</option>
            ${libres.map(d => `<option value="${d.id}">${esc(d.nombre)}</option>`).join('')}</select>` : ''}
          ${(c.fuentes || []).length ? `<details class="co-por"><summary>De dónde sale</summary><ul>${c.fuentes.map(f => `<li>${esc(f)}</li>`).join('')}</ul></details>` : ''}
        </section>` : ''}
      </div>

      <div class="co-acc">
        ${editable ? `
          ${coModoDe(c) === 'prueba'
            ? '<button class="btn corto" disabled title="En modo Prueba no se envía nada">Enviar respuesta</button>'
            : `<button class="btn corto" data-co="enviar" data-id="${c.id}" ${bloqueado ? 'disabled title="Lo está respondiendo un compañero"' : ''}>Enviar respuesta</button>`}
          <button class="cbtn" data-co="guardar" data-id="${c.id}" ${bloqueado ? 'disabled' : ''}>Guardar cambios</button>
          <button class="cbtn peligro" data-co="descartar" data-id="${c.id}">No responder</button>` : ''}
        <label class="co-para" style="margin:0 0 0 auto">¿Carpeta equivocada?
          <select class="co-sel" data-co="mover" data-id="${c.id}" aria-label="Mover a otra carpeta">${opciones}</select></label>
      </div>
    </div>`;
}

function coSegLista(seg){
  return `<ul class="co-seglista">${seg.checks.map(([e, t]) =>
    `<li class="${e}"><span aria-hidden="true">${e === 'ok' ? '✓' : e === 'mal' ? '✕' : 'i'}</span>${esc(t)}</li>`).join('')}</ul>`;
}

  const cuenta = id => CO.correos.filter(c => c.carpeta === id).length;
  return `
    <div class="panel">
      <div class="cabpanel"><div><h3>Vuestras carpetas</h3>
        <p class="ph">El asistente elige la carpeta leyendo «Qué va aquí».</p></div>
        <button class="btn corto" data-co="cnueva">Nueva carpeta</button></div>
      ${CO.carpetas.map((c, i) => `
        <div class="co-cfila">
          <div class="co-orden">
            <button data-co="csubir" data-id="${esc(c.id)}" ${i===0?'disabled':''} aria-label="Subir ${esc(c.nombre)}">▲</button>
            <button data-co="cbajar" data-id="${esc(c.id)}" ${i===CO.carpetas.length-1?'disabled':''} aria-label="Bajar ${esc(c.nombre)}">▼</button>
          </div>
          <div>
            <div class="co-cnom">${esc(c.nombre)}
              ${c.responde ? '<span class="pill az">Se responde</span>' : ''}
              ${c.id === 'revisar' ? '<span class="pill am">Dudosos</span>' : ''}</div>
            <div class="co-cque">${esc(c.que)}</div>
            <div class="co-cdat">${cuenta(c.id)} correos hoy
              ${c.remitente ? ` · siempre aquí si el remitente contiene «${esc(c.remitente)}»` : ''}
              ${c.asunto ? ` · siempre aquí si el asunto contiene «${esc(c.asunto)}»` : ''}
              ${(c.siempre || []).length ? `<div class="co-siempre">Siempre aquí: ${c.siempre.map((e, i) =>
                `<span class="co-chipv">${esc(e)}<button type="button" data-co="reglaquitar" data-id="${esc(c.id)}" data-i="${i}" aria-label="Quitar ${esc(e)}">×</button></span>`).join('')}</div>` : ''}</div>
          </div>
          <div class="co-cacc">
            <button class="cbtn" data-co="ceditar" data-id="${esc(c.id)}">Editar</button>
            <button class="cbtn peligro" data-co="cborrar" data-id="${esc(c.id)}" ${c.fija?'disabled title="Esta carpeta hace falta: se puede renombrar, no borrar"':''}>Borrar</button>
          </div>
        </div>`).join('')}
    </div>
    <p class="nota">«Nuevos clientes» y «Revisar» no se pueden borrar. «Archivados» y «Papelera» son fijas y se vacían desde la bandeja.</p>`;
}

function coFormCarpeta(id){
  const c = id ? coCarp(id) : { nombre:'', que:'', remitente:'', asunto:'' };
  $('#mbox').innerHTML = `
    <div class="cab"><h3 class="co-det" style="font-size:21px">${id ? 'Editar carpeta' : 'Nueva carpeta'}</h3>
      <button class="cerrar" data-co="cerrar" aria-label="Cerrar">×</button></div>
    <div class="co-form">
      <div><label for="cfnom">Nombre</label><input id="cfnom" value="${esc(c.nombre)}" placeholder="Por ejemplo: Eventos y salas" maxlength="40"></div>
      <div><label for="cfque">Qué va aquí</label>
        <textarea class="co-txt corto" id="cfque" placeholder="Explícalo como a una persona nueva del equipo: qué correos van aquí y cuáles no.">${esc(c.que)}</textarea>
</div>
      <div class="campos">
        <div><label for="cfrem">Siempre aquí si el remitente contiene <span class="co-para">(opcional)</span></label>
          <input id="cfrem" value="${esc(c.remitente)}" placeholder="@proveedor.com"></div>
        <div><label for="cfasu">Siempre aquí si el asunto contiene <span class="co-para">(opcional)</span></label>
          <input id="cfasu" value="${esc(c.asunto)}" placeholder="factura"></div>
      </div>
      <div class="acc"><button class="btn corto" data-co="cguardar" data-id="${esc(id || '')}">Guardar</button>
        <button class="cbtn" data-co="cerrar">Cancelar</button></div>
    </div>`;
  $('#modal').style.display = 'block';
  setTimeout(() => $('#cfnom')?.focus(), 50);

function coBorrarCarpeta(id){
  const c = coCarp(id); if (!c || c.fija) return;
  const n = CO.correos.filter(x => x.carpeta === id).length;
  $('#mbox').innerHTML = `
    <div class="cab"><h3 class="co-det" style="font-size:21px">Borrar «${esc(c.nombre)}»</h3>
      <button class="cerrar" data-co="cerrar" aria-label="Cerrar">×</button></div>
    <p class="sub" style="margin-bottom:16px">No se borra ningún correo. ${n === 1 ? 'El correo que hay en ella pasa a:' : n ? `Los ${n} correos que hay en ella pasan a:` : 'Está vacía.'}</p>
    ${n ? `<select class="co-sel" id="cbdest" aria-label="Carpeta de destino">
      <option value="_bandeja">La bandeja de entrada de vuestro buzón</option>
      ${CO.carpetas.filter(k => k.id !== id).map(k => `<option value="${esc(k.id)}">${esc(k.nombre)}</option>`).join('')}</select>` : ''}
    <div class="acc"><button class="btn corto" style="background:var(--rojo-texto)" data-co="cborrarok" data-id="${esc(id)}">Borrar carpeta</button>
      <button class="cbtn" data-co="cerrar">Cancelar</button></div>`;
  $('#modal').style.display = 'block';
}

function coDocumentos(){
  const desp = CO.fotosDrive.reduce((s, c) => s + c.items.filter(i => i[1] === 'despacho').length, 0);
  const fotos = CO.fotosDrive.reduce((s, c) => s + c.items.reduce((t, i) => t + i[2], 0), 0);

function coLeerAuto(){
  if (!$('#coespmin')) return '';
  const a = CO.auto[CO.autoBuzon], n = id => Number($('#' + id).value);
  const min = n('coespmin'), max = n('coespmax');
  if (!(min >= 0 && max >= min)) return 'El tiempo de espera no cuadra: el segundo número tiene que ser igual o mayor que el primero.';
  Object.assign(a, { esperaMin: min, esperaMax: max, desde: $('#codesde').value, hasta: $('#cohasta').value,
    fuera: $('#cofuera').value, seguro: n('coseg'), tope: Math.max(1, n('cotope') || 1),
    dias: [...document.querySelectorAll('.co-dias input:checked')].map(x => Number(x.dataset.dia)) });
  return '';
}

function coAddDocs(files){
  const nuevos = [...files].filter(f => f.size <= 10 * 1024 * 1024);
  if (nuevos.length < files.length) coAviso('Algún archivo pasa de 10 MB y no se ha subido.');
  nuevos.forEach(f => CO.docs.push({ id: ++CO.sig, nombre: f.name, tipo: coTipo(f.name), kb: Math.max(1, Math.round(f.size/1024)),
    centro:'Todos', auto:false, usos:0, subido:'hoy', cuando:'' }));
  if (nuevos.length){ pintarCorreo(); coAviso(`${nuevos.length} documento${nuevos.length>1?'s':''} subido${nuevos.length>1?'s':''}. Falta decir cuándo usarlo.`);
    coFormDoc(CO.docs[CO.docs.length - 1].id); }
}

function coAccion(el, e){
  const a = el.dataset.co, id = el.dataset.id, nid = Number(id);
  const c = CO.correos.find(x => x.id === nid);
  switch (a){
    case 'tab': CO.tab = el.dataset.v; CO.pop = false; cerrar(); return pintarCorreo();
    case 'carp': CO.carpeta = id; CO.abierto = null; return pintarCorreo();
    case 'pop': CO.pop = !CO.pop; return pintarCorreo();
    case 'todos': CO.sel = new Set(CO.buzones.map(b => b.email)); return pintarCorreo();
    case 'recargar': return coRefrescar(true);
    case 'vista': {
      const t = $('#cotxt'); const abierto = CO.correos.find(x => x.id === CO.abierto);
      if (t && abierto?.estado === 'borrador') abierto.respuesta = t.value;
      CO.vista = el.dataset.v; coGuardarVista();
      return coLector() ? pintarCorreo() : coAbrir(CO.abierto);
    }
    case 'ver': return coVer(nid, el.dataset.g, Number(el.dataset.i));
    case 'bajar': {
      const f = coArchivo(coAdjDe(nid, el.dataset.g)[Number(el.dataset.i)]);
      return coDescargar(f.nombre, new Blob([f.bytes], { type: f.mime }));
    }
    case 'bajartodo': {
      const lista = coAdjDe(nid, el.dataset.g);
      const base = (c?.asunto || 'adjuntos').replace(/[\\/:*?"<>|]+/g, '').slice(0, 60).trim();
      coDescargar(`${base} · adjuntos.zip`, coZip(lista.map(coArchivo)));
      return coAviso(`Descargando ${lista.length} archivos en un .zip.`);
    }
    case 'quitafoto': c.fotos.splice(Number(el.dataset.i), 1); return coAbrir(nid);
    case 'fotosdrive': return coAviso('En la versión real vuelve a mirar vuestra carpeta de Drive.');
    case 'firmamodo': coLeerFirma(); CO.firma.modo = el.dataset.v; return pintarCorreo();
    case 'firmaguardar': coLeerFirma(); pintarCorreo(); return coAviso('Firma guardada. Sale en todas las respuestas, con la línea del agente de IA.');
    case 'autoguardar': {
      const err = coLeerAuto(); if (err) return coAviso(err);
      return coAviso(`Respuestas automáticas de ${CO.autoBuzon} guardadas.`);
    }
    case 'abrir': return coSeleccionar(nid, e) ? coAbrir(nid) : coPintarListaQuieta();
    case 'selarchivar': return coMover(coVariosSel(), 'archivados');
    case 'selpapelera': return coMover(coVariosSel(), 'papelera');
    case 'selquitar': CO.seleccion = new Set(CO.abierto != null ? [CO.abierto] : []); return coPintarListaQuieta();
    case 'cerrar': return cerrar();
    case 'bayuda': CO.bayuda = !CO.bayuda; return pintarCorreo();
    case 'bfiltro': { const f = CO.busca.f; f.has(el.dataset.v) ? f.delete(el.dataset.v) : f.add(el.dataset.v); return coPintarLista(); }
    case 'blimpiar': CO.busca = { q:'', f:new Set() }; return pintarCorreo();
    case 'reglaquitar': { const k = coCarp(id); const e = k.siempre.splice(Number(el.dataset.i), 1)[0];
      pintarCorreo(); return coAviso(`Quitado: ${e} ya no va siempre a «${k.nombre}».`); }
    case 'reesc': case 'reescpedir': {
      const o = coObj(el.dataset.tipo, nid);
      let orden = el.dataset.v;
      if (a === 'reescpedir'){
        const inp = document.querySelector(`[data-pide="${el.dataset.tipo}:${nid}"]`);
        orden = coOrdenDe(inp?.value || '');
        if (!orden) return coAviso('En la maqueta solo entiende «más corto», «más formal», «más cercano» o «añade la visita». En la versión real, cualquier frase.');
      }
      if (!coAplicarVersion(o, coReescribir(coTextoDe(o), orden))) return coAviso('Ese cambio ya estaba hecho.');
      coRepintarDonde(); return coAviso(`Versión ${o.vi + 1}: puedes volver a la anterior con ‹.`);
    }
    case 'vant': case 'vsig': {
      const o = coObj(el.dataset.tipo, nid); coVersiones(o);
      o.vi = Math.max(0, Math.min(o.versiones.length - 1, o.vi + (a === 'vsig' ? 1 : -1)));
      coPonerTexto(o, o.versiones[o.vi]); return coRepintarDonde();
    }
    case 'tomar': { c.tomado = true; const p = coPresencia(c);
      coRepintarDonde(); return coAviso(`Avisado: ${p?.nombre || 'tu compañero'} verá que lo editas tú.`); }
    case 'bloquear': CO.bloqueados = [...(CO.bloqueados || []), c.email]; return coMover([nid], 'papelera', false);
    case 'esseguro': c.confiado = true; coRepintarDonde(); return coAviso(`${c.email} marcado como de confianza.`);
    case 'colno': {
      const otro = CO.respuestaDeOtro[nid], p = coPersona(otro.email); cerrar();
      const antes = { estado: c.estado, respuesta: c.respuesta, enviadoPor: c.enviadoPor };
      return coHacer('No se envía la tuya: ya respondió tu compañero.', () => {
        c.estado = 'enviado'; c.respuesta = otro.texto; c.enviadoPor = `Enviada por ${p.nombre} hace un momento`; },
        () => Object.assign(c, antes));
    }
    case 'colsi': c.colision = true; cerrar(); return coEnviar(c);
    // ---- Embudo › Correo ----
    case 'eabrir': CO.leadAbierto = nid; return pintarEmbudoCorreo();
    case 'eenviar': return coEnviarSeguimiento(coLead(nid));
    case 'eposponer': { const l = coLead(nid), antes = { etapa: l.etapa, proximo: l.proximo };
      return coHacer(`Seguimiento a ${l.nombre} pospuesto 2 días.`, () => { l.etapa = 'espera'; l.proximo = Date.now() + 2 * CO_DIA; },
        () => Object.assign(l, antes)); }
    case 'enoseguir': { const l = coLead(nid), antes = l.etapa;
      return coHacer(`Sin más seguimientos para ${l.nombre}.`, () => { l.etapa = 'cerrado'; l.motivo = 'Cerrado a mano'; }, () => { l.etapa = antes; }); }
    case 'eircorreo': { const l = coLead(nid);
      CO.tab = 'bandeja'; CO.busca = { q:'', f:new Set() };
      if (l?.correoId){ CO.carpeta = '_todo'; CO.abierto = l.correoId; CO.seleccion = new Set([l.correoId]); }
      return irA('correo'); }
    case 'econvs': { const l = coLead(nid); if (!l?.userRef) return;
      return (async () => { await irA('convs'); await abrir(l.userRef); })(); }
    case 'eagenda': return irA('agenda');
    case 'irseg': CO.tab = 'ajustes'; CO.irA = 'co-sec-seguimiento'; return irA('correo');
    case 'traducir': c.verTraduccion = !c.verTraduccion; return coRepintarDonde();
    case 'escribiren': c.escribirEs = el.dataset.v === 'mio'; c.versiones = null; return coRepintarDonde();
    case 'retraducir': if (coRetraducir(c)){ coRepintarDonde(); coAviso('Traducción al día.'); } return;
    case 'enviar': {
      coPonerTexto(c, $('#cotxt').value);
      // Escrito en tu idioma: antes de salir se traduce al del cliente.
      if (coEscribeEnMio(c) && !coRetraducir(c)) return;
      // Varios compañeros: si alguien ha respondido desde que lo abriste, se para y se pregunta.
      if (CO.respuestaDeOtro[nid] && !c.colision) return coColision(c);
      return coEnviar(c);
    }
    case 'guardar': coPonerTexto(c, $('#cotxt').value); return coAviso('Cambios guardados. También se ve en Borradores de vuestro correo.');
    case 'otra': return coAviso('En la versión real, el asistente la vuelve a escribir (aquí es una maqueta).');
    case 'descartar': { const antes = c.estado;
      return coHacer('No se responderá a este correo.', () => { c.estado = 'descartado'; }, () => { c.estado = antes; }); }
    case 'archivar': return coMover([nid], 'archivados');
    case 'papelera': return coMover([nid], 'papelera');
    case 'restaurar': return coMover([nid], c.antes && coCarp(c.antes) ? c.antes : 'revisar', false);
    case 'vaciar': return coVaciarConfirmar(id);
    case 'vaciarok': {
      const lista = coVisibles().filter(x => x.carpeta === id), nom = coCarp(id).nombre;
      cerrar();
      return coHacer(`${nom} vaciada: ${lista.length} ${lista.length === 1 ? 'correo borrado' : 'correos borrados'}.`,
        () => lista.forEach(x => { x.borrado = true; }), () => lista.forEach(x => { x.borrado = false; }));
    }
    case 'ircarpetas': CO.tab = 'ajustes'; CO.irA = 'co-sec-carpetas'; CO.pop = false; return pintarCorreo();
    case 'irsec': return document.getElementById(el.dataset.v)?.scrollIntoView({ block:'start', behavior:'smooth' });
    case 'chipx': coChipsLista(el.dataset.chips).splice(Number(el.dataset.i), 1); return coChipsPintar(el.dataset.chips, false);
    case 'uanadir': return coUsuarioAnadir();
    case 'ufotoquitar': { const u = (CO.usuarios[CO.cliente] || []).find(x => x.email === el.dataset.email);
      if (!u || !coPuedeFoto(u.email)) return; u.foto = ''; pintarCorreo(); return coAviso('Vuelve a salir con sus iniciales.'); }
    case 'uquitar': {
      const lista = CO.usuarios[CO.cliente] || [], u = lista.find(x => x.email === el.dataset.email);
      if (!u) return;
      if (u.rol === 'admin' && lista.filter(x => x.rol === 'admin').length < 2) return coAviso('Tiene que quedar al menos un administrador.');
      CO.usuarios[CO.cliente] = lista.filter(x => x !== u);
      pintarCorreo(); return coAviso(`${u.email} ya no tiene acceso.`);
    }
    case 'quitaradj': c.adjuntos = c.adjuntos.filter(x => x !== Number(el.dataset.doc)); return coAbrir(nid);
    case 'cnueva': return coFormCarpeta(null);
    case 'ceditar': return coFormCarpeta(id);
    case 'cborrar': return coBorrarCarpeta(id);
    case 'cguardar': {
      const nombre = $('#cfnom').value.trim();
      if (!nombre) return coAviso('Ponle un nombre a la carpeta.');
      if (CO.carpetas.some(k => k.nombre.toLowerCase() === nombre.toLowerCase() && k.id !== id)) return coAviso('Ya hay una carpeta con ese nombre.');
      const datos = { nombre, que: $('#cfque').value.trim(), remitente: $('#cfrem').value.trim(), asunto: $('#cfasu').value.trim() };
      if (id) Object.assign(coCarp(id), datos);
      else CO.carpetas.splice(CO.carpetas.length - 1, 0, { id: 'c' + (++CO.sig), ...datos });
      cerrar(); pintarCorreo(); return coAviso(id ? 'Carpeta guardada.' : `Carpeta «${nombre}» creada. Desde ahora el asistente ya la usa.`);
    }
    case 'cborrarok': {
      const dest = $('#cbdest')?.value || '_bandeja';
      CO.correos.forEach(x => { if (x.carpeta === id) x.carpeta = dest === '_bandeja' ? '' : dest; });
      const nom = coCarp(id)?.nombre;
      CO.carpetas = CO.carpetas.filter(k => k.id !== id);
      if (CO.carpeta === id) CO.carpeta = '_revisar';
      cerrar(); pintarCorreo(); return coAviso(`Carpeta «${nom}» borrada.`);
    }
    case 'csubir': case 'cbajar': {
      const i = CO.carpetas.findIndex(k => k.id === id), j = a === 'csubir' ? i - 1 : i + 1;
      if (j < 0 || j >= CO.carpetas.length) return;
      [CO.carpetas[i], CO.carpetas[j]] = [CO.carpetas[j], CO.carpetas[i]];
      return pintarCorreo();
    }
    case 'deditar': return coFormDoc(nid);
    case 'dguardar': {
      const d = coDoc(nid);
      Object.assign(d, { nombre: $('#dfnom').value.trim() || d.nombre, cuando: $('#dfcuando').value.trim(),
        centro: $('#dfcentro').value, auto: $('#dfauto').checked });
      cerrar(); pintarCorreo(); return coAviso('Documento guardado.');
    }
    case 'dborrar': {
      const d = coDoc(nid); CO.docs = CO.docs.filter(x => x.id !== nid);
      CO.correos.forEach(x => { if (x.adjuntos) x.adjuntos = x.adjuntos.filter(k => k !== nid); });
      pintarCorreo(); return coAviso(`«${d.nombre}» borrado.`);
    }
    case 'conectar': CO.pop = false; pintarCorreo(); return coFormConectar();
    case 'conectarok': cerrar(); return coAviso('En la versión real: prueba la conexión y, si va bien, el buzón empieza en modo Prueba.');
    case 'probar': return coAviso('Conexión correcta: lectura (IMAP) y envío (SMTP).');
    case 'desconectar': return coAviso('En la versión real pide confirmación y deja de leer el buzón al momento.');
  }
}

// Enviar: como Gmail, sale a los 10 s; hasta entonces «Deshacer» lo para.
function coEnviar(c){
  const quien = coPersona(USUARIO_EMAIL).nombre || USUARIO_EMAIL || 'el panel', para = c.responderA || c.email;
  const paso = coHacer(`Enviando a ${para} en 10 s.`, () => { c.estado = 'enviando'; },
    () => { clearTimeout(paso.t); c.estado = 'borrador'; },
    { deshecho: 'Envío cancelado: la respuesta sigue en «Por revisar».' });
  paso.t = setTimeout(() => {
    c.estado = 'enviado'; c.enviadoPor = `Enviada desde el panel por ${quien}`;
    delete CO.presencia[c.id];
    // Si es de un lead del Embudo, el lead avanza solo.
    const l = c.leadId && coLead(c.leadId);
    if (l){
      if (c.esSeguimiento){ l.seg++; l.eventos.push([0, `Seguimiento ${l.seg} enviado`]); }
      else l.eventos.push([0, 'Le respondimos']);
      l.etapa = 'espera'; l.proximo = Date.now() + CO.seguimiento.dias * CO_DIA;
    }
    CO.historial = CO.historial.filter(p => p !== paso);
    coBadge(); coRepintarDonde(); coAviso(`Respuesta enviada a ${para}.`);
  }, 10000);
}
// Choque: otro compañero ha respondido a este correo mientras tanto.
function coColision(c){
  const otro = CO.respuestaDeOtro[c.id], p = coPersona(otro.email);

}
const coObj = (tipo, id) => tipo === 'lead' ? coLead(id) : CO.correos.find(x => x.id === id);
function coRepintarDonde(){
  if (VISTA === 'embudo') return pintarEmbudoCorreo();

/* ===================== Embudo › Correo (seguimiento) ===================== */
function embudoCabecera(){
  if (!correoPermitido()) return '<h2 class="tit">Embudo</h2>';

    <div class="rangos emb-canal" role="tablist" aria-label="Canal">

      <button class="rg ${CO.embudoCanal === 'correo' ? 'on' : ''}" data-embcanal="correo" role="tab" aria-selected="${CO.embudoCanal === 'correo'}">Correo${n ? ` <span class="navn">${n}</span>` : ''}</button>
    </div></div>`;
}
const embCuando = d => d === 0 ? 'Hoy' : d === -1 ? 'Ayer' : `Hace ${-d} días`;
function embFila(l){
  const ultimo = l.eventos[l.eventos.length - 1]?.[1] || '';
  const linea = l.etapa === 'toca' ? `Seguimiento ${l.seg + 1}${l.seg + 1 >= CO.seguimiento.max ? ' (el último)' : ''} preparado`
    : l.etapa === 'enviando' ? 'Enviando el seguimiento…'
    : l.etapa === 'espera' ? (l.seg >= CO.seguimiento.max ? 'Último seguimiento enviado' : `Próximo seguimiento: ${coFecha(l.proximo)}`)
    : l.etapa === 'cerrado' ? (l.motivo || ultimo) : ultimo;
