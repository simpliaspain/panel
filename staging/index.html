    if (window.innerWidth > 1000 && !$('#pdetalle')){ ABIERTO = ref; return; }
    const b = $('#buscar');
    if (b){ b.value = String(e.telefono || ref || '').split('@')[0]; filtrar(b.value); }

    if (caja === '#mbox') cerrar();
    LFILTRO = ['ganado','perdido'].includes(lead.etapa) ? 'cerrados' : 'activos';
    LEXP = {};
    const lb = $('#lbusca'); if (lb) lb.value = '';
    ponerFiltrosEmbudo();

    // La fila, a la vista en la lista (puede estar más abajo).

/* ---------- ficha ---------- */
function abrirLead(id){
  const l = LEADS.find(x => x.id === id); if (!l) return;
  LABIERTO = id; EABIERTO = null;
  // Si la lista está en «En espera» (se llega con «Abrir en Embudo» o
  // «Ver en el embudo»), pasa a la de este lead, para que su fila se vea.
  if (LFILTRO === 'espera' && $('#lista-leads')){
    LFILTRO = ['ganado','perdido'].includes(l.etapa) ? 'cerrados' : 'activos';
    LEXP = {};
    ponerFiltrosEmbudo();
    pintarLista($('#lbusca')?.value.trim());
  }
  const v = (x) => x == null ? '' : esc(String(x));

  const tel = (l.telefono || l.user_ref || '').replace(/[^0-9+]/g, '');
  const marcar = telefonoE164(l.telefono || l.user_ref);

  // En pantalla ancha la ficha va en la columna de la derecha; en
  // móvil, donde no cabe, se abre encima.
  const ancho = window.innerWidth > 1000;   // el mismo umbral que el CSS
  const caja = ancho && VISTA === 'embudo' && $('#pficha') ? '#pficha' : '#mbox';
  if (caja === '#mbox'){
    $('#modal').style.display = 'block';
    TURNO_DET++;   // la ventana es de la ficha: ninguna conversación tardía la pisa
  }
  else $('#pficha').className = 'panel';
  // La ventana pasa a enseñar una ficha, no una conversación: que el
  // refresco de Conversaciones no la confunda con una.
  delete $(caja).dataset.c;

  $(caja).innerHTML = `
   <div class="lficha">
    <div class="fcab">
      <div style="display:flex;justify-content:space-between;gap:16px">
        <h2>${nom(l.nombre, l.telefono || l.user_ref)}</h2>
        ${caja === '#mbox'
          ? '<button class="cerrar" id="fx" aria-label="Cerrar">×</button>' : ''}
      </div>
      ${l.nombre ? `<p class="dmeta">${marcar
          ? `<a href="tel:${esc(marcar)}" class="mono">${esc(marcar)}</a>`
          : `<span class="mono">${esc(tel)}</span>`}</p>` : ''}
      ${l.email ? `<p class="dmeta"><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></p>` : ''}
      ${[l.servicio, l.ubicacion].filter(Boolean).length
        ? `<p class="dmeta">${esc([l.servicio, l.ubicacion].filter(Boolean).join(', '))}</p>` : ''}

      ${l.ultimo_texto ? `
      <figure class="frecuento">
        <figcaption>Último mensaje${l.ultimo_cuando
          ? ', ' + desdeEntonces(l.ultimo_cuando).txt : ''}</figcaption>
        <blockquote>${esc(l.ultimo_texto)}</blockquote>
      </figure>` : ''}

      ${marcar || lmailOk ? `<div class="fllamar">
        ${marcar ? `<a class="pri" href="tel:${esc(marcar)}">Llamar</a>
        <a class="secu" href="https://wa.me/${esc(marcar.slice(1))}"
           target="_blank" rel="noopener noreferrer">WhatsApp</a>` : ''}
        ${lmailOk ? `<a class="${marcar ? 'secu' : 'pri'}" href="mailto:${esc(String(l.email).trim())}">Correo</a>` : ''}
      </div>` : ''}
    </div>

    <div class="faviso" id="faviso" role="status" aria-live="polite"></div>

    <div class="fsec">
      <label class="h" for="t_detalle">Apuntar contacto</label>
      <div class="fpreg">
        <input id="t_detalle" placeholder="Llamada, email, WhatsApp…">
      </div>
      <div class="ftoque">
        <div class="fpreg">
          <label for="t_fecha">Próxima vez</label>
          <input id="t_fecha" type="date" value="${
            // Solo si aún no ha pasado: con la vencida rellenada, apuntar
            // un contacto la volvía a guardar y el lead seguía vencido.
            l.proxima_fecha && String(l.proxima_fecha).slice(0, 10) >= hoyMadrid()

    <div class="fsec">
      <label class="h" for="fetapa">Etapa</label>
      <div class="fpreg">
        <select id="fetapa">
          ${ETAPAS.map(([k,t]) =>
            `<option value="${k}"${l.etapa===k?' selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="fcaja" id="fcajaperdido">
        <h4>Motivo</h4>
        <div class="fpreg">
          <input id="p_motivo" placeholder="Precio, plazo, otro centro…">
        </div>
        <div class="fila">
          <button class="btn" id="p_ok">Marcar como perdido</button>

    </div>

    <div class="fsec">
      <div class="fsec-cab">
        <h3>Datos</h3>
        <span>${Number(l.cualificado_de) || 0} de 5 respondidas</span>
      </div>
      <div class="fdatos">
        <div class="fpreg"><label for="f_personas">Cuántos son</label>
          <input id="f_personas" type="number" min="1" value="${v(l.personas)}"></div>
        <div class="fpreg"><label for="f_cuando">Para cuándo</label>
          <input id="f_cuando" value="${v(l.cuando_necesita)}"></div>
        <div class="fpreg"><label for="f_perma">Cuánto tiempo</label>
          <input id="f_perma" value="${v(l.permanencia)}"></div>
        <div class="fpreg"><label for="f_situacion">Qué tienen ahora</label>
          <input id="f_situacion" value="${v(l.situacion_actual)}"></div>
        <div class="fpreg"><label for="f_decide">Quién decide</label>
          <input id="f_decide" value="${v(l.quien_decide)}"></div>

                 value="${v(l.valor_mes)}"></div>
        <div class="fpreg"><label for="f_canal">Canal</label>
          <select id="f_canal">
            ${[['desconocido','Sin saber'],['whatsapp_directo','WhatsApp directo'],
               ['portal','Portal'],['web','Web propia'],['google','Google'],
               ['referido','Referido'],['walkin','Entró por la puerta'],
               ['broker','Broker'],['evento','Evento'],['otro','Otro']]
              .map(([k,t]) => `<option value="${k}"${l.canal===k?' selected':''}>${t}</option>`).join('')}
          </select></div>
        <div class="fpreg arriba"><label for="f_notas">Notas</label>
          <textarea id="f_notas">${v(l.notas)}</textarea></div>
      </div>
    </div>

    <div class="fsec">
      <div class="fsec-cab">
        <h3>Historial</h3>
        <button id="fver">Ver conversación</button>
      </div>
      <div class="hist" id="fhist"><div class="ph">Cargando…</div></div>
    </div>

    <div class="fguardar" id="fguardar">
      <button class="btn" id="fguarda">Guardar</button>
      <button class="cbtn sec" id="fdescarta">Descartar</button>
    </div>
   </div>`;

  // La fila que se está leyendo, marcada en la lista.
  document.querySelectorAll('.lfila[data-lead]').forEach(el =>
    el.classList.toggle('on', Number(el.dataset.lead) === id));
  enlazarFicha(l, caja);
  // Quien no puede escribir (lector, u operador en modo lectura) ve la
  // ficha entera, pero no los controles: todos le fallaban al pulsarlos.
  if (!(TENANT && TENANT.puede_escribir)){
    const box = $(caja);
    box.querySelectorAll('input, select, textarea').forEach(e => { e.disabled = true; });
    $('#t_detalle')?.closest('.fsec')?.remove();
    $('#fcajaperdido')?.remove();
    $('#fguardar')?.remove();
    const av = $('#faviso');
    if (av){ av.textContent = 'Solo lectura: con esta cuenta se puede consultar, no cambiar.';
             av.className = 'faviso info'; }
  }
  pintarHistorial(l.id);
  seguirColumnas();
}


/* ---------- historial del lead ---------- */
const ICONO_EV = { toque:'Contacto', etapa:'Cambio de etapa', nota:'Nota', alta:'Alta' };

async function pintarHistorial(leadId){
  const cont = $('#fhist'); if (!cont) return;
  const { data, error } = await supabase.rpc('mt_historial_lead', { p_id: leadId });
  // Si mientras llegaba se ha abierto otro lead, este historial no es
  // suyo: se pintaba en su ficha y un toque en «Deshacer» deshacía dos
  // veces, o lo de otra persona.
  if (LABIERTO !== leadId || !cont.isConnected) return;
  if (error){ cont.innerHTML = '<div class="ph">No se ha podido cargar.</div>'; return; }
  const puedo = !!(TENANT && TENANT.puede_escribir);
  const ev = data || [];

  cont.innerHTML = ev.length ? ev.map(e => `
    <div class="hev">
      <div class="hcuerpo">
        <div>${e.tipo === 'etapa'
          ? `De <b>${esc(NOMBRE_ETAPA[e.desde] || e.desde || '—')}</b> a
             <b>${esc(NOMBRE_ETAPA[e.hasta] || e.hasta)}</b>`
          : esc(e.detalle || ICONO_EV[e.tipo] || e.tipo)}</div>
        <div class="hcuando">${fechaHoraCorta(e.cuando)}</div>
      </div>
      <div class="hacc">
        ${e.tipo === 'toque' && puedo ? `
          <button data-edev="${e.id}">Corregir</button>
          <button class="mal" data-delev="${e.id}">Deshacer</button>` : ''}
      </div>
    </div>`).join('')
    : '<div class="ph">Sin movimientos por ahora.</div>';

  enlazarHistorial(leadId, cont);
}

function enlazarHistorial(leadId, cont){
  if (!cont) return;

  cont.querySelectorAll('button[data-delev]').forEach(b =>
    b.addEventListener('click', async () => {
      b.disabled = true;
      const { error } = await supabase.rpc('mt_deshacer_evento',
        { p_evento: Number(b.dataset.delev) });
      if (error){ b.disabled = false; return; }
      await pintarHistorial(leadId);
      // Aquí había un resto de la ficha antigua que reescribía la última
      // línea de #mbox con «N mensajes, M contactos». En pantalla ancha
      // la ficha no está en #mbox: escribía en la ventana del móvil, que
      // puede tener abierta una conversación. La ficha de ahora no
      // enseña ese recuento, así que basta con poner la lista al día.
      await refrescarEmbudo();
    }));

  // Corregir sustituye el texto por un campo, en el sitio. Abrir otro
  // formulario para cambiar una línea sería desproporcionado.
  cont.querySelectorAll('button[data-edev]').forEach(b =>
    b.addEventListener('click', () => {
      const fila = b.closest('.hev');
      const cuerpo = fila.querySelector('.hcuerpo > div');
      const antes = cuerpo.textContent.trim();
      cuerpo.innerHTML = `<input class="sel" style="width:100%;font-size:13px"
        value="${esc(antes)}">`;
      const inp = cuerpo.querySelector('input');
      inp.focus(); inp.select();
      const guardar = async () => {
        const v = inp.value.trim();
        if (!v || v === antes){ cuerpo.textContent = antes; return; }
        await supabase.rpc('mt_editar_evento',
          { p_evento: Number(b.dataset.edev), p_detalle: v });
        await pintarHistorial(leadId);
      };
      inp.addEventListener('blur', guardar);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape'){ inp.value = antes; inp.blur(); }
      });
    }));
}

const fechaHoraCorta = d => new Date(d).toLocaleString('es-ES',
  { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });

// `caja` es donde está la ficha: la columna de la derecha (#pficha)
// en pantalla ancha, o la ventana (#mbox) en el móvil. Antes todo se
// enganchaba a #mbox, y en pantalla ancha los Datos no avisaban de
// cambios: el botón «Guardar» no aparecía nunca y lo escrito se perdía
// al pasar a otro lead.
function enlazarFicha(l, caja = '#mbox'){
  const box = $(caja);
  const leer = () => ({
    personas:         $('#f_personas').value.trim() || null,
    cuando_necesita:  $('#f_cuando').value.trim()   || null,
    permanencia:      $('#f_perma').value.trim()    || null,
    situacion_actual: $('#f_situacion').value.trim()|| null,
    quien_decide:     $('#f_decide').value.trim()   || null,
    canal:            $('#f_canal').value,
    valor_mes:        $('#f_valor').value.trim()    || null,
    notas:            $('#f_notas').value.trim()    || null
  });

  const aviso = (txt, ok) => {
    const e = $('#faviso');
    e.textContent = txt;
    e.className = 'faviso ' + (ok ? 'ok' : 'mal');
    // Se sube al aviso en lo que se desplaza: la columna en pantalla
    // ancha, la ventana entera en el móvil.
    (caja === '#mbox' ? $('#modal') : box)?.scrollTo?.({ top: 0, behavior: 'smooth' });
    if (ok) setTimeout(() => { e.className = 'faviso'; }, 3500);
  };

  const fallo = (error) => aviso('No se ha podido guardar. ' + mensajeError(error), false);

  // La barra de guardar solo aparece cuando hay algo que guardar.
  // Un botón siempre visible que casi nunca hace falta enseña a
  // ignorarlo, y entonces no se ve el día que sí importa.
  const inicial = JSON.stringify(leer());
  const mirar = () => {
    const barra = $('#fguardar'); if (!barra) return;
    const antes = barra.classList.contains('on');
    barra.classList.toggle('on', JSON.stringify(leer()) !== inicial);
    // En el portátil la barra quedaba por debajo del borde de la
    // pantalla: se editaba un dato y no se veía dónde guardarlo.
    if (!antes && barra.classList.contains('on')){
      const ae = document.activeElement;
      (ae && box.contains(ae) ? ae : barra).scrollIntoView?.({ block: 'nearest' });
    }
  };
  // ¿Sigue abierta ESTA ficha? Después de esperar al servidor puede
  // haberse abierto otro lead: lo que llegue no se pinta en el suyo.
  const viva = () => LABIERTO === l.id && sel.isConnected;
  // Si mientras tanto se ha vuelto a abrir esta misma ficha (otra vez su
  // fila, o cerrar y abrir la ventana), se pinta con lo que ha cambiado.
  const reabrirSiEs = id => { if (LABIERTO === id && LEADS.some(x => x.id === id)) abrirLead(id); };
  box.querySelectorAll('.fdatos input, .fdatos select, .fdatos textarea')
    .forEach(i => { i.addEventListener('input', mirar); i.addEventListener('change', mirar); });

  // Lo que hay escrito en la ficha ahora mismo, para no perderlo
  // cuando hay que volver a pintarla (al cambiar de etapa).
  const foto = () => {
    const v = {};
    box.querySelectorAll('input[id], select[id], textarea[id]').forEach(e => {
      if (e.id !== 'fetapa' && e.id !== 'p_motivo') v[e.id] = e.value;
    });
    return v;
  };
  const devolver = v => {
    let tocado = false;
    for (const [id, val] of Object.entries(v)){
      const e = document.getElementById(id);
      if (e && e.value !== val){ e.value = val; tocado = true; }
    }
    // Para que la barra de Guardar sepa que hay cambios pendientes.
    if (tocado) document.getElementById('f_notas')
      ?.dispatchEvent(new Event('input', { bubbles: true }));
  };

  $('#fguarda').addEventListener('click', async () => {
    const b = $('#fguarda'); b.disabled = true; b.textContent = 'Guardando…';
    const { error } = await supabase.rpc('mt_guardar_lead',
      { p_id: l.id, p_campos: leer() });
    b.disabled = false; b.textContent = 'Guardar';
    if (!viva()){ await refrescarEmbudo(); return; }
    if (error) return fallo(error);
    $('#fguardar').classList.remove('on');
    aviso('Guardado', true);
    anunciar('Guardado');
    await refrescarEmbudo();
  });

  $('#fdescarta').addEventListener('click', () => abrirLead(l.id));

  // ---- etapa ----
  const sel = $('#fetapa');
  sel.addEventListener('change', async () => {
    const et = sel.value;
    if (et === l.etapa) return;
    if (et === 'perdido'){
      $('#fcajaperdido').classList.add('on');
      $('#p_motivo').focus();
      return;
    }
    $('#fcajaperdido').classList.remove('on');
    await moverA(et, null);
  });

  async function moverA(et, nota){
    // Lo escrito se recoge ANTES de esperar: después, la caja puede
    // tener ya la ficha de otro lead y se copiaban sus datos a este.
    const pendiente = foto();
    // Mientras va, ni el desplegable ni «Marcar como perdido»: un doble
    // toque mandaba el cambio dos veces.
    sel.disabled = true;
    const pok = $('#p_ok'); if (pok) pok.disabled = true;
    const { error } = await supabase.rpc('mt_mover_lead',
      { p_id: l.id, p_etapa: et, p_nota: nota });
    sel.disabled = false; if (pok) pok.disabled = false;
    if (!viva()){ await refrescarEmbudo(); reabrirSiEs(l.id); return; }
    if (error){ sel.value = l.etapa; $('#fcajaperdido')?.classList.remove('on'); return fallo(error); }
    await refrescarEmbudo();
    if (!viva()) return;
    const nuevo = LEADS.find(x => x.id === l.id);
    if (nuevo){
      // La ficha se vuelve a pintar con la etapa nueva. Lo que hubiera
      // escrito y sin guardar en los Datos se devuelve a su sitio: antes
      // cambiar de etapa lo borraba sin decir nada.
      abrirLead(nuevo.id);
      devolver(pendiente);
      const t = et === 'perdido' ? 'Marcado como perdido' : 'Etapa: ' + NOMBRE_ETAPA[et];
      aviso(t, true); anunciar(t);
    }
    else cerrar();
  }

  $('#p_no').addEventListener('click', () => {
    $('#fcajaperdido').classList.remove('on');
    sel.value = l.etapa;      // el desplegable vuelve a donde estaba
  });
  $('#p_ok').addEventListener('click', async () => {
    const m = $('#p_motivo').value.trim();
    if (!m) return aviso('Escribe el motivo', false);
    await moverA('perdido', m);
  });

  // ---- apuntar un contacto ----
  $('#t_ok').addEventListener('click', async () => {
    const d = $('#t_detalle').value.trim();
    if (!d) return aviso('Escribe qué has hecho', false);
    const b = $('#t_ok'); b.disabled = true;
    const fechaSig = $('#t_fecha').value || null;
    const { error } = await supabase.rpc('mt_apuntar_toque',
      { p_id: l.id, p_detalle: d, p_proxima: fechaSig });
    b.disabled = false;
    // Si mientras tanto se ha abierto otro lead, el «Apuntado» y el
    // historial de este no se pintan en su ficha.
    if (!viva()){ await refrescarEmbudo(); return; }
    if (error) return fallo(error);
    // No se vuelve a pintar la ficha: apuntar un contacto solo cambia
    // el historial. Repintarla borraba los Datos sin guardar y el
    // propio aviso de «Apuntado».
    $('#t_detalle').value = '';
    aviso('Apuntado', true);
    anunciar('Apuntado');
    await refrescarEmbudo();
    await pintarHistorial(l.id);
  });
  $('#t_detalle').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); $('#t_ok').click(); }
  });

  // ---- ir a la conversación ----
  $('#fx')?.addEventListener('click', cerrar);
  $('#fver').addEventListener('click', async () => {
    cerrar();
    const ref = l.user_ref;
    // Que Conversaciones no reabra a quien se estuviera leyendo antes:
    // salía la conversación de otra persona junto a la lista filtrada.
    ABIERTO = null;
    await irA('convs');
    if (VISTA !== 'convs') return;      // se ha ido a otra pestaña mientras
    if (window.innerWidth > 1000 && !$('#pdetalle')){ ABIERTO = ref; return; }
    const b = $('#buscar');
    if (b){ b.value = String(l.telefono || ref || '').split('@')[0]; filtrar(b.value); }
    if (ref) abrir(ref);
  });

  // Enter dentro de los datos guarda. Fuera de ahí no, porque el
  // campo de apuntar contacto y el del motivo tienen su propio
  // Enter y harían dos cosas a la vez.
  box.querySelectorAll('.fdatos input').forEach(i =>
    i.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      $('#fguarda').click();
    }));
  $('#p_motivo').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); $('#p_ok').click(); }
  });
}

/* ---------- utilidades ---------- */
// El teléfono completo no se muestra en pantalla: se ve lo justo para reconocer al contacto.
const ofusca = t => t ? t.slice(0,4) + '···' + t.slice(-3) : '—';
// El agente de n8n guarda su traza de herramientas delante de la
// respuesta. mensajes_contacto ya la quita, pero la actividad
// reciente lee `content` directo de la tabla. Mismo criterio:
// se cuentan corchetes, porque el JSON de la traza lleva
// corchetes dentro y cortar por el primer "]]" falla con arrays
// anidados.
function limpiaMensaje(t){
  const s = String(t ?? '').trimStart();
  if (!s.startsWith('[Used tools:')) return t ?? '';
  let d = 0;
  for (let i = 0; i < s.length; i++){
    if (s[i] === '[') d++;
    else if (s[i] === ']' && --d === 0) return s.slice(i + 1).trim();
  }
  return t ?? '';
}

// Un número tal como se escribe en España: «22,5», «22.5», «1.450» o
// «1.450,50». Vacío → null (quitar el dato). Lo que no es un número →
// undefined, para poder decirlo en vez de guardar otra cosa.
function leerNumero(t){
  const s = String(t ?? '').trim().replace(/[\s€]/g, '');
  if (!s) return null;
  if (!/^\d{1,3}(\.\d{3})+(,\d+)?$|^\d+([.,]\d+)?$/.test(s)) return undefined;
  const n = /^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)
    ? Number(s.replace(/\./g, '').replace(',', '.'))
    : Number(s.replace(',', '.'));
  return isFinite(n) ? n : undefined;
}
// Y al revés, para rellenar el campo: 22.5 → «22,5».
const numCampo = v => v == null || v === '' || !isFinite(Number(v)) ? ''
  : String(Number(v)).replace('.', ',');

// String(s ?? ''): un campo vacío en la base llega como null, y
// null.replace tumbaba el bloque que lo estuviera pintando.
// La comilla simple también: un nombre como «D'Angelo» dentro de un
// atributo entre comillas simples rompía el botón «Calendario» de la
// Agenda, y un nombre preparado podía meter atributos en el HTML.
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// El número para marcar, con prefijo internacional. Lo que guarda el
// sistema es el número de WhatsApp sin «+» (34600…): un iPhone en España
// lo marcaba como nacional y no conectaba. Si no parece un teléfono (un
// identificador @lid de WhatsApp, por ejemplo), null: no se ofrece llamar.
function telefonoE164(t){
  const s = String(t ?? '').trim();
  if (!s) return null;
  if (s.includes('@') && !/@s\.whatsapp\.net$/.test(s)) return null;
  let d = s.split('@')[0].replace(/[^\d+]/g, '');
  if (d.startsWith('00')) d = '+' + d.slice(2);
  if (!d.startsWith('+')) d = /^[6789]\d{8}$/.test(d) ? '+34' + d : '+' + d;
  return /^\+\d{8,15}$/.test(d) ? d : null;
}
// La fecha de hoy en Madrid, como 'AAAA-MM-DD'. Con toISOString() era
// la de Greenwich: de 00:00 a 02:00 lo de ayer salía «Para hoy».
// El formato se crea una sola vez: crearlo en cada llamada hacía el
// Embudo hasta cuatro veces más lento (se llama varias veces por lead).
const FMT_MADRID = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Madrid' });
const hoyMadrid = () => FMT_MADRID.format(new Date());
// «15 oct», con el año solo si no es el actual («15 oct 26» se leía como
// un día). Una fecha sin hora ('2026-10-15') se lee tal cual, sin pasar
// por la zona del navegador: en otro huso salía el día anterior.
const fechaCorta = d => {
  const soloDia = typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
  const f = new Date(d);
  if (isNaN(f)) return '—';
  const op = { day:'numeric', month:'short' };
  if (soloDia) op.timeZone = 'UTC';
  const anio = soloDia ? Number(d.slice(0, 4)) : f.getFullYear();
  if (anio !== new Date().getFullYear()) op.year = 'numeric';
  return f.toLocaleDateString('es-ES', op);
};
const fecha = d => new Date(d).toLocaleString('es-ES',
  { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const hora = d => new Date(d).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
// Cuándo, en corto, para la actividad reciente: la hora si es de hoy,
// «ayer», el día de la semana esta semana, y si no la fecha. Antes solo
// la hora: un mensaje de la semana pasada parecía de esta mañana.
const cuandoCorto = d => {
  if (!d) return '—';
  const f = new Date(d); if (isNaN(f)) return '—';
  const dia = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const dias = Math.round((dia(new Date()) - dia(f)) / 864e5);
  if (dias <= 0) return hora(f);
  if (dias === 1) return 'ayer';
  if (dias < 7) return f.toLocaleDateString('es-ES', { weekday:'short' }).replace('.', '');
  return f.toLocaleDateString('es-ES', { day:'numeric', month:'short' }).replace('.', '');
};

/* El distintivo solo aparece fuera del dominio de producción. Así no
   hay forma de confundir un panel con otro, y nadie tiene que
   acordarse de quitarlo al desplegar. */
(function(){
  const enProduccion =
    location.hostname === 'panel.simpliaspain.com' &&
    !location.pathname.startsWith('/staging');
  const enLocal =
    location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (enProduccion || enLocal) return;
  const d = document.createElement('div');
  d.className = 'staging';
  d.textContent = 'Staging, no es lo que ve el cliente · versión ' + VERSION;
  document.body.insertBefore(d, document.body.firstChild);
})();
