    <span class="co-av" aria-hidden="true">${esc(coIniciales(l.nombre))}</span>
    <span class="emb-ftx"><b>${esc(l.nombre)}</b><span>${esc(l.asunto)}</span><small>${esc(linea)}</small></span></button>`;
}
function embDetalle(l){
  const ult = l.seg + 1 >= CO.seguimiento.max;

    <div class="co-dcab">
      <div class="co-dtit"><h3>${esc(l.nombre)}</h3></div>

    <div class="co-acc emb-accesos">
      ${l.correoId ? `<button class="btn corto" data-co="eircorreo" data-id="${l.id}">${l.etapa === 'toca' ? 'Ver el seguimiento en Correo' : l.etapa === 'contesto' ? 'Responder en Correo' : 'Abrir en Correo'}</button>` : ''}
      ${l.userRef ? `<button class="cbtn" data-co="econvs" data-id="${l.id}">Ver en Conversaciones</button>` : ''}

// Lo que toca hacer con cada lead, en una frase.
function embSiguiente(l){
  if (l.etapa === 'toca') return `Revisar y enviar el seguimiento ${l.seg + 1}${l.seg + 1 >= CO.seguimiento.max ? ' (el último)' : ''}: ya está escrito en Correo › Por revisar.`;
  if (l.etapa === 'contesto') return 'Responderle: ha contestado. Su respuesta y un borrador están en Correo › Por revisar.';
  if (l.etapa === 'espera' || l.etapa === 'enviando') return l.seg >= CO.seguimiento.max
    ? 'Esperar su respuesta. Ya se le han enviado todos los seguimientos.'
    : `Esperar su respuesta. Si no contesta, el ${coFecha(l.proximo)} se preparará el seguimiento ${l.seg + 1}.`;
  if (l.etapa === 'visita') return l.visitaEn ? `Visita el ${coFecha(l.visitaEn)} a las ${new Date(l.visitaEn).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' })}${l.centro ? ' en ' + l.centro : ''}.` : 'Tiene visita reservada.';
  return l.motivo || 'Cerrado: no hay nada más que hacer.';
}
function pintarEmbudoCorreo(){

  $('#vista').innerHTML = `<div class="emb-correo">

    <div class="co-cifras emb-reglas">
      <span class="co-para">${s.activo ? `Seguimiento a los ${s.dias} días · como mucho ${s.max} · se para si contesta o reserva visita` : 'Seguimiento apagado'}
        <button class="co-editar" data-co="irseg">Cambiar</button></span>
      <span class="co-ej">Datos de ejemplo</span>

    <div class="emb-rej">
      <div class="panel emb-lista">${CO_ETAPAS.map(([k, t]) => { const ls = grupo(k); return ls.length

  coEnlazar();
}
function coEnviarSeguimiento(l){
  l.propuesta = $('#etxt')?.value ?? l.propuesta;
  const antes = { etapa: l.etapa, seg: l.seg, proximo: l.proximo, eventos: [...l.eventos] };

    () => { clearTimeout(paso.t); Object.assign(l, antes); }, { deshecho: 'Seguimiento cancelado: sigue preparado.' });
  paso.t = setTimeout(() => {
    l.seg++; l.eventos.push([0, `Seguimiento ${l.seg} enviado`]);
    l.etapa = 'espera'; l.proximo = Date.now() + CO.seguimiento.dias * CO_DIA;
    CO.historial = CO.historial.filter(p => p !== paso);
    if (VISTA === 'embudo') pintarEmbudoCorreo();
    coAviso(`Seguimiento enviado a ${l.nombre}.`);
  }, 10000);
}

/* ---- Listas en las que se añaden elementos uno a uno (sin comas) ---- */
const CO_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const CO_DOMINIO = /^@?[a-z0-9-]+(\.[a-z0-9-]+)+$/i;
function coChipsLista(clave){
  if (clave === 'excluir') return CO.auto[CO.autoBuzon].excluir;
  if (clave === 'avisos') return CO.avisos;
  return [];
}
function coChips(clave, ph, ayuda){
  const lista = coChipsLista(clave);
  return `<div class="co-chips" data-chips="${clave}">
      ${lista.map((v, i) => `<span class="co-chipv">${esc(v)}<button type="button" data-co="chipx" data-chips="${clave}" data-i="${i}" aria-label="Quitar ${esc(v)}">×</button></span>`).join('')}
      <input class="co-chipin" data-chipsin="${clave}" placeholder="${esc(ph)}" aria-label="${esc(ph)}" autocomplete="off" spellcheck="false">
    </div>
    <div class="hint">${esc(ayuda)}</div>`;
}
// Solo se repinta la lista (no la página): no se pierde el sitio ni el cursor.
function coChipsPintar(clave, enfocar = true){
  const caja = document.querySelector(`.co-chips[data-chips="${clave}"]`); if (!caja) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = coChips(clave, caja.querySelector('input').placeholder, caja.nextElementSibling?.textContent || '');
  caja.replaceWith(tmp.firstElementChild);
  if (enfocar) document.querySelector(`.co-chips[data-chips="${clave}"] input`)?.focus();
}
function coChipsAnadir(input){
  const clave = input.dataset.chipsin, lista = coChipsLista(clave);
  const trozos = input.value.split(/[,;\s]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
  if (!trozos.length) return;
  const malos = [];
  for (const t of trozos){
    const vale = clave === 'avisos' ? CO_EMAIL.test(t) : (CO_EMAIL.test(t) || CO_DOMINIO.test(t));
    if (!vale){ malos.push(t); continue; }
    const v = clave === 'excluir' && !CO_EMAIL.test(t) && !t.startsWith('@') ? '@' + t : t;
    if (!lista.includes(v)) lista.push(v);
  }
  input.value = malos.join(' ');
  coChipsPintar(clave);
  if (malos.length) coAviso(clave === 'avisos' ? `«${malos[0]}» no parece un correo.` : `«${malos[0]}» no parece un correo ni un dominio.`);
}

/* ---- Usuarios de la empresa: los añade y quita el administrador ---- */
function coUsuarioAnadir(){
  if (!esAdminCorreo()) return;
  const email = $('#couemail').value.trim().toLowerCase(), nombre = $('#counom').value.trim(), rol = $('#courol').value;
  if (!CO_EMAIL.test(email)) return coAviso('Escribe un correo válido.');
  const lista = CO.usuarios[CO.cliente] = CO.usuarios[CO.cliente] || [];
  if (lista.some(u => u.email === email)) return coAviso('Esa persona ya tiene acceso.');
  lista.push({ email, nombre: nombre || email.split('@')[0], rol });
  pintarCorreo();
  coAviso(`Invitación enviada a ${email}.`);
}

        ${puede && u.email !== USUARIO_EMAIL

function coCambio(el){
  const a = el.dataset.co, nid = Number(el.dataset.id);
  const c = CO.correos.find(x => x.id === nid);
  if (a === 'mover') return coMover([nid], el.value);
  if (a === 'selmover' && el.value) return coMover(coVariosSel(), el.value);
  if (a === 'uidioma'){
    const u = (CO.usuarios[CO.cliente] || []).find(x => x.email === el.dataset.email); u.idioma = el.value;
    return coAviso(`Idioma de ${u.nombre}: ${CO_IDIOMAS[el.value]}. Los correos en otro idioma se le ofrecerán traducidos.`);
  }
  if (a === 'segact'){ CO.seguimiento.activo = el.checked; return coAviso(el.checked ? 'Seguimiento activado.' : 'Seguimiento apagado.'); }
  if (a === 'segdias'){ CO.seguimiento.dias = Number(el.value); return coAviso(`Seguimiento a los ${el.value} días.`); }
  if (a === 'segmax'){ CO.seguimiento.max = Number(el.value); return coAviso(`Como mucho ${el.value}.`); }
  if (a === 'segmodo'){ CO.seguimiento.modo = el.value; return coAviso(el.value === 'auto' ? 'Los seguimientos saldrán solos.' : 'Los seguimientos se revisan antes de salir.'); }
  if (a === 'deslizq' || a === 'deslder'){ CO.deslizar[a === 'deslizq' ? 'izq' : 'der'] = el.value; return coAviso('Guardado.'); }
  if (a === 'cliente'){ CO.cliente = el.value; CO.abierto = null; CO.pop = false; return pintarCorreo(); }
  if (a === 'urol'){
    const lista = CO.usuarios[CO.cliente] || [], u = lista.find(x => x.email === el.dataset.email);
    if (u.rol === 'admin' && el.value !== 'admin' && lista.filter(x => x.rol === 'admin').length < 2){
      el.value = 'admin'; return coAviso('Tiene que quedar al menos un administrador.');
    }
    u.rol = el.value; return coAviso(`${u.email}: ${u.rol === 'admin' ? 'administrador' : 'empleado'}.`);
  }
  if (a === 'addadj' && el.value){ c.respuesta = $('#cotxt').value; c.adjuntos = [...(c.adjuntos || []), Number(el.value)]; return coAbrir(nid); }
  if (a === 'autobuzon'){ coLeerAuto(); CO.autoBuzon = el.value; return pintarCorreo(); }
  if (a === 'fotosmax'){ CO.fotosMax = Number(el.value); return coAviso(`Como mucho ${CO.fotosMax} fotos por despacho.`); }
  if (a === 'fotosact'){ CO.fotosActivo = el.checked; return coAviso(el.checked ? 'Adjuntará las fotos del despacho que ofrezca.' : 'No adjuntará fotos.'); }
  if (a === 'modobuzon'){
    const b = CO.buzones.find(x => x.email === el.dataset.buzon); b.modo = el.value;
    pintarCorreo(); return coAviso(`${b.email}: modo ${CO_MODOS[b.modo].t}.`);
  }
  if (a === 'selbuzon'){
    if (el.checked) CO.sel.add(el.value);
    else if (CO.sel.size > 1) CO.sel.delete(el.value);
    else { el.checked = true; return coAviso('Tiene que quedar al menos un buzón.'); }
    return pintarCorreo();
  }
}

function coEnlazar(){
  if (CO.enlazado) return; CO.enlazado = true;
  const enCorreo = e => (VISTA === 'correo' || (VISTA === 'embudo' && CO.embudoCanal === 'correo')) && e.target.closest('[data-co]');
  for (const sel of ['#vista', '#mbox']){
    $(sel).addEventListener('click', e => {
      const el = enCorreo(e); if (!el || el.tagName === 'SELECT' || el.type === 'radio' || el.type === 'checkbox') return;
      if (el.disabled) return; e.preventDefault?.(); coAccion(el, e);
    });
    $(sel).addEventListener('change', e => { const el = enCorreo(e); if (el && (el.tagName === 'SELECT' || el.type === 'radio' || el.dataset.co === 'selbuzon' || el.dataset.co === 'fotosact' || el.dataset.co === 'segact')) coCambio(el); });
    // La firma se ve tal cual mientras se escribe.
    $(sel).addEventListener('input', e => {
      if (VISTA !== 'correo' || !/^cof(html|nom|emp|web|tel)$/.test(e.target.id)) return;
      coLeerFirma();
      const p = e.target.closest('.panel')?.querySelector('.co-firmaprev');
      if (p) p.innerHTML = coFirmaHTML(CO.autoBuzon);
    });
    // Lo escrito en un borrador (o en un seguimiento) se guarda al momento, también en su versión.
    $(sel).addEventListener('input', e => {
      const id = e.target.id; if (id !== 'cotxt' && id !== 'etxt') return;
      const o = id === 'etxt' ? coLead(Number(e.target.dataset.id)) : CO.correos.find(x => x.id === Number(e.target.dataset.id));
      if (!o || (id === 'cotxt' && o.estado !== 'borrador')) return;
      coPonerTexto(o, e.target.value);
      if (o.versiones) o.versiones[o.vi] = e.target.value;
      e.target.style.height = 'auto'; e.target.style.height = (e.target.scrollHeight + 4) + 'px';
    });
    // «Pídele un cambio»: Intro = Reescribir.
    $(sel).addEventListener('keydown', e => {
      const inp = e.target.closest?.('[data-pide]'); if (!inp || e.key !== 'Enter') return;
      e.preventDefault(); inp.parentElement.querySelector('[data-co="reescpedir"]')?.click();
    });
    $(sel).addEventListener('keydown', e => {
      const el = enCorreo(e); if (el && el.dataset.co === 'abrir' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); coAccion(el, e); }
    });
  }
  $('#vista').addEventListener('change', e => { if (VISTA === 'correo' && e.target.id === 'cofile') coAddDocs(e.target.files); });
  // Foto de perfil: la suya cada uno (y el administrador, la de cualquiera). Se reduce a 128 px.
  $('#vista').addEventListener('change', e => {
    const email = e.target.dataset?.fotode; if (!email || !e.target.files[0]) return;
    const u = (CO.usuarios[CO.cliente] || []).find(x => x.email === email);
    if (!u || !coPuedeFoto(email)) return;
    const f = e.target.files[0];
    if (!/^image\/(png|jpe?g|webp)$/.test(f.type)) return coAviso('La foto tiene que ser PNG, JPG o WEBP.');
    if (f.size > 5 * 1024 * 1024) return coAviso('La foto pesa demasiado: como mucho 5 MB.');
    const img = new Image(), url = globalThis.URL.createObjectURL(f);
    img.onload = () => {
      const lado = 128, cv = document.createElement('canvas'); cv.width = cv.height = lado;
      const m = Math.min(img.width, img.height), x = cv.getContext('2d');
      x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, lado, lado);   // recorte cuadrado del centro
      u.foto = cv.toDataURL('image/jpeg', .85); globalThis.URL.revokeObjectURL(url);
      pintarCorreo(); coAviso(`Foto de ${u.nombre} cambiada.`);
    };
    img.onerror = () => { globalThis.URL.revokeObjectURL(url); coAviso('No se ha podido leer la foto.'); };
    img.src = url;
  });
  // Logo de la firma: se lee en el navegador (en la versión real, se sube a Supabase Storage).
  $('#vista').addEventListener('change', e => {
    if (VISTA !== 'correo' || e.target.id !== 'cologo' || !e.target.files[0]) return;
    const f = e.target.files[0];
    if (f.size > 500 * 1024) return coAviso('El logo pesa demasiado: como mucho 500 KB.');
    const lector = new FileReader();
    lector.onload = () => { coLeerFirma(); CO.firma.logo = String(lector.result); pintarCorreo(); coAviso('Logo cargado.'); };
    lector.readAsDataURL(f);
  });
  // Listas añadibles: Intro (o coma) añade, borrar con la caja vacía quita el último, al salir se añade.
  for (const sel of ['#vista', '#mbox']){
    $(sel).addEventListener('keydown', e => {
      const inp = e.target.closest?.('[data-chipsin]'); if (!inp || VISTA !== 'correo') return;
      if (e.key === 'Enter' || e.key === ',' || e.key === ';'){ e.preventDefault(); coChipsAnadir(inp); }
      else if (e.key === 'Backspace' && !inp.value){
        const lista = coChipsLista(inp.dataset.chipsin);
        if (lista.length){ lista.pop(); coChipsPintar(inp.dataset.chipsin); }
      }
    });
    $(sel).addEventListener('focusout', e => { const inp = e.target.closest?.('[data-chipsin]'); if (inp && inp.value.trim()) coChipsAnadir(inp); });
    $(sel).addEventListener('click', e => { const caja = e.target.closest?.('.co-chips'); if (caja && e.target === caja) caja.querySelector('input')?.focus(); });
  }

  /* Buscador: busca mientras se escribe (solo cambia la lista). «/» lo enfoca, Escape lo limpia. */
  $('#vista').addEventListener('input', e => {
    if (e.target.id !== 'cobusca' || VISTA !== 'correo') return;
    clearTimeout(CO.tBusca);
    CO.tBusca = setTimeout(() => { CO.busca.q = e.target.value; coPintarLista(); }, 120);
  });
  $('#vista').addEventListener('keydown', e => {
    if (e.target.id === 'cobusca' && e.key === 'Escape' && e.target.value){ e.stopPropagation(); e.target.value = ''; CO.busca.q = ''; coPintarLista(); }
  });
  document.addEventListener('keydown', e => {
    if (VISTA !== 'correo' || e.key !== '/' || escribiendo() || $('#modal').style.display === 'block') return;
    const b = $('#cobusca'); if (b){ e.preventDefault(); b.focus(); b.select(); }
  });

  /* Deslizar con el dedo (solo pantallas táctiles): el fondo dice qué pasará;
     pasado un tercio del ancho, se hace al soltar (y se puede deshacer). */
  let sw = null;
  $('#vista').addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || VISTA !== 'correo') return;
    const fila = e.target.closest('.co-fila'); if (!fila) return;
    sw = { fila, caja: fila.parentElement, x0: e.clientX, y0: e.clientY, dx: 0, activo: false, id: e.pointerId };
  });
  $('#vista').addEventListener('pointermove', e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if (!sw.activo){
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }   // es scroll
      if (Math.abs(dx) < 12) return;
      sw.activo = true; try { sw.fila.setPointerCapture(e.pointerId); } catch {}
      sw.fila.style.transition = 'none';
    }
    sw.dx = dx;
    const acc = dx > 0 ? CO.deslizar.der : CO.deslizar.izq;
    sw.caja.dataset.acc = acc; sw.caja.classList.toggle('der', dx > 0); sw.caja.classList.toggle('izq', dx < 0);
    sw.caja.classList.toggle('listo', Math.abs(dx) > sw.fila.offsetWidth / 3 && acc !== 'nada');
    sw.fila.style.transform = `translateX(${dx}px)`;
  });
  const finSwipe = e => {
    if (!sw || e.pointerId !== sw.id) return;
    const { fila, caja, dx, activo } = sw; sw = null;
    if (!activo) return;
    CO.trasSwipe = true; setTimeout(() => { CO.trasSwipe = false; }, 350);
    const acc = dx > 0 ? CO.deslizar.der : CO.deslizar.izq, ancho = fila.offsetWidth;
    fila.style.transition = 'transform .15s ease';
    if (Math.abs(dx) > ancho / 3 && acc !== 'nada'){
      fila.style.transform = `translateX(${dx > 0 ? ancho : -ancho}px)`;
      setTimeout(() => coMover([Number(fila.dataset.id)], acc, false), 160);
    } else {
      fila.style.transform = '';
      setTimeout(() => { caja.classList.remove('der', 'izq', 'listo'); delete caja.dataset.acc; }, 160);
    }
  };
  $('#vista').addEventListener('pointerup', finSwipe);
  $('#vista').addEventListener('pointercancel', finSwipe);
  // Tras deslizar no se abre el correo (el dedo «hace clic» al soltar).
  $('#vista').addEventListener('click', e => { if (CO.trasSwipe && e.target.closest('.co-fila')){ e.stopImmediatePropagation(); e.preventDefault(); } }, true);

  /* Arrastrar un correo de la lista a una carpeta (también Archivados y Papelera). */
  $('#vista').addEventListener('dragstart', e => {
    const fila = e.target.closest?.('[data-drag]'); if (!fila || VISTA !== 'correo') return;
    const c = CO.correos.find(x => x.id === Number(fila.dataset.drag));
    // Si el correo está entre los seleccionados, se arrastran todos.
    const varios = coVariosSel();
    CO.arrastrando = varios.length > 1 && varios.includes(c.id) ? varios : [c.id];
    e.dataTransfer.setData('text/x-correo', CO.arrastrando.join(','));
    e.dataTransfer.setData('text/plain', c.asunto);
    e.dataTransfer.effectAllowed = 'move';
    // La «etiqueta» que se ve al arrastrar: el asunto, corto.
    // El puntero queda en la esquina vacía de arriba a la izquierda: la etiqueta va
    // abajo a la derecha y nunca tapa el puntero.
    const g = document.createElement('div'); g.className = 'co-arrastre';
    g.innerHTML = `<span>${CO.arrastrando.length > 1 ? `${CO.arrastrando.length} correos` : esc(c.asunto)}</span>`;
    document.body.append(g); e.dataTransfer.setDragImage(g, 0, 0); setTimeout(() => g.remove(), 0);
    fila.classList.add('arrastrando'); $('.co-carps')?.classList.add('soltando');
  });
  $('#vista').addEventListener('dragend', () => {
    CO.arrastrando = null;
    document.querySelectorAll('.arrastrando,.soltando,.co-carp.sobre').forEach(x => x.classList.remove('arrastrando', 'soltando', 'sobre'));
  });
  $('#vista').addEventListener('dragover', e => {
    const z = e.target.closest?.('[data-drop]'); if (!z || CO.arrastrando == null) return;
    e.preventDefault();
    const mismo = CO.arrastrando.every(id => CO.correos.find(x => x.id === id)?.carpeta === z.dataset.drop);
    e.dataTransfer.dropEffect = mismo ? 'none' : 'move';
    document.querySelectorAll('.co-carp.sobre').forEach(x => x !== z && x.classList.remove('sobre'));
    z.classList.toggle('sobre', !mismo);
  });
  $('#vista').addEventListener('dragleave', e => {
    const z = e.target.closest?.('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('sobre');
  });
  $('#vista').addEventListener('drop', e => {
    const z = e.target.closest?.('[data-drop]'); if (!z || CO.arrastrando == null) return;
    e.preventDefault();
    const dato = e.dataTransfer.getData('text/x-correo');
    const ids = dato ? dato.split(',').map(Number).filter(Boolean) : CO.arrastrando;
    CO.arrastrando = null;
    coMover(ids, z.dataset.drop);
  });

  /* Atajos de la bandeja (no actúan si se está escribiendo o hay una ventana abierta):
     ↑ ↓ moverse · Mayús+↑↓ seleccionar · Ctrl/Cmd+A todos · Supr eliminar · E archivar · Esc quitar selección. */
  document.addEventListener('keydown', e => {
    if (VISTA !== 'correo' || CO.tab !== 'bandeja' || escribiendo() || CO.visor || $('#modal').style.display === 'block') return;
    const lista = coListaDatos().lista.map(c => c.id); if (!lista.length) return;
    const actual = CO.abierto != null && lista.includes(CO.abierto) ? CO.abierto : null;
    const objetivo = () => { const v = coVariosSel(); return v.length ? v : actual != null ? [actual] : []; };
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      const i = actual == null ? -1 : lista.indexOf(actual);
      const j = Math.max(0, Math.min(lista.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
      const id = lista[j];
      if (e.shiftKey){ if (CO.ancla == null) CO.ancla = actual ?? id; coSeleccionar(id, { shiftKey:true }); CO.abierto = id; coPintarListaQuieta(); }
      else { coSeleccionar(id); coAbrir(id); }
      document.querySelector(`.co-fila[data-id="${id}"]`)?.scrollIntoView({ block:'nearest' });
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a'){
      e.preventDefault(); CO.seleccion = new Set(lista); coPintarListaQuieta();
    } else if (e.key === 'Delete' || (e.key === 'Backspace' && e.metaKey)){
      const ids = objetivo(); if (ids.length){ e.preventDefault(); coMover(ids, 'papelera'); }
    } else if (e.key.toLowerCase() === 'e' && !e.ctrlKey && !e.metaKey && !e.altKey){
      const ids = objetivo(); if (ids.length){ e.preventDefault(); coMover(ids, 'archivados'); }
    } else if (e.key === 'Escape' && CO.seleccion.size > 1){
      CO.seleccion = new Set(actual != null ? [actual] : []); coPintarListaQuieta();
    }
  });

  // Ctrl+Z / Cmd+Z: deshace lo último hecho con un correo. Si se está
  // escribiendo, es el deshacer normal del texto.
  document.addEventListener('keydown', e => {
    if ((VISTA !== 'correo' && !(VISTA === 'embudo' && CO.embudoCanal === 'correo')) || CO.visor) return;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'z' && !escribiendo()){
      e.preventDefault(); coDeshacer();
    }
  });

  // El desplegable de buzones se cierra al pulsar fuera.
  document.addEventListener('click', e => {
    if (CO.pop && VISTA === 'correo' && !e.target.closest('.co-popw')){ CO.pop = false; pintarCorreo(); }
  });
  // Al pasar de ordenador a ventana pequeña (o al revés) se recoloca.
  matchMedia('(min-width:1100px)').addEventListener('change', () => VISTA === 'correo' && pintarCorreo());
  addEventListener('resize', () => VISTA === 'correo' &&
    document.documentElement.style.setProperty('--cohdr', ($('header')?.offsetHeight || 63) + 'px'));
  $('#vista').addEventListener('dragover', e => { const z = e.target.closest?.('#cosubir'); if (z){ e.preventDefault(); z.classList.add('sobre'); } });
  $('#vista').addEventListener('dragleave', e => e.target.closest?.('#cosubir')?.classList.remove('sobre'));
  $('#vista').addEventListener('drop', e => { const z = e.target.closest?.('#cosubir'); if (z){ e.preventDefault(); coAddDocs(e.dataTransfer.files); } });
}

    b.addEventListener('click', () => irA(b.dataset.v)));
}

/* ---------- carga ---------- */
async function arrancar(){
  // Mientras llega la configuración, el esqueleto: la pantalla se
  // quedaba en blanco un momento justo después de «Entrar».
  if (!$('#vista').innerHTML.trim()) $('#vista').innerHTML = esqueleto('latido');
  // mt_mi_config devuelve una fila solo si quien entra tiene acceso
  // a algún cliente. Sin fila, la cuenta existe pero no está dada de
  // alta en ninguno.
  // Lo guardado del Latido es de quien estuviera antes: fuera.
  LATIDO_CACHE = new Map();
  const rc = await supabase.rpc('mt_mi_config');
  const { data: cfg, error: errCfg } = rc;
  // Sin respuesta no es lo mismo que sin cliente. Antes, si fallaba la
  // conexión, salía «Tu cuenta no tiene ningún cliente asignado», que
  // es falso y asusta.
  if (errCfg){
    $('#vista').innerHTML = `<div class="panel"><div class="vacio">
      <strong>No se ha podido conectar con el servicio.</strong><br>
      ${esc(esDeRed(rc) ? 'Revisa la conexión a internet e inténtalo de nuevo.'
          : errCfg.code === 'tiempo' ? 'El servidor no ha contestado a tiempo.'
          : errCfg.message || 'Revisa la conexión.')}
      <div style="margin-top:16px">
        <button class="btn corto" id="arreint" type="button">Reintentar</button>
      </div></div></div>`;
    $('#arreint')?.addEventListener('click', () => {
      $('#vista').innerHTML = esqueleto('latido');
      arrancar();
    });
    return;
  }
  const t = Array.isArray(cfg) ? cfg[0] : cfg;
  if (!t){
    $('#vista').innerHTML = `<div class="panel"><div class="vacio">
      <strong>Tu cuenta no tiene ningún cliente asignado.</strong><br>
      Falta la fila correspondiente en <code>mt_miembros</code>
      o en <code>mt_operadores</code>.</div></div>`;
    return;
  }
  TENANT = t;
  // El rol y los ajustes se guardan para que los bloques del Latido
  // sepan qué puede hacer quien mira sin volver a preguntarlo.
  CFG.rol = t.rol;
  CFG.ajustes = t.ajustes || {};
  correoAcceso();
  // `nombre`, no `name`: mt_mi_config devuelve la columna en
  // castellano como todo el esquema, y aquí se leía en inglés. En la
  // cabecera del panel ponía literalmente "undefined".
  $('#cliente').textContent = t.nombre || '';

  // Los textos y el horario salen de la base, no del código: así un
  // cliente de otro sector ve su propia terminología.
  //
  // ESTO ESTABA ROTO Y NO SE VEÍA. Había una segunda llamada a
  // mt_mi_config que trataba la respuesta como un objeto con
  // .horario, .documentos, .tratamiento… y mt_mi_config devuelve una
  // fila con slug, nombre, rol y `ajustes`. Ninguna de esas
  // propiedades existía, así que CFG se quedaba SIEMPRE en los
  // valores por defecto del código:
  //
  //   · Configuración enseñaba "lunes a viernes, de 9:00 a 19:00"
  //     fuera cual fuera el horario real, mientras mt_mis_numeros
  //     contaba lo de "fuera de horario" con ajustes.horario. Dos
  //     verdades para la misma franja.
  //   · "Información del servicio" y "Tratamiento de datos" no
  //     aparecían nunca.
  //   · CFG.modulos.agenda nunca podía ocultar la Agenda.
  //
  // Ahora todo sale del mismo sitio: mt_panel_ajustes.ajustes, que es
  // lo que leen también las funciones de la base.
  const A = CFG.ajustes;
  CFG.etiquetas = { ...CFG.etiquetas, ...(A.etiquetas || {}) };
  // El rótulo antiguo pudo quedar guardado en los ajustes y ganaría
  // al valor por defecto. Se sustituye solo si coincide exactamente.
  if (CFG.etiquetas.senales_titulo === 'Qué buscan tus clientes')
    CFG.etiquetas.senales_titulo = 'Por qué se interesan';
  if (A.horario)     CFG.horario     = A.horario;
  if (A.objetivos)   CFG.objetivos   = A.objetivos;
  if (A.documentos)  CFG.documentos  = A.documentos;
  if (A.mapas)       CFG.mapas       = A.mapas;
  if (A.modulos)     CFG.modulos     = A.modulos;
  if (A.tratamiento) CFG.tratamiento = A.tratamiento;
  // Fuera de arrancar(): al cambiar de cliente se vuelve a llamar
  // y el oyente se duplicaría, disparando dos cargas por clic.
  if (!$('#refrescar').dataset.listo){
    $('#refrescar').addEventListener('click', refrescar);
    $('#refrescar').dataset.listo = '1';
  }
  // La Agenda se muestra siempre. Una pestaña vacía que explica
  // qué aparecerá ahí vale más que una pestaña ausente: el cliente
  // no puede echar de menos lo que no sabe que existe, y agendar
  // visitas es el paso donde más se cae el proceso de venta.
  // Un cliente sin agenda puede ocultarla con
  // settings.modulos.agenda = false.
  if (CFG.modulos?.agenda === false)
    document.querySelector('nav button[data-v="agenda"]')?.remove();

  // Si se ha llegado desde el «Ver» del correo diario, directo a esa
  // conversación; si no, al Latido como siempre.
  if (!(await abrirDesdeEnlace())) await pintarLatido();
  autoRefresco();
}

/* ---------- enlace directo a una conversación ----------
   El correo diario de conversaciones (SQL 46) lleva, en cada persona,
   «Ver»: …/#c=<user_ref>&t=<slug>. Se abre Conversaciones con esa
   persona, con sus botones de siempre (también «Contactado por fuera
   del sistema»). Va en la parte # del enlace, que no se manda a ningún
   servidor, y sigue ahí después de «Entrar». Si el enlace es de otro
   cliente, no se abre nada: se queda en el Latido. */
function leerEnlace(){
  const h = String(location.hash || '').replace(/^#/, '');
  if (!h) return null;
  const p = new URLSearchParams(h);
  const c = (p.get('c') || '').trim();
  return c ? { contact: c, slug: (p.get('t') || '').trim() } : null;
}
async function abrirDesdeEnlace(){
  const e = leerEnlace();
  if (!e) return false;
  // Se quita del enlace: al recargar o al compartir la dirección ya no
  // vuelve a abrir a esa persona.
  history.replaceState(null, '', location.pathname + location.search);
  if (e.slug && TENANT?.slug && e.slug !== TENANT.slug) return false;
  await irA('convs');
  await abrir(e.contact);
  return true;
}
// Con el panel ya abierto, otro «Ver» en la misma pestaña.
window.addEventListener('hashchange', () => {
  if (TENANT && $('#app').style.display === 'block') abrirDesdeEnlace();
});

let RANGO = 168;  // horas. El Latido abre en 7 días (lo pidió el cliente).

function pintarCuando(){
  const el = $('#rcuando'); if (!el) return;
  if (!ULTIMA){ el.textContent = '—'; return; }
  const s = Math.round((Date.now() - ULTIMA) / 1000);
  el.textContent = s < 10 ? 'ahora mismo'
    : s < 60 ? `hace ${s} s`
    : s < 3600 ? `hace ${Math.round(s/60)} min`
    : `hace ${Math.round(s/3600)} h`;
}
setInterval(pintarCuando, 10000);

async function refrescar(){
  const b = $('#refrescar');
  b?.classList.add('girando');
  if (VISTA === 'latido')       await pintarLatido(true, true);
  else if (VISTA === 'convs')   await refrescarConvs();
  else if (VISTA === 'embudo')  await refrescarEmbudoVista();
  else if (VISTA === 'agenda')  await pintarAgenda(true);
  else if (VISTA === 'correo')  coRefrescar(true);
  else                          await pintarAjustes(true);
  b?.classList.remove('girando');
}

/* Lo último que llegó bien de cada lectura del Latido. Si una lectura
   falla, se enseña lo último que llegó, marcado como «sin actualizar»,
   y las demás se siguen poniendo al día.

   Antes, si en un refresco fallaba algo, se dejaba la pantalla entera
   como estaba para no cambiar un Latido completo por uno con huecos.
   Con una lectura que fallara SIEMPRE (la de «Cuándo escriben» cuenta
   todo el histórico y es la candidata a pasarse de tiempo), el Latido
   no volvía a cambiar nunca, sin avisar: otra pantalla congelada.

   La clave lleva el rango en las tres lecturas que dependen de él: el
   recuento de 24 horas no vale para «7 días». Se vacía al entrar. */
let LATIDO_CACHE = new Map();
const DEPENDE_RANGO = new Set(['resumen', 'porHora', 'lat']);

async function datos(rango = RANGO){
  // Ninguna lectura directa de tablas: en el proyecto nuevo todas
  // están cerradas y se entra solo por función. Eso cierra de raíz
  // la familia de fallos que nos costó más caro — una vista que
  // devolvía datos de todos los clientes, una columna que no
  // existía y daba ceros en silencio — porque el filtro de
  // exclusiones vive dentro de la función y no se puede olvidar.
  //
  // Los contactos van en la misma tanda y no antes: en serie, una
  // lectura colgada en cada uno eran 40 segundos de esqueleto.
  // Hacen falta para segmentar las señales por persona y para poner
  // nombre a quien sale en la actividad. Se piden en cada carga: si
  // solo se pedían la primera vez, quien escribía por primera vez con
  // el panel abierto (lo normal en una demostración) salía como un
  // número de WhatsApp y con «Llamar» roto. Si fallan, se queda la
  // lista que había.
  const [cts, convs, resumen, porHora, lat, reciente, lugares, patron, numeros] = await Promise.all([
    supabase.rpc('mt_mis_contactos'),
    supabase.rpc('mt_conversaciones_lista', { p_limite: 1000 }),
    supabase.rpc('mt_resumen',    { p_horas: rango }),
    supabase.rpc('mt_por_hora',   { p_horas: rango }),
    // mt_tiempo_respuesta y no mt_latencias: la cifra sale de quien
    // de verdad mide, y viene con su procedencia. El indicador
    // enseñaba 0,0 s porque promediaba el hueco entre dos filas que
    // n8n escribe en la misma operación.
    supabase.rpc('mt_tiempo_respuesta', { p_horas: rango }),
    supabase.rpc('mt_actividad',  { p_limite: 12 }),
    supabase.rpc('mt_demanda'),
    supabase.rpc('mt_patron_horario'),
    supabase.rpc('mt_mis_numeros')
  ]);
  if (cts && !cts.error && Array.isArray(cts.data)) CONTACTOS = cts.data;

  // QUÉ HA FALLADO, Y NO UNA LISTA VACÍA. Una lectura que falla daba
  // `data: null`, se convertía en [] y el Latido enseñaba ceros: «0
  // personas atendidas» cuando lo que pasaba era que no había llegado
  // el dato. Ahora cada lectura acaba en uno de tres estados:
  //   · al día: ha llegado ahora;
  //   · viejos: no ha llegado, y se usa lo último que llegó;
  //   · fallos: no ha llegado nunca, y su bloque lo dice.
  const R = { convs, resumen, porHora, lat, reciente, lugares, patron, numeros };
  const clave = k => DEPENDE_RANGO.has(k) ? k + '|' + rango : k;
  const D = {}, fallos = new Set(), viejos = new Set();
  for (const k of Object.keys(R)){
    if (R[k] && !R[k].error){ D[k] = R[k].data; LATIDO_CACHE.set(clave(k), R[k].data); }
    else if (LATIDO_CACHE.has(clave(k))){ D[k] = LATIDO_CACHE.get(clave(k)); viejos.add(k); }
    else fallos.add(k);
  }
  // La forma, normalizada: una lista es una lista aunque la base
  // devuelva una sola fila suelta, y una fila es una fila aunque llegue
  // dentro de una lista.
  const lista = k => fallos.has(k) ? []
    : Array.isArray(D[k]) ? D[k] : D[k] ? [D[k]] : [];
  const fila = k => fallos.has(k) ? null
    : (Array.isArray(D[k]) ? D[k][0] : D[k]) ?? null;

  // «Actualizado hace…» solo avanza cuando ha llegado todo al día: si
  // no, diría «ahora mismo» encima de datos que no se han podido traer.
  if (!fallos.size && !viejos.size){ ULTIMA = Date.now(); pintarCuando(); }

  // Orden: primero lo registrado con fecha real (más reciente arriba);
  // después el histórico, ordenado por seq — que conserva el orden
  // original de n8n aunque no tengamos la fecha.
  // Ahora hay fecha real para casi todo (primera_en viene de
  // users.created_at en el histórico), así que se ordena por ella.
  // Sobre una copia: la lista guardada no se toca.
  const cs = [...lista('convs')].sort((a, b) => {
    const fa = a.primera_en ? new Date(a.primera_en).getTime() : null;
    const fb = b.primera_en ? new Date(b.primera_en).getTime() : null;
    if (fa && fb && fa !== fb) return fb - fa;
    if (fa && !fb) return -1;
    if (!fa && fb) return 1;
    return (b.seq || 0) - (a.seq || 0);
  });
  // CONVS se usa también fuera del Latido: solo cambia con datos al día.
  if (!fallos.has('convs') && !viejos.has('convs')) CONVS = cs;
  // Una fila: fuente, muestras, mediana y p95. La MEDIANA y no la
  // media, porque con latencias una sola respuesta lenta arrastra la
  // media y deja de describir lo que tarda normalmente.
  const tr = fila('lat');
  // mt_resumen devuelve una fila con los recuentos ya hechos. Antes
  // se traían todos los mensajes del periodo para contarlos en el
  // navegador: con volumen, eso es traerse media base para calcular
  // dos números.
  const res = fila('resumen') || {};
  return {
    convs: cs,
    num: fila('numeros'),
    res,
    porHora: lista('porHora'),
    total: res.mensajes || 0,
    tr,
    reciente: lista('reciente'),
    temas:    lista('lugares'),
    patron:   lista('patron'),
    vivas: cs.filter(c => !c.historico),
    hist:  cs.filter(c =>  c.historico),
    fallos, viejos
  };
}

// Las lecturas del Latido, en palabras, para decir cuáles no han llegado.
const LECTURAS_LATIDO = {
  convs:'las conversaciones', resumen:'el recuento de mensajes',
  porHora:'el cardiograma', lat:'el tiempo de respuesta',
  reciente:'la actividad reciente', lugares:'servicios y zonas',
  patron:'cuándo escriben', numeros:'tus números'
};

/* ---------- vista: latido ---------- */
// `silencioso` = refresco automático o manual sobre contenido ya
// visible: se evita el estado de carga y se conserva el scroll,
// para que la página no dé el salto que reportaba el usuario.
// Dice algo a quien no ve la pantalla. Se vacía antes de escribir
// porque, si el texto es idéntico al anterior, el lector no lo
// vuelve a leer y el usuario se queda sin enterarse.
function anunciar(texto){
  const a = document.getElementById('anuncio');
  if (!a) return;
  a.textContent = '';
  setTimeout(() => { a.textContent = texto; }, 60);
}

// Un nombre puede ser árabe, emoji o venir vacío. <bdi> aísla la
// dirección del texto: sin él, un nombre en árabe junto a un número
// de teléfono reordena la línea entera y el teléfono aparece al
// revés.
function nom(valor, refPorDefecto){
  const t = String(valor ?? '').trim();
  if (!t) return `<span class="mono">${esc(refPorDefecto ?? '')}</span>` +
                 `<span class="csin"> sin nombre</span>`;
  return `<bdi>${esc(t)}</bdi>`;
}

// El nombre de pila, para las columnas estrechas. [...t] parte por
// caracteres reales por el mismo motivo que en inicial(): cortar un
// emoji o una letra compuesta por la mitad deja un signo roto.
function primerNombre(valor){
  const p = String(valor ?? '').trim().split(/\s+/)[0] || '';
  const c = [...p];
  return c.length > 14 ? c.slice(0, 13).join('') + '…' : p;
}

// La inicial de un nombre que puede empezar por emoji: [...t] parte
// por caracteres reales, no por unidades UTF-16, que partiría un
// emoji por la mitad y dejaría un signo roto.
function inicial(valor, refPorDefecto){
  const t = String(valor ?? '').trim();
  if (!t) return String(refPorDefecto ?? '?').slice(-2);
  return [...t][0].toUpperCase();
}

// Esqueleto con la forma de lo que va a aparecer. Que la espera
// tenga forma la hace percibirse más corta que un "Cargando…".
function esqueleto(tipo){
  if (tipo === 'latido') return `
    <div class="esq-kpis">${'<div class="esq esq-kpi"></div>'.repeat(4)}</div>
    <div class="esq esq-panel"></div>
    <div class="esq esq-panel" style="height:150px"></div>`;
  if (tipo === 'lista') return `
    <div class="esq esq-panel" style="height:72px"></div>
    ${'<div class="esq esq-fila"></div>'.repeat(6)}`;
  return `<div class="esq esq-panel"></div>
          <div class="esq esq-panel" style="height:140px"></div>`;
}

function pintaEn(html, silencioso){
  const y = window.scrollY;
  $('#vista').innerHTML = html;
  if (silencioso) window.scrollTo({ top: y, behavior: 'instant' });
}

/* ---------- el Latido no se queda nunca en el esqueleto ----------

   El 11 de octubre el Latido dejó de cargar y se quedó en el
   esqueleto gris, en el móvil y en el ordenador, sin decir nada. La
   causa fue un mensaje recibido en domingo (ver bloquePatron), pero el
   problema de fondo era otro: UN error en CUALQUIER bloque, o una sola
   lectura que fallara por la red, cortaba la pantalla entera a mitad
   de pintar. Tres reglas desde entonces:

   1. Cada bloque se pinta aislado (seguro). Si uno falla, en su sitio
      sale «No se ha podido mostrar este bloque», el resto se pinta, y
      el fallo llega al maestro como incidencia crítica.
   2. Si una lectura no llega, su bloque lo dice, no enseña un cero
      (un cero parece un dato), y arriba sale qué falta y un botón para
      reintentar. El refresco de cada 30 s lo vuelve a pedir solo.
   3. Si no llega nada, en vez del esqueleto sale qué ha pasado y
      «Reintentar ahora».

   Lo comprueba pruebas/navegador.mjs, con el panel entero en un
   navegador real: con un domingo, con cada lectura fallando, con la
   red caída y con una lectura que no contesta nunca. */

function seguro(nombre, fn, enCaso){
  try { return fn(); }
  catch (e){
    console.error(`Latido · «${nombre}» no se ha podido pintar:`, e);
    reportar(codigoDe('latido', nombre),
      `Latido: el bloque «${nombre}» no se ha podido pintar: ${e?.message || e}`,
      { pila: String(e?.stack || '').slice(0, 800) }, 'critico');
    return enCaso ?? `<div class="panel"><h3>${esc(nombre)}</h3>
      <div class="vacio">No se ha podido mostrar este bloque.<br>
        El resto del Latido funciona con normalidad.</div></div>`;
  }
}
// Lo mismo para lo que se engancha después de pintar (el mapa, los
// botones, el tooltip): si falla, se pierde eso, no la pantalla.
function tramo(nombre, fn){
  try { fn(); }
  catch (e){
    console.error(`Latido · «${nombre}» no se ha podido activar:`, e);
    reportar(codigoDe('latido_act', nombre),
      `Latido: «${nombre}» no se ha podido activar: ${e?.message || e}`,
      { pila: String(e?.stack || '').slice(0, 800) }, 'aviso');
  }
}

// Si hay un Latido pintado (aunque le falte algo). false = esqueleto o
// el aviso de que no se ha podido cargar.
let LATIDO_PINTADO = false;
// Cada carga lleva un turno. Si se pide otra mientras tanto (el
// refresco de cada 30 s y un cambio de rango, o dos toques a
// «Reintentar»), la respuesta que llegue tarde no se pinta: antes podía
// pintar los datos de 24 horas con el botón de 7 días marcado.
let TURNO_LAT = 0;
// Cargas del Latido sin terminar. El refresco automático espera a que
// vuelvan (ver tic30).
let LATIDO_EN_VUELO = 0;

function pintarSinLatido(motivo){
  LATIDO_PINTADO = false;
  $('#vista').innerHTML = `
    <h2 class="tit">El <em>latido</em></h2>
    <div class="panel"><div class="vacio">
      <strong>No se ha podido cargar el Latido.</strong><br>
      ${esc(motivo)}<br>Se vuelve a intentar solo cada 30 segundos.
      <div style="margin-top:16px">
        <button class="btn corto" id="lreint" type="button">Reintentar ahora</button>
      </div>
    </div></div>`;
  $('#lreint')?.addEventListener('click', () => pintarLatido());
}

// `forzar` = lo ha pedido la persona (rango, ⟳, «Reintentar»): si no
// llega nada, se dice aunque hubiera un Latido en pantalla. El refresco
// automático, si no llega NADA, deja el que hay. Si llega algo, se
// pinta siempre: lo que no ha llegado sale con lo último que llegó y
// marcado como «sin actualizar», así que nada se queda congelado.
async function pintarLatido(silencioso, forzar){
  const turno = ++TURNO_LAT;
  if (!silencioso){
    $('#vista').innerHTML = esqueleto('latido');
    LATIDO_PINTADO = false;
  }
  let d = null;
  LATIDO_EN_VUELO++;
  try { d = await datos(RANGO); }
  catch (e){ console.error('Latido · no se han podido leer los datos:', e); }
  finally { LATIDO_EN_VUELO--; }
  // Ya se ha pedido otra carga, o se ha cambiado de pestaña: esta
  // respuesta no se pinta (saldría encima de lo que se esté viendo).
  if (turno !== TURNO_LAT || VISTA !== 'latido') return;

  const total = Object.keys(LECTURAS_LATIDO).length;
  if (!d || d.fallos.size >= total){
    if (LATIDO_PINTADO && !forzar) return;   // se queda el que hay
    pintarSinLatido(navigator.onLine === false
      ? 'El dispositivo no tiene conexión a internet.'
      : 'No hay respuesta del servicio en este momento.');
    return;
  }

  try {
    pintarLatidoCon(d, silencioso);
    LATIDO_PINTADO = true;
  } catch (e){
    // No debería llegar aquí: cada bloque va aislado. Si llega, se dice.
    console.error('Latido · no se ha podido pintar:', e);
    reportar(codigoDe('latido', e?.message), 'El Latido no se ha podido pintar: ' + (e?.message || e),
      { pila: String(e?.stack || '').slice(0, 800) }, 'critico');
    if (silencioso && LATIDO_PINTADO) return;
    pintarSinLatido('Ha ocurrido un error al mostrarlo. Ya está registrado para revisarlo.');
  }
}

function pintarLatidoCon(d, silencioso){
  // EL MAPA SE QUEDA COMO ESTABA. Reescribir la pantalla creaba un
  // contenedor nuevo, sin mapa, y se montaba otro desde cero: cada 30
  // segundos volvía al encuadre inicial y se perdía el zoom que el
  // usuario hubiera hecho. Ahora el contenedor vivo se aparta antes de
  // reescribir y se vuelve a poner en su sitio después, con Leaflet
  // dentro intacto. Lo comprueba pruebas/refresco.mjs.
  const mapaVivo = LMAP && document.getElementById('lmapa') === LMAP.getContainer()
    ? LMAP.getContainer() : null;

  const F = d.fallos;
  const NO_LLEGA = 'No ha llegado el dato';
  // El bloque cuya lectura no ha llegado lo dice con su título, en vez
  // de desaparecer o enseñar ceros.
  const sinDato = titulo => `<div class="panel"><h3>${esc(titulo)}</h3>
    <div class="vacio">No ha llegado este dato. Se vuelve a pedir solo.</div></div>`;

  const etc = RANGO === 24 ? '24h' : RANGO === 168 ? '7 días' : '30 días';

  const kpis = seguro('Indicadores', () => {
    if (F.has('convs')) return [
      kpiPend('Personas atendidas', NO_LLEGA),
      kpiPend(`Conversaciones en ${etc}`, NO_LLEGA),
      kpiPend('Respuestas de la IA', NO_LLEGA)].join('');
    const contactos = new Set(d.convs.map(c => c.user_ref)).size;
    const auto = d.convs.reduce((s,c) => s + (Number(c.del_asistente) || 0), 0);
    const cR   = d.vivas.filter(c => new Date(c.ultima_en) > Date.now() - RANGO*36e5);
    const entr = Number(d.res.del_cliente)   || 0;
    const resp = Number(d.res.del_asistente) || 0;
    return kpi('Personas atendidas', nf.format(contactos),
            `En ${nf.format(d.convs.length)} ${
              d.convs.length === 1 ? 'conversación' : 'conversaciones'}`)
      + kpi(`Conversaciones en ${etc}`, nf.format(cR.length),
            F.has('resumen') ? 'Sin el recuento de mensajes'
              : `${nf.format(entr + resp)} ${entr + resp === 1 ? 'mensaje' : 'mensajes'}`)
      + kpi('Respuestas de la IA', nf.format(auto), 'Sin intervención humana', true);
  }, [kpiPend('Personas atendidas', 'No se ha podido calcular'),
      kpiPend(`Conversaciones en ${etc}`, 'No se ha podido calcular'),
      kpiPend('Respuestas de la IA', 'No se ha podido calcular')].join(''));

  const tiempo = F.has('lat') ? kpiPend('Tiempo de respuesta', NO_LLEGA)
    : seguro('Tiempo de respuesta', () => bloqueTiempo(d.tr),
             kpiPend('Tiempo de respuesta', 'No se ha podido calcular'));

  // «Sin mensajes en este periodo» sería falso si lo que pasa es que
  // no ha llegado el dato.
  const cardiograma = F.has('porHora')
    ? `<div class="vacio">No ha llegado el cardiograma. Se vuelve a pedir solo.</div>`
    : seguro('Cardiograma', () => grafica(d.porHora),
             `<div class="vacio">No se ha podido dibujar el cardiograma.</div>`);

  const enLista = xs => xs.length === 1 ? xs[0]
    : xs.slice(0, -1).join(', ') + ' y ' + xs[xs.length - 1];
  const faltan = [...F].map(k => LECTURAS_LATIDO[k]);
  const viejos = [...(d.viejos || [])].map(k => LECTURAS_LATIDO[k]);
  const partes = [
    faltan.length ? `${faltan.length === 1 ? 'Falta un dato' : 'Faltan datos'}: ${enLista(faltan)}.` : '',
    viejos.length ? `Sin actualizar: ${enLista(viejos)} (se ve lo último que llegó).` : ''
  ].filter(Boolean);
  const aviso = partes.length ? `<div class="lfalta" role="status">
      <span>${esc(partes.join(' '))} Se vuelve a pedir solo cada 30 segundos.</span>
      <button type="button" id="lreint">Reintentar ahora</button>
    </div>` : '';

  pintaEn(`
    <h2 class="tit">El <em>latido</em></h2>
    <p class="sub">Cada conversación que atiende la IA con tus clientes, registrada según entra.</p>
    ${aviso}

    <div class="kpis">
      ${kpis}
      ${tiempo}
    </div>

    <div class="panel">
      <div class="cabpanel">
        <div>
          <h3>Cardiograma</h3>
          <p class="ph">Mensajes entrantes ${RANGO > 48 ? 'por día' : 'por hora'}.</p>
        </div>
        <div class="rangos">
          ${[[24,'24h'],[168,'7d'],[720,'30d']].map(([h,l]) =>
            `<button class="rg${RANGO===h?' on':''}" data-h="${h}">${l}</button>`).join('')}
        </div>
      </div>
      ${cardiograma}
    </div>

    <div class="rejilla2">
      ${F.has('convs') ? sinDato(E('senales_titulo')) : seguro(E('senales_titulo'), () => bloqueSenales(d))}
      ${F.has('lugares') ? sinDato(E('servicio_titulo')) : seguro(E('servicio_titulo'), () => bloqueTemas(d, 'servicio'))}
    </div>

    <div class="rejilla2">
      ${F.has('lugares') ? sinDato(E('ubicacion_titulo')) : seguro(E('ubicacion_titulo'), () => bloqueTemas(d, 'ubicacion'))}
      ${F.has('numeros') ? sinDato('Tus números') : seguro('Tus números', () => bloqueNumeros(d.num))}
    </div>

    ${F.has('patron') ? sinDato('Cuándo escriben') : seguro('Cuándo escriben', () => bloquePatron(d))}

    <div class="rejilla2">
      ${F.has('lugares') ? sinDato('Mapa de demanda') : seguro('Mapa de demanda', () => bloqueMapa(d))}
      ${F.has('reciente') ? sinDato('Actividad reciente') : seguro('Actividad reciente', () => bloqueActividad(d))}
    </div>`, silencioso);

  tramo('Mapa', () => {
    const hueco = document.getElementById('lmapa');
    if (mapaVivo && hueco){
      hueco.replaceWith(mapaVivo);
      LMAP.invalidateSize({ animate: false });
      // Ya está montado: que el observador de carga diferida no lo
      // vuelva a montar. Solo se ponen al día los puntos, sin moverlo.
      const p = document.getElementById('panelmapa');
      if (p) p.dataset.observado = '1';
      pintarPuntos(false);
    } else if (mapaVivo){
      // Ya no hay zonas que enseñar y el bloque ha desaparecido: el mapa
      // se tira, que si no Leaflet sigue vivo sobre un elemento suelto.
      OBSMAPA?.disconnect(); OBSMAPA = null;
      LMAP.remove(); LMAP = null; LCAPA = null;
    }
  });

  $('#lreint')?.addEventListener('click', () => pintarLatido(true, true));
  tramo('Cardiograma', activarGrafico);
  tramo('Carga del mapa', enlazarPlegables);
  ULTIMOS = d;
  // El mapa lo monta su observador cuando entra en pantalla, no
  // aquí: así Leaflet solo se descarga si alguien baja hasta él.
  tramo('Señales', activarSenales);

  tramo('Actividad reciente', () => {
    // desde la actividad reciente se abre la conversación completa
    document.querySelectorAll('.feed li[data-ir]').forEach(li => {
      li.addEventListener('click', () => abrir(li.dataset.ir));
      li.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(li.dataset.ir); }
      });
    });
  });

  // El rango sí necesita volver a consultar (otra ventana temporal),
  // pero se pinta en modo silencioso para conservar el scroll. Lo pide
  // la persona: se pinta aunque falte algo (forzar).
  document.querySelectorAll('.rg[data-h]').forEach(b =>
    b.addEventListener('click', () => { RANGO = +b.dataset.h; pintarLatido(true, true); }));

  // El mapa no necesita datos nuevos: solo se reencuadra.
  document.querySelectorAll('.rg[data-m]').forEach(b =>
    b.addEventListener('click', () => { MAPA = b.dataset.m; repintarMapa(); }));
}

const kpi = (l,n,p,az) => `<div class="kpi">
  <div class="lab">${l}</div><div class="num${az?' az':''}">${n}</div><div class="pie">${p}</div></div>`;

// Un indicador sin datos todavía. Enseña un guion y por qué, en vez
// de un cero: un cero parece una medición que salió cero.
const kpiPend = (l, p) => `<div class="kpi pend">
  <div class="lab">${l}</div><div class="num">—</div><div class="pie">${p}</div></div>`;

/* El tiempo de respuesta, con su procedencia escrita debajo.

   Este indicador marcaba 0,0 s. No decía "no lo sé": decía que el
   asistente contesta al instante. Salía de promediar el hueco entre
   el mensaje del cliente y la respuesta, y n8n escribe las dos filas
   en la misma operación, así que ese hueco eran tres milisegundos.

   De ahí las dos reglas de aquí: no se enseña la cifra sin decir
   quién la ha medido, y un cero no se enseña nunca.

   Y es la MEDIANA, no la media: con latencias, una sola respuesta
   lenta arrastra la media y deja de describir lo que tarda
   normalmente. Con el número de muestras al lado, porque una mediana
   de tres respuestas no es una mediana. */
function bloqueTiempo(tr){
  const T = 'Tiempo de respuesta';
  if (!tr || !Number(tr.muestras) || tr.mediana_s == null)
    return kpiPend(T, 'Aún sin mediciones fiables');

  const s = Number(tr.mediana_s);
  // Un cero aquí es imposible, y si llegara sería que algo ha vuelto
  // a medir mal. Antes que enseñarlo, se calla.
  if (!(s > 0)) return kpiPend(T, 'Aún sin mediciones fiables');

  const n = Number(tr.muestras);
  const de = tr.fuente === 'agente'
    ? 'lo cronometra el asistente'
    : 'medido entre mensajes';
  return kpi(T, `${s.toFixed(1).replace('.', ',')}<small> s</small>`,
    `Mediana de ${nf.format(n)} ${n === 1 ? 'respuesta' : 'respuestas'} · ${de}`);
}

// Sustituye al antiguo bloque de coste. Tres partidas, cada una con su cuenta
// escrita: una cifra sin la operación que la produce no se puede
// defender delante de nadie.
//
// Lo calcula la base (mt_mis_numeros), no el navegador: el horario y
// la zona horaria del cliente ya viven allí, y así la cifra es la
// misma la mire quien la mire.
// Lo que hay que enganchar después de pintar el Latido: la carga
// diferida del mapa y el botón que lleva a Configuración.
//
// PENDIENTE: el plegado de los bloques pesados en móvil. En el
// diseño los paneles se pliegan con «Ver» / «Ocultar» en pantalla
// pequeña, y aquí todos salen abiertos: en un teléfono el Latido
// es muy largo.
function enlazarPlegables(){
  // El mapa se ve desde el principio, como en el diseño, pero
  // Leaflet son 150 KB y está al final de la página: se pide cuando
  // el panel entra en pantalla, no al cargar. Quien no baja hasta
  // ahí no lo descarga nunca.
  const cont = document.getElementById('panelmapa');
  if (cont && !cont.dataset.observado){
    cont.dataset.observado = '1';
    if ('IntersectionObserver' in window){
      const obs = new IntersectionObserver(es => {
        if (es.some(e => e.isIntersecting)){
          obs.disconnect();
          activarMapa().then(() => setTimeout(() => LMAP?.invalidateSize(), 60));
        }
      }, { rootMargin: '200px' });
      obs.observe(cont);
    } else {
      activarMapa();   // navegador antiguo: se carga y ya
    }
  }

  // El botón «i» lleva a Configuración y marca el panel: sin eso,
  // el usuario aterriza en una pantalla llena de paneles y tiene
  // que buscar a cuál venía.
  $('#binum')?.addEventListener('click', async e => {
    e.stopPropagation();
    await irA('ajustes');
    if (VISTA !== 'ajustes') return;
    const el = $('#parametros'); if (!el) return;
    const alto = document.querySelector('header')?.getBoundingClientRect().height || 0;
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - alto - 16,
                      behavior: 'smooth' });
    el.classList.add('destaca');
    setTimeout(() => el.classList.remove('destaca'), 2400);
    $('#tk')?.focus({ preventScroll: true });
  });
}

// La actividad reciente, en su propia función para poder ponerla
// junto al mapa. Sin punto de color: la segunda columna ya dice de
// quién es cada línea, y el punto obligaba a aprenderse un código.
//
// Esa columna decía "Cliente" para todo el mundo, teniendo el nombre
// a mano en mt_actividad. Doce líneas que empiezan todas igual no
// dicen nada; con el nombre se reconoce la conversación de un
// vistazo.
function bloqueActividad(d){
  if (!d.reciente || !d.reciente.length) return '';
  return `<div class="panel">
    <h3>Actividad reciente</h3>
    <p class="ph">Últimos mensajes, del más nuevo al más antiguo.</p>
    <ul class="feed">
      ${d.reciente.map(m => {
        const ref = m.user_ref || null;
        const t = limpiaMensaje(m.contenido);
        // "Cliente" se queda solo para cuando de verdad no hay
        // nombre: el número entero no cabe en la columna, y la fila
        // se abre con un clic para ver quién es.
        const ia    = m.papel !== 'human';
        const quien = ia ? 'IA'
          : (m.nombre ? `<bdi>${esc(primerNombre(m.nombre))}</bdi>` : 'Cliente');
        const pista = ia ? 'Respuesta del asistente'
          : (m.nombre || m.telefono || ref || 'Cliente');
        return `<li${ref ? ` data-ir="${esc(ref)}" tabindex="0" role="button"` : ''}>
          <span class="fh mono" title="${m.cuando ? esc(fecha(m.cuando)) : ''}">${cuandoCorto(m.cuando)}</span>
          <span class="fq${ia ? ' ia' : ''}" title="${esc(pista)}">${quien}</span>
          <span class="ft">${esc([...t].slice(0, 90).join(''))}${[...t].length > 90 ? '\u2026' : ''}</span>
        </li>`;
      }).join('')}
    </ul>
  </div>`;
}

function bloqueNumeros(n){
  if (!n) return '';
  const falta = new Set(Array.isArray(n.faltan) ? n.faltan : []);
  // Un parámetro que llega vacío también falta, lo diga o no la lista
  // `faltan`: si no, la cuenta escribía «× null min».
  if (n.ticket_medio == null)     falta.add('ticket');
  if (n.minutos_por_conv == null) falta.add('minutos');
  if (n.coste_hora == null)       falta.add('coste_hora');
  const eur = v => nf.format(Math.round(Number(v) || 0)) + ' €';

  // Una partida sin su parámetro no enseña un cero, que parecería un
  // dato: dice qué falta y dónde se pone.
  const fila = (titulo, importe, cuenta, falta_de) => `
    <div class="tn-fila">
      <div class="tn-cab"><b>${titulo}</b>
        <span class="tn-eur">${falta_de ? '—' : eur(importe)}</span></div>
      <div class="tn-cuenta${falta_de ? ' tn-falta' : ''}">${
        falta_de ? (CFG.rol === 'operador'
          || TENANT?.puede_escribir
          ? 'Falta un dato: ponlo en Configuración, en «Parámetros de cálculo».'
          : 'Falta un dato de cálculo. Pídeselo a quien administra vuestra cuenta.') : cuenta}</div>
    </div>`;

  // Las tres partidas, ordenadas por importe. "Captados fuera de
  // horario" entra en el total, como en el diseño.
  //
  // Conviene saber que no es lo mismo que las otras dos: tiempo
  // liberado son horas que nadie ha trabajado y ventas cerradas es
  // dinero firmado, mientras que esto es ingreso POSIBLE de gente
  // que quizá se habría perdido. Si alguna vez el cliente discute
  // la cifra, será por esta partida.
  const partidas = [
    [Number(n.fuera_horario_eur) || 0, fila('Captados fuera de horario', n.fuera_horario_eur,
      // "de noche o en fin de semana" solo era cierto con la franja
      // de lunes a viernes. La cuenta usa la franja configurada, así
      // que el texto tiene que decir eso y no suponerla.
      `<strong>${nf.format(n.fuera_horario)}</strong>
       ${n.fuera_horario === 1 ? 'contacto' : 'contactos'} llegados cuando
       tu equipo no estaba
       × <strong>${nf.format(n.ticket_medio)}&nbsp;€</strong> al mes`,
      falta.has('ticket') ? 'el pago medio de un cliente' : null)],
    [Number(n.tiempo_eur) || 0, fila('Tiempo liberado', n.tiempo_eur,
      // nf.format: «7,5 min» y no «7.5 min».
      `<strong>${nf.format(n.conversaciones)}</strong> ${
         Number(n.conversaciones) === 1 ? 'conversación' : 'conversaciones'}
       × <strong>${nf.format(Number(n.minutos_por_conv))}&nbsp;min</strong>
       × <strong>${nf.format(Number(n.coste_hora))}&nbsp;€</strong> la hora`,
      falta.has('minutos') || falta.has('coste_hora')
        ? 'el coste por hora o los minutos por conversación' : null)],
    [Number(n.ventas_eur) || 0, fila('Ventas cerradas', n.ventas_eur,
      `<strong>${nf.format(n.ganados)}</strong>
       ${n.ganados === 1 ? 'cliente ganado' : 'clientes ganados'}
       × <strong>${nf.format(n.ticket_medio)}&nbsp;€</strong> al mes`,
      falta.has('ticket') ? 'el pago medio de un cliente' : null)],
  ].sort((a,b) => b[0] - a[0]).map(x => x[1]).join('');

  // El total lo suma el navegador y no la base, porque la base
  // devuelve el total SIN lo de fuera de horario. Se escribe como
  // suma para que añadir una partida no obligue a acordarse de
  // tocar el total.
  const total = (Number(n.tiempo_eur) || 0)
              + (Number(n.ventas_eur) || 0)
              + (falta.has('ticket') ? 0 : Number(n.fuera_horario_eur) || 0);
  // Sin ningún dato de cálculo, el total no es 0 €: no se sabe. Un
  // «0 €/mes» enorme parecía una cifra; si falta una parte, se dice.
  const faltaT = falta.has('minutos') || falta.has('coste_hora');
  const faltaK = falta.has('ticket');
  const nada = faltaT && faltaK;

  return `<div class="panel" id="p-numeros">
    <div class="cabpanel">
      <div>
        <h3>Tus números</h3>
        <p class="ph">Calculado con tus datos de este mes.</p>
      </div>
      <button class="binfo" id="binum" title="Cambiar los valores del cálculo"
        aria-label="Cambiar los valores del cálculo en Configuración">i</button>
    </div>
    <div class="tn-total">${nada ? '—' : `${nf.format(Math.round(total))}<span>€/mes</span>`}</div>
    <div class="tn">${partidas}
      <div class="tn-tot"><span>= Total al mes${!nada && (faltaT || faltaK) ? ' (sin lo que falta)' : ''}</span>
        <span class="tn-eur">${nada ? '—' : eur(total)}</span></div>
    </div>
  </div>`;
}

function inicioPeriodo(p){
  const d = new Date();
  if (p === 'dia'){ d.setHours(0,0,0,0); return d; }
  if (p === 'semana'){
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    d.setHours(0,0,0,0); return d;
  }
  if (p === 'mes'){ d.setDate(1); d.setHours(0,0,0,0); return d; }
  if (p === 'ano'){ d.setMonth(0,1); d.setHours(0,0,0,0); return d; }
  return null;                       // 'todo'
}

// Estado de la segmentacion de senales: por periodo y por persona.
// Vive fuera de la funcion porque sobrevive a los repintados.
const SEN_PERIODOS = [['dia','Hoy'], ['semana','Semana'], ['mes','Mes'], ['ano','Año'], ['todo','Todo']];
let SEN_PER = 'todo', SEN_QUIEN = '';

// primera_en es el dato real (users.created_at en el histórico).
// Si faltara, se recurre al inicio de la sesión registrada.
const fechaConv = c => {
  const f = c.primera_en || c.primera_en || c.ultima_en;
  return f ? new Date(f) : null;
};

function segmentaConvs(d){
  let lista = d.convs;
  if (SEN_QUIEN) lista = lista.filter(c => c.user_ref === SEN_QUIEN);
  const desde = inicioPeriodo(SEN_PER);
  let sinFecha = 0;
  if (desde){
    lista = lista.filter(c => {
      const f = fechaConv(c);
      if (!f){ sinFecha++; return false; }
      return f >= desde;
    });
  }
  return { lista, desde, sinFecha };
}

function personasSenales(d){
  const refs = new Set(d.convs.map(c => c.user_ref));
  const l = CONTACTOS.length
    ? CONTACTOS.filter(c => refs.has(c.user_ref))
        .map(c => ({ ref: c.user_ref, n: c.nombre || c.telefono || c.user_ref }))
    : [...refs].map(r => ({ ref: r, n: r }));
  return l.sort((a,b) => String(a.n).localeCompare(String(b.n), 'es'));
}

function bloqueSenales(d){
  if (!d.convs.length) return '';
  return `<div class="panel" id="psen">${interiorSenales(d)}</div>`;
}

function interiorSenales(d){
  const { lista, desde, sinFecha } = segmentaConvs(d);
  const t = lista.length;
  const personas = personasSenales(d);
  const quien = personas.find(p => p.ref === SEN_QUIEN);
  const segmentado = SEN_PER !== 'todo' || !!SEN_QUIEN;

  // Las píldoras van bajo el título, como en el diseño. El
  // desplegable de personas se queda: con 39 contactos, mirar las
  // señales de uno concreto es justo lo que hace útil el bloque, y
  // sin él habría que irse a Conversaciones y perder el periodo.
  const controles = `
    <div class="segm">
      ${personas.length > 1 ? `<select class="sel" id="senquien"
          aria-label="Filtrar las señales por persona">
        <option value="">Todas las personas</option>
        ${personas.map(p => `<option value="${esc(String(p.ref))}"${
          p.ref === SEN_QUIEN ? ' selected' : ''}>${esc(String(p.n))}</option>`).join('')}
      </select>` : ''}
      <div class="rangos per">
        ${SEN_PERIODOS.map(([k,l]) => `<button class="rg${SEN_PER===k?' on':''}"
          data-p="${k}">${l}</button>`).join('')}
      </div>
    </div>`;

  // El alcance solo se escribe cuando hay algo que aclarar: sin
  // segmentar, "todas las personas, todo el histórico" es decir lo
  // obvio, y la maqueta no lo lleva.
  const quienTxt = quien ? `<strong>${esc(String(quien.n))}</strong>, ` : '';
  const nomPer = { dia:'Hoy', semana:'Esta semana', mes:'Este mes',
                   ano:'Este año', todo:'' }[SEN_PER];
  const pie = (segmentado || sinFecha) ? `<p class="segpie">${quienTxt}${
    nomPer ? nomPer + (desde ? ` desde el ${fechaCorta(desde)}` : '') + ', ' : ''
  }<strong>${nf.format(t)}</strong> ${t === 1 ? 'conversación' : 'conversaciones'}${
    sinFecha ? `, ${nf.format(sinFecha)} sin fecha ${sinFecha === 1 ? 'queda' : 'quedan'} fuera` : ''}</p>` : '';

  const cab = `
    <h3>${esc(E('senales_titulo'))}</h3>
    <p class="ph">Señales detectadas en el texto de las conversaciones.</p>
    ${controles}
    ${pie}`;

  if (!t) return `${cab}<div class="vacio">
    Ninguna conversación en este periodo.<br>
    Amplía el rango o elige otra persona.</div>`;

  const i = lista.filter(c => c.interes).length;
  const f = lista.filter(c => c.friccion).length;
  const k = lista.filter(c => c.contacto).length;
  const r = lista.filter(c => c.sin_respuesta).length;

  // Saltar a Conversaciones solo tiene sentido sin segmentar: allí no
  // hay filtro de periodo, y las cifras no coincidirían.
  const s = n => segmentado ? null : n;

  return `${cab}
    <div class="barras">
      ${barra('Interés comercial', i, t, E('interes_desc'),  'az', s('interes'))}
      ${barra('Datos de contacto', k, t, E('contacto_desc'), 'vd', s('contacto'))}
      ${barra('El asistente no supo responder', r, t,
              'Reconoció no tener el dato o derivó a una persona', 'am', s('sin_respuesta'))}
      ${barra('Fricción',          f, t, E('friccion_desc'), 'rj', s('friccion'))}
    </div>
    ${quien ? `<div class="dacc" style="margin:18px 0 0;padding:0;border:0">
      <button class="cbtn" id="senabrir">Ver la conversación completa</button>
    </div>` : ''}
`;
}

// Repinta solo el interior del bloque: no hace falta volver a
// consultar nada y la página no se mueve.
function repintarSenales(){
  const cont = $('#psen');
  if (!cont || !ULTIMOS) return;
  cont.innerHTML = interiorSenales(ULTIMOS);
  activarSenales();
}

function activarSenales(){
  const cont = $('#psen'); if (!cont) return;

  cont.querySelectorAll('.rg[data-p]').forEach(b =>
    b.addEventListener('click', () => { SEN_PER = b.dataset.p; repintarSenales(); }));

  const sel = cont.querySelector('#senquien');
  sel?.addEventListener('change', () => { SEN_QUIEN = sel.value; repintarSenales(); });

  cont.querySelector('#senabrir')
      ?.addEventListener('click', () => abrir(SEN_QUIEN));

  // desde una señal se salta a las conversaciones que la tienen
  cont.querySelectorAll('.bfila[data-sen]').forEach(b => {
    const ir = () => irASenal(b.dataset.sen);
    b.addEventListener('click', ir);
    b.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); }
    });
  });
}
// Solo se puede pulsar si hay algo que ver: llevar al usuario a
// una lista vacía sería un callejón sin salida.
const barra = (lab, n, t, pie, cl, tipo) => {
  const p = t ? (n / t * 100) : 0;
  const act = n > 0 && tipo;
  return `<div class="bfila${act ? ' pulsa' : ''}"${
      act ? ` data-sen="${tipo}" tabindex="0" role="button"
      aria-label="Ver las ${n} conversaciones con ${lab.toLowerCase()}"` : ''}>
    <div class="bcab">
      <span class="blab">${lab}${act ? '<span class="bver">Ver</span>' : ''}</span>
      <span class="bnum mono">${nf.format(n)} <small>de ${nf.format(t)}</small></span></div>
    <div class="btrack"><div class="bfill ${cl}" style="width:${Math.max(p,0.6).toFixed(1)}%"></div></div>
    <div class="bpie">${pie}</div>
  </div>`;
};

/* ---------- temas: ubicaciones y servicios ---------- */
function bloqueTemas(d, cat){
  const todos = (d.temas || []).filter(t => t.categoria === cat);
  if (!todos.length) return '';
  const gen  = todos.filter(t => t.generico);
  // Cuatro y no diez: los que van detrás tienen una o dos menciones
  // y solo alargan el panel. Lo que importa es qué piden más.
  const list = todos.filter(t => !t.generico)
    .sort((a,b) => b.conversaciones - a.conversaciones).slice(0, 4);
  if (!list.length && !gen.length) return '';
  const max = Math.max(...list.map(t => t.conversaciones), 1);
  const id = 'p-' + cat;

  return `<div class="panel" id="${id}">
      <h3>${esc(E(cat + '_titulo'))}</h3>
      <p class="ph">${esc(E(cat + '_desc'))}</p>
      ${list.length ? `<div class="barras compacta">
        ${list.map(t => `<div class="bfila">
          <div class="bcab">
            <span class="blab">${esc(t.nombre)}</span>
            <span class="bnum mono">${nf.format(t.conversaciones)}</span>
          </div>
          <div class="btrack"><div class="bfill az"
            style="width:${(t.conversaciones / max * 100).toFixed(1)}%"></div></div>
        </div>`).join('')}
      </div>` : ''}
      ${gen.length ? `<p class="nota" style="margin:${list.length ? '16px' : '0'} 0 0">
        ${gen.map(g => `${nf.format(g.conversaciones)} ${
          Number(g.conversaciones) === 1 ? 'conversación nombra' : 'conversaciones nombran'}
          ${esc(g.nombre)} sin concretar.`).join(' ')}</p>` : ''}
      ${!list.length ? `<div class="vacio">Sin menciones concretas a
        ${esc(E(cat + '_vacio'))}.</div>` : ''}
  </div>`;
}

function bloqueMapa(d){
  const pts = (d.temas || []).filter(t =>
    t.categoria === 'ubicacion' && t.lat != null && t.lng != null);
  if (!pts.length) return '';

  const grupos = {};
  pts.forEach(p => { const a = p.ambito || 'general'; (grupos[a] ||= []).push(p); });

  const claves = Object.keys(grupos).sort((a,b) =>
    ((CFG.mapas[a]?.orden ?? 99) - (CFG.mapas[b]?.orden ?? 99)) || a.localeCompare(b));
  if (!claves.length) return '';
  if (!claves.includes(MAPA)) MAPA = claves[0];

  // Si el cliente no ha puesto nombre al ámbito, el de siempre bien
  // escrito: con la clave tal cual salía «Espana».
  const NOMBRE_AMBITO = { espana:'España', madrid:'Madrid', barcelona:'Barcelona', general:'General' };
  const etq = k => CFG.mapas[k]?.etiqueta || NOMBRE_AMBITO[k] || k.charAt(0).toUpperCase() + k.slice(1);
  PUNTOS = grupos;

  // Plegado por defecto, y por un motivo que no es estético: hasta
  // que no se abre, no se descargan los 150 KB de Leaflet ni las
  // teselas. En el móvil eso es la diferencia entre un panel que
  // carga y uno que se queda pensando.
  return `<div class="panel" id="panelmapa">
    <h3>Mapa de demanda</h3>
    <p class="ph">Zonas que nombran los clientes. Cada punto marca la zona,
       no la dirección del centro.</p>
    <div class="mapacaja">
      ${claves.length > 1 ? `<div class="rangos" style="margin-bottom:12px;flex:none">
        ${claves.map(k => `<button class="rg mp${MAPA===k?' on':''}" data-m="${esc(k)}">
          ${esc(etq(k))}</button>`).join('')}
      </div>` : ''}
      <div id="lmapa" class="lmapa"></div>
    </div>
  </div>`;
}

// Teselas: Stadia "Alidade Smooth" (equivalente a Positron).
// Se autentica por dominio, así que no hay ninguna clave en el
// código. Si fallara, se cae a OpenStreetMap automáticamente.
const TESELAS = {
  principal: {
    url: 'https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png',
    attribution: '&copy; Stadia Maps &copy; OpenMapTiles &copy; OpenStreetMap',
    maxZoom: 20
  },
  respaldo: {
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19, className: 'tsuave'
  }
};

function ponerTeselas(){
  const cfg = CFG.mapas?.teselas || TESELAS.principal;
  let fallos = 0, caido = false;

  const capa = L.tileLayer(cfg.url, {
    attribution: cfg.attribution, maxZoom: cfg.maxZoom || 19,
    className: cfg.className || ''
  }).addTo(LMAP);

  // Varios errores seguidos suelen significar que el proveedor
  // no está sirviendo (dominio sin dar de alta, cuota agotada).
  capa.on('tileerror', () => {
    if (caido || ++fallos < 4) return;
    caido = true;
    capa.remove();
    L.tileLayer(TESELAS.respaldo.url, {
      attribution: TESELAS.respaldo.attribution,
      maxZoom: TESELAS.respaldo.maxZoom,
      className: TESELAS.respaldo.className
    }).addTo(LMAP);
  });
}


// ---------- el mapa se carga cuando se necesita ----------
// Leaflet son unos 150 KB de JavaScript y su hoja de estilos. Estaban
// en la cabecera, bloqueando el primer pintado, para un bloque que
// vive en una pestaña y que muchos clientes no miran nunca.
// Ahora se pide la primera vez que hay un mapa que dibujar.
// El mapa y su capa de puntos. Se guardan fuera de la funcion
// porque hay que poder destruirlos al cambiar de pestana: Leaflet
// deja el contenedor vivo y, sin esto, se acumulan mapas huerfanos.
let LMAP = null, LCAPA = null, OBSMAPA = null;
let leafletCargando = null;
function cargarLeaflet(){
  if (window.L) return Promise.resolve();
  if (leafletCargando) return leafletCargando;

  leafletCargando = new Promise((ok, mal) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    css.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
    css.crossOrigin = '';
    document.head.appendChild(css);

    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
    js.crossOrigin = '';
    js.onload = () => ok();
    js.onerror = () => { leafletCargando = null; mal(new Error('leaflet')); };
    document.head.appendChild(js);
  });
  return leafletCargando;
}

// Crea o actualiza el mapa. Se llama después de pintar la vista.
async function activarMapa(){
  const cont = document.getElementById('lmapa');
  if (!cont || !PUNTOS) return;

  // El mapa ya vive en este contenedor (el refresco lo ha devuelto a
  // su sitio): no se monta otro, que volvería al encuadre inicial.
  if (LMAP && LMAP.getContainer() === cont){ pintarPuntos(false); return; }

  try {
    await cargarLeaflet();
  } catch {
    cont.innerHTML = '<div class="vacio">No se ha podido cargar el mapa.<br>' +
      'Revisa tu conexión y vuelve a intentarlo.</div>';
    return;
  }
  // El contenedor puede haber desaparecido mientras se cargaba
  if (!document.getElementById('lmapa')) return;

  // Si había un mapa en otro contenedor (se salió del Latido y se ha
  // vuelto), ese ya no se ve: se destruye antes de crear el nuevo.
  if (LMAP){ LMAP.remove(); LMAP = null; LCAPA = null; }

  LMAP = L.map(cont, {
    zoomControl: true, scrollWheelZoom: false, attributionControl: true
  });
  ponerTeselas();

  // El scroll del ratón hace zoom solo tras pulsar en el mapa:
  // evita que se quede atrapado al desplazar la página.
  LMAP.on('click', () => LMAP.scrollWheelZoom.enable());
  LMAP.on('mouseout', () => LMAP.scrollWheelZoom.disable());

  // Leaflet mide el contenedor una vez, al crearse. Ahora la caja
  // crece con el panel de al lado, así que hay que avisarle cuando
  // cambia de tamaño: si no, pinta las teselas para la altura que
  // tenía y deja una banda gris al pie. ResizeObserver, no el
  // resize de la ventana, porque la caja también cambia cuando
  // "Actividad reciente" trae más líneas sin que nadie toque nada.
  if (typeof ResizeObserver === 'function'){
    OBSMAPA?.disconnect();
    OBSMAPA = new ResizeObserver(() => LMAP?.invalidateSize({ animate: false }));
    OBSMAPA.observe(cont);
  }

  pintarPuntos();
}

// Lo que se dibujó la última vez. Si el refresco trae las mismas
// zonas con las mismas cifras, no se redibuja nada: los puntos
// volverían a aparecer con su animación cada 30 segundos.
let LFIRMA = '';

// `reencuadrar` = al montar el mapa o al cambiar de ámbito. El
// refresco pasa false: los puntos se ponen al día y el encuadre se
// queda donde el usuario lo dejó.
function pintarPuntos(reencuadrar = true){
  if (!LMAP) return;

  const pts = (PUNTOS[MAPA] || []).filter(p => p.lat != null && p.lng != null);
  const firma = MAPA + '|' + JSON.stringify(
    pts.map(p => [p.nombre, p.lat, p.lng, p.conversaciones, p.zona || '']));
  if (!reencuadrar && LCAPA && firma === LFIRMA) return;
  LFIRMA = firma;

  if (LCAPA){ LCAPA.remove(); LCAPA = null; }
  if (!pts.length) return;

  const max = Math.max(...pts.map(p => p.conversaciones), 1);
  LCAPA = L.layerGroup().addTo(LMAP);

  // de menor a mayor: los círculos grandes quedan encima
  [...pts].sort((a,b) => a.conversaciones - b.conversaciones).forEach((p, i) => {
    const prop = p.conversaciones / max;
    const r = 9 + 20 * Math.sqrt(prop);

    const c = L.circleMarker([Number(p.lat), Number(p.lng)], {
      radius: r, color: '#1B7CFF', weight: 2,
      fillColor: '#1B7CFF', fillOpacity: 0.16 + 0.38 * prop,
      className: 'pmarca'
    }).addTo(LCAPA);

    c.bindTooltip(
      `<strong>${esc(p.nombre)}</strong>
       <span>${p.conversaciones} ${p.conversaciones === 1 ? 'conversación' : 'conversaciones'}</span>
       ${p.zona ? `<span class="tz">${esc(p.zona)}</span>` : ''}`,
      { className: 'ltip', direction: 'top', offset: [0, -r - 2], sticky: false });

    c.on('mouseover', () => c.setStyle({ weight: 3, fillOpacity: 0.62 }));
    c.on('mouseout',  () => c.setStyle({ weight: 2, fillOpacity: 0.16 + 0.38 * prop }));

    // aparición escalonada, como el resto de transiciones del panel.
    // Solo al encuadrar: en un refresco, que todos los puntos
    // parpadearan para añadir uno sería ruido.
    const el = reencuadrar ? c.getElement() : null;
    if (el){
      el.style.opacity = '0';
      el.style.transform = 'scale(.4)';
      el.style.transformOrigin = 'center';
      setTimeout(() => {
        el.style.transition = 'opacity .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1)';
        el.style.opacity = '1';
        el.style.transform = 'scale(1)';
      }, 40 + i * 45);
    }
  });

  if (!reencuadrar) return;
  const grupo = L.featureGroup(LCAPA.getLayers());
  LMAP.fitBounds(grupo.getBounds(), { padding: [46, 46], maxZoom: 14 });
}

// Cambio de ámbito: solo se repintan los puntos y se reencuadra.
// No se toca el DOM, así que la página no se mueve.
function repintarMapa(){
  document.querySelectorAll('.rg[data-m]').forEach(b =>
    b.classList.toggle('on', b.dataset.m === MAPA));
  pintarPuntos();
}

/* ---------- patrón horario ---------- */
function bloquePatron(d){
  if (!d.patron.length) return '';
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  let max = 0;
  d.patron.forEach(p => {
    // EL DOMINGO ES EL 7. mt_patron_horario da los días en isodow
    // (1 = lunes … 7 = domingo), como todo el proyecto, y esta rejilla
    // va de 0 = domingo a 6 = sábado. Se usaba el número tal cual: de
    // lunes a sábado coincide, pero el domingo pedía la fila 7, que no
    // existe, y el error tumbaba el Latido entero. Bastaba UN mensaje
    // recibido en domingo para dejar la pantalla en el esqueleto para
    // siempre, porque esta lectura no tiene ventana de tiempo.
    // % 7 deja 1…6 como están y pasa el 7 a 0.
    if (p.dia == null || p.hora == null) return;   // Number(null) sería 0: domingo
    const dd = Number(p.dia) % 7, h = Number(p.hora);
    // Una fila que no cabe en la semana no se pinta: mejor perder ese
    // dato que la pantalla.
    if (!Number.isInteger(dd) || dd < 0 || !Number.isInteger(h) || h < 0 || h > 23) return;
    const v = Number(p.mensajes) || 0;
    grid[dd][h] += v;
    if (grid[dd][h] > max) max = grid[dd][h];
  });
  if (!max) return '';

  // Franja del equipo del cliente (ajustes.horario), la misma que usa
  // mt_mis_numeros para "Captados fuera de horario". El asistente
  // responde a todas horas; esta franja solo dice cuándo había
  // alguien del equipo.
  // dias viene en formato ISO 1=lunes…7=domingo; getDay() usa 0=domingo.
  const H = CFG.horario || { inicio:9, fin:19, dias:[1,2,3,4,5] };
  // Number(): si los días llegaran como texto, «7» === 7 fallaba y todo
  // contaba como fuera de horario.
  const lab = new Set((H.dias || [1,2,3,4,5]).map(n => Number(n) % 7));
  let fuera = 0, total = 0;
  for (let dd=0; dd<7; dd++) for (let h=0; h<24; h++){
    const v = grid[dd][h]; total += v;
    if (!lab.has(dd) || h < H.inicio || h >= H.fin) fuera += v;
  }
  const pct = total ? Math.round(fuera / total * 100) : 0;
  // Un solo sitio donde se escribe la franja en palabras. Aquí había
  // una segunda versión que cogía el primer día y el último de la
  // lista: con [1,3,5] decía "lunes a viernes", que es falso.
  const rango = (H.dias || []).length
