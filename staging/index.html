    ? horarioTexto()
    : `de ${H.inicio}:00 a ${H.fin}:00`;

  const orden = [1,2,3,4,5,6,0];
  return `<div class="panel">
    <h3>Cuándo escriben</h3>
    <p class="ph">Mensajes por día y hora. <strong>${pct}%</strong> llegan cuando
       tu equipo no está (${rango}), y se atienden igual.</p>
    <div class="mapa">
      <div class="mhoras"><span></span>${
        Array.from({length:24}, (_,h) => `<span class="mh">${h%6===0?h:''}</span>`).join('')}</div>
      ${orden.map(dd => `<div class="mfila">
        <span class="md">${dias[dd]}</span>
        ${grid[dd].map((v,h) => {
          // Sin mensajes, sin estilo propio: así se ve el fondo base de la
          // celda. Con un rgba de opacidad 0 quedaba un hueco transparente.
          const o = v ? (0.14 + 0.86 * (v / max)) : 0;
          return `<span class="mc${v ? '' : ' v0'}"${v ? ` style="background:rgba(27,124,255,${o.toFixed(3)})"` : ''}
            title="${dias[dd]}, ${h}:00, ${v} ${v === 1 ? 'mensaje' : 'mensajes'}"></span>`;
        }).join('')}
      </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- cardiograma ---------- */
function grafica(ev){
  if (!ev.length) return `<div class="vacio">
    Sin mensajes en este periodo.<br>
    El primero que entre aparece aquí.</div>`;

  const porDia = RANGO > 48;
  const n      = porDia ? Math.round(RANGO/24) : RANGO;

  // `ev` viene de mt_por_hora, ya agrupado por la base EN LA ZONA
  // HORARIA DEL CLIENTE. Agrupar aquí lo haría en la del navegador,
  // y un mensaje de las 10:30 de Madrid caería en otra hora según
  // dónde esté quien mira el panel.
  // EL CAMBIO DE HORA. Las horas se cuentan por su instante real
  // (horas enteras desde 1970) y los días por su medianoche local,
  // retrocediendo con setDate. Antes se restaban 24 h y 1 h fijas: el
  // domingo del cambio de octubre salía «2:00» dos veces con el doble de
  // mensajes, y durante un mes un día se repetía y otro desaparecía.
  const clave = t => porDia
    ? new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime()
    : Math.floor(t.getTime() / 36e5);
  const conteo = new Map();
  ev.forEach(e => {
    const t = new Date(e.tramo);
    if (isNaN(t)) return;
    const k = clave(t);
    conteo.set(k, (conteo.get(k) || 0) + Number(e.mensajes || 0));
  });

  const hoy0 = new Date(); hoy0.setHours(0,0,0,0);
  const hora0 = Math.floor(Date.now() / 36e5) * 36e5;
  const cubos = Array.from({length:n}, (_,i) => {
    let t;
    if (porDia){ t = new Date(hoy0); t.setDate(hoy0.getDate() - (n-1-i)); }
    else t = new Date(hora0 - (n-1-i) * 36e5);
    return { t, n: conteo.get(clave(t)) || 0 };
  });

  const max = Math.max(...cubos.map(h => h.n), 1);
  const W = 1000, H = 190;
  const pts = cubos.map((h,i) => [
    (i/Math.max(cubos.length-1,1))*W,
    H - (h.n/max)*(H-34) - 17
  ]);
  const linea = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area  = `M0 ${H} L` + pts.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L') + ` L${W} ${H} Z`;
  const et = d => porDia
    ? d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' })
    : d.getHours() + ':00';
  const etLargo = d => porDia
    ? d.toLocaleDateString('es-ES', { weekday:'long', day:'2-digit', month:'long' })
    : d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' }) +
      ', ' + d.getHours() + ':00 h';
  const ancho = W / cubos.length;

  return `<div class="graf" id="graf">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
        aria-label="Mensajes entrantes a lo largo del periodo">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1B7CFF" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#1B7CFF" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#E2E8F0" stroke-width="1"/>
      <path d="${area}" fill="url(#g)"/>
      <path d="${linea}" fill="none" stroke="#1B7CFF" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>
      <line id="guia" x1="0" y1="0" x2="0" y2="${H}" stroke="#1B7CFF"
            stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      ${pts.map((p,i) => cubos[i].n > 0
        ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#1B7CFF"/>` : '').join('')}
      <circle id="foco" r="6" fill="#fff" stroke="#1B7CFF" stroke-width="2.5" opacity="0"/>
      ${cubos.map((c,i) => `<rect x="${(i*ancho).toFixed(1)}" y="0"
          width="${ancho.toFixed(1)}" height="${H}" fill="transparent"
          data-i="${i}" data-x="${pts[i][0].toFixed(1)}" data-y="${pts[i][1].toFixed(1)}"
          data-n="${c.n}" data-t="${esc(etLargo(c.t))}" class="hit"/>`).join('')}
    </svg>
    <div class="tip" id="tip" hidden></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#64748B;margin-top:9px"
         class="mono">
      <span>${et(cubos[0].t)}</span>
      <span>${et(cubos[Math.floor(cubos.length/2)].t)}</span>
      <span>${et(cubos[cubos.length-1].t)}</span>
    </div>
  </div>`;
}

// Tooltip del cardiograma: se engancha tras pintar el bloque.
function activarGrafico(){
  const cont = $('#graf'); if (!cont) return;
  const svg = cont.querySelector('svg');
  const tip = $('#tip'), guia = $('#guia'), foco = $('#foco');
  if (!svg || !tip) return;

  cont.querySelectorAll('.hit').forEach(r => {
    const mostrar = e => {
      const n = r.dataset.n, x = +r.dataset.x, y = +r.dataset.y;
      guia.setAttribute('x1', x); guia.setAttribute('x2', x);
      guia.setAttribute('opacity', '1');
      foco.setAttribute('cx', x); foco.setAttribute('cy', y);
      foco.setAttribute('opacity', n > 0 ? '1' : '0');

      tip.innerHTML = `<strong>${n} ${n === '1' ? 'mensaje' : 'mensajes'}</strong>
                       <span>${r.dataset.t}</span>`;
      tip.hidden = false;

      const caja = cont.getBoundingClientRect();
      const px = (e.touches ? e.touches[0].clientX : e.clientX) - caja.left;
      const ancho = tip.offsetWidth || 130;
      tip.style.left = Math.max(4, Math.min(px - ancho/2, caja.width - ancho - 4)) + 'px';
      tip.style.top  = Math.max(0, (y / 190) * caja.height - 52) + 'px';
    };
    r.addEventListener('mousemove', mostrar);
    r.addEventListener('touchstart', mostrar, { passive:true });
  });

  const ocultar = () => {
    tip.hidden = true;
    guia.setAttribute('opacity','0');
    foco.setAttribute('opacity','0');
  };
  cont.addEventListener('mouseleave', ocultar);
  cont.addEventListener('touchend', ocultar);
}

function irASenal(tipo){
  FILTRO = new Set([tipo]);
  VISTA = 'convs';
  document.querySelectorAll('nav button').forEach(x =>
    x.classList.toggle('on', x.dataset.v === 'convs'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  pintarConvs();
}

/* ---------- vista: conversaciones ----------
   Se agrupa por PERSONA, no por sesión. El corte a 30 minutos
   sigue existiendo para las métricas, pero aquí sería confuso:
   el usuario piensa en "mi conversación con X", no en sesiones. */
let CONTACTOS = [], ABIERTO = null;
// Filtros activos en Conversaciones. Se combinan con Y: marcar
// "Interés" y "Contacto" da los leads listos para llamar.
let FILTRO = new Set();
// Ordenar importa más de lo que parece: con 26 personas se navega
// a ojo, con 300 no. Por defecto, quien escribió más recientemente.
let ORDEN = 'reciente';
const ORDENES = {
  reciente: { etq:'Más reciente', fn:(a,b) => new Date(b.ultima) - new Date(a.ultima) },
  mensajes: { etq:'Más mensajes', fn:(a,b) => Number(b.mensajes) - Number(a.mensajes) },
  nombre:   { etq:'Por nombre',   fn:(a,b) =>
      (a.nombre || '\uffff').localeCompare(b.nombre || '\uffff', 'es') }
};
const ordena = l => [...l].sort(ORDENES[ORDEN].fn);
const SENALES = {
  interes:       { etq: 'Interés',       campo: c => c.interes,        pill: 'az' },
  contacto:      { etq: 'Con contacto',  campo: c => c.contacto,       pill: 'nt' },
  cita:          { etq: 'Con cita',      campo: c => !!c.cita,         pill: 'vd' },
  sin_respuesta: { etq: 'Sin respuesta', campo: c => c.sin_respuesta,  pill: 'am' },
  friccion:      { etq: 'Fricción',      campo: c => c.friccion,       pill: 'rj' },
  vuelto:        { etq: 'Ha vuelto',     campo: c => Number(c.conversaciones) > 1, pill: 'nt' },
  // Estos dos solo aparecen si hay alguien así: los filtros con cero
  // resultados se esconden solos. Hacen falta para poder encontrar a
  // quien se dejó fuera y volver a incluirlo.
  pausado:       { etq: 'En pausa',      campo: c => !!c.pausado_hasta, pill: 'nt' },
  fuera:         { etq: 'Fuera del recuento', campo: c => !!c.fuera_del_recuento, pill: 'nt' },
  contactado:    { etq: 'Contactado por fuera', campo: c => CONTACTADOS.has(c.user_ref), pill: 'nt' }
};
const aplicaFiltros = (lista, filtros) =>
  lista.filter(c => [...filtros].every(k => SENALES[k].campo(c)));

// Turno y cargas en marcha, como en el Latido: mientras la pantalla está
// en el esqueleto, el refresco no encuentra la lista y lanzaba OTRA carga
// completa, que al llegar tarde volvía a pintarlo todo encima.
let TURNO_CONVS = 0, CONVS_EN_VUELO = 0;
async function pintarConvs(silencioso){
  const turno = ++TURNO_CONVS;
  if (!silencioso) $('#vista').innerHTML =
    esqueleto('lista');

  CONVS_EN_VUELO++;
  let data, error;
  try { ({ data, error } = await supabase.rpc('mt_mis_contactos')); }
  finally { CONVS_EN_VUELO--; }
  // Si mientras llegaba la respuesta se ha pedido otra carga, o se ha
  // cambiado de pestaña, no se pinta: escribiría encima de lo que hay.
  if (turno !== TURNO_CONVS || VISTA !== 'convs') return;
  ULTIMA = Date.now(); pintarCuando();

  if (error){
    pintaEn(`<h2 class="tit">Conversaciones</h2><div class="panel">
      <div class="vacio">No se han podido cargar.<br>${esc(mensajeError(error))}</div>
    </div>`, silencioso);
    return;
  }
  CONTACTOS = data || [];
  await leerContactados();
  if (turno !== TURNO_CONVS || VISTA !== 'convs') return;

  pintaEn(`
    <h2 class="tit">Conversaciones</h2>
    <p class="sub">Todas las personas que han escrito a tu asistente,
       con su historial completo.</p>
    <div class="convs2">
      <div class="panel" id="pconvs"></div>
      <div id="pdetalle" class="panel vacio-det">
        Elige a alguien de la lista para ver su conversación.
      </div>
    </div>`, silencioso);

  render();

  // Al volver a la pestaña, la fila de quien se estaba leyendo sale
  // resaltada (render la marca con ABIERTO). Si la columna se quedara
  // en «Elige a alguien», la pantalla diría dos cosas a la vez, así
  // que se vuelve a abrir. Solo en pantalla ancha: en el móvil la
  // conversación va en una ventana encima, y abrirla sola sería
  // tapar la lista sin que nadie lo haya pedido.
  if (ABIERTO && window.innerWidth > 1000){
    const visible = [...document.querySelectorAll('.pers[data-c]')]
      .some(el => el.dataset.c === ABIERTO);
    if (visible) abrir(ABIERTO);
  }
}

// El refresco de esta pantalla, sin reescribirla. La lista se pone al
// día (alguien nuevo, una marca de «en pausa»…) y la conversación
// abierta se queda abierta, con los mensajes nuevos al final.
async function refrescarConvs(){
  if (!$('#pconvs')) return CONVS_EN_VUELO ? undefined : pintarConvs(true);

  const { data, error } = await supabase.rpc('mt_mis_contactos');
  // Un fallo de red en un refresco no es motivo para vaciar la
  // pantalla: se queda lo que había y se reintenta en 30 segundos.
  if (error || VISTA !== 'convs' || !$('#pconvs')) return;
  ULTIMA = Date.now(); pintarCuando();
  CONTACTOS = data || [];

  // Si mientras tanto alguien se ha puesto a escribir en el buscador,
  // repintar la lista le quitaría el foco a mitad de palabra.
  if (!escribiendo()) render($('#buscar')?.value.trim() || '');
  await refrescarDetalle();
}

// Repinta solo el interior del panel: los filtros son instantáneos
// porque no hay que volver a consultar nada.
function render(busqueda){
  const cont = $('#pconvs'); if (!cont) return;
  const lista = aplicaFiltros(CONTACTOS, FILTRO);
  // Los que el cliente ha dejado fuera siguen en la lista —si no,
  // no podría volver a incluirlos— pero el recuento tiene que decir
  // cuántos son, o la cifra de aquí no cuadraría con la del Latido.
  const fuera = lista.filter(c => c.fuera_del_recuento).length;

  // Cada filtro muestra cuántos resultados daría AÑADIRLO a la
  // selección actual. Si daría cero, se desactiva: así nunca se
  // llega a una lista vacía.
  const chips = Object.entries(SENALES).map(([k, s]) => {
    const activo = FILTRO.has(k);
    const prueba = new Set(FILTRO);
    activo ? prueba.delete(k) : prueba.add(k);
    const n = activo
      ? lista.length
      : aplicaFiltros(CONTACTOS, prueba).length;
    return { k, s, activo, n };
  }).filter(c => c.activo || c.n > 0);


  cont.innerHTML = `
    <div class="cabpanel">
      <div>
        <h3>${nf.format(lista.length)} ${lista.length === 1 ? 'persona' : 'personas'}</h3>
        ${FILTRO.size || fuera
          ? `<p class="ph" style="margin:2px 0 0">${
              FILTRO.size ? `de ${nf.format(CONTACTOS.length)}` : ''}${
              FILTRO.size && fuera ? ' · ' : ''}${
              fuera ? `${nf.format(fuera)} fuera del recuento` : ''}</p>`
          : ''}
      </div>
    </div>

    <div class="barrafil">
      <input id="buscar" class="busca" type="search"
             placeholder="Buscar por nombre, teléfono o email…"
             autocomplete="off" value="${esc(busqueda || '')}">
      <div class="orden">
        ${Object.entries(ORDENES).map(([k,o]) =>
          `<button class="${ORDEN===k?'on':''}" data-o="${k}">${o.etq}</button>`).join('')}
      </div>
    </div>

    <div class="chips">
      ${chips.map(c => `<button class="chip ${c.s.pill}${c.activo ? ' on' : ''}"
          data-f="${c.k}" aria-pressed="${c.activo}">
        ${esc(c.s.etq)}<span class="cn">${nf.format(c.n)}</span>
      </button>`).join('')}
      ${FILTRO.size ? '<button class="chip limpia" id="limpiar">Quitar filtros</button>' : ''}
    </div>

    <div class="lista" id="plista">${lista.length
      ? ordena(lista).slice(0,150).map(filaC).join('')
      : '<div class="vacio">Ninguna persona con esos filtros.</div>'}</div>
    ${lista.length > 150 ? `<p class="nota">Se muestran las 150 primeras de
       ${nf.format(lista.length)}. Afina con el buscador o los filtros.</p>` : ''}`;

  enlazarFilas();

  cont.querySelectorAll('.chip[data-f]').forEach(b =>
    b.addEventListener('click', () => {
      const k = b.dataset.f;
      FILTRO.has(k) ? FILTRO.delete(k) : FILTRO.add(k);
      render();
    }));
  $('#limpiar')?.addEventListener('click', () => { FILTRO.clear(); render(); });

  cont.querySelectorAll('.orden button[data-o]').forEach(b =>
    b.addEventListener('click', () => {
      ORDEN = b.dataset.o;
      render($('#buscar')?.value.trim() || '');
    }));

  const inp = $('#buscar');
  let tmr = null;
  inp.addEventListener('input', () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => filtrar(inp.value.trim()), 280);
  });
  BUSCA = busqueda || '';
  if (busqueda) filtrar(busqueda);
}

// Cada búsqueda lleva un turno: si se escribe otra cosa (o se borra)
// mientras el servidor busca, su respuesta llega tarde y no se pinta.
// Antes pisaba la lista nueva con «Ninguna conversación contiene…».
let TURNO_BUS = 0;
async function filtrar(q){
  const turno = ++TURNO_BUS;
  const cont = $('#plista');
  if (!cont) return;
  BUSCA = q || '';
  const base = aplicaFiltros(CONTACTOS, FILTRO);
  const pinta = (l, vacio) => {
    cont.innerHTML = l.length ? ordena(l).slice(0,150).map(filaC).join('')
                              : `<div class="vacio">${vacio}</div>`;
    enlazarFilas();
  };

  if (!q){ pinta(base, 'Ninguna persona con esos filtros.'); return; }

  // Se normalizan acentos y mayúsculas en ambos lados: buscar
  // "jose" tiene que encontrar a "José", y era el fallo más
  // frecuente del buscador anterior.
  const norm = t => String(t || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const n = norm(q);
  const soloNum = q.replace(/[^0-9]/g, '');

  const local = base.filter(c =>
    norm(c.nombre).includes(n) ||
    norm(c.email).includes(n) ||
    (soloNum.length >= 3 &&
      ((c.telefono || '') + (c.user_ref || '')).includes(soloNum)));

  // Con un texto que parece un teléfono no se busca en los
  // mensajes: encontraría cualquier conversación que mencione
  // esos dígitos y confundiría más que ayudar.
  if (local.length || /^[0-9+ ()-]{3,}$/.test(q)){
    pinta(local, `Nadie coincide con «${esc(q)}».`);
    return;
  }

  cont.innerHTML = '<div class="vacio">Buscando en los mensajes…</div>';
  // La búsqueda ignora acentos porque mt_buscar compara contra el
  // texto normalizado: "coruna" encuentra "A Coruña".
  const { data, error } = await supabase.rpc('mt_buscar', { p_texto: q, p_limite: 500 });
  if (turno !== TURNO_BUS || cont !== $('#plista')) return;
  // Si la búsqueda falla, se dice. Antes salía «Ninguna conversación
  // contiene…», que es falso: no se había podido mirar.
  if (error){
    cont.innerHTML = `<div class="vacio">No se ha podido buscar «${esc(q)}» en los mensajes.<br>
      Inténtalo de nuevo en un momento.</div>`;
    return;
  }
  const refs = new Set((data || []).map(r => r.user_ref));
  const r = base.filter(c => refs.has(c.user_ref ?? c.user_ref));
  // Al buscar dentro de los mensajes, resaltar el nombre no
  // aporta: la coincidencia está en la conversación, no aquí.
  BUSCA = '';
  cont.innerHTML = r.length
    ? ordena(r).slice(0,150).map(filaC).join('')
      + `<p class="nota">${nf.format(r.length)} ${r.length === 1
          ? 'persona escribió' : 'personas escribieron'} «${esc(q)}» en sus mensajes.</p>`
    : `<div class="vacio">Ninguna conversación contiene «${esc(q)}».</div>`;
  enlazarFilas();
}

// Una persona por fila. El identificador manda: si tiene nombre,
// el nombre; si no, el teléfono, y se dice que no hay nombre en
// vez de dejar el hueco. Antes ambos casos se veían igual de
// pequeños y costaba distinguir a quién estabas mirando.
let BUSCA = '';

// Esta tomaba un contacto y partía con n[0], que corta por unidades
// UTF-16: un nombre que empieza por emoji devolvía medio carácter y
// se veía un signo roto. Ahora delega en inicial(), que parte por
// caracteres reales.
const inicialDe = c => {
  const n = (c.nombre || '').trim();
  return n ? inicial(n) : null;
};

// Resalta lo buscado sin romper el escapado: se escapa primero y
// se marca después sobre el texto ya seguro.
//
// El resaltado tiene que ignorar los acentos igual que la
// búsqueda. Si no, escribes "jose", la fila de José aparece y
// nada se marca: parece que el buscador se ha equivocado. No se
// puede normalizar el texto y buscar en él, porque quitar los
// acentos cambia las posiciones; se amplía cada letra de la
// consulta a las variantes que puede tener en el texto.
const ACENTOS = {
  a:'aáàâäã', e:'eéèêë', i:'iíìîï', o:'oóòôöõ',
  u:'uúùûü',  n:'nñ',    c:'cç',    y:'yý'
};
function regexBusqueda(q){
  const partes = [...q].map(ch => {
    const b = ch.toLowerCase();
    if (ACENTOS[b]) return '[' + ACENTOS[b] + ACENTOS[b].toUpperCase() + ']';
    return ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  });
  return new RegExp(partes.join(''), 'gi');
}

function marca(txt){
  const t = esc(String(txt ?? ''));
  if (!BUSCA) return t;
  try {
    // Se marca sobre el texto ya escapado, así que hay que evitar
    // pintar dentro de una entidad como &amp; o &lt;.
    // Las entidades se saltan enteras: buscar «39» marcaba dentro del
    // &#39; de una comilla y la fila enseñaba «D&#39;Angelo».
    const re = regexBusqueda(BUSCA);
    return t.replace(/(&#?\w+;)|([^&]+)/g, (m, ent, txt) =>
      ent || txt.replace(re, x => `<mark>${x}</mark>`));
  } catch { return t; }
}

// "hace 3 h" dice más que una fecha para saber si alguien acaba
// de escribir. Pasada la semana, la fecha vuelve a ser más útil.
function desdeEntonces(d){
  if (!d) return { txt:'—', frio:true };
  const ms = Date.now() - new Date(d).getTime();
  const min = Math.round(ms/6e4);
  if (min < 2)     return { txt:'ahora mismo', frio:false };
  if (min < 60)    return { txt:`hace ${min} min`, frio:false };
  const h = Math.round(min/60);
  if (h < 24)      return { txt:`hace ${h} h`, frio:false };
  const dd = Math.round(h/24);
  if (dd < 7)      return { txt:`hace ${dd} ${dd===1?'día':'días'}`, frio:false };
  return { txt: fechaCorta(d), frio:true };
}

const filaC = c => {
  const ini = inicialDe(c);
  const act = c.historico ? { txt:'histórico', frio:true } : desdeEntonces(c.ultima);
  // El estado va primero: cambia cómo hay que leer el resto de la
  // fila. Si alguien está fuera del recuento, saber que tiene
  // "Interés" importa menos que saber que no cuenta.
  const senales = [
    c.fuera_del_recuento ? '<span class="pill hist">Fuera del recuento</span>' : '',
    CONTACTADOS.has(c.user_ref) ? '<span class="pill hist">Contactado por fuera</span>' : '',
    c.pausado_hasta      ? '<span class="pill nt">En pausa</span>'             : '',
    c.cita          ? '<span class="pill vd">Cita</span>'          : '',
    c.interes       ? '<span class="pill az">Interés</span>'       : '',
    c.contacto      ? '<span class="pill nt">Contacto</span>'      : '',
    c.sin_respuesta ? '<span class="pill am">Sin respuesta</span>' : '',
    c.friccion      ? '<span class="pill rj">Fricción</span>'      : ''
  ].join('');

  return `<div class="pers${c.user_ref === ABIERTO ? ' on' : ''}" data-c="${esc(c.user_ref)}" tabindex="0" role="button">
    <div class="ini${ini ? '' : ' anon'}">${ini ? esc(ini) : '·'}</div>
    <div class="pcuerpo">
      <div class="pnom">${c.nombre
        ? `<bdi>${marca(c.nombre)}</bdi>`
        : `<span class="mono">${marca(c.telefono || c.user_ref)}</span>
           <span class="csin"> sin nombre</span>`}</div>
      <div class="pdat">${c.nombre
        ? `<span class="mono">${marca(c.telefono || c.user_ref)}</span>`
        : (c.email ? marca(c.email) : '')}</div>
      ${senales ? `<div class="pmarcas">${senales}</div>` : ''}
    </div>
    <div class="pact">
      <div class="pcuando${act.frio ? ' frio' : ''}">${esc(act.txt)}</div>
      <div class="pmsg">${nf.format(c.mensajes)} ${Number(c.mensajes) === 1 ? 'mensaje' : 'mensajes'}</div>
    </div>
  </div>`;
};

function enlazarFilas(){
  document.querySelectorAll('.pers[data-c]').forEach(el => {
    const ir = () => abrir(el.dataset.c);
    el.addEventListener('click', ir);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); }
    });
  });
}

/* ---------- vista: agenda ----------
   Las citas ya las guarda el agente en la tabla users mediante
   su herramienta "Save Data". Aquí solo se presentan.          */
async function pintarAgenda(silencioso){
  if (!silencioso) $('#vista').innerHTML = esqueleto('lista');

  // Con el correo activado, la Agenda junta WhatsApp y correo: visitas y cifras del embudo.
  const conCorreo = correoPermitido() && CO.cliente === 'oficinasya';
  const [{ data, error }, resumenWa] = await Promise.all([
    supabase.rpc('mt_mis_citas'),
    conCorreo ? supabase.rpc('mt_embudo_resumen').then(r => r, () => ({ error: true })) : Promise.resolve(null)
  ]);
  // Si mientras tanto se ha cambiado de pestaña, no se pinta encima.
  if (VISTA !== 'agenda') return;
  ULTIMA = Date.now(); pintarCuando();

  if (error){
    pintaEn(`<h2 class="tit">Agenda</h2><div class="panel">
      <div class="vacio">No se ha podido cargar la agenda.<br>${esc(mensajeError(error))}</div>
    </div>`, silencioso);
    return;
  }

  const citas = conCorreo ? [...(data || []).map(c => ({ ...c, canal:'whatsapp' })), ...coCitasCorreo()] : (data || []);
  const ahora = Date.now();
  const vivas = citas.filter(c => c.estado !== 'cancelada');
  const canceladas = citas.filter(c => c.estado === 'cancelada');
  const conFecha = vivas.filter(c => c.cuando);
  const proximas = conFecha.filter(c => new Date(c.cuando) >= ahora)
    .sort((a,b) => new Date(a.cuando) - new Date(b.cuando));
  const pasadas  = conFecha.filter(c => new Date(c.cuando) < ahora)
    .sort((a,b) => new Date(b.cuando) - new Date(a.cuando));
  const sinFecha = vivas.filter(c => !c.cuando);

  pintaEn(`
    <h2 class="tit">Agenda</h2>
    <p class="sub">${conCorreo ? 'Las visitas de WhatsApp y de correo, juntas.' : 'Las citas que ha agendado el asistente.'}</p>

    ${conCorreo ? coResumenCanales(resumenWa) : ''}

    <div class="kpis">
      ${kpi('Próximas citas', nf.format(proximas.length),
            proximas.length ? 'La más cercana, ' + fechaCorta(proximas[0].cuando) : 'Ninguna pendiente')}
      ${kpi('Citas agendadas', nf.format(vivas.length), 'Desde el inicio del servicio', true)}
      ${kpi('Ya celebradas', nf.format(pasadas.length), 'Con fecha pasada')}
      ${kpi('Canceladas', nf.format(canceladas.length),
            citas.length ? `${Math.round(canceladas.length / citas.length * 100)}% del total` : '—')}
    </div>

    ${bloqueCitas('Próximas', proximas, true)}
    ${bloqueCitas('Anteriores', pasadas.slice(0, 25), false)}
    ${sinFecha.length ? bloqueCitas('Sin fecha', sinFecha, false) : ''}
    ${canceladas.length ? bloqueCitas('Canceladas', canceladas.slice(0, 15), false) : ''}

    ${!citas.length ? `<div class="panel"><div class="vacio">
      <strong>Sin citas por ahora.</strong><br>
        Aparecerán aquí cuando el asistente agende la primera.</div></div>` : ''}`,
    silencioso);

  document.querySelectorAll('.ics').forEach(b =>
    b.addEventListener('click', () => descargarICS(JSON.parse(b.dataset.c))));
}

function bloqueCitas(titulo, lista, destacar){
  if (!lista.length) return '';
  return `<div class="panel">
    <h3>${titulo}</h3>
    <p class="ph">${nf.format(lista.length)} ${lista.length===1?'cita':'citas'}</p>
    <div class="citas">
      ${lista.map(c => `<div class="cita${destacar?' pr':''}${
          c.estado === 'cancelada' ? ' can' : ''}">
        <div class="cfecha">
          ${c.cuando ? `<span class="cdia">${new Date(c.cuando).toLocaleDateString('es-ES',
                {day:'2-digit'})}</span>
            <span class="cmes">${new Date(c.cuando).toLocaleDateString('es-ES',
                {month:'short'})}</span>
            <span class="chora mono">${new Date(c.cuando).toLocaleTimeString('es-ES',
                {hour:'2-digit',minute:'2-digit'})}</span>`
            : `<span class="cmes">sin fecha</span>`}
        </div>
        <div class="ccuerpo">
          <strong>${c.nombre ? esc(c.nombre) : esc(c.telefono || c.email || 'Contacto')}${c.canal
            ? ` <span class="pill ${c.canal === 'correo' ? 'az' : 'vd'} co-canal">${c.canal === 'correo' ? 'Correo' : 'WhatsApp'}</span>` : ''}</strong>
          ${c.descripcion ? `<span>${esc(c.descripcion)}</span>` : ''}
          <span class="cmeta mono">${esc(c.telefono || '')}${

        </div>
        <div class="cacc">
          ${telefonoE164(c.telefono) ? `<a class="cbtn" href="tel:${esc(telefonoE164(c.telefono))}">Llamar</a>` : ''}
          ${c.cuando && c.estado !== 'cancelada' ? `<button class="cbtn ics"
              data-c="${esc(JSON.stringify({t:c.nombre||c.telefono||c.email||'contacto',d:c.descripcion||'',
                            w:c.cuando,e:c.email||'',p:c.telefono||''}))}">Calendario</button>` : ''}
          ${/^https?:\/\//i.test(c.enlace || '') && c.estado !== 'cancelada' ? `<a class="cbtn" href="${esc(c.enlace)}"
              target="_blank" rel="noopener noreferrer">Reagendar</a>` : ''}
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

// Genera un .ics estándar: se abre en Google Calendar, Outlook,
// Apple Calendar o el que tenga configurado el usuario.
function descargarICS(c){
  const ini = new Date(c.w);
  const fin = new Date(ini.getTime() + 60*60*1000);
  const z = d => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const esc2 = s => String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SimpliaSpain//Panel//ES',
    'BEGIN:VEVENT',
    'UID:' + Date.now() + '@simpliaspain',
    'DTSTAMP:' + z(new Date()),
    'DTSTART:' + z(ini),
    'DTEND:'   + z(fin),
    'SUMMARY:' + esc2('Cita con ' + c.t),
    'DESCRIPTION:' + esc2((c.d ? c.d + '\n' : '') +
        (c.p ? 'Teléfono: ' + c.p + '\n' : '') + (c.e ? 'Email: ' + c.e : '')),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');

  // globalThis.URL y no URL a secas: arriba del todo hay una constante
  // URL con la dirección de Supabase que tapa a la del navegador, y
  // URL.createObjectURL sobre un texto no existe. El botón
  // «Calendario» de la Agenda lanzaba un error y no descargaba nada.
  const url = globalThis.URL.createObjectURL(new Blob([ics], {type:'text/calendar;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'cita.ics'; a.click();
  setTimeout(() => globalThis.URL.revokeObjectURL(url), 1000);
}

  // su email sin tocar unas cifras que no son suyas.
  // `comprobar(data, enviado)`: si devuelve un texto, no se ha guardado

  const guardar = async (boton, mensaje, campos, textoOk, comprobar, llamar) => {

    b.disabled = true; b.textContent = 'Guardando…'; m.textContent = '';
    try {
      const enviado = campos();

      // los valores nuevos sin recargar la página.

      m.className = 'msg-ok';
      anunciar(textoOk);

  // Lo guardado puede venir como lista (lo normal) o como el texto

  let correos = Array.isArray(a.email_avisos) ? a.email_avisos.map(String)

    const caja = $('#emails'); if (!caja) return;
    caja.innerHTML = filasCorreo(correos);

    // Cada tecleo se guarda en el array: si no, añadir o quitar una
    // fila repinta y se pierde lo que se estaba escribiendo en las
    // demás.
    caja.querySelectorAll('.fmail input').forEach(inp =>
      inp.addEventListener('input', () => { correos[Number(inp.id.slice(2))] = inp.value; }));
    caja.querySelectorAll('button[data-q]').forEach(b =>
      b.addEventListener('click', () => {
        correos.splice(Number(b.dataset.q), 1);
        if (!correos.length) correos = [''];

      }));

    const mas = $('#masmail');
    if (mas) mas.disabled = correos.length >= 5;
    if (foco != null) $('#ea' + foco)?.focus();
  };
  pintaCorreos();

  $('#masmail')?.addEventListener('click', () => {

    guardar('#guardar', '#msg',
      () => ({ email_avisos: correos.map(s => s.trim()).filter(Boolean) }),
      'Cambios guardados.'));

  // Los tres parámetros. Se leen como se escriben en España («22,5»,
  // «1.450»): con campos numéricos, Safari devolvía vacío para «22,5» y
  // se guardaba como si se hubiera borrado el dato.
  const PARAMS = [
    ['#tk', 'ticket_medio_eur',         'El pago medio de un cliente',  100000, 'tiene'],
    ['#mn', 'minutos_por_conversacion', 'Los minutos por conversación', 480,    'tienen'],
    ['#ch', 'coste_hora_eur',           'El coste por hora',            1000,   'tiene']
  ];
  $('#guardarpar')?.addEventListener('click', () => {
    const m = $('#msgpar');
    const vals = {};
    for (const [sel, clave, nombre, max, tiene] of PARAMS){
      const v = leerNumero($(sel).value);
      if (v === undefined){
        m.textContent = `${nombre} ${tiene} que ser un número, por ejemplo 350 o 22,5.`;
        m.className = 'msg-err'; $(sel).focus(); return;
      }
      if (v !== null && (v < 0 || v > max)){
        m.textContent = `${nombre} ${tiene} que estar entre 0 y ${nf.format(max)}.`;
        m.className = 'msg-err'; $(sel).focus(); return;
      }
      vals[clave] = v;
    }
    guardar('#guardarpar', '#msgpar', () => vals,
      'Guardado. «Tus números» ya usa los nuevos valores.',
      // La base anterior a la 119 se saltaba estos datos sin dar error:
      // sin esta comprobación, el panel decía «Guardado» y no lo estaba.
      (data, enviado) => Object.entries(enviado).every(([k, v]) =>
          v === null ? data?.[k] == null : Math.abs(Number(data?.[k]) - v) < 0.06)
        ? null
        : 'No se ha guardado: al servidor le falta una actualización. Avísanos y lo arreglamos.',
      guardarParametros);
  });

  /* ---- el horario del equipo ---- */
  $('#dias')?.querySelectorAll('button[data-d]').forEach(b =>
    b.addEventListener('click', () =>
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true')));

  $('#guardarhor')?.addEventListener('click', async () => {
    const dias = [...$('#dias').querySelectorAll('button[aria-pressed="true"]')]
      .map(b => Number(b.dataset.d)).sort((x, y) => x - y);
    if (!dias.length){

      () => ({ horario: { inicio: Number($('#hi').value),
                          fin:    Number($('#hf').value), dias } }),

    // fuera de horario con ella: si no se actualiza aquí, la pantalla
    // y el cálculo discrepan hasta recargar.
    if (CFG.ajustes?.horario) CFG.horario = CFG.ajustes.horario;
  });
}

// Los tres parámetros de cálculo se guardan con su propia función
// (migración 120), que no depende de cómo esté mt_guardar_ajustes. Si el
// servidor aún no la tiene, se intenta como antes, con mt_guardar_ajustes
// (vale si está la 119); y si tampoco los guarda, la comprobación de
// después lo dice en vez de enseñar «Guardado».
// Solo «el servidor no tiene ESTA función»: otro error de una función
// que falte DENTRO de ella es un fallo de verdad y se cuenta.
// (Declaraciones de función, no const: el envoltorio de rpc, que está más
// arriba, las usa.)
function esOpcional(n){ return n === 'mt_guardar_parametros' || n === 'mt_mi_lista_espera'; }
function sinFuncion(e, nombre = 'mt_guardar_parametros'){
  const m = String(e?.message || '');
  return (e?.code === 'PGRST202' && (!m || m.includes(nombre)))
    || (/could not find the function|does not exist/i.test(m) && m.includes(nombre));
}
// Un correo al que se puede escribir con un mailto: sin más. Fuera ?, &,
// %, comas…: el correo lo da la persona por el chat, y «a@b.es?cc=…»
// abría el borrador con otros destinatarios o con texto suyo.
function correoValido(x){
  return /^[A-Za-z0-9._+'-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/.test(String(x ?? '').trim());
}
async function guardarParametros(valores){
  const r = await supabase.rpc('mt_guardar_parametros', { p_valores: valores });
  if (r?.error && sinFuncion(r.error))
    return supabase.rpc('mt_guardar_ajustes', { p_ajustes: valores });
  return r;
}

// Las filas de correo, aparte y sin tocar el DOM, para poder
// comprobarlas con la batería de render igual que los bloques del
// Latido. El botón de quitar no sale con una sola dirección: borrar
// la única que hay no es quitar una de la lista, es dejar de avisar,
// y para eso se vacía el campo.
function filasCorreo(correos){
  return correos.map((e, i) => `
      <div class="fmail">
        <input id="ea${i}" type="email" inputmode="email"
               autocomplete="email" placeholder="avisos@empresa.com"
               value="${esc(String(e ?? ''))}" aria-label="Correo ${i + 1}">
        ${correos.length > 1
          ? `<button type="button" class="cbtn sec" data-q="${i}"
                     aria-label="Quitar el correo ${i + 1}">Quitar</button>`
          : ''}
      </div>`).join('');
}

// isodow: 1 = lunes … 7 = domingo. La misma convención que
// settings.horario.dias, mt_patron_horario y mt_mis_numeros.
const DIAS_CORTOS = [
  [1,'L','lunes'], [2,'M','martes'], [3,'X','miércoles'], [4,'J','jueves'],
  [5,'V','viernes'], [6,'S','sábado'], [7,'D','domingo']
];
const DIAS_LARGOS = Object.fromEntries(DIAS_CORTOS.map(d => [d[0], d[2]]));

// "lunes a viernes" solo si los días son seguidos. Con [1,3,5] decir
// "lunes a viernes" sería mentira, y era lo que hacía antes: cogía el
// primero y el último de la lista sin mirar si había huecos.
function horarioTexto(){
  const H = CFG.horario || {};
  const d = [...new Set((H.dias || []).map(Number))].sort((x,y) => x - y);
  if (!d.length) return '—';
  const seguidos = d.every((n, i) => i === 0 || n === d[i-1] + 1);
  const dias = d.length === 1 ? DIAS_LARGOS[d[0]]
    : seguidos ? `${DIAS_LARGOS[d[0]]} a ${DIAS_LARGOS[d[d.length-1]]}`
    : d.map(n => DIAS_LARGOS[n]).join(', ');
  return `${dias}, de ${H.inicio}:00 a ${H.fin}:00`;
}

/* ---------- gestión de un contacto ---------- */
// Dos cosas que el cliente pidió poder hacer solo: callar al
// asistente con una persona concreta, y dejar a alguien fuera del
// recuento (su propio móvil, un proveedor, una prueba suya).
//
// Lo que PARA al asistente es mt_contactos.pausado_hasta, la columna
// que el agente consulta antes de responder. El panel apunta además
// quién lo pidió y hasta cuándo, y con las dos cosas puede comprobar
// que lo pedido sigue aplicado. Si deja de estarlo, lo dice: creer
// que el bot está callado mientras contesta es peor que no haber
// podido callarlo.

const PAUSA_LARGA = 365 * 24 * 3600 * 1000;   // de aquí en adelante, indefinida

function hastaCuando(d){
  if (!d) return '';
  const t = new Date(d).getTime();
  if (t - Date.now() > PAUSA_LARGA) return 'hasta que lo reactives';
  const mismoDia = new Date().toDateString() === new Date(d).toDateString();
  return mismoDia ? `hasta las ${hora(d)}` : `hasta el ${fecha(d)}`;
}

// Para la pausa automática: «vuelve a responder a las 12:17». Con
// hastaCuando salía «El asistente vuelve hasta las 12:17», que dice lo
// contrario de lo que pasa.
function vuelveCuando(d){
  const t = new Date(d).getTime();
  if (!d || isNaN(t)) return 'El asistente vuelve a responder cuando termine la pausa.';
  if (t - Date.now() > PAUSA_LARGA) return 'Seguirá en pausa hasta que alguien la quite.';
  const mismoDia = new Date().toDateString() === new Date(d).toDateString();
  return mismoDia ? `El asistente vuelve a responderle a las ${hora(d)}.`
                  : `El asistente vuelve a responderle el ${fecha(d)}.`;
}

// «Contactado por fuera del sistema»: alguien de la empresa ya le ha
// escrito o llamado por su cuenta. El asistente le sigue respondiendo si
// escribe, pero no le escribe por su cuenta para retomar la conversación
// (el reenganche de antes de 24 h). Si la función aún no está en la base
// (SQL 42 sin ejecutar), el botón no sale y todo lo demás sigue igual.
async function leerContactados(){
  try {
    const { data, error } = await supabase.rpc('mt_contactados_fuera');
    if (error) { CONTACTADOS_OK = false; return; }
    CONTACTADOS_OK = true;
    CONTACTADOS = new Map((Array.isArray(data) ? data : []).map(x => [x.user_ref, x]));
  } catch (e) { CONTACTADOS_OK = false; }
}

function gestion(c){
  const puedo  = !!(TENANT && TENANT.puede_escribir);
  const pedida = c.pausa_pedida_hasta || null;
  // Pausa que no ha pedido el panel: la que pone el sistema cuando
  // alguien del equipo contesta a mano. Se enseña, pero no se toca.
  const auto   = !pedida && c.pausado_hasta && c.pausado_por !== 'panel';

  const botones = [
    puedo && !pedida && !auto
      ? '<button class="cbtn" id="gpausar">Parar al asistente</button>' : '',
    puedo && !c.fuera_del_recuento
      ? '<button class="cbtn" id="gexcluir">Dejar fuera del recuento</button>' : '',
    puedo && CONTACTADOS_OK && !CONTACTADOS.has(c.user_ref)
      ? '<button class="cbtn" id="gfuera">Contactado por fuera del sistema</button>' : ''
  ].join('');

  const avisos = [];
  if (pedida && c.pausa_aplicada){
    avisos.push(`<div class="gav"><span class="gtx">
      <b>El asistente no le responde</b>, ${esc(hastaCuando(pedida))}.</span>
      ${puedo ? '<button class="cbtn sec" id="greanudar">Reactivar</button>' : ''}</div>`);
  } else if (pedida){
    avisos.push(`<div class="gav al"><span class="gtx">
      <b>La pausa está anotada pero no se está aplicando.</b>
      El asistente puede seguir respondiéndole. Avísanos y lo revisamos.</span>
      ${puedo ? '<button class="cbtn sec" id="greanudar">Quitar la pausa</button>' : ''}</div>`);
  } else if (auto){
    avisos.push(`<div class="gav"><span class="gtx">
      <b>En pausa</b> porque alguien del equipo le ha contestado a mano.
      ${esc(vuelveCuando(c.pausado_hasta))}</span></div>`);
  }
  if (c.fuera_del_recuento){
    avisos.push(`<div class="gav"><span class="gtx">
      <b>Fuera del recuento.</b> Sus conversaciones no entran en el Latido
      ni en tus números. Puedes seguir leyéndolas.</span>
      ${puedo ? '<button class="cbtn sec" id="gincluir">Volver a contar</button>' : ''}</div>`);
  }

  const marca = CONTACTADOS.get(c.user_ref);
  if (marca){
    // Corto, porque va en la cabecera fija: qué ha cambiado lo explica
    // el cuadro al marcar, y aquí queda al pasar por encima.
    avisos.push(`<div class="gav" title="El asistente no le escribirá por su cuenta para retomar la conversación. Si te escribe, le sigue respondiendo."><span class="gtx">
      <b>Contactado por fuera del sistema</b>${marca.en ? ' el ' + esc(fecha(marca.en)) : ''}${marca.por ? ' por ' + esc(marca.por) : ''}${marca.nota ? ' · «' + esc(marca.nota) + '»' : ''}.</span>
      ${puedo ? '<button class="cbtn sec" id="gfueraq">Quitar la marca</button>' : ''}</div>`);
  }

  const bloque = `<div class="gest">${avisos.join('')}
    <div id="gcaja"></div>
    <div id="gmsg" class="gmsg" role="status" aria-live="polite"></div></div>`;

  return { botones, bloque };
}

// `recargar(aviso)` vuelve a pedir los contactos y repinta. El aviso
// se pone DESPUÉS de repintar, porque repintar borra el anterior y el
// mensaje de "hecho" desaparecía justo al conseguirlo.
function enlazarGestion(contact, recargar){
  const caja = $('#gcaja'), msg = $('#gmsg');
  if (!caja || !msg) return;
  const limpiar = () => { caja.innerHTML = ''; msg.textContent = ''; msg.className = 'gmsg'; };

  const llamar = async (fn, args, textoOk) => {
    msg.textContent = 'Un momento…'; msg.className = 'gmsg';
    try {
      const { error } = await supabase.rpc(fn, args);
      if (error) throw error;
      await recargar(textoOk);
    } catch (e) {
      msg.textContent = e?.message ? mensajeError(e) : 'No se ha podido completar.';
      msg.className = 'gmsg err';
    }
  };

  $('#gpausar')?.addEventListener('click', () => {
    caja.innerHTML = `<div class="gopc">
      <span class="glab">¿Cuánto tiempo quieres que el asistente no le responda?</span>
      <button class="cbtn" data-h="2">2 horas</button>
      <button class="cbtn" data-h="24">Un día</button>
      <button class="cbtn" data-h="">Hasta que lo reactive</button>
      <button class="cbtn sec" data-no="1">Dejarlo</button>
    </div>`;
    caja.querySelectorAll('[data-h]').forEach(b => b.addEventListener('click', () =>
      llamar('mt_pausar',
        { p_user_ref: contact,
          p_horas: b.dataset.h === '' ? null : Number(b.dataset.h) },
        'Hecho: el asistente no le responderá.')));
    caja.querySelector('[data-no]')?.addEventListener('click', limpiar);
  });

  $('#greanudar')?.addEventListener('click', () =>
    llamar('mt_reanudar', { p_user_ref: contact },
           'El asistente vuelve a responderle.'));

  $('#gexcluir')?.addEventListener('click', () => {
    caja.innerHTML = `<div class="gopc">
      <span class="glab">Sus conversaciones dejarán de contar en el Latido y en tus
        números. Podrás seguir leyéndolas y deshacerlo cuando quieras.</span>
      <input type="text" id="gmot" maxlength="120"
             placeholder="Por qué, para acordarte (opcional)">
      <button class="cbtn" data-si="1">Dejar fuera</button>
      <button class="cbtn sec" data-no="1">Dejarlo</button>
    </div>`;
    caja.querySelector('[data-si]')?.addEventListener('click', () =>
      llamar('mt_excluir',
        { p_user_ref: contact,
          p_motivo: ($('#gmot')?.value || '').trim() || null },
        'Hecho: ya no cuenta en las cifras.'));
    caja.querySelector('[data-no]')?.addEventListener('click', limpiar);
  });

  $('#gfuera')?.addEventListener('click', () => {
    caja.innerHTML = `<div class="gopc">
      <span class="glab">Queda claro que ya le habéis contactado y el asistente no le volverá
        a escribir por su cuenta. Si te escribe, le seguirá respondiendo.</span>
      <input type="text" id="gnota" maxlength="200"
             placeholder="Cómo le contactasteis, para acordarte (opcional)">
      <button class="cbtn" data-si="1">Marcar como contactado</button>
      <button class="cbtn sec" data-no="1">Dejarlo</button>
    </div>`;
    caja.querySelector('[data-si]')?.addEventListener('click', () =>
      llamar('mt_contactado_fuera_marcar',
        { p_user_ref: contact,
          p_nota: ($('#gnota')?.value || '').trim() || null },
        'Hecho: queda como contactado por fuera del sistema.'));
    caja.querySelector('[data-no]')?.addEventListener('click', limpiar);
  });

  $('#gfueraq')?.addEventListener('click', () =>
    llamar('mt_contactado_fuera_quitar', { p_user_ref: contact },
           'Marca quitada.'));

  $('#gincluir')?.addEventListener('click', () =>
    llamar('mt_incluir', { p_user_ref: contact },
           'Vuelve a contar en las cifras.'));
}

/* ---------- detalle de un contacto ----------
   Tres piezas, para que el refresco pueda poner al día una
   conversación abierta SIN volver a abrirla:

     abrir()            la abre: esqueleto, mensajes, pintado.
     pintarDetalle()    escribe la conversación en su caja.
     refrescarDetalle() la pone al día en su sitio, sin esqueleto,
                        sin moverte de donde estabas leyendo y sin
                        tocar nada si no ha cambiado.

   Cada apertura lleva un turno. Si se pulsa a Ana y enseguida a
   Luis, los mensajes de Ana pueden llegar después que los de Luis:
   sin el turno se pintaban encima y la columna enseñaba a Ana con
   la fila de Luis resaltada. Manda la última que se pidió. */
let TURNO_DET = 0;
// Lo último que se pintó en cada caja. Si el refresco trae lo mismo,
// no se reescribe: reescribir mueve el foco y borra una selección.
const PINTADO = new WeakMap();

// mt_mensajes_contacto2 (SQL 54) trae además qué mensajes son del
// reenganche, también los que salieron sin llegar a la memoria del
// asistente. Si no está, la de siempre.
async function leerMensajes(contact){
  let { data, error } = await supabase.rpc('mt_mensajes_contacto2', { p_user_ref: contact });
  if (error) ({ data, error } = await supabase.rpc('mt_mensajes_contacto', { p_user_ref: contact }));
  return error ? null : (data || []);
}
const GANCHOS_REENGANCHE = { pendiente: 'lo que quedó pendiente', siguiente_paso: 'el siguiente paso',
  objecion: 'lo que no le encajó', dato_util: 'un dato útil' };

/* ---------- la columna de la derecha sigue a quien lee ----------
   En pantalla ancha, la conversación (y la ficha del Embudo) va fija
   con position:sticky mientras se baja por la lista. Si el navegador
   no la respeta (Safari anterior a la 16, o cualquier ancestro que la
   rompa), la columna se quedaba arriba del todo: al abrir a alguien de
   la mitad de la lista había que subir para leerle y bajar para elegir
   al siguiente. Este respaldo mide dónde ha quedado la columna y, solo
   si está por encima de donde debería, la baja hasta la vista, sin
   salirse de su rejilla. Con sticky funcionando no hace nada. */
function seguirColumnas(){
  // Es solo colocación: si algo falla aquí, no puede impedir que se
  // abra la conversación.
  try { seguirColumnasYa(); } catch (e) { /* sin consecuencias */ }
}
function seguirColumnasYa(){
  if (typeof getComputedStyle !== 'function') return;
  const cab = document.querySelector('header')?.getBoundingClientRect?.().bottom || 0;
  for (const id of ['pdetalle', 'pficha']){
    const el = document.getElementById(id);
    if (!el) continue;
    const previo = Number(el.dataset.desv) || 0;
    const cs = getComputedStyle(el);
    if (window.innerWidth <= 1000 || cs.display === 'none' || !el.parentElement
        || !el.getBoundingClientRect){
      if (previo){ el.style.transform = ''; el.dataset.desv = '0'; }
      continue;
    }
    // Donde querría estar: debajo de la cabecera (o arriba del todo si
    // la cabecera también se ha ido con el scroll).
    const tope = Math.min(parseFloat(cs.top) || 88, Math.max(cab, 0) + 16);
    const r = el.getBoundingClientRect();
    const rej = el.parentElement.getBoundingClientRect();
    const natural = r.top - previo;              // sin el respaldo
    let d = Math.max(0, tope - natural);
    d = Math.min(d, Math.max(0, rej.bottom - (r.bottom - previo)));
    d = Math.round(d);
    if (Math.abs(d - previo) >= 1){
      el.style.transform = d ? `translateY(${d}px)` : '';
      el.dataset.desv = String(d);
    }
  }
}
{
  let pendiente = false;
  const pedir = () => {
    if (pendiente) return;
    pendiente = true;
    (window.requestAnimationFrame || (f => setTimeout(f, 16)))(() => { pendiente = false; seguirColumnas(); });
  };
  window.addEventListener('scroll', pedir, { passive: true });
  window.addEventListener('resize', pedir, { passive: true });
}

// Pinta una conversación. En pantalla ancha va en la columna de la
// derecha; en móvil, donde esa columna no cabe, se abre encima.
async function abrir(contact){
  const turno = ++TURNO_DET;
  ABIERTO = contact;
  const ancho = window.innerWidth > 1000;   // el mismo umbral que el CSS
  const caja = ancho && VISTA === 'convs' && $('#pdetalle') ? '#pdetalle' : '#mbox';

  if (caja === '#mbox'){
    $('#mbox').innerHTML = esqueleto('lista');
    $('#modal').style.display = 'block';
  } else {
    $('#pdetalle').className = 'panel';
    $('#pdetalle').innerHTML = esqueleto('lista');
    seguirColumnas();
  }
  // Mientras carga, la caja no es de nadie: un refresco que llegue
  // ahora no debe pintar encima del esqueleto.
  delete $(caja).dataset.c;

  // Se puede llegar aquí desde el Latido con alguien que acaba de
  // escribir y aún no está en la lista: se vuelve a pedir.
  if (!CONTACTOS.some(x => x.user_ref === contact)){
    const { data: cs, error: ec } = await supabase.rpc('mt_mis_contactos');
    // Si falla, se queda la lista que había (antes la vaciaba).
    if (!ec && Array.isArray(cs)) CONTACTOS = cs;
  }

  const [msgs] = await Promise.all([leerMensajes(contact), leerContactados()]);
  if (turno !== TURNO_DET) return;          // ya se ha pedido a otra persona
  pintarDetalle(caja, contact, msgs);
  // Se abre por el final, como cualquier chat: lo último que se ha
  // hablado es lo que se viene a ver. Antes se abría por el mensaje
  // más antiguo, que podía ser de hace días.
  const sc = caja === '#mbox' ? $('#modal') : $('#pdetalle');
  if (sc) sc.scrollTop = sc.scrollHeight;
  seguirColumnas();
}

function htmlDetalle(contact, msgs, conCerrar){
  const c = CONTACTOS.find(x => x.user_ref === contact) || {};
  const tel = c.telefono || contact;
  const marcar = telefonoE164(c.telefono || contact);
  // El correo puede estar solo en el lead (lo apuntó el equipo en el
  // Embudo): se usa el del contacto y, si no tiene, el del lead.
  const lead = Array.isArray(LEADS) ? LEADS.find(x => x.user_ref === contact) : null;
  const crudo = String(c.email || lead?.email || '').trim();
  const correo = [c.email, lead?.email].map(x => String(x || '').trim()).find(correoValido) || '';
  const mailOk = !!correo;
  const G = gestion(c);
  let dia = null;
  return `
    <div class="dcab">
      <div style="display:flex;justify-content:space-between;gap:16px">
        <h2>${nom(c.nombre, tel)}</h2>
        ${conCerrar
          ? '<button class="cerrar" id="cx" aria-label="Cerrar">×</button>' : ''}
      </div>
      ${(() => {
        // Teléfono y correo en una sola línea: la cabecera es fija y
        // cada línea que ocupa es conversación que no se ve.
        const partes = [
          c.nombre ? (marcar
            ? `<a href="tel:${esc(marcar)}" class="mono">${esc(marcar)}</a>`
            : `<span class="mono">${esc(tel)}</span>`) : '',
          mailOk ? `<a href="mailto:${esc(correo)}">${esc(correo)}</a>` : crudo ? esc(crudo) : ''
        ].filter(Boolean);
        return partes.length ? `<p class="dmeta">${partes.join(' · ')}</p>` : '';
      })()}
      <div class="dacc">
        ${marcar ? `<a class="cbtn pri" href="tel:${esc(marcar)}">Llamar</a>` : ''}
        ${marcar ? `<a class="cbtn" id="dwa" href="https://wa.me/${esc(marcar.slice(1))}"
             target="_blank" rel="noopener noreferrer"
             aria-label="Escribirle por WhatsApp">WhatsApp</a>` : ''}
        ${mailOk ? `<a class="cbtn" id="dmail" href="mailto:${esc(correo)}"
             aria-label="Escribirle un correo a ${esc(correo)}">Correo</a>` : ''}
        <button class="cbtn" id="verembudo">Abrir en Embudo</button>
        ${G.botones}
      </div>
      ${G.bloque}
    </div>
    ${msgs === null
      // Antes un fallo de red decía «Sin mensajes guardados», que es
      // falso: los mensajes están, lo que ha fallado es traerlos.
      ? `<div class="vacio">No se han podido cargar los mensajes.<br>
           Vuelve a intentarlo con ⟳, arriba.</div>`
      : msgs.length ? msgs.map(m => {
      // Un mensaje que solo era la traza de una herramienta, o vacío,
      // salía como una burbuja vacía con la hora. No se pinta.
      const txt = String(limpiaMensaje(m.contenido) ?? '').trim();
      if (!txt) return '';
      // Separador por DÍA, no por sesión: el usuario piensa en
      // "lo del martes", no en cuántas sesiones hubo.
      let sep = '';
      const f = m.cuando ? new Date(m.cuando).toDateString() : null;
      if (f && f !== dia){ dia = f; sep = `<div class="sep"><span>${fecha(m.cuando)}</span></div>`; }
      // Mensaje del reenganche: el asistente le escribió solo porque la
      // conversación se había quedado parada. Marca discreta, no otro color.
      const re = m.papel !== 'human' && m.reenganche && typeof m.reenganche === 'object' ? m.reenganche : null;
      const reTip = re ? 'Reenganche automático: se le escribió porque dejó de contestar'
        + (GANCHOS_REENGANCHE[re.gancho] ? ` · gancho: ${GANCHOS_REENGANCHE[re.gancho]}` : '') : '';
      return sep + `<div class="msg ${m.papel === 'human' ? 'h' : 'a'}${re ? ' reeng' : ''}">
        <div class="burb"${re ? ` title="${esc(reTip)}"` : ''}>${re
          ? '<div class="rtag mono" aria-label="Mensaje de reenganche automático">↻ reenganche · auto</div>' : ''}<span class="btxt">${esc(txt)}</span>
          <div class="hora">${m.cuando ? hora(m.cuando) : 'sin hora'}${
            m.latencia_ms ? `, ${(m.latencia_ms/1000).toFixed(1).replace('.', ',')} s` : ''}</div>
        </div></div>`;
    }).join('') : '<div class="vacio">Sin mensajes guardados.</div>'}`;
}

function pintarDetalle(caja, contact, msgs, html){
  const el = $(caja); if (!el) return;
  html = html ?? htmlDetalle(contact, msgs, caja === '#mbox');
  el.innerHTML = html;
  el.dataset.c = contact;          // de quién es lo que hay dentro
  PINTADO.set(el, html);

  // Marcar en la lista quién se está leyendo
  document.querySelectorAll('.pers[data-c]').forEach(f =>
    f.classList.toggle('on', f.dataset.c === contact));

  $('#verembudo')?.addEventListener('click', async () => {
    if (caja === '#mbox') cerrar();
    // Que el Embudo no reabra al llegar la ficha que hubiera antes.
    LABIERTO = null;
    await irA('embudo');
    if (VISTA !== 'embudo') return;      // se ha ido a otra pestaña mientras
    const l = LEADS.find(x => x.user_ref === contact);
    if (!l) return;
    // Si la columna aún no está (otra carga más nueva la está pintando),
    // se deja apuntada y esa carga la abre al terminar, en su sitio.
    if (window.innerWidth > 1000 && !$('#pficha')){ LABIERTO = l.id; return; }
    abrirLead(l.id);
  });

  enlazarGestion(contact, async aviso => {
    const { data } = await supabase.rpc('mt_mis_contactos');
    if (data) CONTACTOS = data;
    await leerContactados();
    // La lista de la izquierda también cambia: la persona gana o
    // pierde su marca de "en pausa" o "fuera del recuento".
    if ($('#pconvs')) render(BUSCA);
    // En su sitio y no con abrir(): abrir pasa por el esqueleto y
    // la conversación parpadeaba justo al confirmar la acción.
    await refrescarDetalle(true);
    if (aviso){
      const m = $('#gmsg');
      if (m){ m.textContent = aviso; m.className = 'gmsg ok'; }
      anunciar(aviso);
    }
  });

  $('#cx')?.addEventListener('click', cerrar);
}

// Algo a medio hacer dentro de la conversación: elegir cuánto pausar,
// escribir el motivo de una exclusión, o tener texto seleccionado
// para copiarlo. Repintar ahora lo borraría. Se espera al siguiente.
function ocupadoDetalle(el){
  if (($('#gcaja')?.innerHTML || '').trim()) return true;
  const sel = window.getSelection?.();
  if (sel && !sel.isCollapsed && sel.anchorNode && el.contains?.(sel.anchorNode)) return true;
  return false;
}

// `forzar` = después de pausar, excluir…: hay que enseñar el cambio
// aunque el desplegable de opciones estuviera abierto, porque es
// justo de ahí de donde viene.
async function refrescarDetalle(forzar){
  const contact = ABIERTO;
  if (!contact) return;
  // La caja que de verdad enseña a esa persona. La ventana del móvil
  // solo cuenta si está abierta.
  const caja = ['#pdetalle', '#mbox'].find(s => {
    const el = $(s);
    if (!el || el.dataset.c !== contact) return false;
    return s === '#pdetalle' || $('#modal').style.display === 'block';
  });
  if (!caja) return;
  const el = $(caja);
  if (!forzar && ocupadoDetalle(el)) return;

  const turno = TURNO_DET;
  const msgs = await leerMensajes(contact);
  // Sin red, se queda lo que había. Y si mientras tanto se ha abierto
  // a otra persona o la caja ya no existe, esta respuesta llega tarde.
  if (msgs === null || turno !== TURNO_DET || ABIERTO !== contact || $(caja) !== el) return;
  if (!forzar && ocupadoDetalle(el)) return;

  const html = htmlDetalle(contact, msgs, caja === '#mbox');
  if (!forzar && PINTADO.get(el) === html) return;   // nada nuevo

  // Se lee donde se estaba. Si se estaba al final, se sigue al final
  // para ver lo que acaba de llegar, como en cualquier chat.
  const y = el.scrollTop;
  const alFinal = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  const gm = $('#gmsg');
  const aviso = gm && gm.classList.contains('ok') ? gm.textContent : '';

  pintarDetalle(caja, contact, msgs, html);

  el.scrollTop = alFinal ? el.scrollHeight : y;
  if (aviso && !forzar){
    const m = $('#gmsg');
    if (m){ m.textContent = aviso; m.className = 'gmsg ok'; }
  }
}

function cerrar(){
  // Una conversación que aún estuviera llegando a la ventana ya no se
  // pinta: en el móvil aparecía después encima de la ficha de un lead.
  // Solo si la ventana estaba abierta: Escape en el ordenador no debe
  // dejar a medias la conversación de la columna derecha.
  if ($('#modal').style.display === 'block') TURNO_DET++;
  $('#modal').style.display = 'none';
  // La ventana ya no enseña a nadie: un refresco no debe escribir en
  // ella, y una ficha del Embudo puede ocuparla después.
  delete $('#mbox').dataset.c;
  $('#mbox').classList.remove('co-mboxancho');
}
$('#modal').addEventListener('click', e => e.target.id === 'modal' && cerrar());
document.addEventListener('keydown', e => e.key === 'Escape' && cerrar());


/* ============================================================
   EMBUDO COMERCIAL

   El orden de la lista es el producto. Un comercial no necesita
   ver 27 leads: necesita saber a quién llama ahora. Por eso la
   cola se ordena por urgencia real y no por fecha:

     1. Acción vencida — se comprometió a algo y ha pasado
     2. Dejó contacto y nadie le ha tocado — el dinero sobre la mesa
     3. Visita agendada próxima — confirmarla evita el no-show
     4. El resto, por antigüedad del último mensaje

   La cualificación se muestra como cinco barritas, no como un
   número: se ve de un vistazo cuánto falta sin tener que leer.
   ============================================================ */

let LEADS = [], EMBUDO = [], LFILTRO = 'activos', LABIERTO = null;
// La lista de espera (migración 121): quien pidió una sede sin hueco y
// espera aviso. null = el servidor aún no la da, y el botón no sale.
// EABIERTO: la persona en espera cuya ficha está abierta.
let ESPERA = null, EABIERTO = null;

const ETAPAS = [
  ['entrada',        'Entrada',   'fe1'],
  ['cualificado',    'Cualificado','fe2'],
  ['visita_agendada','Visita',    'fe3'],
  ['visita_hecha',   'Visitado',  'fe4'],
  ['propuesta',      'Propuesta', 'fe5'],
  ['ganado',         'Ganado',    'fe6'],
  ['perdido',        'Perdido',   'fe7']
];
const NOMBRE_ETAPA = Object.fromEntries(ETAPAS.map(e => [e[0], e[1]]));

// Devuelve por qué este lead es urgente, o null. Que el motivo sea
// texto y no un color permite escribirlo en la tarjeta: un comercial
// no debería tener que descifrar por qué algo está en rojo.
// Los textos son más cortos que antes porque el título del grupo ya
// dice el motivo: dentro de "Sin llamar" no hace falta repetir en
// cada fila "dejó contacto y nadie le ha llamado". Solo el grupo de
// hoy conserva su texto, porque ahí la FECHA importa.
function urgencia(l){
  const hoy = hoyMadrid();
  if (l.proxima_fecha && l.proxima_fecha < hoy)
    return { nivel:'urg', txt:`Vencido el ${fechaCorta(l.proxima_fecha)}`, peso:0 };
  if (l.proxima_fecha === hoy)
    return { nivel:'urg', txt:'Para hoy', peso:1 };
  // Una visita en menos de tres días pasa a 'urg': confirmarla es lo
  // que evita el no-show, y eso corre tanto como una acción vencida.
  // Solo las que vienen: una visita de la semana pasada no es urgente.
  const falta = l.cita ? new Date(l.cita) - Date.now() : NaN;
  if (falta < 3*864e5 && falta > -12*36e5)
    return { nivel:'urg', txt:`Visita el ${fechaCorta(l.cita)}`, peso:2 };
  // El teléfono NO cuenta como "dejó su contacto": viene de
  // WhatsApp, lo tenemos de todos y no significa que quieran que
  // les llamen. El email sí lo dieron ellos.
  if (Number(l.toques) === 0 && l.email)
    return { nivel:'oro', txt:'', peso:3 };
  if (Number(l.toques) === 0)
    return { nivel:'sin', txt:'', peso:5 };
  return null;
}

// Los grupos, en el orden en que se pintan. Un grupo vacío no se
// pinta: una cabecera con cero debajo es ruido.
const GRUPOS = [
  ['urg',    'Para hoy',   'urg'],
  ['oro',    'Sin llamar', 'oro'],
  ['marcha', 'En marcha',  ''],
  ['sin',    'Sin contacto', 'sin'],
];
// Un grupo de más de ocho se corta a seis. La holgura evita el caso
// absurdo de ocultar uno solo tras un botón que ocupa lo mismo.
const MOSTRAR = 6, HOLGURA = 2;
let LEXP = {};

function ordenLeads(a, b){
  const ua = urgencia(a), ub = urgencia(b);
  const pa = ua ? ua.peso : 4, pb = ub ? ub.peso : 4;
  if (pa !== pb) return pa - pb;
  return new Date(b.ultima || 0) - new Date(a.ultima || 0);
}

let TURNO_EMB = 0, EMBUDO_EN_VUELO = 0;
async function pintarEmbudo(silencioso){
  const turno = ++TURNO_EMB;
  if (!silencioso) $('#vista').innerHTML = esqueleto('lista');
  EMBUDO_EN_VUELO++;
  let a, b;
  try {
    // Sincronizar ANTES de leer: si no, una conversación nueva no
    // aparece hasta que alguien se acuerde de refrescar el CRM a
    // mano, y nadie se acuerda. Es idempotente y no pisa nada de lo
    // que haya escrito el comercial.
    //
    // Si falla —por permisos, por ejemplo— se sigue adelante y se
    // muestra lo que ya hay: una lista algo vieja es mejor que una
    // pantalla en blanco.
    await supabase.rpc('mt_sincronizar').catch(() => {});
    let e;
    [a, b, e] = await Promise.all([
      supabase.rpc('mt_mis_leads'),
      supabase.rpc('mt_embudo_resumen'),
      supabase.rpc('mt_mi_lista_espera')
    ]);
    if (turno === TURNO_EMB) aplicaEspera(e);
  } finally { EMBUDO_EN_VUELO--; }
  // Si mientras tanto se ha pedido otra carga o se ha cambiado de
  // pestaña, no se pinta encima.
  if (turno !== TURNO_EMB || VISTA !== 'embudo') return;
  ULTIMA = Date.now(); pintarCuando();

  if (a.error){
    pintaEn(`${embudoCabecera()}<div class="panel"><div class="vacio">
      No se ha podido cargar.<br>${esc(mensajeError(a.error))}</div></div>`, silencioso);
    return;
  }
  LEADS = a.data || []; EMBUDO = b.data || [];
  if (LFILTRO === 'espera' && ESPERA === null) LFILTRO = 'activos';

  if (!LEADS.length && !(ESPERA || []).length){
    pintaEn(`${embudoCabecera()}
      <p class="sub corta">Quien ha escrito a tu asistente, ordenado por lo que hay que hacer primero.</p>
      <div class="panel"><div class="vacio">
        <strong>Nadie ha escrito aún.</strong><br>
        Quien escriba al asistente entra aquí solo, sin hacer nada.</div></div>`, silencioso);
    return;
  }

  const vivos = LEADS.filter(l => !['ganado','perdido'].includes(l.etapa));

  pintaEn(`
    ${embudoCabecera()}
    <p class="sub corta">Quien ha escrito a tu asistente, ordenado por lo que hay
       que hacer primero.</p>

    ${cuentasEtapa()}

    <div class="convs2 embudo2">
     <div class="panel lpanel">
      <div class="lfiltros">
        <input id="lbusca" class="busca" type="search" aria-label="Buscar leads"
               placeholder="Buscar por nombre o teléfono" autocomplete="off">
        <div class="orden" id="lfiltro" role="group" aria-label="Qué mostrar">
          ${filtrosEmbudo().map(([k,t,n]) => `<button class="${LFILTRO===k?'on':''}" data-lf="${k}"
                   aria-pressed="${LFILTRO===k}">${t} ${nf.format(n)}</button>`).join('')}
        </div>
      </div>

      <div id="lista-leads"></div>
     </div>
     <div id="pficha" class="panel vacio-det">
       Elige a alguien de la lista para ver su ficha.
     </div>
    </div>`, silencioso);

  // Los filtros y el buscador se enlazan aquí, no en la vista de
  // Conversaciones: cada vista enlaza lo suyo.
  enlazarFiltrosEmbudo();

  const lb = $('#lbusca');
  if (lb){
    let t = null;
    lb.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => pintarLista(lb.value.trim()), 200);
    });
  }

  pintarLista($('#lbusca')?.value.trim());

  // Igual que en Conversaciones: si al volver la fila del lead sale
  // resaltada, su ficha se abre, para que la pantalla no diga dos
  // cosas a la vez. Solo en pantalla ancha.
  if (LABIERTO != null && window.innerWidth > 1000){
    const visible = [...document.querySelectorAll('.lfila[data-lead]')]
      .some(el => Number(el.dataset.lead) === LABIERTO);
    if (visible) abrirLead(LABIERTO);
  } else if (EABIERTO != null && window.innerWidth > 1000){
    const visible = [...document.querySelectorAll('.lfila[data-espera]')]
      .some(el => el.dataset.espera === EABIERTO);
    if (visible) abrirEspera(EABIERTO);
  }
}

// Los botones de arriba de la lista: Abiertos, Cerrados y, si el
// servidor da la lista de espera, En espera (cuenta solo a quien espera
// ahora; los ya avisados salen dentro, aparte).
function filtrosEmbudo(){
  const vivos = LEADS.filter(l => !['ganado','perdido'].includes(l.etapa)).length;
  const f = [['activos','Abiertos', vivos], ['cerrados','Cerrados', LEADS.length - vivos]];
  if (ESPERA !== null) f.push(['espera','En espera', esperando().length]);
  return f;
}
function enlazarFiltrosEmbudo(){
  document.querySelectorAll('#lfiltro button[data-lf]').forEach(b =>
    b.addEventListener('click', () => {
      LFILTRO = b.dataset.lf;
      LEXP = {};   // lo desplegado era de la lista anterior
      document.querySelectorAll('#lfiltro button[data-lf]').forEach(x => {
        x.classList.toggle('on', x === b);
        x.setAttribute('aria-pressed', String(x === b));
      });
      pintarLista($('#lbusca')?.value.trim());
    }));
}
// Pone al día los botones sin rehacerlos (no se pierde el foco) salvo
// que cambie cuáles hay: la lista de espera aparece al aplicar la 121.
function ponerFiltrosEmbudo(){
  const caja = $('#lfiltro'); if (!caja) return;
  if (LFILTRO === 'espera' && ESPERA === null) LFILTRO = 'activos';
  const f = filtrosEmbudo();
  const hay = [...caja.querySelectorAll('button[data-lf]')].map(b => b.dataset.lf);
  if (hay.join() === f.map(x => x[0]).join()){
    caja.querySelectorAll('button[data-lf]').forEach((b, i) => {
      b.textContent = `${f[i][1]} ${nf.format(f[i][2])}`;
      b.classList.toggle('on', LFILTRO === f[i][0]);
      b.setAttribute('aria-pressed', String(LFILTRO === f[i][0]));
    });
    return;
  }
  caja.innerHTML = f.map(([k,t,n]) => `<button class="${LFILTRO===k?'on':''}" data-lf="${k}"
                   aria-pressed="${LFILTRO===k}">${t} ${nf.format(n)}</button>`).join('');
  enlazarFiltrosEmbudo();
}

// El refresco de la pantalla del Embudo, sin reescribirla. Antes el
// automático llamaba a pintarEmbudo(true), que reescribe la vista
// entera: la ficha abierta volvía a «Elige a alguien» y se perdía lo
// que se estuviera escribiendo en ella. La ficha no se toca nunca
// desde aquí; la lista y las cuentas sí se ponen al día.
let REFRESCO_EMB = false;
async function refrescarEmbudoVista(){
  // Embudo › Correo: sus datos se ponen al día con los del correo; aquí no se repinta
  // (se perdería lo que se esté escribiendo en un seguimiento).
  if (CO.embudoCanal === 'correo'){ ULTIMA = Date.now(); pintarCuando(); return; }
  // Uno cada vez: si el anterior aún espera al servidor, no se solapa otro.
  if (REFRESCO_EMB) return;
  REFRESCO_EMB = true;
  try {
    if (!$('#lista-leads')) return EMBUDO_EN_VUELO ? undefined : pintarEmbudo(true);
    // Sincronizar primero, como al entrar: es lo que hace aparecer a
    // quien acaba de escribir por primera vez.
    await supabase.rpc('mt_sincronizar').catch(() => {});
    if (VISTA !== 'embudo' || !$('#lista-leads')) return;
    await refrescarEmbudo();
    ULTIMA = Date.now(); pintarCuando();
  } finally { REFRESCO_EMB = false; }
}

// Refresca los datos SIN repintar la vista entera. Repintar `#vista`
// con la ficha abierta vacía el fondo un instante, la página se
// encoge y el modal salta.
async function refrescarEmbudo(){
  const [a, b, e] = await Promise.all([
    supabase.rpc('mt_mis_leads'),
    supabase.rpc('mt_embudo_resumen'),
    supabase.rpc('mt_mi_lista_espera')
  ]);
  if (a.data) LEADS = a.data;
  if (b.data) EMBUDO = b.data;
  aplicaEspera(e);

  const c = document.querySelector('.fcuentas');
  if (c) c.outerHTML = cuentasEtapa();
  // Las cuentas de «Abiertos», «Cerrados» y «En espera» también: si no,
  // decían el número de cuando se entró en la pestaña.
  ponerFiltrosEmbudo();
  pintarLista($('#lbusca')?.value.trim());
}

// Una línea con las etapas que tienen gente. Sustituye a la barra
// del recorrido: aquella ocupaba un panel entero para decir lo
// mismo, y con cero cerrados sus proporciones no decían nada.
function cuentasEtapa(){
  const con = (EMBUDO || []).filter(e => Number(e.leads) > 0);
  if (!con.length) return '';
  return `<div class="fcuentas">${con.map(e =>
    `<span>${esc(NOMBRE_ETAPA[e.etapa] || e.etapa)} <b>${nf.format(e.leads)}</b></span>`
  ).join('')}</div>`;
}

function pintarLista(q){
  const cont = $('#lista-leads'); if (!cont) return;
  if (LFILTRO === 'espera') return pintarEspera(cont, q);
  const norm = t => String(t || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  const cerrados = LFILTRO === 'cerrados';
  let l = LEADS.filter(x => cerrados === ['ganado','perdido'].includes(x.etapa));

  if (q){
    const n = norm(q), num = q.replace(/[^0-9]/g, '');
    l = l.filter(x => norm(x.nombre).includes(n) || norm(x.email).includes(n) ||
      (num.length >= 3 && String(x.telefono || x.user_ref).includes(num)));
  }
  l.sort(ordenLeads);

  if (!l.length){
    cont.innerHTML = `<div class="vacio">${q
      ? `Nadie coincide con «${esc(q)}».`
      : cerrados ? 'Ninguno cerrado.' : 'Ninguno abierto.'}</div>`;
    return;
  }

  // Agrupado: por etapa si son cerrados, por urgencia si no. El
  // motivo vive en el título del grupo y no se repite en cada fila.
  const grupos = cerrados
    ? [['ganado','Ganado',''], ['perdido','Perdido','sin']]
    : GRUPOS;
  const de = cerrados
    ? (x => x.etapa)
    : (x => urgencia(x)?.nivel || 'marcha');

  cont.innerHTML = grupos.map(([clave, titulo, tono]) => {
    const dentro = l.filter(x => de(x) === clave);
    if (!dentro.length) return '';          // un grupo vacío es ruido

    const corta = dentro.length > MOSTRAR + HOLGURA && !LEXP[clave];
    const vistos = corta ? dentro.slice(0, MOSTRAR) : dentro;
    const faltan = dentro.length - vistos.length;

    return `<div class="lgcab ${tono}">${esc(titulo)}
              <span class="mono">${dentro.length}</span></div>
            ${vistos.map(x => filaLead(x, clave)).join('')}
            ${faltan ? `<button class="lmas" data-g="${esc(clave)}">Ver ${faltan} más</button>` : ''}`;
  }).join('');

  enlazarLeads();
}

function filaLead(l, grupo){
  const u = urgencia(l);
  const pide = [l.servicio, l.ubicacion].filter(Boolean).join(', ');
  const tel  = l.telefono || l.user_ref;
  const hace = l.ultima ? desdeEntonces(l.ultima).txt : '';

  // El motivo solo se escribe en el grupo de hoy, donde la fecha
  // importa. En los demás, el título del grupo ya lo dice.
  const motivo = grupo === 'urg' && u?.txt ? u.txt : '';

  // La fila de la ficha abierta se marca al pintar, no solo al pulsar:
  // si no, cada refresco de la lista le quitaba el resalte.
  return `<div class="lfila${l.id === LABIERTO ? ' on' : ''}" data-lead="${l.id}" tabindex="0" role="button"
    aria-label="${esc(l.nombre || tel)}${motivo ? '. ' + esc(motivo) : ''}">
    <div class="lfila-txt">
      <div class="lfila-nom${l.nombre ? '' : ' mono'}">${
        l.nombre ? `<bdi>${esc(l.nombre)}</bdi>` : esc(tel)}</div>
      <div class="lfila-pide">${pide ? esc(pide) : 'Sin concretar qué busca'}</div>
      ${motivo ? `<div class="lfila-urg">${esc(motivo)}</div>` : ''}
    </div>
    ${hace ? `<span class="lfila-hace">${esc(hace)}</span>` : ''}
  </div>`;
}

function enlazarLeads(){
  document.querySelectorAll('.lmas[data-g]').forEach(b =>
    b.addEventListener('click', e => {
      e.stopPropagation();           // el botón vive dentro de la lista
      LEXP[b.dataset.g] = true;
      pintarLista($('#lbusca')?.value.trim());
    }));

  document.querySelectorAll('.lfila[data-lead]').forEach(el => {
    const ir = () => abrirLead(Number(el.dataset.lead));
    el.addEventListener('click', ir);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); }
    });
  });
}

/* ---------- lista de espera ----------
   Quien pidió una sede concreta, no había despacho para él y aceptó que
   se le avise cuando quede uno libre. La lista la llena y la avisa el
   asistente (mt_lista_espera); aquí solo se enseña. */
function aplicaEspera(r){
  if (r && !r.error && Array.isArray(r.data)) ESPERA = r.data;
  // El servidor aún no tiene la 121: sin botón. Otro fallo (la red…):
  // se queda lo que había, como el resto del Embudo.
  else if (r?.error && sinFuncion(r.error, 'mt_mi_lista_espera')) ESPERA = null;
}
const esperando = () => (ESPERA || []).filter(e => e.estado === 'activa');

// «Velázquez, Serrano · 4 personas · despacho»
function buscaEspera(e){
  const p = [];
  const sedes = (Array.isArray(e.centros) ? e.centros : []).filter(Boolean);
  if (sedes.length) p.push(sedes.join(', '));
  const n = Number(e.personas);
  if (n > 0) p.push(`${nf.format(n)} ${n === 1 ? 'persona' : 'personas'}`);
  if (e.tipo) p.push(String(e.tipo));
  return p.join(' · ');
}
const avisadaTxt = e => e.avisado_en ? `Avisado el ${fechaCorta(e.avisado_en)}` : 'Avisado';

function pintarEspera(cont, q){
  const norm = t => String(t || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
  let l = [...(ESPERA || [])];
  if (q){
    const n = norm(q), num = q.replace(/[^0-9]/g, '');
    l = l.filter(x => norm(x.nombre).includes(n) || norm(x.email).includes(n) ||
      norm(buscaEspera(x)).includes(n) ||
      (num.length >= 3 && String(x.telefono || x.user_ref).includes(num)));
  }
  if (!l.length){
    cont.innerHTML = `<div class="vacio">${q
      ? `Nadie coincide con «${esc(q)}».`
      : `<strong>Nadie está esperando hueco ahora.</strong><br>
         Cuando el asistente apunte a alguien a la lista de espera de una
         sede, saldrá aquí, con lo que busca y desde cuándo.`}</div>`;
    return;
  }
  const grupos = [['activa', 'Esperando hueco', 'oro'], ['avisada', 'Ya avisados', 'sin']];
  cont.innerHTML = grupos.map(([estado, titulo, tono]) => {
    const dentro = l.filter(x => estado === 'activa' ? x.estado === 'activa' : x.estado !== 'activa');
    if (!dentro.length) return '';
    return `<div class="lgcab ${tono}">${esc(titulo)}
              <span class="mono">${dentro.length}</span></div>
            ${dentro.map(filaEspera).join('')}`;
  }).join('');

  cont.querySelectorAll('.lfila[data-espera]').forEach(el => {
    const ir = () => abrirEspera(el.dataset.espera);
    el.addEventListener('click', ir);
    el.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); ir(); }
    });
  });
}

function filaEspera(e){
  const tel = e.telefono || e.user_ref;
  const busca = buscaEspera(e);
  const activa = e.estado === 'activa';
  const cuando = activa ? `Esperando desde el ${fechaCorta(e.creado_en)}` : avisadaTxt(e);
  return `<div class="lfila${e.id === EABIERTO ? ' on' : ''}" data-espera="${esc(e.id)}" tabindex="0" role="button"
    aria-label="${esc(e.nombre || tel)}. ${esc(cuando)}">
    <div class="lfila-txt">
      <div class="lfila-nom${e.nombre ? '' : ' mono'}">${
        e.nombre ? `<bdi>${esc(e.nombre)}</bdi>` : esc(String(tel).split('@')[0])}</div>
      <div class="lfila-pide">${busca ? esc(busca) : 'Sin concretar qué busca'}</div>
      <div class="lfila-esp${activa ? '' : ' avisada'}">${esc(cuando)}</div>
    </div>
  </div>`;
}

function abrirEspera(id){
  const e = (ESPERA || []).find(x => x.id === id); if (!e) return;
  EABIERTO = id; LABIERTO = null;
  const ancho = window.innerWidth > 1000;   // el mismo umbral que el CSS
  const caja = ancho && VISTA === 'embudo' && $('#pficha') ? '#pficha' : '#mbox';
  if (caja === '#mbox'){
    $('#modal').style.display = 'block';
    TURNO_DET++;   // ninguna conversación tardía pisa la ventana
  } else $('#pficha').className = 'panel';
  // Lo que hay dentro no es una conversación: el refresco de
  // Conversaciones no debe confundirlo con una.
  delete $(caja).dataset.c;

  const marcar = telefonoE164(e.telefono || e.user_ref);
  const mailOk = correoValido(e.email);
  const correo = mailOk ? String(e.email).trim() : '';
  const activa = e.estado === 'activa';
  const sedes = (Array.isArray(e.centros) ? e.centros : []).filter(Boolean);

      ${correo ? `<p class="dmeta"><a href="mailto:${esc(correo)}">${esc(correo)}</a></p>` : ''}
      <span class="festado${activa ? '' : ' avisada'}">${activa ? 'En lista de espera' : esc(avisadaTxt(e))}</span>
      ${marcar || correo ? `<div class="fllamar">
        ${marcar ? `<a class="pri" href="tel:${esc(marcar)}">Llamar</a>
        <a class="secu" href="https://wa.me/${esc(marcar.slice(1))}"
           target="_blank" rel="noopener noreferrer">WhatsApp</a>` : ''}
        ${correo ? `<a class="${marcar ? 'secu' : 'pri'}" href="mailto:${esc(correo)}">Correo</a>` : ''}

        ${n > 0 ? `<dt>Para</dt><dd>${nf.format(n)} ${n === 1 ? 'persona' : 'personas'}</dd>` : ''}
        ${e.tipo ? `<dt>Tipo</dt><dd>${esc(String(e.tipo).charAt(0).toUpperCase() + String(e.tipo).slice(1))}</dd>` : ''}
        ${Number(e.presupuesto) > 0 ? `<dt>Presupuesto</dt><dd>${nf.format(Number(e.presupuesto))} €</dd>` : ''}

    <div class="fsec">

  document.querySelectorAll('.lfila[data-lead]').forEach(el => el.classList.remove('on'));

    const ref = e.user_ref;
    ABIERTO = null;
    await irA('convs');
