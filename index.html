/* ---------- mapa ----------
   Genérico: el encuadre se calcula desde las propias coordenadas
   del cliente, así que funciona en cualquier geografía. La silueta
   de referencia es opcional y vive en su configuración.          */

/* ---------- mapa ----------
   Cartografía real con Leaflet y teselas CartoDB Positron: un
   estilo minimalista en grises que funciona en cualquier punto
   del mundo. Así el mapa vale para cualquier cliente sin que
   nadie tenga que dibujar un contorno.                        */

let LMAP = null, LCAPA = null;

function bloqueMapa(d){
  const pts = (d.temas || []).filter(t =>
    t.categoria === 'ubicacion' && t.lat != null && t.lng != null);
  if (!pts.length) return '';

  const grupos = {};
  pts.forEach(p => { const a = p.ambito || 'general'; (grupos[a] ||= []).push(p); });

  const claves = Object.keys(grupos).sort((a,b) =>
    ((CFG.mapas[a]?.orden ?? 99) - (CFG.mapas[b]?.orden ?? 99)) || a.localeCompare(b));
  if (!claves.length) return '';
  if (!claves.includes(MAPA)) MAPA = claves[0];

  const etq = k => CFG.mapas[k]?.etiqueta || k.charAt(0).toUpperCase() + k.slice(1);
  PUNTOS = grupos;

  return `<div class="panel" id="panelmapa">
    <div class="cabpanel">
      <div>
        <h3>Mapa de demanda</h3>
        <p class="ph">Cada punto es una zona que nombran los clientes.
           El tamaño es cuántas veces la nombran.</p>
      </div>
      ${claves.length > 1 ? `<div class="rangos">
        ${claves.map(k => `<button class="rg mp${MAPA===k?' on':''}" data-m="${esc(k)}">
          ${esc(etq(k))}</button>`).join('')}
      </div>` : ''}
    </div>
    <div id="lmapa" class="lmapa"></div>
  </div>`;
}

// Teselas: Stadia "Alidade Smooth" (equivalente a Positron).
// Se autentica por dominio, así que no hay ninguna clave en el
// código. Si fallara, se cae a OpenStreetMap automáticamente.
const TESELAS = {
  principal: {
    url: 'https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png',
    attribution: '&copy; Stadia Maps &copy; OpenMapTiles &copy; OpenStreetMap',
    maxZoom: 20
  },
  respaldo: {
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19, className: 'tsuave'
  }
};

function ponerTeselas(){
  const cfg = CFG.mapas?.teselas || TESELAS.principal;
  let fallos = 0, caido = false;

  const capa = L.tileLayer(cfg.url, {
    attribution: cfg.attribution, maxZoom: cfg.maxZoom || 19,
    className: cfg.className || ''
  }).addTo(LMAP);

  // Varios errores seguidos suelen significar que el proveedor
  // no está sirviendo (dominio sin dar de alta, cuota agotada).
  capa.on('tileerror', () => {
    if (caido || ++fallos < 4) return;
    caido = true;
    capa.remove();
    L.tileLayer(TESELAS.respaldo.url, {
      attribution: TESELAS.respaldo.attribution,
      maxZoom: TESELAS.respaldo.maxZoom,
      className: TESELAS.respaldo.className
    }).addTo(LMAP);
  });
}

// Crea o actualiza el mapa. Se llama después de pintar la vista.
function activarMapa(){
  const cont = document.getElementById('lmapa');
  if (!cont || !PUNTOS) return;

  if (typeof L === 'undefined'){
    cont.innerHTML = '<div class="vacio">No se ha podido cargar el mapa.<br>' +
      'Revisa tu conexión y vuelve a intentarlo.</div>';
    return;
  }

  // El contenedor se recrea en cada pintado, así que el mapa
  // anterior queda huérfano: se destruye antes de crear el nuevo.
  if (LMAP){ LMAP.remove(); LMAP = null; }

  LMAP = L.map(cont, {
    zoomControl: true, scrollWheelZoom: false, attributionControl: true
  });
  ponerTeselas();

  // El scroll del ratón hace zoom solo tras pulsar en el mapa:
  // evita que se quede atrapado al desplazar la página.
  LMAP.on('click', () => LMAP.scrollWheelZoom.enable());
  LMAP.on('mouseout', () => LMAP.scrollWheelZoom.disable());

  pintarPuntos();
}

function pintarPuntos(){
  if (!LMAP) return;
  if (LCAPA){ LCAPA.remove(); LCAPA = null; }

  const pts = (PUNTOS[MAPA] || []).filter(p => p.lat != null && p.lng != null);
  if (!pts.length) return;

  const max = Math.max(...pts.map(p => p.conversaciones), 1);
  LCAPA = L.layerGroup().addTo(LMAP);

  // de menor a mayor: los círculos grandes quedan encima
  [...pts].sort((a,b) => a.conversaciones - b.conversaciones).forEach((p, i) => {
    const prop = p.conversaciones / max;
    const r = 9 + 20 * Math.sqrt(prop);

    const c = L.circleMarker([Number(p.lat), Number(p.lng)], {
      radius: r, color: '#1B7CFF', weight: 2,
      fillColor: '#1B7CFF', fillOpacity: 0.16 + 0.38 * prop,
      className: 'pmarca'
    }).addTo(LCAPA);

    c.bindTooltip(
      `<strong>${esc(p.nombre)}</strong>
       <span>${p.conversaciones} ${p.conversaciones === 1 ? 'conversación' : 'conversaciones'}</span>
       ${p.zona ? `<span class="tz">${esc(p.zona)}</span>` : ''}`,
      { className: 'ltip', direction: 'top', offset: [0, -r - 2], sticky: false });

    c.on('mouseover', () => c.setStyle({ weight: 3, fillOpacity: 0.62 }));
    c.on('mouseout',  () => c.setStyle({ weight: 2, fillOpacity: 0.16 + 0.38 * prop }));

    // aparición escalonada, como el resto de transiciones del panel
    const el = c.getElement();
    if (el){
      el.style.opacity = '0';
      el.style.transform = 'scale(.4)';
      el.style.transformOrigin = 'center';
      setTimeout(() => {
        el.style.transition = 'opacity .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1)';
        el.style.opacity = '1';
        el.style.transform = 'scale(1)';
      }, 40 + i * 45);
    }
  });

  const grupo = L.featureGroup(LCAPA.getLayers());
  LMAP.fitBounds(grupo.getBounds(), { padding: [46, 46], maxZoom: 14 });
}

// Cambio de ámbito: solo se repintan los puntos y se reencuadra.
// No se toca el DOM, así que la página no se mueve.
function repintarMapa(){
  document.querySelectorAll('.rg[data-m]').forEach(b =>
    b.classList.toggle('on', b.dataset.m === MAPA));
  pintarPuntos();
}

/* ---------- patrón horario ---------- */
function bloquePatron(d){
  if (!d.patron.length) return '';
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  let max = 0;
  d.patron.forEach(p => {
    const v = Number(p.mensajes) || 0;
    grid[p.dia_semana][p.hora] += v;
    if (grid[p.dia_semana][p.hora] > max) max = grid[p.dia_semana][p.hora];
  });
  if (!max) return '';

  // Horario laboral real del cliente (settings.horario).
  // dias viene en formato ISO 1=lunes…7=domingo; getDay() usa 0=domingo.
  const H = CFG.horario || { inicio:9, fin:19, dias:[1,2,3,4,5] };
  const lab = new Set((H.dias || [1,2,3,4,5]).map(n => n === 7 ? 0 : n));
  let fuera = 0, total = 0;
  for (let dd=0; dd<7; dd++) for (let h=0; h<24; h++){
    const v = grid[dd][h]; total += v;
    if (!lab.has(dd) || h < H.inicio || h >= H.fin) fuera += v;
  }
  const pct = total ? Math.round(fuera / total * 100) : 0;
  const dnom = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const dlab = (H.dias || []).map(n => dnom[n === 7 ? 0 : n]);
  const rango = dlab.length
    ? `${dlab[0]} a ${dlab[dlab.length-1]}, de ${H.inicio}:00 a ${H.fin}:00`
    : `de ${H.inicio}:00 a ${H.fin}:00`;

  const orden = [1,2,3,4,5,6,0];
  return `<div class="panel">
    <h3>Cuándo escriben</h3>
    <p class="ph">Mensajes por día y hora. <strong>${pct}%</strong> llegan fuera
       de tu horario de atención (${rango}), y se atienden igual.</p>
    <div class="mapa">
      <div class="mhoras"><span></span>${
        Array.from({length:24}, (_,h) => `<span class="mh">${h%6===0?h:''}</span>`).join('')}</div>
      ${orden.map(dd => `<div class="mfila">
        <span class="md">${dias[dd]}</span>
        ${grid[dd].map((v,h) => {
          const o = v ? (0.14 + 0.86 * (v / max)) : 0;
          return `<span class="mc" style="background:rgba(27,124,255,${o.toFixed(3)})"
            title="${dias[dd]} ${h}:00 · ${v} mensajes"></span>`;
        }).join('')}
      </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- cardiograma ---------- */
function grafica(ev){
  if (!ev.length) return `<div class="vacio">
    Sin mensajes en este periodo.<br>
    El primero que entre aparece aquí.</div>`;

  const porDia = RANGO > 48;
  const paso   = porDia ? 864e5 : 36e5;
  const n      = porDia ? Math.round(RANGO/24) : RANGO;

  const cubos = Array.from({length:n}, (_,i) => {
    const t = new Date(Date.now() - (n-1-i)*paso);
    porDia ? t.setHours(0,0,0,0) : t.setMinutes(0,0,0);
    return { t, n:0 };
  });
  ev.filter(e => e.role === 'human').forEach(e => {
    const t = new Date(e.observed_at);
    porDia ? t.setHours(0,0,0,0) : t.setMinutes(0,0,0);
    const s = cubos.find(x => x.t.getTime() === t.getTime());
    if (s) s.n++;
  });

  const max = Math.max(...cubos.map(h => h.n), 1);
  const W = 1000, H = 190;
  const pts = cubos.map((h,i) => [
    (i/Math.max(cubos.length-1,1))*W,
    H - (h.n/max)*(H-34) - 17
  ]);
  const linea = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area  = `M0 ${H} L` + pts.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L') + ` L${W} ${H} Z`;
  const et = d => porDia
    ? d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' })
    : d.getHours() + ':00';
  const etLargo = d => porDia
    ? d.toLocaleDateString('es-ES', { weekday:'long', day:'2-digit', month:'long' })
    : d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' }) +
      ', ' + d.getHours() + ':00 h';
  const ancho = W / cubos.length;

  return `<div class="graf" id="graf">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
        aria-label="Mensajes entrantes a lo largo del periodo">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1B7CFF" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#1B7CFF" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#E2E8F0" stroke-width="1"/>
      <path d="${area}" fill="url(#g)"/>
      <path d="${linea}" fill="none" stroke="#1B7CFF" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>
      <line id="guia" x1="0" y1="0" x2="0" y2="${H}" stroke="#1B7CFF"
            stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      ${pts.map((p,i) => cubos[i].n > 0
        ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#1B7CFF"/>` : '').join('')}
      <circle id="foco" r="6" fill="#fff" stroke="#1B7CFF" stroke-width="2.5" opacity="0"/>
      ${cubos.map((c,i) => `<rect x="${(i*ancho).toFixed(1)}" y="0"
          width="${ancho.toFixed(1)}" height="${H}" fill="transparent"
          data-i="${i}" data-x="${pts[i][0].toFixed(1)}" data-y="${pts[i][1].toFixed(1)}"
          data-n="${c.n}" data-t="${esc(etLargo(c.t))}" class="hit"/>`).join('')}
    </svg>
    <div class="tip" id="tip" hidden></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#64748B;margin-top:9px"
         class="mono">
      <span>${et(cubos[0].t)}</span>
      <span>${et(cubos[Math.floor(cubos.length/2)].t)}</span>
      <span>${et(cubos[cubos.length-1].t)} · ahora</span>
    </div>
  </div>`;
}

// Tooltip del cardiograma: se engancha tras pintar el bloque.
function activarGrafico(){
  const cont = $('#graf'); if (!cont) return;
  const svg = cont.querySelector('svg');
  const tip = $('#tip'), guia = $('#guia'), foco = $('#foco');
  if (!svg || !tip) return;

  cont.querySelectorAll('.hit').forEach(r => {
    const mostrar = e => {
      const n = r.dataset.n, x = +r.dataset.x, y = +r.dataset.y;
      guia.setAttribute('x1', x); guia.setAttribute('x2', x);
      guia.setAttribute('opacity', '1');
      foco.setAttribute('cx', x); foco.setAttribute('cy', y);
      foco.setAttribute('opacity', n > 0 ? '1' : '0');

      tip.innerHTML = `<strong>${n} ${n === '1' ? 'mensaje' : 'mensajes'}</strong>
                       <span>${r.dataset.t}</span>`;
      tip.hidden = false;

      const caja = cont.getBoundingClientRect();
      const px = (e.touches ? e.touches[0].clientX : e.clientX) - caja.left;
      const ancho = tip.offsetWidth || 130;
      tip.style.left = Math.max(4, Math.min(px - ancho/2, caja.width - ancho - 4)) + 'px';
      tip.style.top  = Math.max(0, (y / 190) * caja.height - 52) + 'px';
    };
    r.addEventListener('mousemove', mostrar);
    r.addEventListener('touchstart', mostrar, { passive:true });
  });

  const ocultar = () => {
    tip.hidden = true;
    guia.setAttribute('opacity','0');
    foco.setAttribute('opacity','0');
  };
  cont.addEventListener('mouseleave', ocultar);
  cont.addEventListener('touchend', ocultar);
}

function irASenal(tipo){
  FILTRO = new Set([tipo]);
  VISTA = 'convs';
  document.querySelectorAll('nav button').forEach(x =>
    x.classList.toggle('on', x.dataset.v === 'convs'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  pintarConvs();
}

/* ---------- vista: conversaciones ----------
   Se agrupa por PERSONA, no por sesión. El corte a 30 minutos
   sigue existiendo para las métricas, pero aquí sería confuso:
   el usuario piensa en "mi conversación con X", no en sesiones. */
let CONTACTOS = [];
// Filtros activos en Conversaciones. Se combinan con Y: marcar
// "Interés" y "Contacto" da los leads listos para llamar.
let FILTRO = new Set();
// Ordenar importa más de lo que parece: con 26 personas se navega
// a ojo, con 300 no. Por defecto, quien escribió más recientemente.
let ORDEN = 'reciente';
const ORDENES = {
  reciente: { etq:'Más reciente', fn:(a,b) => new Date(b.ultima) - new Date(a.ultima) },
  antigua:  { etq:'Más antigua',  fn:(a,b) => new Date(a.primera) - new Date(b.primera) },
  mensajes: { etq:'Más mensajes', fn:(a,b) => Number(b.mensajes) - Number(a.mensajes) },
  nombre:   { etq:'Por nombre',   fn:(a,b) =>
      (a.nombre || '\uffff').localeCompare(b.nombre || '\uffff', 'es') }
};
const ordena = l => [...l].sort(ORDENES[ORDEN].fn);
const SENALES = {
  interes:       { etq: 'Interés',       campo: c => c.interes,        pill: 'az' },
  contacto:      { etq: 'Con contacto',  campo: c => c.contacto,       pill: 'nt' },
  cita:          { etq: 'Con cita',      campo: c => !!c.cita,         pill: 'vd' },
  sin_respuesta: { etq: 'Sin respuesta', campo: c => c.sin_respuesta,  pill: 'am' },
  friccion:      { etq: 'Fricción',      campo: c => c.friccion,       pill: 'rj' },
  vuelto:        { etq: 'Ha vuelto',     campo: c => Number(c.conversaciones) > 1, pill: 'nt' }
};
const aplicaFiltros = (lista, filtros) =>
  lista.filter(c => [...filtros].every(k => SENALES[k].campo(c)));

async function pintarConvs(silencioso){
  if (!silencioso) $('#vista').innerHTML =
    '<div class="cargando">Cargando conversaciones…</div>';

  const { data, error } = await supabase.rpc('mis_contactos');
  ULTIMA = Date.now(); pintarCuando();

  if (error){
    pintaEn(`<h2 class="tit">Conversaciones</h2><div class="panel">
      <div class="vacio">No se han podido cargar.<br>${esc(error.message)}</div>
    </div>`, silencioso);
    return;
  }
  CONTACTOS = data || [];

  pintaEn(`
    <h2 class="tit">Conversaciones</h2>
    <p class="sub">Una fila por persona. Ábrela para ver todo el intercambio,
       incluidas las veces que volvió a escribir.</p>
    <div class="panel" id="pconvs"></div>`, silencioso);

  render();
}

// Repinta solo el interior del panel: los filtros son instantáneos
// porque no hay que volver a consultar nada.
function render(busqueda){
  const cont = $('#pconvs'); if (!cont) return;
  const lista = aplicaFiltros(CONTACTOS, FILTRO);

  // Cada filtro muestra cuántos resultados daría AÑADIRLO a la
  // selección actual. Si daría cero, se desactiva: así nunca se
  // llega a una lista vacía.
  const chips = Object.entries(SENALES).map(([k, s]) => {
    const activo = FILTRO.has(k);
    const prueba = new Set(FILTRO);
    activo ? prueba.delete(k) : prueba.add(k);
    const n = activo
      ? lista.length
      : aplicaFiltros(CONTACTOS, prueba).length;
    return { k, s, activo, n };
  }).filter(c => c.activo || c.n > 0);

  const sesiones = lista.reduce((a,c) => a + Number(c.conversaciones), 0);
  const vueltos  = lista.filter(c => Number(c.conversaciones) > 1).length;

  cont.innerHTML = `
    <div class="cabpanel">
      <div>
        <h3>${nf.format(lista.length)} ${lista.length === 1 ? 'persona' : 'personas'}</h3>
        <p class="ph" style="margin:2px 0 0">${nf.format(sesiones)} conversaciones${
          vueltos ? ` · ${nf.format(vueltos)} ${vueltos === 1 ? 'ha vuelto' : 'han vuelto'} a escribir` : ''}${
          FILTRO.size ? ` · filtrado de ${nf.format(CONTACTOS.length)}` : ''}</p>
      </div>
    </div>

    <div class="barrafil">
      <input id="buscar" class="busca" type="search"
             placeholder="Buscar por nombre, teléfono, email o texto…"
             autocomplete="off" value="${esc(busqueda || '')}">
      <div class="orden">
        ${Object.entries(ORDENES).map(([k,o]) =>
          `<button class="${ORDEN===k?'on':''}" data-o="${k}">${o.etq}</button>`).join('')}
      </div>
    </div>

    <div class="chips">
      ${chips.map(c => `<button class="chip ${c.s.pill}${c.activo ? ' on' : ''}"
          data-f="${c.k}" aria-pressed="${c.activo}">
        ${esc(c.s.etq)}<span class="cn">${nf.format(c.n)}</span>
      </button>`).join('')}
      ${FILTRO.size ? '<button class="chip limpia" id="limpiar">Quitar filtros</button>' : ''}
    </div>

    <div class="lista" id="plista">${lista.length
      ? ordena(lista).slice(0,150).map(filaC).join('')
      : '<div class="vacio">Ninguna persona con esos filtros.</div>'}</div>
    ${lista.length > 150 ? `<p class="nota">Se muestran las 150 primeras de
       ${nf.format(lista.length)}. Afina con el buscador o los filtros.</p>` : ''}`;

  enlazarFilas();

  cont.querySelectorAll('.chip[data-f]').forEach(b =>
    b.addEventListener('click', () => {
      const k = b.dataset.f;
      FILTRO.has(k) ? FILTRO.delete(k) : FILTRO.add(k);
      render();
    }));
  $('#limpiar')?.addEventListener('click', () => { FILTRO.clear(); render(); });

  cont.querySelectorAll('.orden button[data-o]').forEach(b =>
    b.addEventListener('click', () => {
      ORDEN = b.dataset.o;
      render($('#buscar')?.value.trim() || '');
    }));

  const inp = $('#buscar');
  let tmr = null;
  inp.addEventListener('input', () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => filtrar(inp.value.trim()), 280);
  });
  BUSCA = busqueda || '';
  if (busqueda) filtrar(busqueda);
}

async function filtrar(q){
  const cont = $('#plista');
  if (!cont) return;
  BUSCA = q || '';
  const base = aplicaFiltros(CONTACTOS, FILTRO);
  const pinta = (l, vacio) => {
    cont.innerHTML = l.length ? ordena(l).slice(0,150).map(filaC).join('')
                              : `<div class="vacio">${vacio}</div>`;
    enlazarFilas();
  };

  if (!q){ pinta(base, 'Ninguna persona con esos filtros.'); return; }

  // Se normalizan acentos y mayúsculas en ambos lados: buscar
  // "jose" tiene que encontrar a "José", y era el fallo más
  // frecuente del buscador anterior.
  const norm = t => String(t || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const n = norm(q);
  const soloNum = q.replace(/[^0-9]/g, '');

  const local = base.filter(c =>
    norm(c.nombre).includes(n) ||
    norm(c.email).includes(n) ||
    (soloNum.length >= 3 &&
      ((c.telefono || '') + (c.contact_ref || '')).includes(soloNum)));

  // Con un texto que parece un teléfono no se busca en los
  // mensajes: encontraría cualquier conversación que mencione
  // esos dígitos y confundiría más que ayudar.
  if (local.length || /^[0-9+ ()-]{3,}$/.test(q)){
    pinta(local, `Nadie coincide con «${esc(q)}».`);
    return;
  }

  cont.innerHTML = '<div class="vacio">Buscando en los mensajes…</div>';
  const { data } = await supabase.from('message_events')
    .select('conversation_id').eq('excluido', false)
    .ilike('content', `%${q}%`).limit(500);
  const ids = new Set((data || []).map(r => r.conversation_id));
  const r = base.filter(c => (c.ids || []).some(i => ids.has(i)));
  // Al buscar dentro de los mensajes, resaltar el nombre no
  // aporta: la coincidencia está en la conversación, no aquí.
  BUSCA = '';
  cont.innerHTML = r.length
    ? ordena(r).slice(0,150).map(filaC).join('')
      + `<p class="nota">${nf.format(r.length)} ${r.length === 1
          ? 'persona escribió' : 'personas escribieron'} «${esc(q)}» en sus mensajes.</p>`
    : `<div class="vacio">Ninguna conversación contiene «${esc(q)}».</div>`;
  enlazarFilas();
}

// Una persona por fila. El identificador manda: si tiene nombre,
// el nombre; si no, el teléfono, y se dice que no hay nombre en
// vez de dejar el hueco. Antes ambos casos se veían igual de
// pequeños y costaba distinguir a quién estabas mirando.
let BUSCA = '';

const inicial = c => {
  const n = (c.nombre || '').trim();
  if (n) return n[0].toUpperCase();
  return null;
};

// Resalta lo buscado sin romper el escapado: se escapa primero y
// se marca después sobre el texto ya seguro.
//
// El resaltado tiene que ignorar los acentos igual que la
// búsqueda. Si no, escribes "jose", la fila de José aparece y
// nada se marca: parece que el buscador se ha equivocado. No se
// puede normalizar el texto y buscar en él, porque quitar los
// acentos cambia las posiciones; se amplía cada letra de la
// consulta a las variantes que puede tener en el texto.
const ACENTOS = {
  a:'aáàâäã', e:'eéèêë', i:'iíìîï', o:'oóòôöõ',
  u:'uúùûü',  n:'nñ',    c:'cç',    y:'yý'
};
function regexBusqueda(q){
  const partes = [...q].map(ch => {
    const b = ch.toLowerCase();
    if (ACENTOS[b]) return '[' + ACENTOS[b] + ACENTOS[b].toUpperCase() + ']';
    return ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  });
  return new RegExp(partes.join(''), 'gi');
}

function marca(txt){
  const t = esc(String(txt ?? ''));
  if (!BUSCA) return t;
  try {
    // Se marca sobre el texto ya escapado, así que hay que evitar
    // pintar dentro de una entidad como &amp; o &lt;.
    return t.replace(regexBusqueda(BUSCA), m =>
      m.includes('&') || m.includes(';') ? m : `<mark>${m}</mark>`);
  } catch { return t; }
}

// "hace 3 h" dice más que una fecha para saber si alguien acaba
// de escribir. Pasada la semana, la fecha vuelve a ser más útil.
function desdeEntonces(d){
  if (!d) return { txt:'—', frio:true };
  const ms = Date.now() - new Date(d).getTime();
  const min = Math.round(ms/6e4);
  if (min < 2)     return { txt:'ahora mismo', frio:false };
  if (min < 60)    return { txt:`hace ${min} min`, frio:false };
  const h = Math.round(min/60);
  if (h < 24)      return { txt:`hace ${h} h`, frio:false };
  const dd = Math.round(h/24);
  if (dd < 7)      return { txt:`hace ${dd} ${dd===1?'día':'días'}`, frio:false };
  return { txt: fechaCorta(d), frio:true };
}

const filaC = c => {
  const ini = inicial(c);
  const act = c.historico ? { txt:'histórico', frio:true } : desdeEntonces(c.ultima);
  const senales = [
    c.cita          ? '<span class="pill vd">Cita</span>'          : '',
    c.interes       ? '<span class="pill az">Interés</span>'       : '',
    c.contacto      ? '<span class="pill nt">Contacto</span>'      : '',
    c.sin_respuesta ? '<span class="pill am">Sin respuesta</span>' : '',
    c.friccion      ? '<span class="pill rj">Fricción</span>'      : ''
  ].join('');

  return `<div class="pers" data-c="${esc(c.contact_ref)}" tabindex="0" role="button">
    <div class="ini${ini ? '' : ' anon'}">${ini ? esc(ini) : '·'}</div>
    <div class="pcuerpo">
      <div class="pnom">${c.nombre
        ? marca(c.nombre)
        : `<span class="mono">${marca(c.telefono || c.contact_ref)}</span>
           <span class="csin"> · sin nombre</span>`}</div>
      <div class="pdat">${c.nombre
        ? `<span class="mono">${marca(c.telefono || c.contact_ref)}</span>` : ''}${
        c.email ? (c.nombre ? ' · ' : '') + marca(c.email) : ''}</div>
      ${senales ? `<div class="pmarcas">${senales}</div>` : ''}
    </div>
    <div class="pact">
      <div class="pcuando${act.frio ? ' frio' : ''}">${esc(act.txt)}</div>
      <div class="pmsg">${nf.format(c.mensajes)} mensajes${
        Number(c.conversaciones) > 1 ? ` · ${c.conversaciones} veces` : ''}</div>
    </div>
  </div>`;
};

function enlazarFilas(){
  document.querySelectorAll('.pers[data-c]').forEach(el => {
    const ir = () => abrir(el.dataset.c);
    el.addEventListener('click', ir);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); }
    });
  });
}

/* ---------- vista: agenda ----------
   Las citas ya las guarda el agente en la tabla users mediante
   su herramienta "Save Data". Aquí solo se presentan.          */
async function pintarAgenda(silencioso){
  if (!silencioso) $('#vista').innerHTML = '<div class="cargando">Cargando agenda…</div>';

  const { data, error } = await supabase.rpc('mis_citas');
  ULTIMA = Date.now(); pintarCuando();

  if (error){
    pintaEn(`<h2 class="tit">Agenda</h2><div class="panel">
      <div class="vacio">No se ha podido cargar la agenda.<br>${esc(error.message)}</div>
    </div>`, silencioso);
    return;
  }

  const citas = data || [];
  const ahora = Date.now();
  const vivas = citas.filter(c => c.estado !== 'cancelada');
  const canceladas = citas.filter(c => c.estado === 'cancelada');
  const conFecha = vivas.filter(c => c.cuando);
  const proximas = conFecha.filter(c => new Date(c.cuando) >= ahora)
    .sort((a,b) => new Date(a.cuando) - new Date(b.cuando));
  const pasadas  = conFecha.filter(c => new Date(c.cuando) < ahora)
    .sort((a,b) => new Date(b.cuando) - new Date(a.cuando));
  const sinFecha = vivas.filter(c => !c.cuando);

  pintaEn(`
    <h2 class="tit">Agenda</h2>
    <p class="sub">Citas que ha ido registrando el asistente en sus conversaciones.
       Puedes añadir cada una a tu calendario.</p>

    <div class="kpis">
      ${kpi('Próximas citas', nf.format(proximas.length),
            proximas.length ? 'La más cercana, ' + fechaCorta(proximas[0].cuando) : 'Ninguna pendiente')}
      ${kpi('Citas agendadas', nf.format(vivas.length), 'Desde el inicio del servicio', true)}
      ${kpi('Ya celebradas', nf.format(pasadas.length), 'Con fecha pasada')}
      ${kpi('Canceladas', nf.format(canceladas.length),
            citas.length ? `${Math.round(canceladas.length / citas.length * 100)}% del total` : '—')}
    </div>

    ${bloqueCitas('Próximas', proximas, true)}
    ${bloqueCitas('Anteriores', pasadas.slice(0, 25), false)}
    ${sinFecha.length ? bloqueCitas('Sin fecha', sinFecha, false) : ''}
    ${canceladas.length ? bloqueCitas('Canceladas', canceladas.slice(0, 15), false) : ''}

    ${!citas.length ? `<div class="panel"><div class="vacio">
      Sin citas por ahora.<br>
        Aparecen aquí en cuanto se agende la primera desde Calendly.</div></div>` : ''}`,
    silencioso);

  document.querySelectorAll('.ics').forEach(b =>
    b.addEventListener('click', () => descargarICS(JSON.parse(b.dataset.c))));
}

function bloqueCitas(titulo, lista, destacar){

    <h3>${titulo}</h3>
    <p class="ph">${nf.format(lista.length)} ${lista.length===1?'cita':'citas'}</p>
    <div class="citas">
      ${lista.map(c => `<div class="cita${destacar?' pr':''}${
          c.estado === 'cancelada' ? ' can' : ''}">
        <div class="cfecha">
          ${c.cuando ? `<span class="cdia">${new Date(c.cuando).toLocaleDateString('es-ES',
                {day:'2-digit'})}</span>
            <span class="cmes">${new Date(c.cuando).toLocaleDateString('es-ES',
                {month:'short'})}</span>
            <span class="chora mono">${new Date(c.cuando).toLocaleTimeString('es-ES',
                {hour:'2-digit',minute:'2-digit'})}</span>`
            : `<span class="cdia">·</span><span class="cmes">s/f</span>`}
        </div>
        <div class="ccuerpo">
          <strong>${c.nombre ? esc(c.nombre) : esc(c.telefono || c.email || 'Contacto')}</strong>
          ${c.descripcion ? `<span>${esc(c.descripcion)}</span>` : ''}
          <span class="cmeta mono">${esc(c.telefono || '')}${
            c.email ? ' · ' + esc(c.email) : ''}</span>
          ${c.ubicacion ? `<span class="cmeta">${esc(c.ubicacion)}</span>` : ''}
        </div>
        <div class="cacc">
          ${c.telefono ? `<a class="cbtn" href="tel:${esc(c.telefono)}">Llamar</a>` : ''}
          ${c.cuando && c.estado !== 'cancelada' ? `<button class="cbtn ics"
              data-c='${esc(JSON.stringify({t:c.nombre||c.telefono,d:c.descripcion||'',
                            w:c.cuando,e:c.email||'',p:c.telefono||''}))}'>Calendario</button>` : ''}
          ${c.enlace && c.estado !== 'cancelada' ? `<a class="cbtn" href="${esc(c.enlace)}"
              target="_blank" rel="noopener noreferrer">Reagendar</a>` : ''}
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

// Genera un .ics estándar: se abre en Google Calendar, Outlook,
// Apple Calendar o el que tenga configurado el usuario.
function descargarICS(c){
  const ini = new Date(c.w);
  const fin = new Date(ini.getTime() + 60*60*1000);
  const z = d => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const esc2 = s => String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SimpliaSpain//Panel//ES',
    'BEGIN:VEVENT',
    'UID:' + Date.now() + '@simpliaspain',
    'DTSTAMP:' + z(new Date()),
    'DTSTART:' + z(ini),
    'DTEND:'   + z(fin),
    'SUMMARY:' + esc2('Cita · ' + c.t),
    'DESCRIPTION:' + esc2((c.d ? c.d + '\n' : '') +
        (c.p ? 'Teléfono: ' + c.p + '\n' : '') + (c.e ? 'Email: ' + c.e : '')),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');

  const url = URL.createObjectURL(new Blob([ics], {type:'text/calendar;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'cita.ics'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ============================================================
   EMBUDO COMERCIAL

   El orden de la lista es el producto. Un comercial no necesita
   ver 27 leads: necesita saber a quién llama ahora. Por eso la
   cola se ordena por urgencia real y no por fecha:

     1. Acción vencida — se comprometió a algo y ha pasado
     2. Dejó contacto y nadie le ha tocado — el dinero sobre la mesa
     3. Visita agendada próxima — confirmarla evita el no-show
     4. El resto, por antigüedad del último mensaje

   La cualificación se muestra como cinco barritas, no como un
   número: se ve de un vistazo cuánto falta sin tener que leer.
   ============================================================ */

let LEADS = [], EMBUDO = [], LFILTRO = 'todo', LABIERTO = null;

const ETAPAS = [
  ['entrada',        'Entrada',   'fe1'],
  ['cualificado',    'Cualificado','fe2'],
  ['visita_agendada','Visita',    'fe3'],
  ['visita_hecha',   'Visitado',  'fe4'],
  ['propuesta',      'Propuesta', 'fe5'],
  ['ganado',         'Ganado',    'fe6'],
  ['perdido',        'Perdido',   'fe7']
];
const NOMBRE_ETAPA = Object.fromEntries(ETAPAS.map(e => [e[0], e[1]]));

// Devuelve por qué este lead es urgente, o null. Que el motivo sea
// texto y no un color permite escribirlo en la tarjeta: un comercial
// no debería tener que descifrar por qué algo está en rojo.
function urgencia(l){
  const hoy = new Date().toISOString().slice(0,10);
  if (l.proxima_fecha && l.proxima_fecha < hoy)
    return { nivel:'urg', txt:`Acción vencida el ${fechaCorta(l.proxima_fecha)}`, peso:0 };
  if (l.proxima_fecha === hoy)
    return { nivel:'urg', txt:'Acción prevista para hoy', peso:1 };
  if (Number(l.toques) === 0 && (l.email || l.telefono) &&
      ['cualificado','visita_hecha','propuesta'].includes(l.etapa))
    return { nivel:'oro', txt:'Dejó contacto y nadie le ha llamado', peso:2 };
  if (l.cita && new Date(l.cita) - Date.now() < 3*864e5)
    return { nivel:'oro', txt:`Visita el ${fechaCorta(l.cita)}: confirmar`, peso:3 };
  if (Number(l.toques) === 0 && l.etapa === 'entrada')
    return { nivel:'', txt:'Sin tocar', peso:5 };
  return null;
}

function ordenLeads(a, b){
  const ua = urgencia(a), ub = urgencia(b);
  const pa = ua ? ua.peso : 4, pb = ub ? ub.peso : 4;
  if (pa !== pb) return pa - pb;
  return new Date(b.ultima || 0) - new Date(a.ultima || 0);
}

async function pintarEmbudo(silencioso){
  if (!silencioso) $('#vista').innerHTML = '<div class="cargando">Cargando el embudo…</div>';

  // Sincronizar ANTES de leer: si no, una conversación nueva no
  // aparece hasta que alguien se acuerde de refrescar el CRM a
  // mano, y nadie se acuerda. Es idempotente y no pisa nada de lo
  // que haya escrito el comercial.
  //
  // Si falla —por permisos, por ejemplo— se sigue adelante y se
  // muestra lo que ya hay: una lista algo vieja es mejor que una
  // pantalla en blanco.
  await supabase.rpc('sincronizar_leads').catch(() => {});

  const [a, b] = await Promise.all([
    supabase.rpc('mis_leads'),
    supabase.rpc('embudo')
  ]);
  ULTIMA = Date.now(); pintarCuando();

  if (a.error){
    pintaEn(`<h2 class="tit">Embudo</h2><div class="panel"><div class="vacio">
      No se ha podido cargar.<br>${esc(a.error.message)}</div></div>`, silencioso);
    return;
  }
  LEADS = a.data || []; EMBUDO = b.data || [];

  if (!LEADS.length){
    pintaEn(`<h2 class="tit">Embudo</h2>
      <p class="sub">Todo el que escribe al asistente, y en qué punto está.</p>
      <div class="panel"><div class="vacio">
        <strong>Nadie ha escrito aún.</strong><br>
        Quien escriba al asistente entra aquí solo, sin hacer nada.</div></div>`, silencioso);
    return;
  }

  const vivos = LEADS.filter(l => !['ganado','perdido'].includes(l.etapa));
  const urg   = vivos.filter(l => urgencia(l)?.nivel === 'urg').length;
  const oro   = vivos.filter(l => urgencia(l)?.nivel === 'oro').length;

  pintaEn(`
    <h2 class="tit">Embudo</h2>
    <p class="sub">Todo el que escribe al asistente, y en qué punto está.
       Se crean solos a partir de las conversaciones; tú los mueves.</p>

    ${bloqueFunnel()}

    <div class="panel">
      <div class="cabpanel">
        <div>
          <h3>${urg ? `${urg} ${urg === 1 ? 'necesita' : 'necesitan'} atención hoy`
                    : oro ? `${oro} sin tocar con el contacto ya dado`
                    : 'Nada urgente'}</h3>
          <p class="ph">${nf.format(vivos.length)} en marcha ·
             ${nf.format(LEADS.length - vivos.length)} cerrados</p>
        </div>
        <button class="binfo" id="binfo" title="Cómo se lee esto"
          aria-label="Cómo se lee esto">i</button>
      </div>

      ${leyenda()}

      <div class="lfiltros">
        <input id="lbusca" class="busca" type="search"
               placeholder="Buscar por nombre, teléfono o email…" autocomplete="off">
        <div class="orden">
          ${[['todo','Todos'],['urg','Urgentes'],['sin','Sin tocar'],['cerrado','Cerrados']]
            .map(([k,t]) => `<button class="${LFILTRO===k?'on':''}" data-lf="${k}">${t}</button>`)
            .join('')}
        </div>
      </div>

      <div id="lista-leads"></div>
    </div>

    <p class="nota">Entra aquí todo el que escribe al asistente, no solo quien
       muestra interés: lo que más se pierde es precisamente lo que nadie llega a
       mirar. Los que no vayan a ninguna parte se descartan en dos clics.
       Lo que escribas tú no se sobrescribe nunca.</p>`, silencioso);

  $('#binfo')?.addEventListener('click', () =>
    $('#leyenda').classList.toggle('on'));

  // Los filtros y el buscador se enlazan aquí, no en la vista de
  // Conversaciones: cada vista enlaza lo suyo.
  document.querySelectorAll('.orden button[data-lf]').forEach(b =>
    b.addEventListener('click', () => {
      LFILTRO = b.dataset.lf;
      document.querySelectorAll('.orden button[data-lf]')
        .forEach(x => x.classList.toggle('on', x === b));
      pintarLista($('#lbusca')?.value.trim());
    }));

  const lb = $('#lbusca');
  if (lb){
    let t = null;
    lb.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => pintarLista(lb.value.trim()), 200);
    });
  }

  pintarLista($('#lbusca')?.value.trim());
}

// Refresca los datos SIN repintar la vista entera. Repintar
// `#vista` con la ficha abierta vacía el fondo un instante, la
// página se encoge y el modal salta y se deforma. Aquí solo se
// tocan la barra del embudo y la lista.
async function refrescarEmbudo(){
  const [a, b] = await Promise.all([
    supabase.rpc('mis_leads'),
    supabase.rpc('embudo')
  ]);
  if (a.data) LEADS = a.data;
  if (b.data) EMBUDO = b.data;

  const f = $('#panel-funnel');
  if (f) f.innerHTML = interiorFunnel();
  pintarLista($('#lbusca')?.value.trim());
}

function bloqueFunnel(){
  return `<div class="panel" id="panel-funnel">${interiorFunnel()}</div>`;
}

function interiorFunnel(){
  const total = EMBUDO.reduce((s,e) => s + Number(e.leads), 0) || 1;
  const con = EMBUDO.filter(e => Number(e.leads) > 0);
  return `
    <h3>El recorrido</h3>
    <p class="ph">De la primera pregunta al contrato firmado.</p>
    <div class="fbarra">
      ${con.map(e => {
        const cl = (ETAPAS.find(x => x[0] === e.etapa) || [,,'fe1'])[2];
        return `<div class="ftramo ${cl}" style="flex:${Number(e.leads)}"
          title="${esc(NOMBRE_ETAPA[e.etapa] || e.etapa)}">${e.leads}</div>`;
      }).join('')}
    </div>
    <div class="fleyenda">
      ${con.map(e => {
        const cl = (ETAPAS.find(x => x[0] === e.etapa) || [,,'fe1'])[2];
        return `<span><i class="${cl}"></i>${esc(NOMBRE_ETAPA[e.etapa] || e.etapa)}
          · ${e.leads} (${Math.round(Number(e.leads)/total*100)} %)</span>`;
      }).join('')}
    </div>
    ${Number(EMBUDO.find(e => e.etapa==='ganado')?.leads || 0) === 0
      ? `<p class="nota" style="margin:0">Sin cerrados todavía. Al marcar el primero como ganado
         aparecerá aquí la conversión real.</p>` : ''}`;
}

function pintarLista(q){
  const cont = $('#lista-leads'); if (!cont) return;
  const norm = t => String(t || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  let l = LEADS.slice();
  if (LFILTRO === 'cerrado') l = l.filter(x => ['ganado','perdido'].includes(x.etapa));
  else {
    l = l.filter(x => !['ganado','perdido'].includes(x.etapa));
    if (LFILTRO === 'urg') l = l.filter(x => ['urg','oro'].includes(urgencia(x)?.nivel));
    if (LFILTRO === 'sin') l = l.filter(x => Number(x.toques) === 0);
  }
  if (q){
    const n = norm(q), num = q.replace(/[^0-9]/g, '');
    l = l.filter(x => norm(x.nombre).includes(n) || norm(x.email).includes(n) ||
      (num.length >= 3 && String(x.telefono || x.contact_ref).includes(num)));
  }

  cont.innerHTML = l.length
    ? l.sort(ordenLeads).map(tarjetaLead).join('')
    : `<div class="vacio">Ningún lead con este filtro.</div>`;
  enlazarLeads();
}

function tarjetaLead(l){
  const u = urgencia(l);
  const pide = [l.servicio, l.ubicacion].filter(Boolean).join(' · ');
  const cual = [l.personas, l.cuando_necesita, l.permanencia,
                l.situacion_actual, l.quien_decide];

  return `<div class="lead ${u?.nivel || ''}" data-lead="${l.id}" tabindex="0" role="button">
    <div class="lcinta"></div>
    <div class="lcuerpo">
      <div class="lcab">
        <span class="lnom">${l.nombre ? esc(l.nombre)
          : `<span class="mono">${esc(l.telefono || l.contact_ref)}</span>
             <span class="csin"> sin nombre</span>`}</span>
        <span class="pill az">${esc(NOMBRE_ETAPA[l.etapa] || l.etapa)}</span>
        ${l.valor_mes ? `<span class="pill vd">${nf.format(l.valor_mes)} €/mes</span>` : ''}
      </div>
      <div class="lpide">${pide ? esc(pide) : 'Sin concretar qué busca'}</div>
      <div class="lcual" title="${cual.filter(Boolean).length} de 5 preguntas respondidas">
        ${cual.map(v => `<span class="${v ? 'si' : ''}"></span>`).join('')}
      </div>
      <div class="lpie">
        ${u ? `<span class="${u.nivel === 'urg' ? 'lurge' : ''}">${esc(u.txt)}</span>` : ''}
        ${l.ultima ? `<span>Escribió ${desdeEntonces(l.ultima).txt}</span>` : ''}
        <span><b>${l.toques}</b> ${Number(l.toques) === 1 ? 'toque' : 'toques'}</span>
        ${l.respuesta_s != null
          ? `<span>Respondido en <b>${l.respuesta_s} s</b></span>` : ''}
      </div>
    </div>
    <div class="laccion">
      <button class="cbtn" data-lead="${l.id}">Abrir</button>
    </div>
  </div>`;
}

function enlazarLeads(){
  document.querySelectorAll('.lead[data-lead]').forEach(el => {
    const ir = () => abrirLead(Number(el.dataset.lead));
    el.addEventListener('click', ir);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); }
    });
  });
}

/* ---------- ficha ---------- */

/* ---------- historial del lead ---------- */
const ICONO_EV = { toque:'Contacto', etapa:'Cambio de etapa', nota:'Nota', alta:'Alta' };

async function pintarHistorial(leadId){
  const cont = $('#fhist'); if (!cont) return;
  const { data, error } = await supabase.rpc('historial_lead', { p_id: leadId });
  if (error){ cont.innerHTML = '<div class="ph">No se ha podido cargar.</div>'; return; }
  const ev = data || [];

  cont.innerHTML = ev.length ? ev.map(e => `
    <div class="hev">
      <span class="hpunto ${esc(e.tipo)}"></span>
      <div class="hcuerpo">
        <div>${e.tipo === 'etapa'
          ? `De <b>${esc(NOMBRE_ETAPA[e.desde] || e.desde || '—')}</b> a
             <b>${esc(NOMBRE_ETAPA[e.hasta] || e.hasta)}</b>`
          : esc(e.detalle || ICONO_EV[e.tipo] || e.tipo)}</div>
        <div class="hcuando">${esc(ICONO_EV[e.tipo] || e.tipo)} ·
          ${fechaHoraCorta(e.cuando)}${
          e.tipo === 'etapa' && e.detalle ? ' · ' + esc(e.detalle) : ''}</div>
      </div>
      <div class="hacc">
        ${e.tipo === 'toque' ? `
          <button data-edev="${e.id}">Corregir</button>
          <button class="mal" data-delev="${e.id}">Deshacer</button>` : ''}
      </div>
    </div>`).join('')
    : '<div class="ph">Sin movimientos por ahora.</div>';

  enlazarHistorial(leadId);
}

function enlazarHistorial(leadId){
  const cont = $('#fhist'); if (!cont) return;

  cont.querySelectorAll('button[data-delev]').forEach(b =>
    b.addEventListener('click', async () => {
      b.disabled = true;
      const { error } = await supabase.rpc('deshacer_evento',
        { p_evento: Number(b.dataset.delev) });
      if (error){ b.disabled = false; return; }
      await pintarHistorial(leadId);
      await refrescarEmbudo();
      const l = LEADS.find(x => x.id === leadId);
      if (l) $('#mbox').querySelector('.dmeta:last-of-type')?.replaceWith(
        Object.assign(document.createElement('p'), { className:'dmeta',
          textContent: `${nf.format(l.mensajes || 0)} mensajes · ${l.toques} ${
            Number(l.toques) === 1 ? 'toque' : 'toques'}` }));
    }));

  // Corregir sustituye el texto por un campo, en el sitio. Abrir otro
  // formulario para cambiar una línea sería desproporcionado.
  cont.querySelectorAll('button[data-edev]').forEach(b =>
    b.addEventListener('click', () => {
      const fila = b.closest('.hev');
      const cuerpo = fila.querySelector('.hcuerpo > div');
      const antes = cuerpo.textContent.trim();
      cuerpo.innerHTML = `<input class="sel" style="width:100%;font-size:13px"
        value="${esc(antes)}">`;
      const inp = cuerpo.querySelector('input');
      inp.focus(); inp.select();
      const guardar = async () => {
        const v = inp.value.trim();
        if (!v || v === antes){ cuerpo.textContent = antes; return; }
        await supabase.rpc('editar_evento',
          { p_evento: Number(b.dataset.edev), p_detalle: v });
        await pintarHistorial(leadId);
      };
      inp.addEventListener('blur', guardar);
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape'){ inp.value = antes; inp.blur(); }
      });
    }));
}

const fechaHoraCorta = d => new Date(d).toLocaleString('es-ES',
  { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });

function enlazarFicha(l){
  const leer = () => ({
    personas:         $('#f_personas').value.trim() || null,
    cuando_necesita:  $('#f_cuando').value.trim()   || null,
    permanencia:      $('#f_perma').value.trim()    || null,
    situacion_actual: $('#f_situacion').value.trim()|| null,
    quien_decide:     $('#f_decide').value.trim()   || null,
    canal:            $('#f_canal').value,
    valor_mes:        $('#f_valor').value.trim()    || null,
    proxima_accion:   $('#f_accion').value.trim()   || null,
    proxima_fecha:    $('#f_fecha').value           || null,
    notas:            $('#f_notas').value.trim()    || null
  });

  // El aviso va arriba y se desplaza hasta él: un mensaje que no se
  // ve equivale a que la acción no hizo nada, que es justo lo que
  // parecía antes.
  const aviso = (txt, ok) => {
    const e = $('#faviso');
    e.textContent = txt;
    e.className = 'faviso ' + (ok ? 'ok' : 'mal');
    $('#mbox').scrollTo({ top: 0, behavior: 'smooth' });
    if (ok) setTimeout(() => { e.className = 'faviso'; }, 3500);
  };

  const fallo = (error) => aviso(
    /lectura|acceso|42501/.test(error.message || '')
      ? 'No tienes permiso para editar este cliente. Pídele a SimpliaSpain que te dé rol de administrador.'
      : 'No se ha podido guardar: ' + error.message, false);

  const caja = (id, abrir) => {
    ['#fcajatoque','#fcajaperdido'].forEach(x =>
      $(x).classList.toggle('on', x === id && abrir));
    if (abrir) $(id).scrollIntoView({ behavior:'smooth', block:'nearest' });
  };

  // ---- guardar ----
  $('#fguardar').addEventListener('click', async () => {
    const b = $('#fguardar'); b.disabled = true; b.textContent = 'Guardando…';
    const { error } = await supabase.rpc('guardar_lead', { p_id: l.id, p_campos: leer() });
    b.disabled = false; b.textContent = 'Guardar cambios';
    if (error) return fallo(error);
    aviso('Guardado', true);
    await refrescarEmbudo();
  });

  // ---- cambiar de etapa ----
  document.querySelectorAll('.fet[data-et]').forEach(b =>
    b.addEventListener('click', async () => {
      const et = b.dataset.et;
      if (et === l.etapa) return;
      if (et === 'perdido'){ caja('#fcajaperdido', true); return; }
      caja(null, false);
      await moverA(et, null);
    }));

  async function moverA(et, nota){
    const { error } = await supabase.rpc('mover_lead',
      { p_id: l.id, p_etapa: et, p_nota: nota });
    if (error) return fallo(error);
    await refrescarEmbudo();
    const nuevo = LEADS.find(x => x.id === l.id);
    if (nuevo){ abrirLead(nuevo.id); aviso('Movido a ' + NOMBRE_ETAPA[et], true); }
    else cerrar();   // se ha excluido o filtrado: no dejar la ficha huérfana
  }

  $('#p_no').addEventListener('click', () => caja(null, false));
  $('#p_ok').addEventListener('click', async () => {
    const m = $('#p_motivo').value.trim();
    if (!m) return aviso('Escribe el motivo antes de cerrarlo', false);
    await moverA('perdido', m);
  });

  // ---- apuntar un toque ----
  $('#ftoque').addEventListener('click', () => {
    caja('#fcajatoque', !$('#fcajatoque').classList.contains('on'));
    $('#t_fecha').value = $('#f_fecha').value || '';
    setTimeout(() => $('#t_detalle')?.focus(), 120);
  });
  $('#t_no').addEventListener('click', () => caja(null, false));
  $('#t_ok').addEventListener('click', async () => {
    const d = $('#t_detalle').value.trim();
    if (!d) return aviso('Escribe qué has hecho', false);
    const b = $('#t_ok'); b.disabled = true;
    const { error } = await supabase.rpc('apuntar_toque',
      { p_id: l.id, p_detalle: d, p_proxima: $('#t_fecha').value || null });
    b.disabled = false;
    if (error) return fallo(error);
    caja(null, false);
    aviso('Contacto apuntado', true);
    await refrescarEmbudo();
    const nuevo = LEADS.find(x => x.id === l.id);
    if (nuevo) abrirLead(nuevo.id);
  });

  // ---- ir a la conversación ----
  $('#fx').addEventListener('click', cerrar);
  $('#fver').addEventListener('click', () => {
    cerrar();
    document.querySelector('nav button[data-v="convs"]')?.click();
    setTimeout(() => {
      const b = $('#buscar');
      if (b){ b.value = l.telefono || l.contact_ref; filtrar(b.value); }
    }, 700);
  });

  // Enter guarda desde cualquier campo de texto de la ficha
  $('#mbox').querySelectorAll('.fpreg input').forEach(i =>
    i.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if ($('#fcajatoque').classList.contains('on')) $('#t_ok').click();
      else if ($('#fcajaperdido').classList.contains('on')) $('#p_ok').click();
      else $('#fguardar').click();
    }));
}

/* ---------- utilidades ---------- */
// El teléfono completo no se muestra en pantalla: se ve lo justo para reconocer al contacto.
const ofusca = t => t ? t.slice(0,4) + '···' + t.slice(-3) : '—';
// El agente de n8n guarda su traza de herramientas delante de la
// respuesta. mensajes_contacto ya la quita, pero la actividad
// reciente lee `content` directo de la tabla. Mismo criterio:
// se cuentan corchetes, porque el JSON de la traza lleva
// corchetes dentro y cortar por el primer "]]" falla con arrays
// anidados.
function limpiaMensaje(t){
  const s = String(t ?? '').trimStart();
  if (!s.startsWith('[Used tools:')) return t ?? '';
  let d = 0;
  for (let i = 0; i < s.length; i++){
    if (s[i] === '[') d++;
    else if (s[i] === ']' && --d === 0) return s.slice(i + 1).trim();
  }
  return t ?? '';
}

const esc = s => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fechaCorta = d => new Date(d).toLocaleDateString('es-ES',
  { day:'2-digit', month:'short', year:'2-digit' });
const fecha = d => new Date(d).toLocaleString('es-ES',
  { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const hora = d => new Date(d).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });

/* El distintivo solo aparece fuera del dominio de producción. Así no
   hay forma de confundir un panel con otro, y nadie tiene que
   acordarse de quitarlo al desplegar. */
(function(){
  const enProduccion =
    location.hostname === 'panel.simpliaspain.com' &&
    !location.pathname.startsWith('/staging');
  const enLocal =
    location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (enProduccion || enLocal) return;
  const d = document.createElement('div');
  d.className = 'staging';
  d.textContent = 'Staging · no es lo que ve el cliente';
  document.body.insertBefore(d, document.body.firstChild);
})();
</script>
