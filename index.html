<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpliaSpain · Panel de cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pulso:#1B7CFF;
    --profundo:#0A1F4A;
    --tinta:#0A0E1A;
    --aire:#E5EFFE;
    --gris:#64748B;
    --linea:#E2E8F0;
    --blanco:#FFFFFF;
    --fondo:#F7FAFF;
    --verde:#12B76A;
    --ambar:#F79009;
    --rojo:#F04438;
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;width:100%;max-width:100%;overflow-x:hidden;
            -webkit-text-size-adjust:100%}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:var(--fondo);color:var(--tinta);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  em{font-style:italic;color:var(--pulso);font-weight:800}
  button{font-family:inherit;cursor:pointer;border:none}
  button:focus-visible,input:focus-visible{outline:2px solid var(--pulso);outline-offset:2px}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center}
  @media(max-width:900px){#login{grid-template-columns:1fr}#login .izq{display:none}}
  #login .izq{padding:0 6vw}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;background:var(--aire);
    color:var(--profundo);font-size:12px;font-weight:600;
    padding:6px 14px;border-radius:99px;margin-bottom:28px;
  }
  .eyebrow::before{content:'';width:7px;height:7px;border-radius:99px;background:var(--pulso)}
  #login h1{font-size:clamp(44px,5.5vw,76px);line-height:1.02;letter-spacing:-.035em;font-weight:800}
  #login .izq p{margin-top:22px;max-width:44ch;color:#334155;line-height:1.65;font-size:15px}
  .der{padding:0 6vw}
  .card{
    background:var(--blanco);border-radius:var(--r);padding:38px 34px;
    box-shadow:0 1px 2px rgba(10,31,74,.04),0 12px 40px rgba(10,31,74,.07);
    max-width:440px;margin:0 auto;width:100%;
  }
  .marca{font-size:15px;font-weight:800;text-align:center;letter-spacing:-.01em}
  .marca span{color:var(--pulso)}
  .card h2{text-align:center;font-size:27px;line-height:1.2;margin:14px 0 6px;letter-spacing:-.02em}
  .estado{
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12.5px;color:var(--gris);margin-bottom:26px;
  }
  .dot{width:7px;height:7px;border-radius:99px;background:var(--verde);flex:none}
  .dot.on{animation:lat 2s ease-in-out infinite}
  @keyframes lat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
  label{display:block;font-size:12.5px;font-weight:600;margin:0 0 7px}
  input{
    width:100%;padding:13px 15px;border:1.5px solid var(--linea);border-radius:11px;
    font-size:14.5px;font-family:inherit;margin-bottom:16px;transition:border-color .15s;
    background:var(--blanco);color:var(--tinta);
  }
  input:focus{border-color:var(--pulso)}
  .btn{
    width:100%;background:var(--pulso);color:#fff;padding:14px;border-radius:11px;
    font-size:14.5px;font-weight:700;transition:filter .15s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .err{
    background:#FEF3F2;border:1px solid #FDA29B;color:#B42318;
    padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none;
  }

  /* ---------- APP ---------- */
  #app{display:none;min-height:100vh}
  header{
    background:var(--blanco);border-bottom:1px solid var(--linea);
    padding:0 22px;display:flex;align-items:center;gap:20px;
    position:sticky;top:0;z-index:20;flex-wrap:wrap;
  }
  .marca{font-size:16px}
  nav{display:flex;gap:4px;flex:1 1 auto;min-width:0}
  .hend{display:flex;align-items:center;gap:14px;margin-left:auto;min-width:0}
  nav button{
    background:none;padding:19px 14px;font-size:14px;font-weight:600;color:var(--gris);
    border-bottom:2.5px solid transparent;margin-bottom:-1px;
  }
  nav button.on{color:var(--pulso);border-bottom-color:var(--pulso)}
  .vivo{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gris);
        font-weight:600;min-width:0}
  .vivo span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .salir{background:none;color:var(--gris);font-size:13px;padding:8px 12px;border-radius:8px}
  .salir:hover{background:var(--aire);color:var(--profundo)}
  main{padding:34px 26px 70px;max-width:1440px;margin:0 auto}
  h2.tit{font-size:32px;letter-spacing:-.03em;margin-bottom:5px}
  .sub{color:var(--gris);font-size:14px;margin-bottom:28px;max-width:70ch;line-height:1.55}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:15px;margin-bottom:26px}
  .kpi{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:21px 23px}
  .kpi .lab{font-size:12px;color:var(--gris);font-weight:600;margin-bottom:9px}
  .kpi .num{font-size:41px;font-weight:800;letter-spacing:-.035em;line-height:1}
  .kpi .num.az{color:var(--pulso)}
  .kpi .num small{font-size:17px;font-weight:700}
  .kpi .pie{font-size:11.5px;color:var(--gris);margin-top:9px}
  .kpi.pend{background:repeating-linear-gradient(135deg,#fff,#fff 9px,#FBFCFE 9px,#FBFCFE 18px)}
  .kpi.pend .num{color:#CBD5E1}

  .panel{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:23px 25px;margin-bottom:22px}
  .panel h3{font-size:15px;margin-bottom:3px}
  .panel .ph{color:var(--gris);font-size:12.5px;margin-bottom:20px}

  .vacio{text-align:center;padding:46px 20px;color:var(--gris);font-size:13.5px;line-height:1.6}

  .tabla{overflow-x:auto;margin:0 -25px;padding:0 25px;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td,th{white-space:nowrap}
  td:first-child,th:first-child{white-space:normal}
  th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--gris);padding:0 14px 12px;font-weight:700;
    border-bottom:1px solid var(--linea);
  }
  thead tr th:first-child{padding-left:0}
  tbody td:first-child{padding-left:0}
  tbody tr:first-child td{border-top:0}
  td{padding:13px 14px;border-top:1px solid var(--linea)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--fondo)}
  .pill{
    display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;
    border-radius:99px;background:var(--aire);color:var(--profundo);
  }
  .pill.hist{background:#F1F5F9;color:var(--gris)}

  .modal{
    display:none;position:fixed;inset:0;background:rgba(10,14,26,.55);
    z-index:50;padding:26px;overflow-y:auto;
  }
  .modal .box{
    background:var(--blanco);border-radius:var(--r);max-width:760px;margin:26px auto;
    padding:30px 32px;
  }
  .modal .cab{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
  .cerrar{background:none;font-size:25px;color:var(--gris);line-height:1;padding:0 6px}
  .msg{display:flex;margin-bottom:11px}
  .msg .burb{max-width:76%;padding:11px 15px;border-radius:14px;font-size:13.5px;line-height:1.55}
  .msg.h{justify-content:flex-start}
  .msg.h .burb{background:var(--aire);border-bottom-left-radius:4px}
  .msg.a{justify-content:flex-end}
  .msg.a .burb{background:var(--pulso);color:#fff;border-bottom-right-radius:4px}
  .hora{font-size:10.5px;color:var(--gris);margin-top:5px;opacity:.8}
  .msg.a .hora{color:#DBEAFE}

  .aviso{
    background:#FFFAEB;border:1px solid #FEDF89;border-radius:12px;
    padding:13px 17px;font-size:12.5px;color:#93370D;margin-bottom:24px;line-height:1.6;
  }
  .cabpanel{display:flex;justify-content:space-between;align-items:flex-start;
            gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .cabpanel .ph{margin-bottom:0}
  .rangos{display:flex;gap:4px;background:var(--fondo);padding:3px;border-radius:10px}
  .rg{background:none;padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--gris)}
  .rg.on{background:var(--blanco);color:var(--pulso);box-shadow:0 1px 3px rgba(10,31,74,.09)}
  .mini{display:flex;gap:26px;flex-wrap:wrap;font-size:12.5px;color:var(--gris);margin:16px 0 20px;
        padding-bottom:16px;border-bottom:1px solid var(--linea)}
  .mini strong{color:var(--tinta);font-size:15px;font-weight:700;margin-right:5px}
  .nota{font-size:12px;color:var(--gris);line-height:1.6;margin:-6px 0 30px;max-width:76ch}
  .secc{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--gris);margin-bottom:13px}
  .ficha{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:1px 22px;font-size:13.5px}
  .ficha dt{color:var(--gris);font-weight:600;padding:9px 0;border-top:1px solid var(--linea)}
  .ficha dd{padding:9px 0;border-top:1px solid var(--linea);line-height:1.55}
  .ficha dt:first-of-type,.ficha dd:first-of-type{border-top:0}
  @media(max-width:640px){.ficha{grid-template-columns:1fr;gap:0}
    .ficha dd{padding-top:0;border-top:0}}
  .campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
  .campos input{margin-bottom:0}
  .acc{display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap}
  .btn.corto{width:auto;padding:11px 22px}
  .msg-ok{font-size:12.5px;color:var(--verde);font-weight:600}
  .msg-err{font-size:12.5px;color:var(--rojo);font-weight:600}
  .feed{list-style:none;margin:0;padding:0}
  .feed li{display:grid;grid-template-columns:auto 52px 62px 1fr;gap:11px;align-items:baseline;
           padding:9px 0;border-top:1px solid var(--linea);font-size:13px}
  .feed li:first-child{border-top:0}
  .fdot{width:7px;height:7px;border-radius:99px;margin-top:6px}
  .fdot.h{background:var(--pulso)}
  .fdot.a{background:#94A3B8}
  .fh{font-size:11.5px;color:var(--gris)}
  .fq{font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.04em}
  .ft{color:var(--tinta);line-height:1.5;min-width:0;overflow-wrap:anywhere}
  @media(max-width:640px){.feed li{grid-template-columns:auto 52px 1fr}.fq{display:none}}
  .barras{display:grid;gap:19px}
  .bfila{}
  .bcab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:12px}
  .blab{font-size:13.5px;font-weight:600}
  .bnum{font-size:14px;font-weight:700}
  .bnum small{color:var(--gris);font-weight:500;font-size:11.5px}
  .btrack{height:8px;background:var(--aire);border-radius:99px;overflow:hidden}
  .bfill{height:100%;border-radius:99px;transition:width .5s ease}
  .bfill.az{background:var(--pulso)} .bfill.vd{background:var(--verde)}
  .bfill.rj{background:var(--ambar)}
  .bpie{font-size:11.5px;color:var(--gris);margin-top:6px}

  .zonas{display:grid;gap:9px}
  .zfila{display:grid;grid-template-columns:minmax(120px,1.4fr) 68px 1fr 42px;
         gap:12px;align-items:center;font-size:13px}
  .zn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zz{font-size:11px;color:var(--gris)}
  .ztrack{height:7px;background:var(--aire);border-radius:99px;overflow:hidden;min-width:30px}
  .zfill{display:block;height:100%;background:var(--pulso);border-radius:99px}
  .zc{text-align:right;font-weight:700}
  @media(max-width:600px){.zfila{grid-template-columns:1fr 46px;gap:4px 10px}
    .zz,.ztrack{display:none}}

  .mapa{overflow-x:auto;padding-bottom:4px}
  .mhoras,.mfila{display:grid;grid-template-columns:38px repeat(24,minmax(11px,1fr));
                 gap:3px;align-items:center;min-width:420px}
  .mhoras{margin-bottom:5px}
  .mh{font-size:9.5px;color:var(--gris);text-align:center;font-family:'JetBrains Mono',monospace}
  .mfila{margin-bottom:3px}
  .md{font-size:11px;color:var(--gris);font-weight:600}
  .mc{aspect-ratio:1;border-radius:3px;background:var(--aire);min-height:11px}

  .busca{width:auto;min-width:260px;flex:0 1 320px;max-width:100%;margin:0;padding:9px 13px;font-size:13.5px}
  @media(max-width:600px){.busca{width:100%;min-width:0}}
  .aprox{font-size:10px;color:var(--gris);font-weight:600}
  .pill.az{background:#E5EFFE;color:#0A4DA6}
  .pill.vd{background:#E7F8F0;color:#04724D}
  .pill.rj{background:#FEF0C7;color:#93370D}
  td .pill{margin-right:4px}
  .hint{font-size:11px;color:var(--gris);margin-top:6px;line-height:1.5}
  input:disabled{background:var(--fondo);color:var(--gris);cursor:not-allowed}
  .refr{display:flex;align-items:center;gap:6px;background:none;padding:6px 10px;
        border-radius:8px;color:var(--gris);font-size:11.5px;font-weight:600}
  .refr:hover{background:var(--fondo);color:var(--pulso)}
  .ricon{font-size:14px;line-height:1;display:inline-block}
  .refr.girando .ricon{animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  @media(max-width:820px){.rtxt{display:none}}

  .svgmapa{width:100%;height:auto;display:block;max-height:min(60vh,460px)}
  .mtxt{font-size:12px;font-weight:700;fill:#0A1F4A;font-family:'Plus Jakarta Sans',sans-serif}
  .mnum{font-size:12px;font-weight:800;fill:#fff;font-family:'JetBrains Mono',monospace}
  .mkm{font-size:10.5px;fill:#94A3B8;font-family:'JetBrains Mono',monospace;font-weight:500}
  .mcen{font-size:10.5px;fill:#64748B;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
        letter-spacing:.04em;text-transform:uppercase}

  .docs{display:grid;gap:10px}
  .doc{display:flex;align-items:center;gap:13px;padding:14px 16px;
       border:1px solid var(--linea);border-radius:12px;text-decoration:none;
       color:inherit;transition:border-color .15s,background .15s}
  .doc:hover{border-color:var(--pulso);background:var(--fondo)}
  .dico{font-size:19px;flex:none}
  .dtx{display:grid;gap:3px;min-width:0}
  .dtx strong{font-size:13.5px}
  .dtx span{font-size:12px;color:var(--gris);line-height:1.5}
  .dfl{margin-left:auto;color:var(--gris);font-size:15px;flex:none}
  .graf{position:relative}
  .hit{cursor:crosshair}
  .tip{position:absolute;background:var(--tinta);color:#fff;padding:8px 12px;
       border-radius:9px;font-size:12px;line-height:1.45;pointer-events:none;
       white-space:nowrap;z-index:5;box-shadow:0 6px 18px rgba(10,31,74,.22)}
  .tip strong{display:block;font-size:14px;font-weight:800}
  .tip span{color:#CBD5E1;font-size:11px}

  .cnom{font-weight:700;font-size:13.5px}
  .csin{color:var(--gris);font-weight:500;font-style:italic}
  .cdat{font-size:11.5px;color:var(--gris);margin-top:2px}
  .ses{display:inline-block;font-size:10px;color:var(--gris);margin-left:5px;
       background:var(--fondo);padding:1px 6px;border-radius:99px;font-weight:600}
  .pill.nt{background:#F1F5F9;color:#475569}
  td .cnom,td .cdat{white-space:normal}

  .sep{display:flex;align-items:center;gap:12px;margin:20px 0 13px;
       color:var(--gris);font-size:11px;font-weight:600}
  .sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--linea)}
  .dmeta{font-size:12.5px;color:var(--gris);margin-top:5px}
  .dmeta a{color:var(--pulso);text-decoration:none}
  .dmeta a:hover{text-decoration:underline}

  .citas{display:grid;gap:11px}
  .cita{display:grid;grid-template-columns:62px 1fr auto;gap:15px;align-items:center;
        padding:13px 15px;border:1px solid var(--linea);border-radius:13px}
  .cita.pr{border-color:#BFDBFE;background:#FAFCFF}
  .cita.can{opacity:.62}
  .cita.can .ccuerpo strong{text-decoration:line-through}
  .cfecha{text-align:center;line-height:1.15}
  .cdia{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em}
  .cmes{display:block;font-size:10.5px;color:var(--gris);text-transform:uppercase;
        font-weight:700;letter-spacing:.04em}
  .chora{display:block;font-size:11px;color:var(--pulso);font-weight:700;margin-top:2px}
  .ccuerpo{display:grid;gap:3px;min-width:0}
  .ccuerpo strong{font-size:14px}
  .ccuerpo span{font-size:12.5px;color:#475569;line-height:1.5;overflow-wrap:anywhere}
  .cmeta{font-size:11.5px;color:var(--gris)}
  .cacc{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .cbtn{font-size:12px;font-weight:600;padding:7px 12px;border-radius:9px;
        background:var(--aire);color:var(--profundo);text-decoration:none;
        border:none;cursor:pointer;white-space:nowrap;font-family:inherit}
  .cbtn:hover{background:var(--pulso);color:#fff}
  @media(max-width:600px){
    .cita{grid-template-columns:52px 1fr;gap:12px}
    .cacc{grid-column:1/-1;justify-content:flex-start}
  }
  .cargando{text-align:center;padding:60px;color:var(--gris);font-size:13.5px}

  /* ---------- MÓVIL ---------- */
  @media(max-width:820px){
    header{padding:0;gap:0}
    .marca{order:1;padding:13px 16px;flex:1 1 auto}
    .hend{order:2;padding:13px 16px;margin-left:0;flex:0 0 auto}
    .hend .vivo span:last-child{max-width:110px}
    nav{order:3;flex:0 0 100%;width:100%;padding:0 8px;
        border-top:1px solid var(--linea);overflow-x:auto;
        scrollbar-width:none;-webkit-overflow-scrolling:touch}
    nav::-webkit-scrollbar{display:none}
    nav button{padding:13px 12px;font-size:13.5px;white-space:nowrap;flex:0 0 auto}
    main{padding:24px 16px 60px}
    h2.tit{font-size:25px}
    .panel{padding:19px 17px}
    .kpi{padding:18px 19px}
    .kpi .num{font-size:35px}
    .tabla{margin:0 -17px;padding:0 17px}
    .mini{gap:16px 20px}
    .modal{padding:0}
    .modal .box{margin:0;border-radius:0;min-height:100vh;padding:22px 18px}
    .modal .cab{position:sticky;top:0;background:var(--blanco);
                padding-bottom:14px;margin-bottom:16px;z-index:2}
    .msg .burb{max-width:88%}
    .rangos{width:100%;justify-content:space-between}
    .rg{flex:1;text-align:center}
    .cabpanel{gap:14px}
  }
  @media(max-width:420px){
    .kpis{grid-template-columns:1fr}
    .campos{grid-template-columns:1fr}
    main{padding:20px 13px 56px}
    .panel{padding:16px 14px}
    .tabla{margin:0 -14px;padding:0 14px}
    .mapa{margin:0 -14px;padding:0 14px}
    .svgmapa{max-height:none}
    .mtxt{font-size:15px}
    .mnum{font-size:15px}
    h2.tit{font-size:22px}
    .kpi .num{font-size:32px}
    .doc{padding:12px 13px;gap:10px}
  }
  @media(max-width:340px){
    main{padding:16px 10px 50px}
    .panel{padding:14px 12px}
    nav button{padding:12px 9px;font-size:12.5px}
    .marca{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login">
  <div class="izq">
    <div class="eyebrow">Panel de cliente</div>
    <h1>Encender<br>el <em>pulso</em>.</h1>
    <p>Tu operación no se detiene cuando cierras la oficina. Cada conversación

async function datos(){
  const desde = new Date(Date.now() - RANGO*36e5).toISOString();

  const [convs, evR, evTot, lat, reciente, lugares, patron] = await Promise.all([
    supabase.from('conversations')
      .select('id,contact_ref,started_at,last_at,msg_count,human_count,ai_count,is_backfilled,seq,fecha_origen,fecha_estimada,senal_interes,senal_frustracion,senal_contacto')
      .order('last_at', { ascending:false }).limit(1000),
    supabase.from('message_events')
      .select('role,observed_at')
      .eq('is_backfilled', false).gte('observed_at', desde),
    supabase.from('message_events').select('id', { count:'exact', head:true }),
    supabase.from('message_events')
      .select('latency_ms').not('latency_ms', 'is', null)
      .order('id', { ascending:false }).limit(200),
    supabase.from('message_events')
      .select('conversation_id,role,content,observed_at,is_backfilled')
      .eq('is_backfilled', false)
      .order('id', { ascending:false }).limit(12),
    supabase.from('v_demanda_temas').select('*').limit(40),
    supabase.from('v_patron_horario').select('*')
  ]);

  // Orden: primero lo registrado con fecha real (más reciente arriba);
  // después el histórico, ordenado por seq — que conserva el orden
  // original de n8n aunque no tengamos la fecha.
  // Ahora hay fecha real para casi todo (fecha_origen viene de
  // users.created_at en el histórico), así que se ordena por ella.
  ULTIMA = Date.now(); pintarCuando();
  CONVS = (convs.data || []).sort((a, b) => {
    const fa = a.fecha_origen ? new Date(a.fecha_origen).getTime() : null;
    const fb = b.fecha_origen ? new Date(b.fecha_origen).getTime() : null;
    if (fa && fb && fa !== fb) return fb - fa;
    if (fa && !fb) return -1;
    if (!fa && fb) return 1;
    return (b.seq || 0) - (a.seq || 0);
  });
  const lats = (lat.data || []).map(r => r.latency_ms);
  return {
    convs: CONVS,
    evR:   evR.data || [],
    total: evTot.count || 0,
    lats,
    latMedia: lats.length

    reciente: reciente.data || [],
    temas:    lugares.data  || [],
    patron:   patron.data   || [],

    hist:  CONVS.filter(c =>  c.is_backfilled)
  };

/* ---------- mapa ----------
   Genérico: el encuadre se calcula desde las propias coordenadas
   del cliente, así que funciona en cualquier geografía. La silueta
   de referencia es opcional y vive en su configuración.          */

// El lienzo se adapta a la forma de los datos en vez de forzar
// los datos a un lienzo fijo: así no queda espacio muerto a los
// lados cuando la nube de puntos es más alta que ancha.
const W_MAPA = 760;

function encuadre(pts, cfg){
  let la0, la1, ln0, ln1;

  if (cfg && cfg.encuadre){
    const e = cfg.encuadre;
    la0 = e.lat_min; la1 = e.lat_max; ln0 = e.lng_min; ln1 = e.lng_max;
    // los puntos fuera del encuadre configurado (p. ej. Canarias
    // en un mapa peninsular) lo amplían para no perderlos
    pts.forEach(p => {
      const la = Number(p.lat), ln = Number(p.lng);
      if (la < la0) la0 = la - 0.4;  if (la > la1) la1 = la + 0.4;
      if (ln < ln0) ln0 = ln - 0.4;  if (ln > ln1) ln1 = ln + 0.4;
    });
  } else {
    const las = pts.map(p => Number(p.lat));
    const lns = pts.map(p => Number(p.lng));
    la0 = Math.min(...las); la1 = Math.max(...las);
    ln0 = Math.min(...lns); ln1 = Math.max(...lns);

    const MIN = 0.03;
    if (la1 - la0 < MIN){ const c=(la0+la1)/2; la0=c-MIN/2; la1=c+MIN/2; }
    if (ln1 - ln0 < MIN){ const c=(ln0+ln1)/2; ln0=c-MIN/2; ln1=c+MIN/2; }

    const ml = (la1-la0)*0.22, mn = (ln1-ln0)*0.22;
    la0-=ml; la1+=ml; ln0-=mn; ln1+=mn;
  }

  // altura del lienzo según la proporción geográfica real
  const k = Math.cos((la0+la1)/2 * Math.PI/180);
  const anchoGeo = (ln1-ln0) * k, altoGeo = la1-la0;
  let H = Math.round(W_MAPA * altoGeo / anchoGeo);
  H = Math.max(320, Math.min(H, 620));   // límites razonables

  return { la0, la1, ln0, ln1, W: W_MAPA, H };
}

const proy = (lat, lng, E) => [
  (lng - E.ln0) / (E.ln1 - E.ln0) * E.W,
  (1 - (lat - E.la0) / (E.la1 - E.la0)) * E.H
];

function bloqueMapa(d){
  // Los genéricos (p. ej. "Madrid" sin concretar centro) SÍ entran
  // en el mapa: en la vista nacional son el punto más relevante.
  const pts = (d.temas || []).filter(t =>
    t.categoria === 'ubicacion' && t.lat != null && t.lng != null);
  if (!pts.length) return '';

  const grupos = {};
  pts.forEach(p => { const a = p.ambito || 'general'; (grupos[a] ||= []).push(p); });

  const claves = Object.keys(grupos).sort((a,b) =>
    ((CFG.mapas[a]?.orden ?? 99) - (CFG.mapas[b]?.orden ?? 99)) || a.localeCompare(b));
  if (!claves.length) return '';
  if (!claves.includes(MAPA)) MAPA = claves[0];

  const etq = k => CFG.mapas[k]?.etiqueta || k.charAt(0).toUpperCase() + k.slice(1);

  return `<div class="panel" id="panelmapa">
    <div class="cabpanel">
      <div>
        <h3>Mapa de demanda</h3>
        <p class="ph">Cada punto es una zona mencionada por los clientes;
           su tamaño, cuántas conversaciones la nombran.</p>
      </div>
      ${claves.length > 1 ? `<div class="rangos">
        ${claves.map(k => `<button class="rg mp${MAPA===k?' on':''}" data-m="${esc(k)}">
          ${esc(etq(k))}</button>`).join('')}
      </div>` : ''}
    </div>
    ${dibujaMapa(grupos[MAPA], CFG.mapas[MAPA] || {})}
  </div>`;
}

function dibujaMapa(pts, cfg){
  if (!pts || !pts.length) return '<div class="vacio">Sin datos en este ámbito.</div>';
  const E   = encuadre(pts, cfg);
  const max = Math.max(...pts.map(p => p.conversaciones), 1);
  const rMin = 7, rMax = pts.length > 14 ? 20 : 26;

  let fondo;
  if (cfg.silueta){
    const dpath = cfg.silueta.trim().split(/\s+/).map(tok => {
      if (tok === 'M' || tok === 'L' || tok === 'Z') return tok;
      const [la, ln] = tok.split(',').map(Number);
      if (!isFinite(la) || !isFinite(ln)) return '';
      const [x, y] = proy(la, ln, E);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).filter(Boolean).join(' ');
    fondo = `<path d="${dpath}" fill="#EFF6FF" stroke="#C7DDF9"
                   stroke-width="1.5" stroke-linejoin="round"/>`;
  } else {
    // Sin silueta se dibujan referencias reales: retícula fina y
    // anillos de distancia desde un punto conocido. Preferimos
    // esto a inventar un contorno aproximado de la ciudad.
    const cen = cfg.centro || {
      lat: (E.la0 + E.la1) / 2, lng: (E.ln0 + E.ln1) / 2, etiqueta: 'Centro'
    };
    const [cx, cy] = proy(Number(cen.lat), Number(cen.lng), E);

    // px por km, a partir de la escala real del encuadre
    const kmLat = 111.32;
    const kmLng = 111.32 * Math.cos((E.la0 + E.la1) / 2 * Math.PI / 180);
    const pxKm  = (E.W / ((E.ln1 - E.ln0) * kmLng));

    // radios "redondos" que quepan en el lienzo
    const maxKm = Math.max(E.W, E.H) / pxKm / 2;
    const escala = [1,2,5,10,15,20,25,50,100,150,200];
    const anillos = escala.filter(k => k * pxKm > 34 && k < maxKm * 1.15).slice(0, 5);

    // barra de escala: una distancia redonda de ~1/5 del ancho
    const objetivo = (E.W / pxKm) / 5;
    const barraKm = escala.reduce((a,b) =>
      Math.abs(b - objetivo) < Math.abs(a - objetivo) ? b : a, escala[0]);

    fondo = `
      <rect x="0" y="0" width="${E.W}" height="${E.H}" rx="16" fill="#FBFDFF"/>
      <g stroke="#EDF3FC" stroke-width="1">
        ${Array.from({length:11}, (_,i) => i+1).map(i =>
          `<line x1="0" y1="${(E.H*i/12).toFixed(0)}" x2="${E.W}" y2="${(E.H*i/12).toFixed(0)}"/>`).join('')}
        ${Array.from({length:11}, (_,i) => i+1).map(i =>
          `<line x1="${(E.W*i/12).toFixed(0)}" y1="0" x2="${(E.W*i/12).toFixed(0)}" y2="${E.H}"/>`).join('')}
      </g>
      <g>
        ${anillos.map(k => `
          <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(k*pxKm).toFixed(1)}"
                  fill="none" stroke="#D6E6FA" stroke-width="1.2" stroke-dasharray="4 5"/>
          <text x="${(cx + k*pxKm*0.7071).toFixed(1)}"
                y="${(cy - k*pxKm*0.7071 + 4).toFixed(1)}"
                class="mkm">${k} km</text>`).join('')}
      </g>
      <g>
        <line x1="${(cx-7).toFixed(1)}" y1="${cy.toFixed(1)}"
              x2="${(cx+7).toFixed(1)}" y2="${cy.toFixed(1)}" stroke="#94A3B8" stroke-width="1.5"/>
        <line x1="${cx.toFixed(1)}" y1="${(cy-7).toFixed(1)}"
              x2="${cx.toFixed(1)}" y2="${(cy+7).toFixed(1)}" stroke="#94A3B8" stroke-width="1.5"/>
        <text x="${cx.toFixed(1)}" y="${(cy+20).toFixed(1)}"
              text-anchor="middle" class="mcen">${esc(cen.etiqueta || 'Centro')}</text>
      </g>
      <g transform="translate(20,${E.H-24})">
        <line x1="0" y1="0" x2="${(barraKm*pxKm).toFixed(1)}" y2="0"
              stroke="#94A3B8" stroke-width="2"/>
        <line x1="0" y1="-4" x2="0" y2="4" stroke="#94A3B8" stroke-width="2"/>
        <line x1="${(barraKm*pxKm).toFixed(1)}" y1="-4"
              x2="${(barraKm*pxKm).toFixed(1)}" y2="4" stroke="#94A3B8" stroke-width="2"/>
        <text x="${(barraKm*pxKm/2).toFixed(1)}" y="-8"
              text-anchor="middle" class="mkm">${barraKm} km</text>
      </g>`;
  }

  // Etiquetas: se colocan de mayor a menor y se omite la que
  // chocaría con otra ya puesta. Sin esto se solapan los centros
  // que están en la misma manzana.
  const puestas = [];
  if (!cfg.silueta){
    const c = cfg.centro || { lat:(E.la0+E.la1)/2, lng:(E.ln0+E.ln1)/2 };
    const [ccx, ccy] = proy(Number(c.lat), Number(c.lng), E);
    puestas.push({ x1:ccx-42, x2:ccx+42, y1:ccy+6, y2:ccy+26 });
  }
  const cabe = (x, y, texto) => {
    const w = texto.length * 6.6 + 10, h = 17;
    const caja = { x1:x-w/2, x2:x+w/2, y1:y-h, y2:y+3 };
    const choca = puestas.some(p =>
      !(caja.x2 < p.x1 || caja.x1 > p.x2 || caja.y2 < p.y1 || caja.y1 > p.y2));
    if (choca) return false;
    puestas.push(caja); return true;
  };

  const orden = [...pts].sort((a,b) => b.conversaciones - a.conversaciones);
  const circulos = [], textos = [];

  orden.forEach(p => {
    const [x, y] = proy(Number(p.lat), Number(p.lng), E);
    const r = rMin + (rMax - rMin) * Math.sqrt(p.conversaciones / max);
    const op = (0.16 + 0.44 * (p.conversaciones / max)).toFixed(2);

    circulos.push(`<g>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"
              fill="#1B7CFF" fill-opacity="${op}" stroke="#1B7CFF" stroke-width="1.5"/>
      <title>${esc(p.nombre)} · ${p.conversaciones} conversaciones</title>
      ${r >= 12 ? `<text x="${x.toFixed(1)}" y="${(y+4.5).toFixed(1)}"
            text-anchor="middle" class="mnum">${p.conversaciones}</text>` : ''}
    </g>`);

    if (cabe(x, y - r - 4, p.nombre)){
      textos.push(`<text x="${x.toFixed(1)}" y="${(y-r-7).toFixed(1)}"
          text-anchor="middle" class="mtxt">${esc(p.nombre)}</text>`);
    }
  });

  const sinEtiqueta = orden.length - textos.length;
  return `<svg viewBox="0 0 ${E.W} ${E.H}" class="svgmapa" role="img"
      aria-label="Mapa de demanda por ubicación">
    ${fondo}${circulos.join('')}${textos.join('')}
  </svg>
  <p class="nota" style="margin:10px 0 0">
    ${cfg.silueta ? 'Representación esquemática; no es un mapa a escala. '
       : 'Los anillos marcan la distancia en línea recta desde el centro. '}
    ${sinEtiqueta > 0 ? `${sinEtiqueta} ${sinEtiqueta === 1 ? 'zona más queda' : 'zonas más quedan'}
       sin etiquetar por falta de espacio: pasa el ratón por encima para verlas.` : ''}
  </p>`;
}

/* ---------- patrón horario ---------- */
function bloquePatron(d){
  if (!d.patron.length) return '';
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  let max = 0;
  d.patron.forEach(p => {
    const v = Number(p.mensajes) || 0;
    grid[p.dia_semana][p.hora] += v;
    if (grid[p.dia_semana][p.hora] > max) max = grid[p.dia_semana][p.hora];
  });
  if (!max) return '';

  // Horario laboral real del cliente (settings.horario).
  // dias viene en formato ISO 1=lunes…7=domingo; getDay() usa 0=domingo.
  const H = CFG.horario || { inicio:9, fin:19, dias:[1,2,3,4,5] };
  const lab = new Set((H.dias || [1,2,3,4,5]).map(n => n === 7 ? 0 : n));
  let fuera = 0, total = 0;
  for (let dd=0; dd<7; dd++) for (let h=0; h<24; h++){
    const v = grid[dd][h]; total += v;
    if (!lab.has(dd) || h < H.inicio || h >= H.fin) fuera += v;
  }
  const pct = total ? Math.round(fuera / total * 100) : 0;
  const dnom = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const dlab = (H.dias || []).map(n => dnom[n === 7 ? 0 : n]);
  const rango = dlab.length
    ? `${dlab[0]} a ${dlab[dlab.length-1]}, de ${H.inicio}:00 a ${H.fin}:00`
    : `de ${H.inicio}:00 a ${H.fin}:00`;

  const orden = [1,2,3,4,5,6,0];
  return `<div class="panel">
    <h3>Cuándo escriben</h3>
    <p class="ph">Mensajes por día y hora. <strong>${pct}%</strong> llegan fuera
       de tu horario de atención (${rango}) — y se atienden igual.</p>
    <div class="mapa">
      <div class="mhoras"><span></span>${
        Array.from({length:24}, (_,h) => `<span class="mh">${h%6===0?h:''}</span>`).join('')}</div>
      ${orden.map(dd => `<div class="mfila">
        <span class="md">${dias[dd]}</span>
        ${grid[dd].map((v,h) => {
          const o = v ? (0.14 + 0.86 * (v / max)) : 0;
          return `<span class="mc" style="background:rgba(27,124,255,${o.toFixed(3)})"
            title="${dias[dd]} ${h}:00 · ${v} mensajes"></span>`;
        }).join('')}
      </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- cardiograma ---------- */
function grafica(ev){
  if (!ev.length) return `<div class="vacio">
    Todavía no hay mensajes registrados en este periodo.<br>
    En cuanto entre uno, aparecerá aquí.</div>`;

  const porDia = RANGO > 48;
  const paso   = porDia ? 864e5 : 36e5;
  const n      = porDia ? Math.round(RANGO/24) : RANGO;

  const cubos = Array.from({length:n}, (_,i) => {
    const t = new Date(Date.now() - (n-1-i)*paso);
    porDia ? t.setHours(0,0,0,0) : t.setMinutes(0,0,0);
    return { t, n:0 };
  });
  ev.filter(e => e.role === 'human').forEach(e => {
    const t = new Date(e.observed_at);
    porDia ? t.setHours(0,0,0,0) : t.setMinutes(0,0,0);
    const s = cubos.find(x => x.t.getTime() === t.getTime());
    if (s) s.n++;
  });

  const max = Math.max(...cubos.map(h => h.n), 1);
  const W = 1000, H = 190;
  const pts = cubos.map((h,i) => [
    (i/Math.max(cubos.length-1,1))*W,
    H - (h.n/max)*(H-34) - 17
  ]);
  const linea = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area  = `M0 ${H} L` + pts.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L') + ` L${W} ${H} Z`;
  const et = d => porDia
    ? d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' })
    : d.getHours() + ':00';
  const etLargo = d => porDia
    ? d.toLocaleDateString('es-ES', { weekday:'long', day:'2-digit', month:'long' })
    : d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' }) +
      ', ' + d.getHours() + ':00 h';
  const ancho = W / cubos.length;

  return `<div class="graf" id="graf">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
        aria-label="Mensajes entrantes a lo largo del periodo">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1B7CFF" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#1B7CFF" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#E2E8F0" stroke-width="1"/>
      <path d="${area}" fill="url(#g)"/>
      <path d="${linea}" fill="none" stroke="#1B7CFF" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>
      <line id="guia" x1="0" y1="0" x2="0" y2="${H}" stroke="#1B7CFF"
            stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      ${pts.map((p,i) => cubos[i].n > 0
        ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#1B7CFF"/>` : '').join('')}
      <circle id="foco" r="6" fill="#fff" stroke="#1B7CFF" stroke-width="2.5" opacity="0"/>
      ${cubos.map((c,i) => `<rect x="${(i*ancho).toFixed(1)}" y="0"
          width="${ancho.toFixed(1)}" height="${H}" fill="transparent"
          data-i="${i}" data-x="${pts[i][0].toFixed(1)}" data-y="${pts[i][1].toFixed(1)}"
          data-n="${c.n}" data-t="${esc(etLargo(c.t))}" class="hit"/>`).join('')}
    </svg>
    <div class="tip" id="tip" hidden></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#64748B;margin-top:9px"
         class="mono">
      <span>${et(cubos[0].t)}</span>
      <span>${et(cubos[Math.floor(cubos.length/2)].t)}</span>
      <span>${et(cubos[cubos.length-1].t)} · ahora</span>
    </div>
  </div>`;
}

// Tooltip del cardiograma: se engancha tras pintar el bloque.
function activarGrafico(){
  const cont = $('#graf'); if (!cont) return;
  const svg = cont.querySelector('svg');
  const tip = $('#tip'), guia = $('#guia'), foco = $('#foco');
  if (!svg || !tip) return;

  cont.querySelectorAll('.hit').forEach(r => {
    const mostrar = e => {
      const n = r.dataset.n, x = +r.dataset.x, y = +r.dataset.y;
      guia.setAttribute('x1', x); guia.setAttribute('x2', x);
      guia.setAttribute('opacity', '1');
      foco.setAttribute('cx', x); foco.setAttribute('cy', y);
      foco.setAttribute('opacity', n > 0 ? '1' : '0');

      tip.innerHTML = `<strong>${n} ${n === '1' ? 'mensaje' : 'mensajes'}</strong>
                       <span>${r.dataset.t}</span>`;
      tip.hidden = false;

      const caja = cont.getBoundingClientRect();
      const px = (e.touches ? e.touches[0].clientX : e.clientX) - caja.left;
      const ancho = tip.offsetWidth || 130;
      tip.style.left = Math.max(4, Math.min(px - ancho/2, caja.width - ancho - 4)) + 'px';
      tip.style.top  = Math.max(0, (y / 190) * caja.height - 52) + 'px';
    };
    r.addEventListener('mousemove', mostrar);
    r.addEventListener('touchstart', mostrar, { passive:true });
  });

  const ocultar = () => {
    tip.hidden = true;
    guia.setAttribute('opacity','0');
    foco.setAttribute('opacity','0');
  };
  cont.addEventListener('mouseleave', ocultar);
  cont.addEventListener('touchend', ocultar);
}

/* ---------- vista: conversaciones ----------
   Se agrupa por PERSONA, no por sesión. El corte a 30 minutos
   sigue existiendo para las métricas, pero aquí sería confuso:
   el usuario piensa en "mi conversación con X", no en sesiones. */
let CONTACTOS = [];

async function pintarConvs(silencioso){
  if (!silencioso) $('#vista').innerHTML =
    '<div class="cargando">Cargando conversaciones…</div>';

  const { data, error } = await supabase.rpc('mis_contactos');
  ULTIMA = Date.now(); pintarCuando();

  if (error){
    pintaEn(`<h2 class="tit">Conversaciones</h2><div class="panel">
      <div class="vacio">No se han podido cargar.<br>${esc(error.message)}</div>
    </div>`, silencioso);
    return;
  }
  CONTACTOS = data || [];

  const sesiones = CONTACTOS.reduce((s,c) => s + Number(c.conversaciones), 0);
  const vueltos  = CONTACTOS.filter(c => Number(c.conversaciones) > 1).length;
  const conCita  = CONTACTOS.filter(c => c.cita).length;

  pintaEn(`
    <h2 class="tit">Conversaciones</h2>
    <p class="sub">Una fila por persona. Ábrela para ver todo el intercambio,
       incluidas las veces que volvió a escribir.</p>
    <div class="panel">
      <div class="cabpanel">
        <div>
          <h3>${nf.format(CONTACTOS.length)} personas</h3>
          <p class="ph" style="margin:2px 0 0">${nf.format(sesiones)} conversaciones${
            vueltos ? ` · ${nf.format(vueltos)} ${vueltos===1?'persona ha vuelto':'personas han vuelto'} a escribir` : ''}${
            conCita ? ` · ${nf.format(conCita)} con cita` : ''}</p>
        </div>
        <input id="buscar" class="busca" type="search"
               placeholder="Buscar por nombre, teléfono o texto…" autocomplete="off">
      </div>
      <div class="tabla"><table>
        <thead><tr>
          <th>Contacto</th><th>Mensajes</th><th>Primera</th>
          <th>Última</th><th>Señales</th>
        </tr></thead>
        <tbody>${CONTACTOS.slice(0,150).map(filaC).join('')}</tbody>
      </table></div>
    </div>`, silencioso);

  enlazarFilas();
  const inp = $('#buscar');
  let tmr = null;
  inp.addEventListener('input', () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => filtrar(inp.value.trim()), 280);
  });
}

const filaC = c => `<tr data-c="${esc(c.contact_ref)}">
  <td>
    <div class="cnom">${c.nombre ? esc(c.nombre) : '<span class="csin">Sin nombre</span>'}</div>
    <div class="cdat mono">${esc(c.telefono || c.contact_ref)}</div>
    ${c.email ? `<div class="cdat">${esc(c.email)}</div>` : ''}
  </td>
  <td class="mono">${c.mensajes}
    ${Number(c.conversaciones) > 1
      ? `<span class="ses">${c.conversaciones} veces</span>` : ''}</td>
  <td>${c.primera ? fechaCorta(c.primera) : '—'}</td>
  <td>${c.historico ? '<span class="aprox">histórico</span>' : fechaCorta(c.ultima)}</td>
  <td>${[
      c.cita     ? '<span class="pill vd">Cita</span>'      : '',
      c.interes  ? '<span class="pill az">Interés</span>'   : '',
      c.contacto ? '<span class="pill nt">Contacto</span>'  : '',
      c.friccion ? '<span class="pill rj">Fricción</span>'  : ''
    ].join('') || '<span class="pill hist">—</span>'}</td>
</tr>`;

function enlazarFilas(){
  document.querySelectorAll('tbody tr[data-c]').forEach(tr =>
    tr.addEventListener('click', () => abrir(tr.dataset.c)));
}

async function filtrar(q){
  const tb = document.querySelector('tbody');
  if (!tb) return;
  if (!q){ tb.innerHTML = CONTACTOS.slice(0,150).map(filaC).join(''); enlazarFilas(); return; }

  const n = q.toLowerCase();
  // nombre, teléfono o email: filtra en memoria, instantáneo
  const local = CONTACTOS.filter(c =>
    (c.nombre   || '').toLowerCase().includes(n) ||
    (c.telefono || '').includes(q.replace(/[^0-9]/g,'')) ||
    (c.email    || '').toLowerCase().includes(n));

  if (local.length || /^[0-9+ ]{3,}$/.test(q)){
    tb.innerHTML = local.length ? local.map(filaC).join('')
      : `<tr><td colspan="5" class="vacio">Ningún contacto coincide.</td></tr>`;
    enlazarFilas(); return;
  }

  // si no, se busca dentro del texto de los mensajes
  tb.innerHTML = `<tr><td colspan="5" class="vacio">Buscando en los mensajes…</td></tr>`;
  const { data } = await supabase.from('message_events')
    .select('conversation_id').ilike('content', `%${q}%`).limit(500);
  const ids = new Set((data || []).map(r => r.conversation_id));
  const r = CONTACTOS.filter(c => (c.ids || []).some(i => ids.has(i)));
  tb.innerHTML = r.length ? r.map(filaC).join('')
    : `<tr><td colspan="5" class="vacio">Ninguna conversación contiene «${esc(q)}».</td></tr>`;
  enlazarFilas();
}

/* ---------- vista: agenda ----------
   Las citas ya las guarda el agente en la tabla users mediante
   su herramienta "Save Data". Aquí solo se presentan.          */
async function pintarAgenda(silencioso){
  if (!silencioso) $('#vista').innerHTML = '<div class="cargando">Cargando agenda…</div>';

  const { data, error } = await supabase.rpc('mis_citas');
  ULTIMA = Date.now(); pintarCuando();

  if (error){
    pintaEn(`<h2 class="tit">Agenda</h2><div class="panel">
      <div class="vacio">No se ha podido cargar la agenda.<br>${esc(error.message)}</div>
    </div>`, silencioso);
    return;
  }

  const citas = data || [];
  const ahora = Date.now();
  const vivas = citas.filter(c => c.estado !== 'cancelada');
  const canceladas = citas.filter(c => c.estado === 'cancelada');
  const conFecha = vivas.filter(c => c.cuando);
  const proximas = conFecha.filter(c => new Date(c.cuando) >= ahora)
    .sort((a,b) => new Date(a.cuando) - new Date(b.cuando));
  const pasadas  = conFecha.filter(c => new Date(c.cuando) < ahora)
    .sort((a,b) => new Date(b.cuando) - new Date(a.cuando));
  const sinFecha = vivas.filter(c => !c.cuando);

  pintaEn(`
    <h2 class="tit">Agenda</h2>
    <p class="sub">Citas que ha ido registrando el asistente en sus conversaciones.
       Puedes añadir cada una a tu calendario.</p>

    <div class="kpis">
      ${kpi('Próximas citas', nf.format(proximas.length),
            proximas.length ? 'La más cercana, ' + fechaCorta(proximas[0].cuando) : 'Ninguna pendiente')}
      ${kpi('Citas agendadas', nf.format(vivas.length), 'Desde el inicio del servicio', true)}
      ${kpi('Ya celebradas', nf.format(pasadas.length), 'Con fecha pasada')}
      ${kpi('Canceladas', nf.format(canceladas.length),
            citas.length ? `${Math.round(canceladas.length / citas.length * 100)}% del total` : '—')}
    </div>

    ${bloqueCitas('Próximas', proximas, true)}
    ${bloqueCitas('Anteriores', pasadas.slice(0, 25), false)}
    ${sinFecha.length ? bloqueCitas('Sin fecha', sinFecha, false) : ''}
    ${canceladas.length ? bloqueCitas('Canceladas', canceladas.slice(0, 15), false) : ''}

    ${!citas.length ? `<div class="panel"><div class="vacio">
      Todavía no hay ninguna cita registrada.<br>
      Aparecerán aquí en cuanto se agende la primera desde Calendly.</div></div>` : ''}`,
    silencioso);

  document.querySelectorAll('.ics').forEach(b =>
    b.addEventListener('click', () => descargarICS(JSON.parse(b.dataset.c))));
}

function bloqueCitas(titulo, lista, destacar){
  if (!lista.length) return '';
  return `<div class="panel">
    <h3>${titulo}</h3>
    <p class="ph">${nf.format(lista.length)} ${lista.length===1?'cita':'citas'}</p>
    <div class="citas">
      ${lista.map(c => `<div class="cita${destacar?' pr':''}${
          c.estado === 'cancelada' ? ' can' : ''}">
        <div class="cfecha">
          ${c.cuando ? `<span class="cdia">${new Date(c.cuando).toLocaleDateString('es-ES',
                {day:'2-digit'})}</span>
            <span class="cmes">${new Date(c.cuando).toLocaleDateString('es-ES',
                {month:'short'})}</span>
            <span class="chora mono">${new Date(c.cuando).toLocaleTimeString('es-ES',
                {hour:'2-digit',minute:'2-digit'})}</span>`
            : `<span class="cdia">·</span><span class="cmes">s/f</span>`}
        </div>
        <div class="ccuerpo">
          <strong>${c.nombre ? esc(c.nombre) : esc(c.telefono || c.email || 'Contacto')}</strong>
          ${c.descripcion ? `<span>${esc(c.descripcion)}</span>` : ''}
          <span class="cmeta mono">${esc(c.telefono || '')}${
            c.email ? ' · ' + esc(c.email) : ''}</span>
          ${c.ubicacion ? `<span class="cmeta">${esc(c.ubicacion)}</span>` : ''}
        </div>
        <div class="cacc">
          ${c.telefono ? `<a class="cbtn" href="tel:${esc(c.telefono)}">Llamar</a>` : ''}
          ${c.cuando && c.estado !== 'cancelada' ? `<button class="cbtn ics"
              data-c='${esc(JSON.stringify({t:c.nombre||c.telefono,d:c.descripcion||'',
                            w:c.cuando,e:c.email||'',p:c.telefono||''}))}'>Calendario</button>` : ''}
          ${c.enlace && c.estado !== 'cancelada' ? `<a class="cbtn" href="${esc(c.enlace)}"
              target="_blank" rel="noopener noreferrer">Reagendar</a>` : ''}
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

// Genera un .ics estándar: se abre en Google Calendar, Outlook,
// Apple Calendar o el que tenga configurado el usuario.
function descargarICS(c){
  const ini = new Date(c.w);
  const fin = new Date(ini.getTime() + 60*60*1000);
  const z = d => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const esc2 = s => String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SimpliaSpain//Panel//ES',
    'BEGIN:VEVENT',
    'UID:' + Date.now() + '@simpliaspain',
    'DTSTAMP:' + z(new Date()),
    'DTSTART:' + z(ini),
    'DTEND:'   + z(fin),
    'SUMMARY:' + esc2('Cita · ' + c.t),
    'DESCRIPTION:' + esc2((c.d ? c.d + '\n' : '') +
        (c.p ? 'Teléfono: ' + c.p + '\n' : '') + (c.e ? 'Email: ' + c.e : '')),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');

  const url = URL.createObjectURL(new Blob([ics], {type:'text/calendar;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'cita.ics'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- vista: configuración ---------- */
async function pintarAjustes(silencioso){
  if (!silencioso) $('#vista').innerHTML = '<div class="cargando">Cargando configuración…</div>';

  let r = null, err = null;
  try {
    const { data, error } = await supabase.rpc('resumen_servicio');
    if (error) throw error;
    r = data;
  } catch (e) { err = e; }

  if (!r){
    $('#vista').innerHTML = `<h2 class="tit">Configuración</h2>
      <div class="panel"><div class="vacio">
        No se ha podido cargar la configuración del servicio.<br>
        ${esc(err?.message || '')}</div></div>`;
    return;
  }

  const a = r.ajustes || {};
  const alta = r.alta ? new Date(r.alta).toLocaleDateString('es-ES',
    { day:'2-digit', month:'long', year:'numeric' }) : '—';
  const desde = r.primer_registro ? new Date(r.primer_registro).toLocaleDateString('es-ES',
    { day:'2-digit', month:'long', year:'numeric' }) : '—';

  $('#vista').innerHTML = `
    <h2 class="tit">Configuración</h2>
    <p class="sub">Datos del servicio, parámetros de cálculo y qué información
       se trata. Lo editable se guarda al pulsar Guardar.</p>

    <div class="panel">
      <h3>Servicio</h3>
      <p class="ph">Información de tu cuenta. No editable desde aquí.</p>
      <dl class="ficha">
        <dt>Cliente</dt><dd>${esc(r.cliente || '—')}</dd>
        <dt>Canal</dt><dd>${esc(r.canal)}</dd>
        <dt>Alta del servicio</dt><dd>${alta}</dd>
        <dt>Registro con fecha desde</dt><dd>${desde}</dd>
        <dt>Conversaciones</dt><dd class="mono">${nf.format(r.conversaciones)}</dd>
        <dt>Mensajes</dt><dd class="mono">${nf.format(r.mensajes)}</dd>
        <dt>Personas atendidas</dt><dd class="mono">${nf.format(r.contactos)}</dd>
        <dt>Usuarios con acceso</dt><dd class="mono">${nf.format(r.usuarios)}</dd>
        <dt>Ubicaciones monitorizadas</dt><dd class="mono">${nf.format(r.ubicaciones || 0)}</dd>
        <dt>Servicios monitorizados</dt><dd class="mono">${nf.format(r.servicios || 0)}</dd>
        <dt>Horario de atención</dt><dd>${horarioTexto()}</dd>
        ${r.sector ? `<dt>Sector</dt><dd>${esc(r.sector)}</dd>` : ''}
      </dl>
    </div>

    <div class="panel">
      <h3>Parámetros de cálculo</h3>
      <p class="ph">Los usamos para estimar el coste de atención evitado.
         ${r.puede_editar_coste ? 'Puedes ajustarlos a tu realidad.'
           : 'Los fija SimpliaSpain para que la cifra sea comparable entre periodos. Si no encajan con tu operación, dínoslo y los actualizamos.'}</p>
      ${r.puede_editar_coste ? `
        <div class="campos">
          <div>
            <label for="ch">Coste por hora de una persona (€)</label>
            <input id="ch" type="number" min="0" max="1000" step="0.5"
                   value="${a.coste_hora_eur ?? ''}">
          </div>
          <div>
            <label for="mn">Minutos que llevaría atender una conversación</label>
            <input id="mn" type="number" min="0" max="480" step="0.5"
                   value="${a.minutos_por_conversacion ?? ''}">
          </div>
        </div>`
        : `<dl class="ficha">
          <dt>Coste por hora</dt>
          <dd>${a.coste_hora_eur != null ? a.coste_hora_eur + ' €' : '—'}</dd>
          <dt>Minutos por conversación</dt>
          <dd>${a.minutos_por_conversacion != null ? a.minutos_por_conversacion + ' min' : '—'}</dd>
        </dl>`}
    </div>

    <div class="panel">
      <h3>Tus preferencias</h3>
      <p class="ph">Lo que puedes cambiar tú mismo.</p>
      <div class="campos">
        <div>
          <label for="ea">Email para avisos del servicio</label>
          <input id="ea" type="email" placeholder="avisos@empresa.com"
                 value="${esc(a.email_avisos ?? '')}">
          <p class="hint">Usaremos esta dirección para comunicaciones sobre el asistente.</p>
        </div>
      </div>
      <div class="acc">
        <button class="btn corto" id="guardar">Guardar cambios</button>
        <span id="msg" class="msg-ok"></span>
      </div>
    </div>

    ${CFG.documentos && CFG.documentos.length ? `<div class="panel">
      <h3>Información del servicio</h3>
      <p class="ph">Documentación que usa el asistente para responder.
         Solo lectura: si necesitas cambiar algo, escríbenos y lo actualizamos.</p>
      <div class="docs">
        ${CFG.documentos.map(doc => `<a class="doc" href="${esc(doc.url)}"
            target="_blank" rel="noopener noreferrer">
          <span class="dico" aria-hidden="true">📄</span>
          <span class="dtx">
            <strong>${esc(doc.titulo || 'Documento')}</strong>
            ${doc.desc ? `<span>${esc(doc.desc)}</span>` : ''}
          </span>
          <span class="dfl" aria-hidden="true">↗</span>
        </a>`).join('')}
      </div>
    </div>` : ''}

    <div class="panel">
      <h3>Tratamiento de datos</h3>
      <p class="ph">Qué se registra de las conversaciones y para qué.</p>
      <dl class="ficha">
        <dt>Qué se guarda</dt>
        <dd>Texto de los mensajes, fecha y hora, y un identificador del
            contacto para poder agrupar la conversación.</dd>
        <dt>Para qué</dt>
        <dd>Atender la conversación, calcular las métricas de este panel
            y permitir consultar el histórico.</dd>
        <dt>Quién accede</dt>
        <dd>Solo los usuarios dados de alta en tu cuenta. Cada cliente ve
            exclusivamente sus propias conversaciones.</dd>
        <dt>Servicios implicados</dt>
        <dd>OpenAI (generación de respuestas y transcripción de audios),
            Supabase (almacenamiento, servidores en la UE) y Hostinger
            (servidor del asistente).</dd>
        <dt>Números de teléfono</dt>
        <dd>Se muestran parcialmente ofuscados en este panel.</dd>
        <dt>Horario y ubicaciones</dt>
        <dd>Se configuran con los datos que nos facilitaste en el alta del
            servicio. Si algo ha cambiado, dínoslo y lo actualizamos.</dd>
      </dl>
      <p class="aviso" style="margin:16px 0 0">
        Para ejercer derechos de acceso, rectificación o supresión sobre un
        contacto concreto, escríbenos y lo tramitamos.
      </p>
    </div>`;

  $('#guardar').addEventListener('click', async () => {
    const b = $('#guardar'), m = $('#msg');
    b.disabled = true; b.textContent = 'Guardando…'; m.textContent = '';
    const num = v => v === '' ? null : Number(v);
    try {
      const args = { p_email_avisos: $('#ea').value.trim() };
      if ($('#ch')){
        args.p_coste_hora = num($('#ch').value);
        args.p_minutos    = num($('#mn').value);
      }
      const { error } = await supabase.rpc('actualizar_ajustes', args);
      if (error) throw error;
      m.textContent = 'Cambios guardados.';
      m.className = 'msg-ok';
    } catch (e) {
      m.textContent = e.message === 'Sin acceso'
        ? 'Tu cuenta no tiene permiso para modificar estos ajustes.'
        : (e.message || 'No se han podido guardar los cambios.');
      m.className = 'msg-err';
    }
    b.disabled = false; b.textContent = 'Guardar cambios';
  });
}

const fila = c => `<tr data-id="${c.id}">
  <td class="mono">${ofusca(c.contact_ref)}</td>
  <td class="mono">${c.msg_count}</td>
  <td class="mono">${c.human_count}</td>
  <td class="mono">${c.ai_count}</td>
  <td>${c.fecha_origen
        ? fecha(c.fecha_origen) + (c.fecha_estimada ? ' <span class="aprox">aprox.</span>' : '')
        : '—'}</td>
  <td>${[
      c.senal_interes     ? '<span class="pill az">Interés</span>'   : '',
      c.senal_contacto    ? '<span class="pill vd">Contacto</span>'  : '',
      c.senal_frustracion ? '<span class="pill rj">Fricción</span>'  : ''
    ].join('') || '<span class="pill hist">—</span>'}</td>
</tr>`;

function horarioTexto(){
  const H = CFG.horario || {};
  const dn = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const ds = (H.dias || []).map(n => dn[n === 7 ? 0 : n]);
  if (!ds.length) return '—';
  return `${ds[0]} a ${ds[ds.length-1]}, de ${H.inicio}:00 a ${H.fin}:00`;
}

/* ---------- detalle de un contacto ---------- */
async function abrir(contact){
  const c = CONTACTOS.find(x => x.contact_ref === contact) || {};
  $('#mbox').innerHTML = '<div class="cargando">Cargando…</div>';
  $('#modal').style.display = 'block';

  const { data } = await supabase.rpc('mensajes_contacto', { p_contact: contact });
  const msgs = data || [];
  let sesion = null;

  $('#mbox').innerHTML = `
    <div class="cab">
      <div>
        <h2 style="font-size:21px;letter-spacing:-.02em">
          ${c.nombre ? esc(c.nombre) : 'Contacto'}</h2>
        <p class="dmeta">
          <a href="tel:${esc(c.telefono||'')}" class="mono">${esc(c.telefono || contact)}</a>
          ${c.email ? ` · <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}
        </p>
        <p class="dmeta">${msgs.length} mensajes${
          Number(c.conversaciones) > 1 ? ` en ${c.conversaciones} conversaciones` : ''}${
          c.cita ? ` · cita: ${esc(c.cita)}` : ''}</p>
      </div>
      <button class="cerrar" id="cx" aria-label="Cerrar">×</button>
    </div>
    ${msgs.map(m => {
      let sep = '';
      if (m.sesion !== sesion){
        sesion = m.sesion;
        const f = m.is_backfilled ? null : (m.fecha_ref || m.observed_at);
        sep = `<div class="sep"><span>${
          msgs.filter(x => x.sesion === m.sesion).length} mensajes${
          f ? ' · ' + fecha(f) : ''}</span></div>`;
      }
      return sep + `<div class="msg ${m.role === 'human' ? 'h' : 'a'}">
        <div class="burb">${esc(m.content || '')}
          <div class="hora">${m.is_backfilled ? 'sin hora registrada' : hora(m.observed_at)}${
            m.latency_ms ? ` · ${(m.latency_ms/1000).toFixed(1)}s` : ''}</div>
        </div></div>`;
    }).join('')}`;

  $('#cx').addEventListener('click', cerrar);
}
function cerrar(){ $('#modal').style.display = 'none'; }
$('#modal').addEventListener('click', e => e.target.id === 'modal' && cerrar());
document.addEventListener('keydown', e => e.key === 'Escape' && cerrar());

/* ---------- utilidades ---------- */
// El teléfono completo no se muestra en pantalla: se ve lo justo para reconocer al contacto.
const ofusca = t => t ? t.slice(0,4) + '···' + t.slice(-3) : '—';
const esc = s => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fechaCorta = d => new Date(d).toLocaleDateString('es-ES',
  { day:'2-digit', month:'short', year:'2-digit' });
const fecha = d => new Date(d).toLocaleString('es-ES',
  { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
const hora = d => new Date(d).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
</script>
